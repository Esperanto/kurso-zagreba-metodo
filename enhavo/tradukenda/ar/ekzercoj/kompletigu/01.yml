- Marko estas en la ĉambro.: ماركو في الغرفة.
- Li sidas sur seĝo.: يجلس على كرسي.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: معلم يعلم. عامل يعمل. يتعلم الطالب.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: ماركو وألكساندرو طلاب ورياضيون.
- La patrino de Marko estas instruistino.: والدة ماركو معلمة.
- La seĝo estas en la ĉambro.: الكرسي موجود في الغرفة.
- La libro estas de li, ĝi estas lia.: الكتاب ينتمي إليه. إنه له.
- Mia nomo estas Marko.: اسمي ماركو.
