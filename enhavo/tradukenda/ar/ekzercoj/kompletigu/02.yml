- Marko havas amikon kaj amikinon. Ili estas geamikoj.: لدى ماركو صديق ذكر وصديقة. إنهم أصدقاء.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: يصنع القهوة ويشربونها في منزلنا.
- Ili iras al la hotelo.: يذهبون إلى الفندق.
- Ŝi vidas, ke Marko amas ŝin.: ترى أن ماركو يحبها.
- Ili havas facilajn lernolibrojn.: لديهم كتب مدرسية سهلة.
