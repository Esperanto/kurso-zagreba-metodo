- Mia amiko skribas multe.: صديقي يكتب كثيرا.
- Bela kelnerino estas belulino.: النادلة الجميلة هي امرأة جميلة.
- Ni havas multajn belajn aferojn.: لدينا الكثير من الأشياء الجميلة.
- Ni kune lernas en lernejo.: نتعلم معًا في المدرسة.
- Miaj gepatroj manĝas en manĝejo.: والدي يأكلان في غرفة الطعام.
- La kuko estas manĝebla.: الكعكة صالحة للأكل.
