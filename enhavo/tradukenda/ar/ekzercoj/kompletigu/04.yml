- Ana kaj Marko iris tra la strato.: ذهبت آنا وماركو في الشارع.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: جاؤوا إلى مقهى، وذهبوا إلى طاولة، ورأوا الأب جالسًا على كرسي.
- Ana metis tri kukojn sur seĝon.: وضعت آنا ثلاث كعكات على الكرسي.
- Ŝi remetis poste la kukojn sur la tablon.: وبعد ذلك أعادت الكعك إلى الطاولة.
