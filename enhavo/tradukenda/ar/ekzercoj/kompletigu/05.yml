- Dankon, sinjoro. Nedankinde.: شكرا لك يا سيدي. على الرحب والسعة.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: الساعة قصيرة، واليوم أطول، والشهر هو الأطول.
- Mi legas pli multajn librojn ol mia amiko.: قرأت كتبًا أكثر من صديقي.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: لقد أرسلت رسائل طويلة إلى صديقي أثناء وجوده في طوكيو.
- La libro estas leginda.: الكتاب يستحق القراءة.
