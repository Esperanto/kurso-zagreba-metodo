- La gepatroj ĉiam deziras, ke mi lernu multon.: يرغب الآباء دائمًا في أن أتعلم الكثير.
- Mia amiko deziras, ke mi iru kanti kun li.: صديقي يتمنى أن أذهب وأغني معه.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: يريد الأب من ابنه أن يأكل الكعكة الموجودة على الطاولة.
- Ni loĝas en malgranda ĉambro.: نحن نعيش في غرفة صغيرة.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: لقد أصبحت غير مرتاح عندما رأيتك.
- Ĉiuj rimarkis, ke ŝi estas belega.: لاحظ الجميع أنها جميلة جدًا.
