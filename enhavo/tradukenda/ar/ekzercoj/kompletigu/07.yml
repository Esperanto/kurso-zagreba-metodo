- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: كان يشرب مشروبه الصباحي بسرعة كبيرة لكي يأتي مبكرًا إلى المدرسة.
- Mi ankoraŭ ne aŭdis novaĵon.: ولم أسمع أي أخبار حتى الآن.
- En tiu momento Marko ekkriis.: في تلك اللحظة صرخ ماركو.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: الصبي الذي لا يحب الأولاد والبنات الآخرين ليس لديه أصدقاء ذكور ولا أصدقاء إناث.
