- Ni ordigis ĉion kaj transdonis al ili.: لقد رتبنا كل شيء وسلمناه لهم.
- Mi petas glason da kafo kaj iom da akvo.: أطلب كوبًا من القهوة وبعض الماء.
- Doloris lin la kapo. Li malsaniĝis.: رأسه يؤلمه. لقد أصبح مريضا.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: تحب الفتاة أن تكون جميلة، ولهذا السبب تجمل وجهها.
