- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: لو كان لدي المال بقدر الأفكار، لسافرت حول العالم.
- En ĉiu vortaro mankas kelkaj vortoj.: في كل قاموس هناك بعض الكلمات مفقودة.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: الشخص الذي يستمر في سرد القصص لفترة طويلة على مائدة الطعام سيظل جائعًا.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: كان عليه أن ينتبه ولم يُسمح له بالبقاء في الخارج لفترة طويلة تحت المطر. ولذلك أصيب بنزلة برد.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: لديه فكرته الواضحة، لكنه سيصدق كل ما تقولينه، كما لو كنت زوجته.
