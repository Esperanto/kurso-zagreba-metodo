- En juneco oni havas ankaŭ belecon.: وفي الشباب يمتلك الإنسان أيضًا جمالًا.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: يجب على الرؤساء تبسيط المهام المعقدة.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: في تلك السن كان قد أصبح بالفعل قائدًا لنادي رياضي.
- Monon oni metas en monujon.: واحد يضع المال في المحفظة.
- Sekvu la ekzemplon de la bonaj familianoj.: اقتدوا بأفراد الأسرة الطيبين.
