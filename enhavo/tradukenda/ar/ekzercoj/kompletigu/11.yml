- La knabino ĵetis la paperon en la paperujon.: ألقت الفتاة الورقة في سلة المهملات.
- Kie estas mia skribilo, mi volas respondi al li.: أين قلمي؟ أريد أن أجيب عليه.
- La suno malaperis kaj nun estas preskaŭ malhele.: اختفت الشمس والآن أصبح الظلام تقريبًا.
- Bonvolu manĝi la panon per manĝilo.: يرجى تناول الخبز مع أواني الأكل.
- Pardonu min, mi ne rajtas resti.: سامحني، لا يسمح لي بالبقاء.
