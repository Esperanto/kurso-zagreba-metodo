- Antaŭ kvarona horo ili revenis.: لقد عادوا منذ ربع ساعة.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: بعد المحنة الرهيبة، ذهب الناس بعيدا، وانهارت المدن القديمة.
- Ni devus revidi nin, mia amiko.: يجب أن نرى بعضنا البعض مرة أخرى، يا صديقي.
- Ju pli ofte mi pripensas, des pli mi koleras.: كلما فكرت في الأمر أكثر، كلما زاد غضبي.
- Ŝi loĝas en iu ajn domo.: تعيش في أي منزل.
