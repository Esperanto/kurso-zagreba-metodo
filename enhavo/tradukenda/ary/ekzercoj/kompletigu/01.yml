- Marko estas en la ĉambro.: ماركو فالغرفة.
- Li sidas sur seĝo.: هو جالس على كرسي.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: معلّم كيدرّس. عامل كيخدم. تلميذ كيتعلّم.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: ماركو وألكساندرو تلاميذ ورياضيين.
- La patrino de Marko estas instruistino.: أم ماركو معلّمة.
- La seĝo estas en la ĉambro.: الكرسي فالغرفة.
- La libro estas de li, ĝi estas lia.: الكتاب من عندو؛ راه ديالو.
- Mia nomo estas Marko.: سميتي ماركو.
