- Marko havas amikon kaj amikinon. Ili estas geamikoj.: ماركو عندو صاحب وصاحبة. هوما صحاب.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: هو كيطيب القهوة وهما كيشربوها فدارنا.
- Ili iras al la hotelo.: هما غاديين للفندق.
- Ŝi vidas, ke Marko amas ŝin.: هي كتشوف بلّي ماركو كيبغيها.
- Ili havas facilajn lernolibrojn.: عندهم كتب تعليمية ساهلة.
