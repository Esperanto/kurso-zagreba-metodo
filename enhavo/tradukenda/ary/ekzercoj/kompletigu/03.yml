- Mia amiko skribas multe.: صاحبي كيكتب بزاف.
- Bela kelnerino estas belulino.: نادلة زوينة هي مرا زوينة.
- Ni havas multajn belajn aferojn.: عندنا بزاف ديال الحوايج الزوينين.
- Ni kune lernas en lernejo.: حنا كنتعلمو مجموعين فالمدرسة.
- Miaj gepatroj manĝas en manĝejo.: واليديا كياكلو فبلاصة الماكلة.
- La kuko estas manĝebla.: الكيكة كتّاكل.
