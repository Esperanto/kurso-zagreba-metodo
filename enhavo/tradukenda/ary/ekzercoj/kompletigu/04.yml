- Ana kaj Marko iris tra la strato.: آنا وماركو مشاو فالزنقة.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: وصلو لقهوة، مشاو لطابلة، وشافو الأب جالس على كرسي.
- Ana metis tri kukojn sur seĝon.: آنا حطات ثلاث كيكات على كرسي.
- Ŝi remetis poste la kukojn sur la tablon.: من بعد رجّعات الكيكات للطابلة.
