- Dankon, sinjoro. Nedankinde.: شكرا، سيدي. بلا جميل.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: ساعة قصيرة، نهار أطول، شهر هو الأطول.
- Mi legas pli multajn librojn ol mia amiko.: كنقرا كتب أكثر من صاحبي.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: صيفطت رسائل طوال لصاحبي ملي كان فطوكيو.
- La libro estas leginda.: الكتاب يستاهل يتقرا.
