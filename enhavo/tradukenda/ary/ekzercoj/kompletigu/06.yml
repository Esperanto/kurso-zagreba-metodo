- La gepatroj ĉiam deziras, ke mi lernu multon.: الوالدين ديما باغيين نتعلم بزاف.
- Mia amiko deziras, ke mi iru kanti kun li.: صاحبي باغيني نمشي نغني معاه.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: الأب باغي ولدو ياكل الكيكة اللي فوق الطابلة.
- Ni loĝas en malgranda ĉambro.: حنا ساكنين فغرفة صغيرة.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: وليت مقلق ملي شفتك.
- Ĉiuj rimarkis, ke ŝi estas belega.: كلشي لاحظ بلّي هي زوينة بزاف.
