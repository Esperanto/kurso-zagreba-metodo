- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: شرب مشروب الصباح ديالو بسرعة كبيرة باش يجي بكري للمدرسة.
- Mi ankoraŭ ne aŭdis novaĵon.: مازال ما سمعت حتى شي خبر.
- En tiu momento Marko ekkriis.: فداك اللحظة ماركو صرخ.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: ولد اللي ما كيبغيش الدراري والبنات الآخرين ما عندوش لا صحاب لا صاحبات.
