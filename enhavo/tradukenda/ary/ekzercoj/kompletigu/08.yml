- Ni ordigis ĉion kaj transdonis al ili.: رتبنا كلشي وسلمناه ليهم.
- Mi petas glason da kafo kaj iom da akvo.: عافاك بغيت كاس ديال القهوة وشوية ديال الماء.
- Doloris lin la kapo. Li malsaniĝis.: راسو وجعو. مرض.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: البنت كيعجبها تكون زوينة، وعلى هاد السبب كتزين وجهها.
