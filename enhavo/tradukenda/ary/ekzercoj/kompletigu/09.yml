- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: إلا كان عندي الفلوس قد الأفكار، كنت غادي نسافر حول العالم.
- En ĉiu vortaro mankas kelkaj vortoj.: فكل قاموس ناقصين شي كلمات.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: واحد الإنسان اللي كيبقى يحكي بزاف حدا طابلة الماكلة غادي يبقى جيعان.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: كان خاصو ينتبه وما كانش مسموح ليه يبقى برا بزاف فالشتى. لذلك برد.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: عندو الفكرة الواضحة ديالو، ولكن غادي يصدق كلشي اللي غادي تقول، بحال إلا كنتي مراتو.
