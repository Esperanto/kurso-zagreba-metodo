- En juneco oni havas ankaŭ belecon.: فالشباب كاين حتى الزين.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: الرؤساء خاصهم يسهلو الخدمة المعقدة.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: فداك السن كان ولى من قبل رئيس نادي رياضي.
- Monon oni metas en monujon.: الفلوس كيديروها فمحفظة.
- Sekvu la ekzemplon de la bonaj familianoj.: تبعو مثال أفراد العائلة المزيانين.
