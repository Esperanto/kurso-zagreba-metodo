- La knabino ĵetis la paperon en la paperujon.: البنت لوحات الورقة فسلة الورق.
- Kie estas mia skribilo, mi volas respondi al li.: فين هو القلم ديالي؟ بغيت نجاوبو.
- La suno malaperis kaj nun estas preskaŭ malhele.: الشمس غبرات ودابا كاد تكون الظلمة.
- Bonvolu manĝi la panon per manĝilo.: عافاك كول الخبز بأداة ديال الماكلة.
- Pardonu min, mi ne rajtas resti.: سمح ليا، ما مسموحش ليا نبقى.
