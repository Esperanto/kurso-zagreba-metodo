- Antaŭ kvarona horo ili revenis.: رجعو قبل ربع ساعة.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: من بعد المصيبة الخايبة، الناس مشاو والمدن القديمة تهدمات.
- Ni devus revidi nin, mia amiko.: خاصنا نشوفو بعضياتنا مرة أخرى، صاحبي.
- Ju pli ofte mi pripensas, des pli mi koleras.: كلما كنخمم فداك الشي أكثر، كلما كنغضب أكثر.
- Ŝi loĝas en iu ajn domo.: هي ساكنة فشي دار كيفما كانت.
