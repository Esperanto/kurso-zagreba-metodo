- Marko estas en la ĉambro.: Марка ў пакоі.
- Li sidas sur seĝo.: Ён сядзіць на крэсле.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Настаўнік вучыць. Рабочы працуе. Вучань вучыцца.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Марка і Аляксандр — вучні і спартсмены.
- La patrino de Marko estas instruistino.: Маці Марка — настаўніца.
- La seĝo estas en la ĉambro.: Крэсла ў пакоі.
- La libro estas de li, ĝi estas lia.: Кніга належыць яму; яна ягоная.
- Mia nomo estas Marko.: Мяне завуць Марка.
