- Marko estas en la ĉambro.: Марка ў пакоі.
- Li sidas sur seĝo.: Ён сядае на крэсла.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Выкладае настаўнік. Працуе рабочы. Студэнт вучыцца.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Марка і Аляксандра - студэнты і спартсмены.
- La patrino de Marko estas instruistino.: Мама Марка — настаўніца.
- La seĝo estas en la ĉambro.: Крэсла ў пакоі.
- La libro estas de li, ĝi estas lia.: Кніга належыць яму; гэта яго.
- Mia nomo estas Marko.: Мяне завуць Марка.
