- Marko havas amikon kaj amikinon. Ili estas geamikoj.: У Марка ёсць сябар і сяброўка. Яны сябры.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ён гатуе каву, і яе п'юць у нас дома.
- Ili iras al la hotelo.: Ідуць у атэль.
- Ŝi vidas, ke Marko amas ŝin.: Яна бачыць, што Марка кахае яе.
- Ili havas facilajn lernolibrojn.: У іх лёгкія падручнікі.
