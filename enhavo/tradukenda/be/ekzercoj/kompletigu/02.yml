- Marko havas amikon kaj amikinon. Ili estas geamikoj.: У Маркі ёсць сябар і сяброўка. Яны сябры.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ён гатуе каву, і яны п'юць яе ў нашым доме.
- Ili iras al la hotelo.: Яны ідуць у гатэль.
- Ŝi vidas, ke Marko amas ŝin.: Яна бачыць, што Марка кахае яе.
- Ili havas facilajn lernolibrojn.: У іх лёгкія падручнікі.
