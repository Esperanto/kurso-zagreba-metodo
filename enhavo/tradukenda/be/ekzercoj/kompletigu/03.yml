- Mia amiko skribas multe.: Мой сябар шмат піша.
- Bela kelnerino estas belulino.: Прыгожая афіцыянтка — прыгажуня.
- Ni havas multajn belajn aferojn.: У нас шмат прыгожых рэчаў.
- Ni kune lernas en lernejo.: Мы разам вучымся ў школе.
- Miaj gepatroj manĝas en manĝejo.: Мае бацькі ядуць у сталовай.
- La kuko estas manĝebla.: Торт ядомы.
