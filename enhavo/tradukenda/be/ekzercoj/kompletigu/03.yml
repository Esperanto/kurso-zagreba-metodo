- Mia amiko skribas multe.: Мой сябар шмат піша.
- Bela kelnerino estas belulino.: Прыгожая афіцыянтка - прыгожая жанчына.
- Ni havas multajn belajn aferojn.: У нас шмат прыгожага.
- Ni kune lernas en lernejo.: Мы разам вучымся ў школе.
- Miaj gepatroj manĝas en manĝejo.: Бацькі ядуць у сталовай.
- La kuko estas manĝebla.: Торт ядомы.
