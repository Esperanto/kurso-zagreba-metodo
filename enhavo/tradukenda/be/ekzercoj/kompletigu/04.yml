- Ana kaj Marko iris tra la strato.: Ана і Марка пайшлі па вуліцы.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Прыйшлі ў кафэ, падышлі да століка і ўбачылі, што бацька сядзіць на крэсле.
- Ana metis tri kukojn sur seĝon.: Ана паставіла на крэсла тры пірожныя.
- Ŝi remetis poste la kukojn sur la tablon.: Пазней яна зноў паставіла пірагі на стол.
