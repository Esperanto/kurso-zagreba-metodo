- Ana kaj Marko iris tra la strato.: Ана і Марка ішлі па вуліцы.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Яны прыйшлі ў кавярню, падышлі да стала і ўбачылі, што бацька сядзіць на крэсле.
- Ana metis tri kukojn sur seĝon.: Ана паклала тры пірожныя на крэсла.
- Ŝi remetis poste la kukojn sur la tablon.: Пазней яна зноў паклала пірожныя на стол.
