- Dankon, sinjoro. Nedankinde.: Дзякуй, спадар. Няма за што.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Гадзіна кароткая, дзень даўжэйшы, месяц найдаўжэйшы.
- Mi legas pli multajn librojn ol mia amiko.: Я чытаю больш кніг, чым мой сябар.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Я дасылаў свайму сябру доўгія лісты, пакуль ён быў у Токіа.
- La libro estas leginda.: Кніга вартая чытання.
