- Dankon, sinjoro. Nedankinde.: Дзякуй, сэр. Запрашаем.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Гадзіна карацей, дзень даўжэй, месяц самы доўгі.
- Mi legas pli multajn librojn ol mia amiko.: Я чытаю больш кніг, чым мой сябар.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Я адпраўляў доўгія лісты свайму сябру, калі ён быў у Токіо.
- La libro estas leginda.: Кніга вартая таго, каб яе прачытаць.
