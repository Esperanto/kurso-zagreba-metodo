- La gepatroj ĉiam deziras, ke mi lernu multon.: Бацькі заўсёды жадаюць, каб я шмат вучыўся.
- Mia amiko deziras, ke mi iru kanti kun li.: Мой сябар хоча, каб я пайшоў спяваць з ім.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Бацька хоча, каб яго дзіця з'ела торт, які стаіць на стале.
- Ni loĝas en malgranda ĉambro.: Мы жывем у маленькім пакоі.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Мне стала не па сабе, калі я ўбачыў цябе.
- Ĉiuj rimarkis, ke ŝi estas belega.: Усе заўважылі, што яна вельмі прыгожая.
