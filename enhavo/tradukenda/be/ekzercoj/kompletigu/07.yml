- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ён вельмі хутка выпіў свой ранішні напой, каб рана прыйсці ў школу.
- Mi ankoraŭ ne aŭdis novaĵon.: Я яшчэ не чуў навіны.
- En tiu momento Marko ekkriis.: У гэты момант Марка закрычаў.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Хлопчык, які не любіць іншых дзяцей, не мае ні сяброў, ні сябровак.
