- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ранішні напой ён выпіў вельмі хутка, каб раней прыйсці ў школу.
- Mi ankoraŭ ne aŭdis novaĵon.: Я яшчэ не чуў ніякіх навін.
- En tiu momento Marko ekkriis.: У гэты момант Марка ўскрыкнуў.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Хлопчык, які не любіць іншых хлопчыкаў і дзяўчынак, не мае ні сяброў, ні сяброўак.
