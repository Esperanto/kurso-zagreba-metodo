- Ni ordigis ĉion kaj transdonis al ili.: Мы ўсё прывялі ў парадак і перадалі ім.
- Mi petas glason da kafo kaj iom da akvo.: Прашу шклянку кавы і вады.
- Doloris lin la kapo. Li malsaniĝis.: Балела галава. Ён захварэў.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Дзяўчына любіць быць прыгожай, таму і ўпрыгожвае свой твар.
