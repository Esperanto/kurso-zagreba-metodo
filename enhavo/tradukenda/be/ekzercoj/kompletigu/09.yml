- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Калі б у мяне было столькі грошай, колькі ідэй, я падарожнічаў бы вакол свету.
- En ĉiu vortaro mankas kelkaj vortoj.: У кожным слоўніку не хапае некалькіх слоў.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Чалавек, які доўга расказвае за абедзенным сталом, застанецца галодным.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Яму трэба было быць уважлівым, і ён не меў права доўга заставацца на вуліцы пад дажджом. Таму ён прастудзіўся.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: У яго ёсць уласная ясная ідэя, але ён паверыць усяму, што вы скажаце, нібы вы яго жонка.
