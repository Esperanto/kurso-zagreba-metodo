- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Калі б у мяне было столькі грошай, колькі ідэй, я б падарожнічаў па свеце.
- En ĉiu vortaro mankas kelkaj vortoj.: У кожным слоўніку некаторыя словы адсутнічаюць.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Чалавек, які доўга распавядае за абедзенным сталом, застанецца галодным.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Яму трэба было быць уважлівым, і яму не дазвалялі доўга заставацца на вуліцы пад дажджом. Таму і прастудзіўся.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: У яго ёсць сваё яснае ўяўленне, але ён паверыць усяму, што вы скажаце, як калі б вы яго жонка.
