- En juneco oni havas ankaŭ belecon.: У маладосці чалавек мае таксама прыгажосць.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Кіраўнікі павінны спрасціць складаныя працы.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: У такім узросце ён ужо стаў кіраўніком спартыўнага клуба.
- Monon oni metas en monujon.: Грошы кладуць у кашалёк.
- Sekvu la ekzemplon de la bonaj familianoj.: Бярыце прыклад з добрых членаў сям'і.
