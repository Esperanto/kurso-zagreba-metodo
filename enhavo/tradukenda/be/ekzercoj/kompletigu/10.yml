- En juneco oni havas ankaŭ belecon.: У маладосці таксама ёсць прыгажосць.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Начальства павінна спрасціць складаную працу.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: У такім узросце ён ужо стаў клубным кіраўніком спартыўнага клуба.
- Monon oni metas en monujon.: Адзін кладзе грошы ў кашалёк.
- Sekvu la ekzemplon de la bonaj familianoj.: Бярыце прыклад з добрых членаў сям'і.
