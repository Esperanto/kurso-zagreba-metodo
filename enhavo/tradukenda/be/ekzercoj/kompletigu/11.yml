- La knabino ĵetis la paperon en la paperujon.: Дзяўчына кінула паперу ў кошык для папер.
- Kie estas mia skribilo, mi volas respondi al li.: Дзе мая ручка? Я хачу адказаць яму.
- La suno malaperis kaj nun estas preskaŭ malhele.: Сонца знікла, і цяпер амаль цёмна.
- Bonvolu manĝi la panon per manĝilo.: Калі ласка, ешце хлеб сталовым прыборам.
- Pardonu min, mi ne rajtas resti.: Прабачце, я не маю права заставацца.
