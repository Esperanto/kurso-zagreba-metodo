- La knabino ĵetis la paperon en la paperujon.: Дзяўчына выкінула паперу ў кошык для папер.
- Kie estas mia skribilo, mi volas respondi al li.: Дзе мая ручка? Я хачу яму адказаць.
- La suno malaperis kaj nun estas preskaŭ malhele.: Сонца схавалася, і цяпер амаль цёмна.
- Bonvolu manĝi la panon per manĝilo.: Калі ласка, ешце хлеб з посудам.
- Pardonu min, mi ne rajtas resti.: Прабачце, мне не дазволена заставацца.
