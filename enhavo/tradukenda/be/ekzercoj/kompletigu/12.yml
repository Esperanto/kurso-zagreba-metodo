- Antaŭ kvarona horo ili revenis.: Яны вярнуліся чвэрць гадзіны таму.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Пасля страшнай бяды людзі разышліся, а старыя гарады разваліліся.
- Ni devus revidi nin, mia amiko.: Нам варта зноў пабачыцца, сябар.
- Ju pli ofte mi pripensas, des pli mi koleras.: Чым часцей я думаю пра гэта, тым больш злуюся.
- Ŝi loĝas en iu ajn domo.: Яна жыве ў любым доме.
