- Antaŭ kvarona horo ili revenis.: Яны вярнуліся чвэрць гадзіны таму.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Пасля страшнага няшчасця людзі сышлі, а старыя гарады разваліліся.
- Ni devus revidi nin, mia amiko.: Нам варта зноў пабачыцца, мой сябар.
- Ju pli ofte mi pripensas, des pli mi koleras.: Чым часцей я пра гэта думаю, тым больш злуюся.
- Ŝi loĝas en iu ajn domo.: Яна жыве ў любым доме.
