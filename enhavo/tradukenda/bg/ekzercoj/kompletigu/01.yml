- Marko estas en la ĉambro.: Марко е в стаята.
- Li sidas sur seĝo.: Той седи на стол.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Учител преподава. Работник работи. Ученик учи.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Марко и Александро са ученици и спортисти.
- La patrino de Marko estas instruistino.: Майката на Марко е учителка.
- La seĝo estas en la ĉambro.: Столът е в стаята.
- La libro estas de li, ĝi estas lia.: Книгата е негова; тя е неговата.
- Mia nomo estas Marko.: Моето име е Марко.
