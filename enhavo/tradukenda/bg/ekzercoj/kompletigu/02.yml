- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Марко има приятел и приятелка. Те са приятели.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Той прави кафе и те го пият в нашия дом.
- Ili iras al la hotelo.: Те отиват към хотела.
- Ŝi vidas, ke Marko amas ŝin.: Тя вижда, че Марко я обича.
- Ili havas facilajn lernolibrojn.: Те имат лесни учебници.
