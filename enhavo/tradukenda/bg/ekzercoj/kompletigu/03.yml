- Mia amiko skribas multe.: Моят приятел пише много.
- Bela kelnerino estas belulino.: Красива сервитьорка е красавица.
- Ni havas multajn belajn aferojn.: Имаме много красиви неща.
- Ni kune lernas en lernejo.: Ние учим заедно в училище.
- Miaj gepatroj manĝas en manĝejo.: Моите родители ядат в столова.
- La kuko estas manĝebla.: Сладкишът е годен за ядене.
