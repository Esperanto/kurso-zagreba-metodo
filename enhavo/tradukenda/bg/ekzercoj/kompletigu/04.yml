- Ana kaj Marko iris tra la strato.: Ана и Марко минаха през улицата.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Те дойдоха до кафене, отидоха до маса и видяха бащата да седи на стол.
- Ana metis tri kukojn sur seĝon.: Ана сложи три сладкиша върху стол.
- Ŝi remetis poste la kukojn sur la tablon.: После тя сложи сладкишите обратно върху масата.
