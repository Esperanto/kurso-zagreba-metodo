- Dankon, sinjoro. Nedankinde.: Благодаря, господине. Няма защо.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Часът е кратък, денят е по-дълъг, месецът е най-дълъг.
- Mi legas pli multajn librojn ol mia amiko.: Чета повече книги от моя приятел.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Изпратих на моя приятел дълги писма, докато той беше в Токио.
- La libro estas leginda.: Книгата си струва да бъде прочетена.
