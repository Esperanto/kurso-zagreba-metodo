- La gepatroj ĉiam deziras, ke mi lernu multon.: Родителите винаги желаят да науча много.
- Mia amiko deziras, ke mi iru kanti kun li.: Моят приятел желае да отида да пея с него.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Бащата иска детето му да изяде сладкиша, който е на масата.
- Ni loĝas en malgranda ĉambro.: Живеем в малка стая.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Станах неспокоен, когато те видях.
- Ĉiuj rimarkis, ke ŝi estas belega.: Всички забелязаха, че тя е много красива.
