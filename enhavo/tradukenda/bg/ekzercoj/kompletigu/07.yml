- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Той изпи много бързо сутрешната си напитка, за да дойде рано в училище.
- Mi ankoraŭ ne aŭdis novaĵon.: Още не съм чул новина.
- En tiu momento Marko ekkriis.: В този момент Марко извика.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Момче, което не обича другите момчета и момичета, няма нито приятели, нито приятелки.
