- Ni ordigis ĉion kaj transdonis al ili.: Подредихме всичко и им го предадохме.
- Mi petas glason da kafo kaj iom da akvo.: Моля за чаша кафе и малко вода.
- Doloris lin la kapo. Li malsaniĝis.: Болеше го главата. Той се разболя.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Момичето обича да е красиво и затова разкрасява лицето си.
