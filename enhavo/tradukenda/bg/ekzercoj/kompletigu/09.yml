- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ако имах толкова пари, колкото идеи, щях да пътувам около света.
- En ĉiu vortaro mankas kelkaj vortoj.: Във всеки речник липсват няколко думи.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Човек, който дълго разказва на масата за хранене, ще остане гладен.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Той трябваше да внимава и нямаше право да остава дълго навън в дъжда. Затова настина.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Той има своя ясна идея, но ще повярва на всичко, което кажеш, сякаш си негова съпруга.
