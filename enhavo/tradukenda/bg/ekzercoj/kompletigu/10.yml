- En juneco oni havas ankaŭ belecon.: В младостта човек има и красота.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Началниците би трябвало да опростяват сложните работи.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: На тази възраст той вече стана ръководител на спортен клуб.
- Monon oni metas en monujon.: Парите се слагат в портмоне.
- Sekvu la ekzemplon de la bonaj familianoj.: Следвай примера на добрите членове на семейството.
