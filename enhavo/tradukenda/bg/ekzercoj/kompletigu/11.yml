- La knabino ĵetis la paperon en la paperujon.: Момичето хвърли хартията в кошчето за хартия.
- Kie estas mia skribilo, mi volas respondi al li.: Къде е моята писалка? Искам да му отговоря.
- La suno malaperis kaj nun estas preskaŭ malhele.: Слънцето изчезна и сега е почти тъмно.
- Bonvolu manĝi la panon per manĝilo.: Моля, яж хляба с прибор.
- Pardonu min, mi ne rajtas resti.: Прости ми, нямам право да остана.
