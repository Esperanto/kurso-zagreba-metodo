- Antaŭ kvarona horo ili revenis.: Преди четвърт час те се върнаха.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: След ужасното нещастие хората си отидоха и старите градове се разпаднаха.
- Ni devus revidi nin, mia amiko.: Трябва пак да се видим, приятелю мой.
- Ju pli ofte mi pripensas, des pli mi koleras.: Колкото по-често мисля за това, толкова повече се ядосвам.
- Ŝi loĝas en iu ajn domo.: Тя живее в която и да е къща.
