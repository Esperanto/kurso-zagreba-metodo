- Marko estas en la ĉambro.: মার্কো রুমে আছে।
- Li sidas sur seĝo.: সে একটা চেয়ারে বসে আছে।
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: একজন শিক্ষক পড়াচ্ছেন। একজন শ্রমিক কাজ করে। একজন ছাত্র শেখে।
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: মার্কো এবং আলেকসান্দ্রো ছাত্র এবং ক্রীড়াবিদ।
- La patrino de Marko estas instruistino.: মার্কোর মা একজন শিক্ষিকা।
- La seĝo estas en la ĉambro.: চেয়ারটা রুমে।
- La libro estas de li, ĝi estas lia.: বইটি তারই; এটা তার
- Mia nomo estas Marko.: আমার নাম মার্কো।
