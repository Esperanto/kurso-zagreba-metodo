- Marko havas amikon kaj amikinon. Ili estas geamikoj.: মার্কোর একজন পুরুষ বন্ধু এবং একজন মহিলা বন্ধু রয়েছে। তারা বন্ধু।
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: তিনি কফি তৈরি করেন এবং তারা আমাদের বাড়িতে পান করেন।
- Ili iras al la hotelo.: তারা হোটেলে যায়।
- Ŝi vidas, ke Marko amas ŝin.: সে দেখে যে মার্কো তাকে ভালোবাসে।
- Ili havas facilajn lernolibrojn.: তাদের কাছে সহজ পাঠ্যপুস্তক রয়েছে।
