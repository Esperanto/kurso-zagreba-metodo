- Mia amiko skribas multe.: আমার বন্ধু অনেক লেখে।
- Bela kelnerino estas belulino.: একজন সুন্দরী ওয়েট্রেস একজন সুন্দরী।
- Ni havas multajn belajn aferojn.: আমাদের অনেক সুন্দর জিনিস আছে।
- Ni kune lernas en lernejo.: আমরা স্কুলে একসাথে শিখি।
- Miaj gepatroj manĝas en manĝejo.: আমার বাবা-মা একটি ডাইনিং রুমে খাচ্ছেন।
- La kuko estas manĝebla.: কেকটি ভোজ্য।
