- Ana kaj Marko iris tra la strato.: আনা এবং মার্কো রাস্তা ধরে চলে গেল।
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: তারা একটা ক্যাফেতে এসে একটা টেবিলে গিয়ে দেখল বাবা একটা চেয়ারে বসে আছে।
- Ana metis tri kukojn sur seĝon.: আনা একটা চেয়ারে তিনটা কেক রাখল।
- Ŝi remetis poste la kukojn sur la tablon.: সে পরে কেকগুলো আবার টেবিলে রাখল।
