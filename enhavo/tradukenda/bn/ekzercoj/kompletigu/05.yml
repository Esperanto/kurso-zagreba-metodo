- Dankon, sinjoro. Nedankinde.: ধন্যবাদ, স্যার। আপনাকে স্বাগতম।
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: একটি ঘন্টা ছোট, একটি দিন দীর্ঘ, একটি মাস দীর্ঘতম।
- Mi legas pli multajn librojn ol mia amiko.: আমি আমার বন্ধুর চেয়ে বেশি বই পড়ি।
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: টোকিওতে থাকাকালীন আমি আমার বন্ধুকে দীর্ঘ চিঠি পাঠিয়েছিলাম।
- La libro estas leginda.: বইটি পড়ার যোগ্য।
