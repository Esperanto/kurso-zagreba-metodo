- La gepatroj ĉiam deziras, ke mi lernu multon.: বাবা-মায়েরা সবসময়ই চান আমি যেন অনেক কিছু শিখি।
- Mia amiko deziras, ke mi iru kanti kun li.: আমার বন্ধু চায় আমি তার সাথে গান গাই।
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: বাবা চান তার সন্তান টেবিলে থাকা কেকটি খাবে।
- Ni loĝas en malgranda ĉambro.: আমরা একটি ছোট ঘরে থাকি।
- Mi fariĝis maltrankvila, kiam mi vidis vin.: তোমাকে দেখে আমি অস্থির হয়ে গেলাম।
- Ĉiuj rimarkis, ke ŝi estas belega.: সবাই লক্ষ্য করলো যে সে খুব সুন্দরী।
