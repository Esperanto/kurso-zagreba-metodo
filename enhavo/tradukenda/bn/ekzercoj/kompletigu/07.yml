- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: স্কুলে তাড়াতাড়ি আসার জন্য সে তার সকালের পানীয়টি খুব তাড়াতাড়ি পান করেছিল।
- Mi ankoraŭ ne aŭdis novaĵon.: এখনো কোনো খবর শুনিনি।
- En tiu momento Marko ekkriis.: ততক্ষণে চিৎকার করে উঠল মার্কো।
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: যে ছেলে অন্য ছেলে-মেয়েদের ভালোবাসে না তার কোনো পুরুষ বন্ধু বা নারী বন্ধু নেই।
