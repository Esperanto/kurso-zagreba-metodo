- Ni ordigis ĉion kaj transdonis al ili.: আমরা সবকিছু গুছিয়ে তাদের হাতে তুলে দিয়েছি।
- Mi petas glason da kafo kaj iom da akvo.: আমি এক গ্লাস কফি এবং কিছু জল চাই।
- Doloris lin la kapo. Li malsaniĝis.: তার মাথায় ব্যাথা। তিনি অসুস্থ হয়ে পড়েন।
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: মেয়েটি সুন্দর হতে পছন্দ করে এবং সে কারণে সে তার মুখকে সুন্দর করে তোলে।
