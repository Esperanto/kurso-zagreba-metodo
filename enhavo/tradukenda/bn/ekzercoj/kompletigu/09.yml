- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: যদি আমার কাছে ধারণার মতো অর্থ থাকত, আমি বিশ্বজুড়ে ভ্রমণ করতাম।
- En ĉiu vortaro mankas kelkaj vortoj.: প্রতিটি অভিধানে কিছু শব্দ অনুপস্থিত।
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: যে ব্যক্তি খাবার টেবিলে দীর্ঘক্ষণ গল্প বলে তার ক্ষুধার্ত থাকবে।
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: তাকে মনোযোগ দিতে হয়েছিল এবং বৃষ্টিতে বেশিক্ষণ বাইরে থাকতে দেওয়া হয়নি। তাই তার সর্দি লেগেছে।
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: তার স্পষ্ট ধারণা আছে, কিন্তু আপনি যা বলবেন সে সবই সে বিশ্বাস করবে, যেন আপনি তার স্ত্রী।
