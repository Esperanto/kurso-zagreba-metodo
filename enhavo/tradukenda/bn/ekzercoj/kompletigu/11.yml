- La knabino ĵetis la paperon en la paperujon.: মেয়েটি কাগজটি ওয়েস্টপেপারের ঝুড়িতে ফেলে দিল।
- Kie estas mia skribilo, mi volas respondi al li.: আমার কলম কোথায়? আমি তাকে উত্তর দিতে চাই.
- La suno malaperis kaj nun estas preskaŭ malhele.: সূর্য অদৃশ্য হয়ে গেছে এবং এখন প্রায় অন্ধকার।
- Bonvolu manĝi la panon per manĝilo.: দয়া করে খাবারের পাত্র দিয়ে রুটি খান।
- Pardonu min, mi ne rajtas resti.: আমাকে ক্ষমা করুন, আমাকে থাকতে দেওয়া হবে না।
