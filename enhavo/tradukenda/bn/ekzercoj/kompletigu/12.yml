- Antaŭ kvarona horo ili revenis.: পনেরো মিনিট আগে তারা ফিরেছে।
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ভয়ঙ্কর দুর্ভাগ্যের পরে, লোকেরা চলে গেল এবং পুরানো শহরগুলি ভেঙে পড়ল।
- Ni devus revidi nin, mia amiko.: আমাদের আবার দেখা উচিত, আমার বন্ধু.
- Ju pli ofte mi pripensas, des pli mi koleras.: যতবার আমি এটা নিয়ে ভাবি, ততই রাগী হয়ে যাই।
- Ŝi loĝas en iu ajn domo.: সে যে কোন বাড়িতে থাকে।
