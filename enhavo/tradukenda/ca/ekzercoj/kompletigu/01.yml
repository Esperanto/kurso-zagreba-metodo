- Marko estas en la ĉambro.: En Marko és a l'habitació.
- Li sidas sur seĝo.: S'asseu en una cadira.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Un professor ensenya. Un treballador treballa. Un alumne aprèn.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko i Aleksandro són estudiants i esportistes.
- La patrino de Marko estas instruistino.: La mare d'en Marko és mestra.
- La seĝo estas en la ĉambro.: La cadira és a l'habitació.
- La libro estas de li, ĝi estas lia.: El llibre li pertany; és seu.
- Mia nomo estas Marko.: Em dic Marko.
