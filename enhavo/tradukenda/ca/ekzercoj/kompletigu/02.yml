- Marko havas amikon kaj amikinon. Ili estas geamikoj.: En Marko té un amic i una amiga. Són amics.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Fa cafè i el beuen a casa nostra.
- Ili iras al la hotelo.: Van a l'hotel.
- Ŝi vidas, ke Marko amas ŝin.: Ella veu que en Marko l'estima.
- Ili havas facilajn lernolibrojn.: Tenen llibres de text fàcils.
