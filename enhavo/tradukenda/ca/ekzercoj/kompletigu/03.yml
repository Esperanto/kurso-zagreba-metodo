- Mia amiko skribas multe.: El meu amic escriu molt.
- Bela kelnerino estas belulino.: Una bella cambrera és una bella dona.
- Ni havas multajn belajn aferojn.: Tenim moltes coses boniques.
- Ni kune lernas en lernejo.: Aprenem junts a l'escola.
- Miaj gepatroj manĝas en manĝejo.: Els meus pares mengen al menjador.
- La kuko estas manĝebla.: El pastís és comestible.
