- Ana kaj Marko iris tra la strato.: Ana i Marko van anar pel carrer.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Van arribar a una cafeteria, van anar a una taula i van veure el pare assegut en una cadira.
- Ana metis tri kukojn sur seĝon.: L'Ana va posar tres pastissos en una cadira.
- Ŝi remetis poste la kukojn sur la tablon.: Més tard va tornar a posar els pastissos a la taula.
