- Dankon, sinjoro. Nedankinde.: Gràcies, senyor. De benvingut.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Una hora és curta, un dia és més llarg, un mes és el més llarg.
- Mi legas pli multajn librojn ol mia amiko.: Llegeixo més llibres que el meu amic.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Vaig enviar llargues cartes al meu amic mentre era a Tòquio.
- La libro estas leginda.: El llibre val la pena llegir-lo.
