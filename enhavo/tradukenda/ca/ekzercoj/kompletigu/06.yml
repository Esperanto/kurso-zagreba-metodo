- La gepatroj ĉiam deziras, ke mi lernu multon.: Els pares sempre volen que aprengui molt.
- Mia amiko deziras, ke mi iru kanti kun li.: El meu amic desitja que vagi a cantar amb ell.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: El pare vol que el seu fill es mengi el pastís que hi ha a taula.
- Ni loĝas en malgranda ĉambro.: Vivim en una habitació petita.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Em vaig sentir inquiet quan et vaig veure.
- Ĉiuj rimarkis, ke ŝi estas belega.: Tothom es va adonar que és molt bonica.
