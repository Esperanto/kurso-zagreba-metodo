- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Va beure la seva beguda del matí molt ràpidament per arribar d'hora a l'escola.
- Mi ankoraŭ ne aŭdis novaĵon.: Encara no he sentit cap notícia.
- En tiu momento Marko ekkriis.: En aquell moment en Marko va cridar.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Un nen que no estima els altres nois i noies no té ni amics masculins ni amigues femenines.
