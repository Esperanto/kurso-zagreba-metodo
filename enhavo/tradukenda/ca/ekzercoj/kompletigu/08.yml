- Ni ordigis ĉion kaj transdonis al ili.: Ho vam posar tot en ordre i els ho vam lliurar.
- Mi petas glason da kafo kaj iom da akvo.: Demano un got de cafè i una mica d'aigua.
- Doloris lin la kapo. Li malsaniĝis.: Li feia mal el cap. Es va posar malalt.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: A la noia li agrada ser bella, i per això s'embelleix la cara.
