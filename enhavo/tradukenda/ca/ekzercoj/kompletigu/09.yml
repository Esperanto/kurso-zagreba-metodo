- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Si tingués tants diners com idees, viatjaria per tot el món.
- En ĉiu vortaro mankas kelkaj vortoj.: A cada diccionari falten algunes paraules.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Una persona que segueix explicant històries durant molt de temps a la taula del menjador quedarà amb gana.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Havia de parar atenció i no se li va permetre quedar-se molt temps fora sota la pluja. Per això es va refredar.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Té la seva idea clara, però es creurà tot el que dius, com si fossis la seva dona.
