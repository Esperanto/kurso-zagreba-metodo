- En juneco oni havas ankaŭ belecon.: En la joventut també té bellesa.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Els caps haurien de simplificar les feines complicades.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: A aquella edat ja s'havia convertit en el líder d'un club esportiu.
- Monon oni metas en monujon.: Un posa diners en una cartera.
- Sekvu la ekzemplon de la bonaj familianoj.: Seguiu l'exemple dels bons membres de la família.
