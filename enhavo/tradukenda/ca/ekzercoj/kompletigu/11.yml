- La knabino ĵetis la paperon en la paperujon.: La noia va llençar el paper a la paperera.
- Kie estas mia skribilo, mi volas respondi al li.: On és el meu bolígraf? Vull respondre-li.
- La suno malaperis kaj nun estas preskaŭ malhele.: El sol ha desaparegut i ara és gairebé fosc.
- Bonvolu manĝi la panon per manĝilo.: Si us plau, menja el pa amb un estri per menjar.
- Pardonu min, mi ne rajtas resti.: Perdoneu-me, no em permeten quedar-me.
