- Antaŭ kvarona horo ili revenis.: Van tornar fa un quart d'hora.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Després de la terrible desgràcia, la gent se'n va anar i les velles ciutats es van ensorrar.
- Ni devus revidi nin, mia amiko.: Ens hauríem de tornar a veure, amic meu.
- Ju pli ofte mi pripensas, des pli mi koleras.: Com més sovint hi penso, més enfadat m'enfado.
- Ŝi loĝas en iu ajn domo.: Viu a qualsevol casa.
