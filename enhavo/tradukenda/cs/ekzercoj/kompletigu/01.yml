- Marko estas en la ĉambro.: Marko je v místnosti.
- Li sidas sur seĝo.: Sedí na židli.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Učitel učí. Dělník pracuje. Student se učí.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko a Aleksandro jsou studenti a sportovci.
- La patrino de Marko estas instruistino.: Markova matka je učitelka.
- La seĝo estas en la ĉambro.: Židle je v místnosti.
- La libro estas de li, ĝi estas lia.: Kniha patří jemu; je to jeho.
- Mia nomo estas Marko.: Jmenuji se Marko.
