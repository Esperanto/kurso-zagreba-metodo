- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko má kamaráda a kamarádku. Jsou to kamarádi.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Vaří kávu a pijí ji u nás doma.
- Ili iras al la hotelo.: Jdou do hotelu.
- Ŝi vidas, ke Marko amas ŝin.: Vidí, že ji Marko miluje.
- Ili havas facilajn lernolibrojn.: Mají jednoduché učebnice.
