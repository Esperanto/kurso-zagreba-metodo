- Mia amiko skribas multe.: Můj přítel hodně píše.
- Bela kelnerino estas belulino.: Krásná servírka je krásná žena.
- Ni havas multajn belajn aferojn.: Máme mnoho krásných věcí.
- Ni kune lernas en lernejo.: Učíme se spolu ve škole.
- Miaj gepatroj manĝas en manĝejo.: Moji rodiče jedí v jídelně.
- La kuko estas manĝebla.: Dort je jedlý.
