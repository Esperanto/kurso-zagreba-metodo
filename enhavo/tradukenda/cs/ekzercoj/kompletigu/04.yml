- Ana kaj Marko iris tra la strato.: Ana a Marko šli ulicí.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Přišli do kavárny, šli ke stolu a viděli otce, jak sedí na židli.
- Ana metis tri kukojn sur seĝon.: Ana položila tři dorty na židli.
- Ŝi remetis poste la kukojn sur la tablon.: Později položila koláče zpět na stůl.
