- Dankon, sinjoro. Nedankinde.: Děkuji, pane. nemáš zač.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Hodina je krátká, den delší, měsíc nejdelší.
- Mi legas pli multajn librojn ol mia amiko.: Čtu více knih než můj přítel.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Když byl v Tokiu, poslal jsem svému příteli dlouhé dopisy.
- La libro estas leginda.: Kniha stojí za přečtení.
