- La gepatroj ĉiam deziras, ke mi lernu multon.: Rodiče si vždy přejí, abych se hodně naučil.
- Mia amiko deziras, ke mi iru kanti kun li.: Můj kamarád si přeje, abych s ním šel zpívat.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Otec chce, aby jeho dítě snědlo dort, který je na stole.
- Ni loĝas en malgranda ĉambro.: Bydlíme v malém pokoji.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Když jsem tě uviděl, znepokojil jsem se.
- Ĉiuj rimarkis, ke ŝi estas belega.: Všichni si všimli, že je velmi krásná.
