- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Svůj ranní drink vypil velmi rychle, aby přišel brzy do školy.
- Mi ankoraŭ ne aŭdis novaĵon.: Zatím jsem neslyšel žádné zprávy.
- En tiu momento Marko ekkriis.: V tu chvíli Marko vykřikl.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Chlapec, který nemiluje ostatní chlapce a dívky, nemá ani kamarády, ani kamarádky.
