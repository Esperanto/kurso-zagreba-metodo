- Ni ordigis ĉion kaj transdonis al ili.: Vše jsme dali do pořádku a předali jim to.
- Mi petas glason da kafo kaj iom da akvo.: Požádám o sklenici kávy a trochu vody.
- Doloris lin la kapo. Li malsaniĝis.: Bolela ho hlava. Onemocněl.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Dívka je ráda krásná, a proto si zkrášluje obličej.
