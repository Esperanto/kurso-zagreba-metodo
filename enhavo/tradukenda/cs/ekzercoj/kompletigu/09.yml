- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Kdybych měl tolik peněz jako nápadů, cestoval bych po světě.
- En ĉiu vortaro mankas kelkaj vortoj.: V každém slovníku některá slova chybí.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Člověk, který u jídelního stolu dlouho vypráví příběhy, zůstane hladový.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Musel dávat pozor a nesměl dlouho pobývat venku v dešti. Proto se nachladil.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Má jasnou představu, ale bude věřit všemu, co řeknete, jako byste byla jeho žena.
