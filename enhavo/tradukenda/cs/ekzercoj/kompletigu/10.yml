- En juneco oni havas ankaŭ belecon.: V mládí má člověk také krásu.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Šéfové by si měli zjednodušit složité práce.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: V tomto věku se již stal klubovým vedoucím sportovního klubu.
- Monon oni metas en monujon.: Člověk dává peníze do peněženky.
- Sekvu la ekzemplon de la bonaj familianoj.: Následujte příklad dobrých členů rodiny.
