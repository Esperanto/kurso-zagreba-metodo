- La knabino ĵetis la paperon en la paperujon.: Dívka hodila papír do odpadkového koše.
- Kie estas mia skribilo, mi volas respondi al li.: Kde je moje pero? Chci mu odpovědět.
- La suno malaperis kaj nun estas preskaŭ malhele.: Slunce zmizelo a nyní je téměř tma.
- Bonvolu manĝi la panon per manĝilo.: Jezte chléb pomocí jídelního náčiní.
- Pardonu min, mi ne rajtas resti.: Odpusť mi, nesmím zůstat.
