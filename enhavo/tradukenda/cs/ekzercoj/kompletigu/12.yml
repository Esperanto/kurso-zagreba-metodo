- Antaŭ kvarona horo ili revenis.: Vrátili se před čtvrt hodinou.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Po strašlivém neštěstí lidé odešli a stará města se rozpadla.
- Ni devus revidi nin, mia amiko.: Měli bychom se znovu vidět, můj kamaráde.
- Ju pli ofte mi pripensas, des pli mi koleras.: Čím častěji na to myslím, tím jsem naštvanější.
- Ŝi loĝas en iu ajn domo.: Bydlí v jakémkoli domě.
