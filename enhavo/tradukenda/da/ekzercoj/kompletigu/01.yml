- Marko estas en la ĉambro.: Marko er i rummet.
- Li sidas sur seĝo.: Han sidder på en stol.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: En lærer underviser. En arbejder arbejder. En elev lærer.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko og Aleksandro er studerende og atleter.
- La patrino de Marko estas instruistino.: Markos mor er lærer.
- La seĝo estas en la ĉambro.: Stolen er i rummet.
- La libro estas de li, ĝi estas lia.: Bogen tilhører ham; det er hans.
- Mia nomo estas Marko.: Jeg hedder Marko.
