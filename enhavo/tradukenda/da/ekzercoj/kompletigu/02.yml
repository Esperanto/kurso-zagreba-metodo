- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko har en mandlig ven og en veninde. De er venner.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Han laver kaffe, og de drikker den i vores hjem.
- Ili iras al la hotelo.: De går til hotellet.
- Ŝi vidas, ke Marko amas ŝin.: Hun ser, at Marko elsker hende.
- Ili havas facilajn lernolibrojn.: De har nemme lærebøger.
