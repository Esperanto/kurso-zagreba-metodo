- Mia amiko skribas multe.: Min ven skriver meget.
- Bela kelnerino estas belulino.: En smuk servitrice er en smuk kvinde.
- Ni havas multajn belajn aferojn.: Vi har mange smukke ting.
- Ni kune lernas en lernejo.: Vi lærer sammen i skolen.
- Miaj gepatroj manĝas en manĝejo.: Mine forældre spiser i en spisestue.
- La kuko estas manĝebla.: Kagen er spiselig.
