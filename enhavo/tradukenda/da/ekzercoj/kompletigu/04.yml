- Ana kaj Marko iris tra la strato.: Ana og Marko gik hen ad gaden.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: De kom til en cafe, gik hen til et bord og så faderen sidde på en stol.
- Ana metis tri kukojn sur seĝon.: Ana satte tre kager på en stol.
- Ŝi remetis poste la kukojn sur la tablon.: Hun satte senere kagerne på bordet igen.
