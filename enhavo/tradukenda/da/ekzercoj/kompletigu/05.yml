- Dankon, sinjoro. Nedankinde.: Tak, sir. Du er velkommen.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: En time er kort, en dag er længere, en måned er den længste.
- Mi legas pli multajn librojn ol mia amiko.: Jeg læser flere bøger end min ven.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Jeg sendte lange breve til min ven, mens han var i Tokyo.
- La libro estas leginda.: Bogen er værd at læse.
