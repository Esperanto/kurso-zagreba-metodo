- La gepatroj ĉiam deziras, ke mi lernu multon.: Forældre ønsker altid, at jeg lærer meget.
- Mia amiko deziras, ke mi iru kanti kun li.: Min ven ønsker, at jeg går og synger med ham.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Faderen vil have, at hans barn spiser den kage, der står på bordet.
- Ni loĝas en malgranda ĉambro.: Vi bor i et lille værelse.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Jeg blev utryg, da jeg så dig.
- Ĉiuj rimarkis, ke ŝi estas belega.: Alle lagde mærke til, at hun er meget smuk.
