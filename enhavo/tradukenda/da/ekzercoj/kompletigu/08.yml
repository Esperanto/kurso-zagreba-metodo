- Ni ordigis ĉion kaj transdonis al ili.: Vi satte alt i stand og overlod det til dem.
- Mi petas glason da kafo kaj iom da akvo.: Jeg beder om et glas kaffe og noget vand.
- Doloris lin la kapo. Li malsaniĝis.: Hans hoved gjorde ondt. Han blev syg.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Pigen kan lide at være smuk, og af den grund forskønner hun sit ansigt.
