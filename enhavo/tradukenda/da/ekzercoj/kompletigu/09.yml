- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Hvis jeg havde lige så mange penge som ideer, ville jeg rejse rundt i verden.
- En ĉiu vortaro mankas kelkaj vortoj.: I hver ordbog mangler nogle ord.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: En person, der bliver ved med at fortælle historier i lang tid ved spisebordet, vil forblive sulten.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Han skulle være opmærksom og måtte ikke blive længe udenfor i regnen. Derfor blev han forkølet.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Han har sin klare idé, men han vil tro på alt, hvad du siger, som om du var hans kone.
