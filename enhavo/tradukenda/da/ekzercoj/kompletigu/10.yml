- En juneco oni havas ankaŭ belecon.: I ungdommen har man også skønhed.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Chefer bør forenkle komplicerede job.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: I den alder var han allerede blevet klubleder i en sportsklub.
- Monon oni metas en monujon.: Man putter penge i en pung.
- Sekvu la ekzemplon de la bonaj familianoj.: Følg de gode familiemedlemmers eksempel.
