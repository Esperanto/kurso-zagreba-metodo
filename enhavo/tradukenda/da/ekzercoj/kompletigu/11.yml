- La knabino ĵetis la paperon en la paperujon.: Pigen smed papiret i papirkurven.
- Kie estas mia skribilo, mi volas respondi al li.: Hvor er min pen? Jeg vil gerne svare ham.
- La suno malaperis kaj nun estas preskaŭ malhele.: Solen forsvandt og nu er det næsten mørkt.
- Bonvolu manĝi la panon per manĝilo.: Spis venligst brødet med et spiseredskab.
- Pardonu min, mi ne rajtas resti.: Tilgiv mig, jeg må ikke blive.
