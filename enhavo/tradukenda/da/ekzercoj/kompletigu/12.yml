- Antaŭ kvarona horo ili revenis.: De vendte tilbage for et kvarter siden.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Efter den frygtelige ulykke gik folket bort, og de gamle byer faldt fra hinanden.
- Ni devus revidi nin, mia amiko.: Vi burde ses igen, min ven.
- Ju pli ofte mi pripensas, des pli mi koleras.: Jo oftere jeg tænker over det, jo mere vred bliver jeg.
- Ŝi loĝas en iu ajn domo.: Hun bor i ethvert hus.
