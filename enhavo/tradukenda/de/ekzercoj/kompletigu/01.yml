- Marko estas en la ĉambro.: Marko ist im Zimmer.
- Li sidas sur seĝo.: Er sitzt auf einem Stuhl.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Ein Lehrer lehrt. Ein Arbeiter arbeitet. Ein Schüler lernt.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko und Aleksandro sind Schüler und Sportler.
- La patrino de Marko estas instruistino.: Die Mutter von Marko ist Lehrerin.
- La seĝo estas en la ĉambro.: Der Stuhl ist im Zimmer.
- La libro estas de li, ĝi estas lia.: Das Buch ist von ihm, es ist seins.
- Mia nomo estas Marko.: Mein Name ist Marko.
