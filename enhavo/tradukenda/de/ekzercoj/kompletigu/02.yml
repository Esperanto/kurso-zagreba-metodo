- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko hat einen Freund und eine Freundin. Sie sind Freunde.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Er kocht Kaffee und sie trinken ihn bei uns zu Hause.
- Ili iras al la hotelo.: Sie gehen zum Hotel.
- Ŝi vidas, ke Marko amas ŝin.: Sie sieht, dass Marko sie liebt.
- Ili havas facilajn lernolibrojn.: Sie haben einfache Lehrbücher.
