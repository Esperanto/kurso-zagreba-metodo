- Mia amiko skribas multe.: Mein Freund schreibt viel.
- Bela kelnerino estas belulino.: Eine schöne Kellnerin ist eine Schöne.
- Ni havas multajn belajn aferojn.: Wir haben viele schöne Sachen.
- Ni kune lernas en lernejo.: Wir lernen zusammen in der Schule.
- Miaj gepatroj manĝas en manĝejo.: Meine Eltern essen in einem Speiseraum.
- La kuko estas manĝebla.: Der Kuchen ist essbar.
