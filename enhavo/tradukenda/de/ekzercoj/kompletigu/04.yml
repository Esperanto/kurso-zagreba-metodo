- Ana kaj Marko iris tra la strato.: Ana und Marko gingen die Straße entlang.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Sie kamen zu einem Café, gingen zu einem Tisch und sahen den Vater auf einem Stuhl sitzen.
- Ana metis tri kukojn sur seĝon.: Ana legte drei Kuchen auf einen Stuhl.
- Ŝi remetis poste la kukojn sur la tablon.: Sie legte danach die Kuchen wieder auf den Tisch.
