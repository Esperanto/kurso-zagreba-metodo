- Dankon, sinjoro. Nedankinde.: Danke, mein Herr. Keine Ursache.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Eine Stunde ist kurz, ein Tag ist länger, ein Monat ist der längste.
- Mi legas pli multajn librojn ol mia amiko.: Ich lese mehr Bücher als mein Freund.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Ich schickte meinem Freund lange Briefe, während er in Tokio war.
- La libro estas leginda.: Das Buch ist lesenswert.
