- La gepatroj ĉiam deziras, ke mi lernu multon.: Die Eltern wünschen immer, dass ich viel lerne.
- Mia amiko deziras, ke mi iru kanti kun li.: Mein Freund wünscht, dass ich mit ihm singen gehe.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Der Vater will, dass sein Kind den Kuchen isst, der auf dem Tisch ist.
- Ni loĝas en malgranda ĉambro.: Wir wohnen in einem kleinen Zimmer.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Ich wurde unruhig, als ich dich sah.
- Ĉiuj rimarkis, ke ŝi estas belega.: Alle bemerkten, dass sie wunderschön ist.
