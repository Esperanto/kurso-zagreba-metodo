- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Er trank sein morgendliches Getränk sehr schnell, um früh zur Schule zu kommen.
- Mi ankoraŭ ne aŭdis novaĵon.: Ich habe noch keine Neuigkeit gehört.
- En tiu momento Marko ekkriis.: In diesem Moment schrie Marko auf.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Ein Junge, der andere Jungen und Mädchen nicht mag, hat weder Freunde noch Freundinnen.
