- Ni ordigis ĉion kaj transdonis al ili.: Wir ordneten alles und übergaben es ihnen.
- Mi petas glason da kafo kaj iom da akvo.: Ich bitte um ein Glas Kaffee und etwas Wasser.
- Doloris lin la kapo. Li malsaniĝis.: Ihm tat der Kopf weh. Er wurde krank.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Das Mädchen mag es, schön zu sein, und deshalb verschönert sie ihr Gesicht.
