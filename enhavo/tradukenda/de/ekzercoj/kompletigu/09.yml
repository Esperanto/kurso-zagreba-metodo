- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Wenn ich so viel Geld hätte wie Ideen, würde ich um die Welt reisen.
- En ĉiu vortaro mankas kelkaj vortoj.: In jedem Wörterbuch fehlen einige Wörter.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ein Mensch, der lange am Esstisch erzählt, wird hungrig bleiben.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Er musste aufpassen und durfte nicht lange draußen im Regen bleiben. Deshalb erkältete er sich.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Er hat seine klare Vorstellung, aber er wird alles glauben, was du sagst, als wärst du seine Ehefrau.
