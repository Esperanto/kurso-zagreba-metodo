- En juneco oni havas ankaŭ belecon.: In der Jugend hat man auch Schönheit.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Schwierige Arbeiten sollten Chefs vereinfachen.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: In diesem Alter war er schon Klubleiter eines Sportklubs geworden.
- Monon oni metas en monujon.: Geld steckt man in eine Geldbörse.
- Sekvu la ekzemplon de la bonaj familianoj.: Folgt dem Beispiel der guten Familienangehörigen.
