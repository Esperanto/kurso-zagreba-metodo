- La knabino ĵetis la paperon en la paperujon.: Das Mädchen warf das Papier in den Papierkorb.
- Kie estas mia skribilo, mi volas respondi al li.: Wo ist mein Stift, ich will ihm antworten.
- La suno malaperis kaj nun estas preskaŭ malhele.: Die Sonne verschwand und jetzt ist es fast dunkel.
- Bonvolu manĝi la panon per manĝilo.: Bitte iss das Brot mit Besteck.
- Pardonu min, mi ne rajtas resti.: Entschuldige, ich darf nicht bleiben.
