- Antaŭ kvarona horo ili revenis.: Vor einer Viertelstunde kamen sie zurück.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Nach dem schrecklichen Unglück gingen die Menschen fort und die alten Städte zerfielen.
- Ni devus revidi nin, mia amiko.: Wir sollten uns wiedersehen, mein Freund.
- Ju pli ofte mi pripensas, des pli mi koleras.: Je öfter ich darüber nachdenke, desto mehr ärgere ich mich.
- Ŝi loĝas en iu ajn domo.: Sie wohnt in irgendeinem Haus.
