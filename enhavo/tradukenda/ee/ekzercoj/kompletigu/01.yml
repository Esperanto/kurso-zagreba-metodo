- Marko estas en la ĉambro.: Marko le xɔa me.
- Li sidas sur seĝo.: Enɔa zikpui aɖe dzi.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Nufiala aɖe fiaa nu. Dɔwɔla aɖe wɔa dɔ. Sukuvi aɖe srɔ̃a nu.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko kple Aleksandro nye sukuviwo kple kamedefefewɔlawo.
- La patrino de Marko estas instruistino.: Marko dada nye nufiala.
- La seĝo estas en la ĉambro.: Zikpui la le xɔa me.
- La libro estas de li, ĝi estas lia.: Agbalẽa nye etɔ; etɔe wònye.
- Mia nomo estas Marko.: Nye ŋkɔe nye Marko.
