- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Ŋutsu xɔlɔ̃ aɖe kple nyɔnu xɔlɔ̃ aɖe le Marko si. Xɔlɔ̃woe wonye.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ewɔa kɔfi eye wononɛ le míaƒe aƒeme.
- Ili iras al la hotelo.: Woyia amedzrodzeƒea.
- Ŝi vidas, ke Marko amas ŝin.: Ekpɔe be Marko lɔ̃ ye.
- Ili havas facilajn lernolibrojn.: Nusrɔ̃gbalẽ bɔbɔewo le wo si.
