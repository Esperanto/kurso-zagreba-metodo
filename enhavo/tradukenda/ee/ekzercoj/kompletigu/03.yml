- Mia amiko skribas multe.: Xɔ̃nyea ŋlɔa nu geɖe.
- Bela kelnerino estas belulino.: Nuɖuɖudzrala dzetugbe nye nyɔnu dzetugbe.
- Ni havas multajn belajn aferojn.: Nu dzeani geɖewo le mía si.
- Ni kune lernas en lernejo.: Míesrɔ̃a nu ɖekae le suku.
- Miaj gepatroj manĝas en manĝejo.: Dzinyelawo ɖua nu le nuɖuxɔ me.
- La kuko estas manĝebla.: Keke la nye esi woate ŋu aɖu.
