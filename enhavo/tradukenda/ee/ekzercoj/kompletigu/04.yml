- Ana kaj Marko iris tra la strato.: Ana kple Marko yi mɔa dzi.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Wova kɔfidzraƒe aɖe, yi kplɔ̃ aɖe gbɔ, eye wokpɔ fofoa wòbɔbɔ nɔ zikpui aɖe dzi.
- Ana metis tri kukojn sur seĝon.: Ana tsɔ abolo etɔ̃ da zikpui aɖe dzi.
- Ŝi remetis poste la kukojn sur la tablon.: Emegbe egatsɔ aboloawo da ɖe kplɔ̃a dzi.
