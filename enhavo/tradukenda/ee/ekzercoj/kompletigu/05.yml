- Dankon, sinjoro. Nedankinde.: Akpe na wò, aƒetɔ. Wòe zɔ.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Gaƒoƒo ɖeka le kpuie, ŋkeke ɖeka didi wu, ɣleti ɖeka didi wu.
- Mi legas pli multajn librojn ol mia amiko.: Mexlẽa agbalẽ geɖe wu xɔ̃nyea.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Meɖo lɛta didiwo ɖe xɔ̃nye esime wònɔ Tokyo.
- La libro estas leginda.: Agbalẽa sɔ be woaxlẽ.
