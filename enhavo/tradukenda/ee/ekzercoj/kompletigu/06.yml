- La gepatroj ĉiam deziras, ke mi lernu multon.: Dzilawo dina ɣesiaɣi be masrɔ̃ nu geɖe.
- Mia amiko deziras, ke mi iru kanti kun li.: Xɔ̃nyea di vevie be mayi aɖadzi ha kplii.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Vifofoa di be ye vi naɖu abolo si le kplɔ̃a dzi.
- Ni loĝas en malgranda ĉambro.: Xɔ sue aɖe mee míele.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Nye dzi gbã esi mekpɔ wò.
- Ĉiuj rimarkis, ke ŝi estas belega.: Amesiame de dzesii be edze tugbe ŋutɔ.
