- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Eno eƒe ŋdinono kaba ŋutɔ be yeate ŋu ava suku kaba.
- Mi ankoraŭ ne aŭdis novaĵon.: Nyemese nya aɖeke haɖe o.
- En tiu momento Marko ekkriis.: Le ɣeyiɣi ma me la, Marko do ɣli.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Ŋutsuvi si melɔ̃ ŋutsuvi kple nyɔnuvi bubuwo o la, xɔlɔ̃ ŋutsuwo alo nyɔnuwo hã mele esi o.
