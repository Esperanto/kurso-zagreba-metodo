- Ni ordigis ĉion kaj transdonis al ili.: Míeɖo nusianu ɖe ɖoɖo nu hetsɔe de asi na wo.
- Mi petas glason da kafo kaj iom da akvo.: Mebiaa kɔpo ɖeka kɔfi kple tsi aɖe.
- Doloris lin la kapo. Li malsaniĝis.: Eƒe ta nɔ veve sem. Eva dze dɔ.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Nyɔnuvia lɔ̃a dzedzeme, eye le susu ma ta wòɖoa atsyɔ̃ na eƒe mo.
