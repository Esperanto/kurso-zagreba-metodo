- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ne ga geɖe le asinye abe susuwo ene la, anye ne mazɔ mɔ atsa le xexeame.
- En ĉiu vortaro mankas kelkaj vortoj.: Le nyagɔmeɖegbalẽ ɖesiaɖe me la, nya aɖewo bu.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ame si yi edzi le ŋutinyawo gblɔm le nuɖukplɔ̃ ŋu ɣeyiɣi didi aɖe la, dɔ anɔ ewum.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ele be wòalé to ɖe eŋu eye womeɖe mɔ nɛ be wòanɔ gota ɣeyiɣi didi le tsidzadza me o. Eyata exɔ dzamezã.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Eƒe susu si me kɔ la le esi, gake axɔ nya sia nya si nàgblɔ dzi ase, abe ɖe srɔ̃ae nènye ene.
