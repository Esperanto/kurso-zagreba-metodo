- La knabino ĵetis la paperon en la paperujon.: Nyɔnuvia tsɔ pepaa ƒu gbe ɖe gbeɖuɖɔgoa me.
- Kie estas mia skribilo, mi volas respondi al li.: Afikae nye nuŋlɔti le? Medi be maɖo eŋu nɛ.
- La suno malaperis kaj nun estas preskaŭ malhele.: Ɣea bu eye fifia viviti do kloe.
- Bonvolu manĝi la panon per manĝilo.: Taflatse mitsɔ nuɖunu ɖu aboloa.
- Pardonu min, mi ne rajtas resti.: Tsɔe kem, womeɖe mɔ nam be manɔ anyi o.
