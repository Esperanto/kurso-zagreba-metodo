- Antaŭ kvarona horo ili revenis.: Wotrɔ gbɔ gaƒoƒo ɖeka ƒe akpa enelia enye sia.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Le dzɔgbevɔ̃e dziŋɔa megbe la, ameawo dzo eye du xoxoawo mu.
- Ni devus revidi nin, mia amiko.: Ele be míagakpɔ mía nɔewo ake, xɔ̃nye.
- Ju pli ofte mi pripensas, des pli mi koleras.: Zi alesi mebua eŋu zi geɖe la, zi nenemae medoa dziku.
- Ŝi loĝas en iu ajn domo.: Enɔa aƒe ɖesiaɖe me.
