- Marko estas en la ĉambro.: Ο Μάρκο είναι στο δωμάτιο.
- Li sidas sur seĝo.: Κάθεται σε μια καρέκλα.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Ένας δάσκαλος διδάσκει. Ένας εργάτης δουλεύει. Ένας μαθητής μαθαίνει.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Ο Μάρκο και ο Αλέξανδρος είναι μαθητές και αθλητές.
- La patrino de Marko estas instruistino.: Η μητέρα του Μάρκου είναι δασκάλα.
- La seĝo estas en la ĉambro.: Η καρέκλα είναι στο δωμάτιο.
- La libro estas de li, ĝi estas lia.: Το βιβλίο του ανήκει. είναι δικό του.
- Mia nomo estas Marko.: Με λένε Μάρκο.
