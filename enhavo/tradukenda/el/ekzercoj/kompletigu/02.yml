- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Ο Μάρκο έχει έναν φίλο και μια φίλη. Είναι φίλοι.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Φτιάχνει καφέ και τον πίνουν στο σπίτι μας.
- Ili iras al la hotelo.: Πηγαίνουν στο ξενοδοχείο.
- Ŝi vidas, ke Marko amas ŝin.: Βλέπει ότι ο Μάρκο την αγαπά.
- Ili havas facilajn lernolibrojn.: Έχουν εύκολα σχολικά βιβλία.
