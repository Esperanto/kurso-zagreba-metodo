- Mia amiko skribas multe.: Ο φίλος μου γράφει πολλά.
- Bela kelnerino estas belulino.: Μια όμορφη σερβιτόρα είναι μια όμορφη γυναίκα.
- Ni havas multajn belajn aferojn.: Έχουμε πολλά όμορφα πράγματα.
- Ni kune lernas en lernejo.: Μαθαίνουμε μαζί στο σχολείο.
- Miaj gepatroj manĝas en manĝejo.: Οι γονείς μου τρώνε σε μια τραπεζαρία.
- La kuko estas manĝebla.: Το κέικ είναι βρώσιμο.
