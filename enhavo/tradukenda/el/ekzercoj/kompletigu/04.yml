- Ana kaj Marko iris tra la strato.: Η Άνα και ο Μάρκο πήγαν στο δρόμο.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ήρθαν σε ένα καφενείο, πήγαν σε ένα τραπέζι και είδαν τον πατέρα να κάθεται σε μια καρέκλα.
- Ana metis tri kukojn sur seĝon.: Η Άνα έβαλε τρεις τούρτες σε μια καρέκλα.
- Ŝi remetis poste la kukojn sur la tablon.: Αργότερα έβαλε τα κέικ ξανά στο τραπέζι.
