- Dankon, sinjoro. Nedankinde.: Σας ευχαριστώ, κύριε. Καλώς ήρθες.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Μια ώρα είναι μικρή, μια μέρα είναι μεγαλύτερη, ένας μήνας είναι ο μεγαλύτερος.
- Mi legas pli multajn librojn ol mia amiko.: Διαβάζω περισσότερα βιβλία από τον φίλο μου.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Έστειλα μακροσκελή γράμματα στον φίλο μου όσο ήταν στο Τόκιο.
- La libro estas leginda.: Το βιβλίο αξίζει να διαβαστεί.
