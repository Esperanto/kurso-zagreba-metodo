- La gepatroj ĉiam deziras, ke mi lernu multon.: Οι γονείς πάντα εύχονται να μάθω πολλά.
- Mia amiko deziras, ke mi iru kanti kun li.: Ο φίλος μου εύχεται να πάω να τραγουδήσω μαζί του.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Ο πατέρας θέλει το παιδί του να φάει το κέικ που είναι στο τραπέζι.
- Ni loĝas en malgranda ĉambro.: Μένουμε σε ένα μικρό δωμάτιο.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Έγινα άβολα όταν σε είδα.
- Ĉiuj rimarkis, ke ŝi estas belega.: Όλοι παρατήρησαν ότι είναι πολύ όμορφη.
