- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Έπινε πολύ γρήγορα το πρωινό του ποτό για να έρθει νωρίς στο σχολείο.
- Mi ankoraŭ ne aŭdis novaĵon.: Δεν έχω ακούσει ακόμα κανένα νέο.
- En tiu momento Marko ekkriis.: Εκείνη τη στιγμή ο Μάρκο φώναξε.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Ένα αγόρι που δεν αγαπά άλλα αγόρια και κορίτσια δεν έχει φίλους ούτε άντρες.
