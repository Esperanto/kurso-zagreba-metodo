- Ni ordigis ĉion kaj transdonis al ili.: Τα βάλαμε όλα σε τάξη και τους τα παραδώσαμε.
- Mi petas glason da kafo kaj iom da akvo.: Ζητώ ένα ποτήρι καφέ και λίγο νερό.
- Doloris lin la kapo. Li malsaniĝis.: Το κεφάλι του πονούσε. Αρρώστησε.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Στο κορίτσι αρέσει να είναι όμορφο και γι' αυτό ομορφαίνει το πρόσωπό της.
