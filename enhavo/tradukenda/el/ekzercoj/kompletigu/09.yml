- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Αν είχα τόσα χρήματα όσο ιδέες, θα ταξίδευα σε όλο τον κόσμο.
- En ĉiu vortaro mankas kelkaj vortoj.: Σε κάθε λεξικό λείπουν κάποιες λέξεις.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ένα άτομο που συνεχίζει να λέει ιστορίες για πολύ καιρό στο τραπέζι της τραπεζαρίας θα παραμείνει πεινασμένο.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Έπρεπε να προσέξει και δεν του επέτρεπαν να μείνει πολύ έξω στη βροχή. Γι' αυτό κρυολόγησε.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Έχει ξεκάθαρη ιδέα, αλλά θα πιστεύει όλα όσα λες, σαν να είσαι γυναίκα του.
