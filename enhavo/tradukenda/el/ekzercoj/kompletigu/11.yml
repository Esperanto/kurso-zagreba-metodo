- La knabino ĵetis la paperon en la paperujon.: Το κορίτσι πέταξε το χαρτί στο καλάθι των αχρήστων.
- Kie estas mia skribilo, mi volas respondi al li.: Πού είναι το στυλό μου; Θέλω να του απαντήσω.
- La suno malaperis kaj nun estas preskaŭ malhele.: Ο ήλιος χάθηκε και τώρα είναι σχεδόν σκοτεινά.
- Bonvolu manĝi la panon per manĝilo.: Παρακαλούμε να φάτε το ψωμί με ένα σκεύος φαγητού.
- Pardonu min, mi ne rajtas resti.: Συγχωρέστε με, δεν επιτρέπεται να μείνω.
