- Antaŭ kvarona horo ili revenis.: Επέστρεψαν πριν από ένα τέταρτο.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Μετά τη φοβερή συμφορά, ο κόσμος έφυγε και οι παλιές πόλεις διαλύθηκαν.
- Ni devus revidi nin, mia amiko.: Πρέπει να ξαναδούμε ο ένας τον άλλον φίλε μου.
- Ju pli ofte mi pripensas, des pli mi koleras.: Όσο πιο συχνά το σκέφτομαι, τόσο πιο θυμωμένος γίνομαι.
- Ŝi loĝas en iu ajn domo.: Μένει σε οποιοδήποτε σπίτι.
