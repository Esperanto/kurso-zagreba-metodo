- Marko estas en la ĉambro.: Marko is in the room.
- Li sidas sur seĝo.: He sits on a chair.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: A teacher teaches. A worker works. A student learns.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko and Aleksandro are students and athletes.
- La patrino de Marko estas instruistino.: Marko's mother is a teacher.
- La seĝo estas en la ĉambro.: The chair is in the room.
- La libro estas de li, ĝi estas lia.: The book belongs to him; it is his.
- Mia nomo estas Marko.: My name is Marko.
