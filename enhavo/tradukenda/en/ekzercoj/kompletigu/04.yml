- Ana kaj Marko iris tra la strato.: Ana and Marko went along the street.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: They came to a cafe, went to a table, and saw the father sitting on a chair.
- Ana metis tri kukojn sur seĝon.: Ana put three cakes on a chair.
- Ŝi remetis poste la kukojn sur la tablon.: She later put the cakes back on the table.
