- Dankon, sinjoro. Nedankinde.: Thank you, sir. You're welcome.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: An hour is short, a day is longer, a month is the longest.
- Mi legas pli multajn librojn ol mia amiko.: I read more books than my friend.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: I sent long letters to my friend while he was in Tokyo.
- La libro estas leginda.: The book is worth reading.
