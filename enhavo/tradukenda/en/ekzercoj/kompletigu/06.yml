- La gepatroj ĉiam deziras, ke mi lernu multon.: Parents always wish that I learn a lot.
- Mia amiko deziras, ke mi iru kanti kun li.: My friend wishes that I go sing with him.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: The father wants his child to eat the cake that is on the table.
- Ni loĝas en malgranda ĉambro.: We live in a small room.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: I became uneasy when I saw you.
- Ĉiuj rimarkis, ke ŝi estas belega.: Everyone noticed that she is very beautiful.
