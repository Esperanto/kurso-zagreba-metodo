- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: If I had as much money as ideas, I would travel around the world.
- En ĉiu vortaro mankas kelkaj vortoj.: In every dictionary some words are missing.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: A person who keeps telling stories for a long time at the dining table will remain hungry.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: He had to pay attention and was not allowed to stay outside long in the rain. Therefore he caught a cold.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: He has his clear idea, but he will believe everything that you say, as if you were his wife.
