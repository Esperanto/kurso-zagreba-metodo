- La knabino ĵetis la paperon en la paperujon.: The girl threw the paper into the wastepaper basket.
- Kie estas mia skribilo, mi volas respondi al li.: Where is my pen? I want to answer him.
- La suno malaperis kaj nun estas preskaŭ malhele.: The sun disappeared and now it is almost dark.
- Bonvolu manĝi la panon per manĝilo.: Please eat the bread with an eating utensil.
- Pardonu min, mi ne rajtas resti.: Forgive me, I am not allowed to stay.
