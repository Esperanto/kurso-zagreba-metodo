- Antaŭ kvarona horo ili revenis.: They returned a quarter of an hour ago.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: After the terrible misfortune, the people went away and the old cities fell apart.
- Ni devus revidi nin, mia amiko.: We should see each other again, my friend.
- Ju pli ofte mi pripensas, des pli mi koleras.: The more often I think about it, the angrier I become.
- Ŝi loĝas en iu ajn domo.: She lives in any house.
