- Marko estas en la ĉambro.: Marko está en la habitación.
- Li sidas sur seĝo.: Él se sienta en una silla.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Un maestro enseña. Un trabajador trabaja. Un estudiante aprende.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko y Aleksandro son estudiantes y deportistas.
- La patrino de Marko estas instruistino.: La madre de Marko es profesora.
- La seĝo estas en la ĉambro.: La silla está en la habitación.
- La libro estas de li, ĝi estas lia.: El libro le pertenece; es suyo.
- Mia nomo estas Marko.: Mi nombre es Marco.
