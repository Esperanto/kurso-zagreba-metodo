- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko tiene un amigo y una amiga. Son amigos.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Él hace café y lo beben en nuestra casa.
- Ili iras al la hotelo.: Van al hotel.
- Ŝi vidas, ke Marko amas ŝin.: Ella ve que Marko la ama.
- Ili havas facilajn lernolibrojn.: Tienen libros de texto fáciles.
