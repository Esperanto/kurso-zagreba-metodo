- Mia amiko skribas multe.: Mi amigo escribe mucho.
- Bela kelnerino estas belulino.: Una hermosa camarera es una hermosa mujer.
- Ni havas multajn belajn aferojn.: Tenemos muchas cosas hermosas.
- Ni kune lernas en lernejo.: Aprendemos juntos en la escuela.
- Miaj gepatroj manĝas en manĝejo.: Mis padres comen en un comedor.
- La kuko estas manĝebla.: El pastel es comestible.
