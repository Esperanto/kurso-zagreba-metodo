- Ana kaj Marko iris tra la strato.: Ana y Marko fueron por la calle.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Llegaron a un café, se acercaron a una mesa y vieron al padre sentado en una silla.
- Ana metis tri kukojn sur seĝon.: Ana puso tres pasteles en una silla.
- Ŝi remetis poste la kukojn sur la tablon.: Luego volvió a poner los pasteles en la mesa.
