- Dankon, sinjoro. Nedankinde.: Gracias, señor. De nada.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Una hora es corta, un día es más largo, un mes es el más largo.
- Mi legas pli multajn librojn ol mia amiko.: Leo más libros que mi amigo.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Envié largas cartas a mi amigo mientras estaba en Tokio.
- La libro estas leginda.: Vale la pena leer el libro.
