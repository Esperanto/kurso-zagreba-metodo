- La gepatroj ĉiam deziras, ke mi lernu multon.: Los padres siempre desean que aprenda mucho.
- Mia amiko deziras, ke mi iru kanti kun li.: Mi amigo desea que vaya a cantar con él.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: El padre quiere que su hijo se coma el pastel que está sobre la mesa.
- Ni loĝas en malgranda ĉambro.: Vivimos en una habitación pequeña.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Me inquieté cuando te vi.
- Ĉiuj rimarkis, ke ŝi estas belega.: Todos notaron que ella es muy hermosa.
