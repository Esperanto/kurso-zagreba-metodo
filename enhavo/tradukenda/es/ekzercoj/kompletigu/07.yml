- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Bebió su bebida matutina muy rápidamente para llegar temprano a la escuela.
- Mi ankoraŭ ne aŭdis novaĵon.: Todavía no he escuchado ninguna noticia.
- En tiu momento Marko ekkriis.: En ese momento Marko gritó.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Un niño que no ama a otros niños y niñas no tiene amigos ni amigas.
