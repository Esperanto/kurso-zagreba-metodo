- Ni ordigis ĉion kaj transdonis al ili.: Pusimos todo en orden y se lo entregamos.
- Mi petas glason da kafo kaj iom da akvo.: Pido un vaso de café y un poco de agua.
- Doloris lin la kapo. Li malsaniĝis.: Le dolía la cabeza. Se enfermó.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: A la niña le gusta ser bella, y por eso embellece su rostro.
