- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Si tuviera tanto dinero como ideas, viajaría por todo el mundo.
- En ĉiu vortaro mankas kelkaj vortoj.: En todo diccionario faltan algunas palabras.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Una persona que sigue contando historias durante mucho tiempo en la mesa del comedor seguirá teniendo hambre.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Tenía que prestar atención y no se le permitía permanecer mucho tiempo afuera bajo la lluvia. Por eso se resfrió.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Él tiene su idea clara, pero creerá todo lo que le digas, como si fuera su esposa.
