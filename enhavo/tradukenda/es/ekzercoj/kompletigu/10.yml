- En juneco oni havas ankaŭ belecon.: En la juventud también se tiene belleza.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Los jefes deberían simplificar los trabajos complicados.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: A esa edad ya se había convertido en el líder de un club deportivo.
- Monon oni metas en monujon.: Uno pone dinero en una billetera.
- Sekvu la ekzemplon de la bonaj familianoj.: Sigue el ejemplo de los buenos miembros de la familia.
