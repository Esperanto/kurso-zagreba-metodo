- La knabino ĵetis la paperon en la paperujon.: La niña arrojó el papel a la papelera.
- Kie estas mia skribilo, mi volas respondi al li.: ¿Dónde está mi bolígrafo? Quiero responderle.
- La suno malaperis kaj nun estas preskaŭ malhele.: El sol desapareció y ya casi es de noche.
- Bonvolu manĝi la panon per manĝilo.: Por favor, come el pan con un utensilio para comer.
- Pardonu min, mi ne rajtas resti.: Perdóname, no puedo quedarme.
