- Antaŭ kvarona horo ili revenis.: Regresaron hace un cuarto de hora.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Después de la terrible desgracia, la gente se fue y las antiguas ciudades se desmoronaron.
- Ni devus revidi nin, mia amiko.: Deberíamos volver a vernos, amigo mío.
- Ju pli ofte mi pripensas, des pli mi koleras.: Cuanto más lo pienso, más me enojo.
- Ŝi loĝas en iu ajn domo.: Vive en cualquier casa.
