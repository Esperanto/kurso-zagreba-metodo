- Marko estas en la ĉambro.: Marko on toas.
- Li sidas sur seĝo.: Ta istub toolil.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Õpetaja õpetab. Tööline töötab. Õpilane õpib.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ja Aleksandro on õpilased ja sportlased.
- La patrino de Marko estas instruistino.: Marko ema on õpetaja.
- La seĝo estas en la ĉambro.: Tool on toas.
- La libro estas de li, ĝi estas lia.: Raamat kuulub talle; see on tema.
- Mia nomo estas Marko.: Minu nimi on Marko.
