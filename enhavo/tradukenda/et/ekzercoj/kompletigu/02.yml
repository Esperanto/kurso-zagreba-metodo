- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Markol on meessõber ja naissõber. Nad on sõbrad.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ta teeb kohvi ja nad joovad seda meie kodus.
- Ili iras al la hotelo.: Nad lähevad hotelli.
- Ŝi vidas, ke Marko amas ŝin.: Ta näeb, et Marko armastab teda.
- Ili havas facilajn lernolibrojn.: Neil on lihtsad õpikud.
