- Mia amiko skribas multe.: Mu sõber kirjutab palju.
- Bela kelnerino estas belulino.: Kaunis ettekandja on ilus naine.
- Ni havas multajn belajn aferojn.: Meil on palju ilusaid asju.
- Ni kune lernas en lernejo.: Koolis õpime koos.
- Miaj gepatroj manĝas en manĝejo.: Mu vanemad söövad söögitoas.
- La kuko estas manĝebla.: Kook on söödav.
