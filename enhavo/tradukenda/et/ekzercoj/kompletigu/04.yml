- Ana kaj Marko iris tra la strato.: Ana ja Marko läksid mööda tänavat.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Nad tulid kohvikusse, läksid laua juurde ja nägid isa toolil istumas.
- Ana metis tri kukojn sur seĝon.: Ana pani kolm kooki toolile.
- Ŝi remetis poste la kukojn sur la tablon.: Hiljem pani ta koogid lauale tagasi.
