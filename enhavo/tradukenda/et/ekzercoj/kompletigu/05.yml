- Dankon, sinjoro. Nedankinde.: Aitäh, härra. Pole tänu väärt.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Tund on lühike, päev on pikem, kuu on kõige pikem.
- Mi legas pli multajn librojn ol mia amiko.: Ma loen rohkem raamatuid kui mu sõber.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Saatsin oma sõbrale pikki kirju, kui ta Tokyos oli.
- La libro estas leginda.: Raamat on lugemist väärt.
