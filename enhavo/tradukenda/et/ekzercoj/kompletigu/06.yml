- La gepatroj ĉiam deziras, ke mi lernu multon.: Vanemad soovivad alati, et ma palju õpiksin.
- Mia amiko deziras, ke mi iru kanti kun li.: Mu sõber soovib, et ma läheksin temaga koos laulma.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Isa tahab, et tema laps sööks seda kooki, mis laual on.
- Ni loĝas en malgranda ĉambro.: Elame väikeses toas.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Ma muutusin rahutuks, kui sind nägin.
- Ĉiuj rimarkis, ke ŝi estas belega.: Kõik märkasid, et ta on väga ilus.
