- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ta jõi oma hommikujoogi väga kiiresti ära, et varakult kooli tulla.
- Mi ankoraŭ ne aŭdis novaĵon.: Ma pole veel ühtegi uudist kuulnud.
- En tiu momento Marko ekkriis.: Sel hetkel hüüdis Marko.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Poisil, kes teisi poisse ja tüdrukuid ei armasta, pole ei meessõpru ega naissõpru.
