- Ni ordigis ĉion kaj transdonis al ili.: Panime kõik korda ja andsime neile üle.
- Mi petas glason da kafo kaj iom da akvo.: Ma palun klaasi kohvi ja veidi vett.
- Doloris lin la kapo. Li malsaniĝis.: Ta pea valutas. Ta jäi haigeks.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Tüdrukule meeldib ilus olla ja seetõttu ta kaunistab oma nägu.
