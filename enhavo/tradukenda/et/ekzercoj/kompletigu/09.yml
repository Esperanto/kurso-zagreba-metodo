- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Kui mul oleks nii palju raha kui ideid, reisiksin mööda maailma ringi.
- En ĉiu vortaro mankas kelkaj vortoj.: Igas sõnastikus on mõned sõnad puudu.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Inimene, kes söögilauas pikalt jutustab, jääb nälga.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ta pidi olema tähelepanelik ja ei tohtinud vihmaga kaua väljas viibida. Seetõttu ta külmetus.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Tal on selge ettekujutus, kuid ta usub kõike, mida sa ütled, nagu oleksid sa tema naine.
