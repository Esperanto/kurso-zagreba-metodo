- En juneco oni havas ankaŭ belecon.: Nooruses on ka ilu.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Ülemused peaksid keerulisi töid lihtsustama.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Selles vanuses oli temast saanud juba spordiklubi klubijuht.
- Monon oni metas en monujon.: Üks paneb raha rahakotti.
- Sekvu la ekzemplon de la bonaj familianoj.: Võtke eeskuju headest pereliikmetest.
