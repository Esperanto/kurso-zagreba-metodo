- La knabino ĵetis la paperon en la paperujon.: Tüdruk viskas paberi vanapaberikorvi.
- Kie estas mia skribilo, mi volas respondi al li.: Kus mu pastakas on? Ma tahan talle vastata.
- La suno malaperis kaj nun estas preskaŭ malhele.: Päike kadus ja nüüd on peaaegu pime.
- Bonvolu manĝi la panon per manĝilo.: Palun sööge leiba söögiriistaga.
- Pardonu min, mi ne rajtas resti.: Andke andeks, ma ei tohi jääda.
