- Antaŭ kvarona horo ili revenis.: Nad tulid tagasi veerand tundi tagasi.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Pärast kohutavat õnnetust läksid inimesed minema ja vanad linnad lagunesid.
- Ni devus revidi nin, mia amiko.: Me peaksime teineteist uuesti nägema, mu sõber.
- Ju pli ofte mi pripensas, des pli mi koleras.: Mida sagedamini ma sellele mõtlen, seda vihasemaks ma muutun.
- Ŝi loĝas en iu ajn domo.: Ta elab igas majas.
