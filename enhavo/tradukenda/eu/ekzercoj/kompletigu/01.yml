- Marko estas en la ĉambro.: Marko gelan dago.
- Li sidas sur seĝo.: Aulki batean esertzen da.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Irakasle batek irakasten du. Langile batek lan egiten du. Ikasle batek ikasten du.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko eta Aleksandro ikasleak eta kirolariak dira.
- La patrino de Marko estas instruistino.: Markoren ama irakaslea da.
- La seĝo estas en la ĉambro.: Aulkia gelan dago.
- La libro estas de li, ĝi estas lia.: Liburua berea da; berea da.
- Mia nomo estas Marko.: Nire izena Marko da.
