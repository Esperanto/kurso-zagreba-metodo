- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Markok gizonezko lagun bat eta emakumezko lagun bat ditu. Lagunak dira.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Kafea egiten du eta gure etxean edaten dute.
- Ili iras al la hotelo.: Hotelera joaten dira.
- Ŝi vidas, ke Marko amas ŝin.: Markok maite duela ikusten du.
- Ili havas facilajn lernolibrojn.: Testu liburu errazak dituzte.
