- Mia amiko skribas multe.: Nire lagunak asko idazten du.
- Bela kelnerino estas belulino.: Zerbitzari eder bat emakume eder bat da.
- Ni havas multajn belajn aferojn.: Gauza eder asko ditugu.
- Ni kune lernas en lernejo.: Elkarrekin ikasten dugu eskolan.
- Miaj gepatroj manĝas en manĝejo.: Nire gurasoek jangela batean jaten dute.
- La kuko estas manĝebla.: Tarta jangarria da.
