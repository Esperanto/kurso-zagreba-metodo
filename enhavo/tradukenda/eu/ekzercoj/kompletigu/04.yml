- Ana kaj Marko iris tra la strato.: Ana eta Marko kaletik joan ziren.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Kafetegi batera etorri, mahai batera joan eta aita aulki batean eserita ikusi zuten.
- Ana metis tri kukojn sur seĝon.: Anak hiru pastel jarri zituen aulki batean.
- Ŝi remetis poste la kukojn sur la tablon.: Geroago pastelak mahai gainean jarri zituen berriro.
