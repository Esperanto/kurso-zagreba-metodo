- Dankon, sinjoro. Nedankinde.: Eskerrik asko, jauna. Ongi etorri.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Ordu bat laburra da, egun bat luzeagoa, hilabete bat luzeena.
- Mi legas pli multajn librojn ol mia amiko.: Nire lagunak baino liburu gehiago irakurtzen ditut.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Tokion zegoen bitartean gutun luzeak bidali nizkion lagunari.
- La libro estas leginda.: Liburuak irakurtzea merezi du.
