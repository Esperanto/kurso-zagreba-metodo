- La gepatroj ĉiam deziras, ke mi lernu multon.: Gurasoek beti nahi dute asko ikastea.
- Mia amiko deziras, ke mi iru kanti kun li.: Nire lagunak nahi du berarekin abestera joatea.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Aitak bere umeak mahai gainean dagoen pastela jatea nahi du.
- Ni loĝas en malgranda ĉambro.: Gela txiki batean bizi gara.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Zu ikustean ezinegona jarri nintzen.
- Ĉiuj rimarkis, ke ŝi estas belega.: Denek nabaritu zuten oso ederra dela.
