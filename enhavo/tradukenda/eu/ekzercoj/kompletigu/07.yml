- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Goizeko edaria oso azkar edan zuen eskolara goiz etortzeko.
- Mi ankoraŭ ne aŭdis novaĵon.: Oraindik ez dut berririk entzun.
- En tiu momento Marko ekkriis.: Momentu horretan Markok oihu egin zuen.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Beste neska-mutilak maite ez dituen mutilak ez du ez gizonezko lagunik, ez emakumezko lagunik.
