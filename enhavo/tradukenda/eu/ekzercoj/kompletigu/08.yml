- Ni ordigis ĉion kaj transdonis al ili.: Dena ordenatu eta haien esku utzi genuen.
- Mi petas glason da kafo kaj iom da akvo.: Edalontzi bat kafe bat eta ur pixka bat eskatzen dut.
- Doloris lin la kapo. Li malsaniĝis.: Buruak min hartu zuen. Gaixotu egin zen.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Neskak ederra izatea gustatzen zaio, eta horregatik edertzen du aurpegia.
