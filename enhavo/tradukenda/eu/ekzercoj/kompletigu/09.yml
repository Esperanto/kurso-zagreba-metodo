- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ideia adina diru izango banu, munduan zehar bidaiatuko nuke.
- En ĉiu vortaro mankas kelkaj vortoj.: Hiztegi guztietan hitz batzuk falta dira.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Jantokiko mahaian denbora luzez istorioak kontatzen jarraitzen duenak gosetuta jarraituko du.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Arreta jarri behar izan zuen eta euripean kanpoan luzaroan egon behar ez zuen. Horregatik hotza hartu zuen.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Bere ideia argia du, baina zuk esaten duzun guztia sinetsiko du, bere emaztea bazina bezala.
