- En juneco oni havas ankaŭ belecon.: Gaztetan ere badu edertasuna.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Nagusiek lan konplikatuak erraztu beharko lituzkete.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Adin horretan jadanik kiroldegi bateko klubeko lider bihurtua zen.
- Monon oni metas en monujon.: Batek dirua zorro batean sartzen du.
- Sekvu la ekzemplon de la bonaj familianoj.: Jarraitu familiako kide onen adibidea.
