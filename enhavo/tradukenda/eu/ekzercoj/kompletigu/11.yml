- La knabino ĵetis la paperon en la paperujon.: Neskak papera zakarrontzira bota zuen.
- Kie estas mia skribilo, mi volas respondi al li.: Non dago nire boligrafoa? erantzun nahi diot.
- La suno malaperis kaj nun estas preskaŭ malhele.: Eguzkia desagertu zen eta orain ia ilun dago.
- Bonvolu manĝi la panon per manĝilo.: Mesedez, jan ogia jateko tresna batekin.
- Pardonu min, mi ne rajtas resti.: Barka iezadazu, ez daukat geratzeko baimenik.
