- Antaŭ kvarona horo ili revenis.: Duela ordu laurden itzuli ziren.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Zoritxar ikaragarriaren ondoren, jendea joan zen eta hiri zaharrak puskatu ziren.
- Ni devus revidi nin, mia amiko.: Berriro elkar ikusi beharko genuke, adiskide.
- Ju pli ofte mi pripensas, des pli mi koleras.: Zenbat eta maizago pentsatzen dudan, orduan eta haserreago jartzen naiz.
- Ŝi loĝas en iu ajn domo.: Edozein etxetan bizi da.
