- Marko estas en la ĉambro.: مارکو در اتاق است.
- Li sidas sur seĝo.: روی صندلی می نشیند.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: معلمی تدریس می کند. یک کارگر کار می کند. یک دانش آموز یاد می گیرد.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: مارکو و الکساندرو دانشجو و ورزشکار هستند.
- La patrino de Marko estas instruistino.: مادر مارکو معلم است.
- La seĝo estas en la ĉambro.: صندلی در اتاق است.
- La libro estas de li, ĝi estas lia.: کتاب متعلق به اوست; مال اوست
- Mia nomo estas Marko.: نام من مارکو است.
