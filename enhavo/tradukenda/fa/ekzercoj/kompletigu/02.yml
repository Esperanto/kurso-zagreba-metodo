- Marko havas amikon kaj amikinon. Ili estas geamikoj.: مارکو یک دوست مرد و یک دوست زن دارد. آنها دوست هستند.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: او قهوه درست می کند و در خانه ما می نوشند.
- Ili iras al la hotelo.: به هتل می روند.
- Ŝi vidas, ke Marko amas ŝin.: او می بیند که مارکو او را دوست دارد.
- Ili havas facilajn lernolibrojn.: کتاب های درسی آسانی دارند.
