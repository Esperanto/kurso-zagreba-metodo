- Mia amiko skribas multe.: دوست من زیاد می نویسد.
- Bela kelnerino estas belulino.: یک پیشخدمت زیبا یک زن زیباست.
- Ni havas multajn belajn aferojn.: ما چیزهای زیبای زیادی داریم.
- Ni kune lernas en lernejo.: در مدرسه با هم یاد می گیریم.
- Miaj gepatroj manĝas en manĝejo.: پدر و مادرم در یک اتاق غذاخوری غذا می خورند.
- La kuko estas manĝebla.: کیک خوراکی است.
