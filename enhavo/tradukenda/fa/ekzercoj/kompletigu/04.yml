- Ana kaj Marko iris tra la strato.: آنا و مارکو در امتداد خیابان رفتند.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: آمدند کافه ای رفتند سر میزی دیدند پدر روی صندلی نشسته است.
- Ana metis tri kukojn sur seĝon.: آنا سه کیک روی یک صندلی گذاشت.
- Ŝi remetis poste la kukojn sur la tablon.: بعداً کیک ها را دوباره روی میز گذاشت.
