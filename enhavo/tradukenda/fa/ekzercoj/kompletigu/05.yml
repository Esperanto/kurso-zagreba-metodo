- Dankon, sinjoro. Nedankinde.: ممنون آقا شما خوش آمدید.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: یک ساعت کوتاه است، یک روز طولانی تر، یک ماه طولانی ترین است.
- Mi legas pli multajn librojn ol mia amiko.: من بیشتر از دوستم کتاب می خوانم.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: زمانی که دوستم در توکیو بود، نامه های طولانی برای او فرستادم.
- La libro estas leginda.: کتاب ارزش خواندن دارد.
