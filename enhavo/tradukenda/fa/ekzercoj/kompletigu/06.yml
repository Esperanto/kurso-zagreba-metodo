- La gepatroj ĉiam deziras, ke mi lernu multon.: والدین همیشه آرزو می کنند که من چیزهای زیادی یاد بگیرم.
- Mia amiko deziras, ke mi iru kanti kun li.: دوستم آرزو دارد که من با او بخوانم.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: پدر می خواهد فرزندش کیکی را که روی میز است بخورد.
- Ni loĝas en malgranda ĉambro.: ما در یک اتاق کوچک زندگی می کنیم.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: با دیدنت ناراحت شدم
- Ĉiuj rimarkis, ke ŝi estas belega.: همه متوجه شدند که او بسیار زیباست.
