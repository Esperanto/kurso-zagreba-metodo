- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: او نوشیدنی صبحگاهی خود را خیلی سریع نوشید تا زودتر به مدرسه بیاید.
- Mi ankoraŭ ne aŭdis novaĵon.: من هنوز هیچ خبری نشنیده ام.
- En tiu momento Marko ekkriis.: در آن لحظه مارکو فریاد زد.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: پسری که پسر و دختر دیگر را دوست ندارد، نه دوست مرد دارد و نه دوست دختر.
