- Ni ordigis ĉion kaj transdonis al ili.: همه چیز را مرتب کردیم و به آنها تحویل دادیم.
- Mi petas glason da kafo kaj iom da akvo.: یک لیوان قهوه و کمی آب می خواهم.
- Doloris lin la kapo. Li malsaniĝis.: سرش درد گرفت او مریض شد.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: دختر دوست دارد زیبا باشد و به همین دلیل چهره خود را زیبا می کند.
