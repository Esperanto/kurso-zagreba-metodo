- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: اگر به اندازه ایده ها پول داشتم، به دور دنیا سفر می کردم.
- En ĉiu vortaro mankas kelkaj vortoj.: در هر فرهنگ لغت برخی از کلمات گم شده است.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: کسی که برای مدت طولانی پشت میز ناهارخوری داستان می گوید، گرسنه می ماند.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: او باید حواسش را جمع می کرد و اجازه نداشت در زیر باران زیاد بیرون بماند. بنابراین سرما خورد.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: او ایده روشن خود را دارد، اما هرچه می گویید را باور می کند، انگار که همسر او هستید.
