- En juneco oni havas ankaŭ belecon.: در جوانی هم زیبایی دارد.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: روسا باید کارهای پیچیده را ساده کنند.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: در آن سن او قبلاً رهبر باشگاه یک باشگاه ورزشی شده بود.
- Monon oni metas en monujon.: یکی پول را در کیف پول می گذارد.
- Sekvu la ekzemplon de la bonaj familianoj.: از اعضای خوب خانواده الگو بگیرید.
