- La knabino ĵetis la paperon en la paperujon.: دختر کاغذ را داخل سبد کاغذ باطله انداخت.
- Kie estas mia skribilo, mi volas respondi al li.: قلم من کجاست؟ من می خواهم به او پاسخ دهم.
- La suno malaperis kaj nun estas preskaŭ malhele.: خورشید ناپدید شد و اکنون تقریباً تاریک است.
- Bonvolu manĝi la panon per manĝilo.: لطفا نان را با ظرف غذا بخورید.
- Pardonu min, mi ne rajtas resti.: ببخشید من اجازه ندارم بمانم.
