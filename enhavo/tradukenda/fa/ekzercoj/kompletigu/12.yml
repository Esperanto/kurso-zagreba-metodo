- Antaŭ kvarona horo ili revenis.: یک ربع پیش برگشتند.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: پس از این بدبختی وحشتناک، مردم رفتند و شهرهای قدیمی از هم پاشیدند.
- Ni devus revidi nin, mia amiko.: دوست من باید دوباره همدیگر را ببینیم.
- Ju pli ofte mi pripensas, des pli mi koleras.: هر چه بیشتر به آن فکر می کنم، عصبانی تر می شوم.
- Ŝi loĝas en iu ajn domo.: او در هر خانه ای زندگی می کند.
