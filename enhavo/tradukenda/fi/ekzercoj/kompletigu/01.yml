- Marko estas en la ĉambro.: Marko on huoneessa.
- Li sidas sur seĝo.: Hän istuu tuolilla.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Opettaja opettaa. Työläinen työskentelee. Opiskelija oppii.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ja Aleksandro ovat opiskelijoita ja urheilijoita.
- La patrino de Marko estas instruistino.: Markon äiti on opettaja.
- La seĝo estas en la ĉambro.: Tuoli on huoneessa.
- La libro estas de li, ĝi estas lia.: Kirja kuuluu hänelle; se on hänen.
- Mia nomo estas Marko.: Nimeni on Marko.
