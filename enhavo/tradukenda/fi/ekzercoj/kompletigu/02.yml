- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Markolla on miesystävä ja naisystävä. He ovat ystäviä.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Hän keittää kahvia ja he juovat sitä kotonamme.
- Ili iras al la hotelo.: He menevät hotelliin.
- Ŝi vidas, ke Marko amas ŝin.: Hän näkee, että Marko rakastaa häntä.
- Ili havas facilajn lernolibrojn.: Heillä on helppoja oppikirjoja.
