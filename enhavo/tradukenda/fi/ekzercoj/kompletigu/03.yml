- Mia amiko skribas multe.: Ystäväni kirjoittaa paljon.
- Bela kelnerino estas belulino.: Kaunis tarjoilija on kaunis nainen.
- Ni havas multajn belajn aferojn.: Meillä on paljon kauniita asioita.
- Ni kune lernas en lernejo.: Opimme yhdessä koulussa.
- Miaj gepatroj manĝas en manĝejo.: Vanhempani syövät ruokasalissa.
- La kuko estas manĝebla.: Kakku on syötävää.
