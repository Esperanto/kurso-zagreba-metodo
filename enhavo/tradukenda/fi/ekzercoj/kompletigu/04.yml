- Ana kaj Marko iris tra la strato.: Ana ja Marko menivät kadulla.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: He tulivat kahvilaan, menivät pöytään ja näkivät isän istuvan tuolilla.
- Ana metis tri kukojn sur seĝon.: Ana laittoi kolme kakkua tuolille.
- Ŝi remetis poste la kukojn sur la tablon.: Myöhemmin hän laittoi kakut takaisin pöydälle.
