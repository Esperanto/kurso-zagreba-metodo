- Dankon, sinjoro. Nedankinde.: Kiitos, sir. Tervetuloa.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Tunti on lyhyt, päivä on pidempi, kuukausi on pisin.
- Mi legas pli multajn librojn ol mia amiko.: Luen enemmän kirjoja kuin ystäväni.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Lähetin pitkiä kirjeitä ystävälleni hänen ollessaan Tokiossa.
- La libro estas leginda.: Kirja kannattaa lukea.
