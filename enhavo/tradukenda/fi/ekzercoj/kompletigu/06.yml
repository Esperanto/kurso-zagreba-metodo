- La gepatroj ĉiam deziras, ke mi lernu multon.: Vanhemmat toivovat aina, että opin paljon.
- Mia amiko deziras, ke mi iru kanti kun li.: Ystäväni toivoo, että menen laulamaan hänen kanssaan.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Isä haluaa lapsensa syövän pöydällä olevan kakun.
- Ni loĝas en malgranda ĉambro.: Asumme pienessä huoneessa.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Minusta tuli levoton, kun näin sinut.
- Ĉiuj rimarkis, ke ŝi estas belega.: Kaikki huomasivat hänen olevan hyvin kaunis.
