- Ni ordigis ĉion kaj transdonis al ili.: Laitoimme kaiken järjestykseen ja luovutimme sen heille.
- Mi petas glason da kafo kaj iom da akvo.: Pyydän lasillisen kahvia ja vettä.
- Doloris lin la kapo. Li malsaniĝis.: Hänen päänsä sattui. Hän sairastui.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Tyttö tykkää olla kaunis, ja siksi hän kaunistaa kasvonsa.
