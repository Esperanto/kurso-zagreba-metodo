- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Jos minulla olisi yhtä paljon rahaa kuin ideoita, matkustaisin ympäri maailmaa.
- En ĉiu vortaro mankas kelkaj vortoj.: Jokaisesta sanakirjasta puuttuu joitain sanoja.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Pitkään ruokapöydän ääressä tarinoita kertova ihminen pysyy nälkäisenä.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Hänen täytyi olla tarkkaavainen, eikä hän saanut olla pitkään ulkona sateessa. Siksi hän vilustui.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Hänellä on selvä käsityksensä, mutta hän uskoo kaiken, mitä sanot, aivan kuin olisit hänen vaimonsa.
