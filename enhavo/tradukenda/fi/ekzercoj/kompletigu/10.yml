- En juneco oni havas ankaŭ belecon.: Nuoruudessa on myös kauneutta.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Esimiesten tulisi yksinkertaistaa monimutkaisia töitä.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Tuossa iässä hänestä oli jo tullut urheiluseuran seuranjohtaja.
- Monon oni metas en monujon.: Yksi laittaa rahaa lompakkoon.
- Sekvu la ekzemplon de la bonaj familianoj.: Seuraa hyvien perheenjäsenten esimerkkiä.
