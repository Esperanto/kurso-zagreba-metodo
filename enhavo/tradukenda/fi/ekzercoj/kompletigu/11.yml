- La knabino ĵetis la paperon en la paperujon.: Tyttö heitti paperin roskakoriin.
- Kie estas mia skribilo, mi volas respondi al li.: Missä kynäni on? Haluan vastata hänelle.
- La suno malaperis kaj nun estas preskaŭ malhele.: Aurinko katosi ja nyt on melkein pimeää.
- Bonvolu manĝi la panon per manĝilo.: Syö leipä ruokailuvälineellä.
- Pardonu min, mi ne rajtas resti.: Anteeksi, en saa jäädä.
