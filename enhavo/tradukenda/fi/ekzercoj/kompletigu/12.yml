- Antaŭ kvarona horo ili revenis.: He palasivat puoli tuntia sitten.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Kauhean onnettomuuden jälkeen ihmiset lähtivät ja vanhat kaupungit hajosivat.
- Ni devus revidi nin, mia amiko.: Meidän pitäisi nähdä toisemme uudelleen, ystäväni.
- Ju pli ofte mi pripensas, des pli mi koleras.: Mitä useammin ajattelen sitä, sitä vihaisemmaksi tulen.
- Ŝi loĝas en iu ajn domo.: Hän asuu missä tahansa talossa.
