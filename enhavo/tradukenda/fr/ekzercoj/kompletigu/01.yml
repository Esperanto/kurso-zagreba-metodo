- Marko estas en la ĉambro.: Marko est dans la pièce.
- Li sidas sur seĝo.: Il est assis sur une chaise.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Un professeur enseigne. Un ouvrier travaille. Un étudiant apprend.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko et Aleksandro sont étudiants et athlètes.
- La patrino de Marko estas instruistino.: La mère de Marko est enseignante.
- La seĝo estas en la ĉambro.: La chaise est dans la pièce.
- La libro estas de li, ĝi estas lia.: Le livre lui appartient ; c'est le sien.
- Mia nomo estas Marko.: Je m'appelle Marko.
