- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko a un ami et une amie. Ce sont des amis.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Il prépare du café et ils le boivent chez nous.
- Ili iras al la hotelo.: Ils vont à l'hôtel.
- Ŝi vidas, ke Marko amas ŝin.: Elle voit que Marko l'aime.
- Ili havas facilajn lernolibrojn.: Ils ont des manuels faciles.
