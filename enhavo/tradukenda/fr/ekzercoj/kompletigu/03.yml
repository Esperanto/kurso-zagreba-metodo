- Mia amiko skribas multe.: Mon ami écrit beaucoup.
- Bela kelnerino estas belulino.: Une belle serveuse est une belle femme.
- Ni havas multajn belajn aferojn.: Nous avons beaucoup de belles choses.
- Ni kune lernas en lernejo.: Nous apprenons ensemble à l'école.
- Miaj gepatroj manĝas en manĝejo.: Mes parents mangent dans une salle à manger.
- La kuko estas manĝebla.: Le gâteau est comestible.
