- Ana kaj Marko iris tra la strato.: Ana et Marko longèrent la rue.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ils arrivèrent dans un café, se dirigèrent vers une table et virent le père assis sur une chaise.
- Ana metis tri kukojn sur seĝon.: Ana a posé trois gâteaux sur une chaise.
- Ŝi remetis poste la kukojn sur la tablon.: Plus tard, elle a remis les gâteaux sur la table.
