- Dankon, sinjoro. Nedankinde.: Merci, monsieur. Vous êtes les bienvenus.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Une heure est courte, un jour est plus long, un mois est le plus long.
- Mi legas pli multajn librojn ol mia amiko.: Je lis plus de livres que mon ami.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: J'ai envoyé de longues lettres à mon ami alors qu'il était à Tokyo.
- La libro estas leginda.: Le livre vaut la peine d'être lu.
