- La gepatroj ĉiam deziras, ke mi lernu multon.: Les parents souhaitent toujours que j'apprenne beaucoup.
- Mia amiko deziras, ke mi iru kanti kun li.: Mon ami souhaite que j'aille chanter avec lui.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Le père veut que son enfant mange le gâteau qui est sur la table.
- Ni loĝas en malgranda ĉambro.: Nous vivons dans une petite pièce.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Je suis devenu inquiet quand je t'ai vu.
- Ĉiuj rimarkis, ke ŝi estas belega.: Tout le monde a remarqué qu'elle est très belle.
