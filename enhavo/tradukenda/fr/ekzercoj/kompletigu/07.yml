- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Il buvait très vite son verre du matin pour arriver tôt à l'école.
- Mi ankoraŭ ne aŭdis novaĵon.: Je n'ai pas encore eu de nouvelles.
- En tiu momento Marko ekkriis.: À ce moment-là, Marko s'est écrié.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Un garçon qui n’aime pas les autres garçons et filles n’a ni amis masculins ni amis féminins.
