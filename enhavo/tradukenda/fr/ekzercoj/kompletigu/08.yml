- Ni ordigis ĉion kaj transdonis al ili.: Nous avons tout mis en ordre et leur avons remis.
- Mi petas glason da kafo kaj iom da akvo.: Je demande un verre de café et de l'eau.
- Doloris lin la kapo. Li malsaniĝis.: Il avait mal à la tête. Il est tombé malade.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: La fille aime être belle et c’est pour cette raison qu’elle embellit son visage.
