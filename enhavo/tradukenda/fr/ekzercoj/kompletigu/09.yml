- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Si j’avais autant d’argent que d’idées, je voyagerais à travers le monde.
- En ĉiu vortaro mankas kelkaj vortoj.: Dans chaque dictionnaire, certains mots manquent.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Une personne qui continue à raconter des histoires pendant longtemps à table restera affamée.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Il devait faire attention et n’était pas autorisé à rester longtemps dehors sous la pluie. C'est pourquoi il a attrapé froid.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Il a une idée claire, mais il croira tout ce que vous dites, comme si vous étiez sa femme.
