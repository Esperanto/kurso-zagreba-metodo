- En juneco oni havas ankaŭ belecon.: Dans la jeunesse, on a aussi la beauté.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Les patrons devraient simplifier les tâches compliquées.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: À cet âge, il était déjà devenu directeur d’un club sportif.
- Monon oni metas en monujon.: On met de l’argent dans un portefeuille.
- Sekvu la ekzemplon de la bonaj familianoj.: Suivez l’exemple des bons membres de la famille.
