- La knabino ĵetis la paperon en la paperujon.: La jeune fille jeta le papier dans la corbeille à papier.
- Kie estas mia skribilo, mi volas respondi al li.: Où est mon stylo ? Je veux lui répondre.
- La suno malaperis kaj nun estas preskaŭ malhele.: Le soleil a disparu et maintenant il fait presque nuit.
- Bonvolu manĝi la panon per manĝilo.: S'il vous plaît, mangez le pain avec un ustensile de cuisine.
- Pardonu min, mi ne rajtas resti.: Pardonnez-moi, je n'ai pas le droit de rester.
