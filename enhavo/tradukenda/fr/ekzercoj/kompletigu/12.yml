- Antaŭ kvarona horo ili revenis.: Ils sont revenus il y a un quart d'heure.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Après ce terrible malheur, les gens sont partis et les vieilles villes se sont effondrées.
- Ni devus revidi nin, mia amiko.: Nous devrions nous revoir, mon ami.
- Ju pli ofte mi pripensas, des pli mi koleras.: Plus j’y pense, plus je me mets en colère.
- Ŝi loĝas en iu ajn domo.: Elle vit dans n'importe quelle maison.
