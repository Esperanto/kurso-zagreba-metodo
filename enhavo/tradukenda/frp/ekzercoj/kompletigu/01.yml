- Marko estas en la ĉambro.: Marko est dens la chambra.
- Li sidas sur seĝo.: Il sèd sur una chêsa.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Un mèstro ensègne. Un ovriér travalyè. Un ecoliér aprent.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko et Aleksandro sont ecoliérs et sportifs.
- La patrino de Marko estas instruistino.: La mére de Marko est mèstra.
- La seĝo estas en la ĉambro.: La chêsa est dens la chambra.
- La libro estas de li, ĝi estas lia.: Lo livro est de lui; il est sien.
- Mia nomo estas Marko.: Mon nom est Marko.
