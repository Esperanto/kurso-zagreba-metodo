- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko at un ami et una amia. Ils sont amis.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Il fêt lo cafè et ils lo bevont dens noutron ostal.
- Ili iras al la hotelo.: Ils vont a l'hotel.
- Ŝi vidas, ke Marko amas ŝin.: Ela vey que Marko l'aime.
- Ili havas facilajn lernolibrojn.: Ils ont de livros d'aprentissâjo fácilos.
