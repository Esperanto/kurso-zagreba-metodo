- Mia amiko skribas multe.: Mon ami écrit beaucoup.
- Bela kelnerino estas belulino.: Una bèla serveusa est una bèla fena.
- Ni havas multajn belajn aferojn.: Nos avons beaucoup de bèlas chouses.
- Ni kune lernas en lernejo.: Nos aprenons ensemble a l'ecola.
- Miaj gepatroj manĝas en manĝejo.: Mos parents mangent dens una sala de mangiér.
- La kuko estas manĝebla.: Lo gato est mangiâblo.
