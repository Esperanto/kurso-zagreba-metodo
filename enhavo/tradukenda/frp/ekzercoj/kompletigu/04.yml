- Ana kaj Marko iris tra la strato.: Ana et Marko sont alâs per la rua.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ils sont vegnus a un cafè, sont alâs a una tabla et ont vu lo pére sèdre sur una chêsa.
- Ana metis tri kukojn sur seĝon.: Ana at botâ três gatos sur una chêsa.
- Ŝi remetis poste la kukojn sur la tablon.: Pus tard ela at remês los gatos sur la tabla.
