- Dankon, sinjoro. Nedankinde.: Mèrci, monsior. De ren.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Una hora est corta, un jorn est més long, un mês est lo més long.
- Mi legas pli multajn librojn ol mia amiko.: Je lis més de livros que mon ami.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: J'ai mandâ de longas lètres a mon ami pendent qu'il était a Tokyo.
- La libro estas leginda.: Lo livro vaut la pena d'être lu.
