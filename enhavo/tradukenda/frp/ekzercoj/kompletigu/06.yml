- La gepatroj ĉiam deziras, ke mi lernu multon.: Los parents volyont tojorn que j'aprègno beaucoup.
- Mia amiko deziras, ke mi iru kanti kun li.: Mon ami voly que j'ale chantar avouéc lui.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Lo pére voly que son enfant mange lo gato qu'est sur la tabla.
- Ni loĝas en malgranda ĉambro.: Nos habitons dens una petita chambra.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Je suis devenu inquiet quand je t'ai vu.
- Ĉiuj rimarkis, ke ŝi estas belega.: Tots ont remarquâ qu'ela est très bèla.
