- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Il at beu très vite sa bevenda du matin por venir tôt a l'ecola.
- Mi ankoraŭ ne aŭdis novaĵon.: Je n'ai pas encore ouï de novèles.
- En tiu momento Marko ekkriis.: A cel moment Marko at criâ.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Un garçon que n'aime pas los autres garçons et filles n'at ni amis ni amias.
