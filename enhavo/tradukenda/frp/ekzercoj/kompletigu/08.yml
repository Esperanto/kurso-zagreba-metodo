- Ni ordigis ĉion kaj transdonis al ili.: Nos avons ordonâ tot et l'avons remês a els.
- Mi petas glason da kafo kaj iom da akvo.: Je demande un vèro de cafè et un peu d'égua.
- Doloris lin la kapo. Li malsaniĝis.: La téta lui faisait mal. Il est devenu malade.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: La filha aime être bèla, et por cela ela embelit son visage.
