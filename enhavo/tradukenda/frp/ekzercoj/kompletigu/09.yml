- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Si j'avais autant d'argent que d'idées, je voyagérôs autour du mondo.
- En ĉiu vortaro mankas kelkaj vortoj.: Dens châque diccionèro manquent quelques mots.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Una persona que raconte longtemps a la tabla de mangiér restera affamâ.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Il devait fâre attention et ne pouvait pas rester longtemps dehors dens la pluie. Donc il at pris froid.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Il at son idèa cllèra, mais il croira tot ce que tu diras, comme si tu étais sa fena.
