- La knabino ĵetis la paperon en la paperujon.: La filha at jetâ lo papiér dens la corbelye a papiér.
- Kie estas mia skribilo, mi volas respondi al li.: Ont est mon stylo? Je voly lui répondre.
- La suno malaperis kaj nun estas preskaŭ malhele.: Lo solèly at disparèt et ora il est presque sombre.
- Bonvolu manĝi la panon per manĝilo.: S'il vos plait, mangiéd lo pan avouéc un ustensilo.
- Pardonu min, mi ne rajtas resti.: Pardone-me, je ne puis pas rester.
