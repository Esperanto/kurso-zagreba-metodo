- Antaŭ kvarona horo ili revenis.: Ils sont revenus il y at un quart d'hora.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Après lo terrible malheur, les gens sont partis et les vièles viles se sont écroulâes.
- Ni devus revidi nin, mia amiko.: Nos devrions nos revoir, mon ami.
- Ju pli ofte mi pripensas, des pli mi koleras.: Plus souvent j'y pense, plus je me mets en colère.
- Ŝi loĝas en iu ajn domo.: Ela habite dens una maison quelconque.
