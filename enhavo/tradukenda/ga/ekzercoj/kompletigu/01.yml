- Marko estas en la ĉambro.: Tá Marko sa seomra.
- Li sidas sur seĝo.: Suíonn sé ar chathaoir.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Múineann múinteoir. Oibríonn oibrí. Foghlaimíonn dalta.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Is mic léinn agus lúthchleasaithe iad Marko agus Aleksandro.
- La patrino de Marko estas instruistino.: Is múinteoir í máthair Marko.
- La seĝo estas en la ĉambro.: Tá an chathaoir sa seomra.
- La libro estas de li, ĝi estas lia.: Baineann an leabhar leis; tá sé aige.
- Mia nomo estas Marko.: Marko is ainm dom.
