- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Tá cara fireann agus cara baineann ag Marko. Is cairde iad.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Déanann sé caife agus ólann siad é inár dteach.
- Ili iras al la hotelo.: Téann siad go dtí an t-óstán.
- Ŝi vidas, ke Marko amas ŝin.: Feiceann sí go bhfuil grá ag Marko di.
- Ili havas facilajn lernolibrojn.: Tá téacsleabhair éasca acu.
