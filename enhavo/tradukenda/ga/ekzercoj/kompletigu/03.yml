- Mia amiko skribas multe.: Scríobhann mo chara go leor.
- Bela kelnerino estas belulino.: Is bean álainn í freastalaí álainn.
- Ni havas multajn belajn aferojn.: Tá go leor rudaí áille againn.
- Ni kune lernas en lernejo.: Foghlaimimid le chéile ar scoil.
- Miaj gepatroj manĝas en manĝejo.: Itheann mo thuismitheoirí i seomra bia.
- La kuko estas manĝebla.: Tá an cáca inite.
