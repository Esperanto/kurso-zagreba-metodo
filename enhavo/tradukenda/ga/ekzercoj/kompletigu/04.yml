- Ana kaj Marko iris tra la strato.: Chuaigh Ana agus Marko feadh na sráide.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Tháinig siad go dtí caifé, chuaigh siad chuig bord, agus chonaic an t-athair ina shuí ar chathaoir.
- Ana metis tri kukojn sur seĝon.: Chuir Ana trí cáca ar chathaoir.
- Ŝi remetis poste la kukojn sur la tablon.: Chuir sí na cácaí ar ais ar an mbord ina dhiaidh sin.
