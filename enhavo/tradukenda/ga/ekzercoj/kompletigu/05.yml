- Dankon, sinjoro. Nedankinde.: Go raibh maith agat, a dhuine uasail. Tá fáilte romhat.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Tá uair an chloig gearr, tá lá níos faide, is é mí an ceann is faide.
- Mi legas pli multajn librojn ol mia amiko.: Léigh mé níos mó leabhar ná mo chara.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Chuir mé litreacha fada chuig mo chara agus é i dTóiceo.
- La libro estas leginda.: Is fiú an leabhar a léamh.
