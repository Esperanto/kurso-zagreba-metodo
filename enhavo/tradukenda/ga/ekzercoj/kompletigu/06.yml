- La gepatroj ĉiam deziras, ke mi lernu multon.: Is mian le tuismitheoirí i gcónaí go bhfoghlaimeoidh mé go leor.
- Mia amiko deziras, ke mi iru kanti kun li.: Is mian le mo chara go rachainn ag canadh leis.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Teastaíonn ón athair go n-íosfadh a leanbh an cáca atá ar an mbord.
- Ni loĝas en malgranda ĉambro.: Tá cónaí orainn i seomra beag.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Bhí anacair orm nuair a chonaic mé thú.
- Ĉiuj rimarkis, ke ŝi estas belega.: Thug gach duine faoi deara go bhfuil sí an-álainn.
