- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: D’ól sé a dheoch ar maidin go han-ghasta le teacht go luath ar scoil.
- Mi ankoraŭ ne aŭdis novaĵon.: Níor chuala mé aon nuacht go fóill.
- En tiu momento Marko ekkriis.: Ag an nóiméad sin ghlaoigh Marko amach.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Buachaill nach bhfuil grá aige do bhuachaillí agus do chailíní eile, níl cairde fireanna ná cairde baineanna aige.
