- Ni ordigis ĉion kaj transdonis al ili.: Chuireamar gach rud in ord agus thugamar ar láimh dóibh é.
- Mi petas glason da kafo kaj iom da akvo.: Iarraim gloine caife agus roinnt uisce.
- Doloris lin la kapo. Li malsaniĝis.: Gortaítear a cheann. D’éirigh sé tinn.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Is maith leis an gcailín a bheith álainn, agus ar an ábhar sin áilleacht sí a aghaidh.
