- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Dá mbeadh an oiread airgid agus smaointe agam, bheinn ag taisteal ar fud an domhain.
- En ĉiu vortaro mankas kelkaj vortoj.: I ngach foclóir tá roinnt focal in easnamh.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Fanfaidh ocras ar dhuine a choinníonn ag insint scéalta ar feadh i bhfad ag an mbord bia.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Bhí air aird a thabhairt agus ní raibh cead aige fanacht amuigh i bhfad sa bháisteach. Dá bhrí sin fuair sé slaghdán.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Tá an smaoineamh soiléir aige, ach creidfidh sé gach rud a deir tú, amhail is dá mba tú a bhean chéile.
