- En juneco oni havas ankaŭ belecon.: I óige tá áilleacht amháin freisin.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Ba cheart do bosses poist casta a shimpliú.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Ag an aois sin bhí sé ina cheannaire ar chlub spóirt cheana féin.
- Monon oni metas en monujon.: Cuireann duine acu airgead isteach i sparán.
- Sekvu la ekzemplon de la bonaj familianoj.: Lean an sampla de na baill teaghlaigh maith.
