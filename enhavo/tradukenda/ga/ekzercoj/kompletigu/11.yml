- La knabino ĵetis la paperon en la paperujon.: Chaith an cailín an páipéar isteach sa chiseán dramhpháipéir.
- Kie estas mia skribilo, mi volas respondi al li.: Cá bhfuil mo pheann? Ba mhaith liom é a fhreagairt.
- La suno malaperis kaj nun estas preskaŭ malhele.: D'imigh an ghrian agus anois tá sé beagnach dorcha.
- Bonvolu manĝi la panon per manĝilo.: Ith an t-arán le acra itheacháin le do thoil.
- Pardonu min, mi ne rajtas resti.: Maith dom, níl cead agam fanacht.
