- Antaŭ kvarona horo ili revenis.: D'fhill siad ceathrú uaire ó shin.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Tar éis an trua uafásach, d'imigh na daoine agus thit na seanchathracha as a chéile.
- Ni devus revidi nin, mia amiko.: Ba cheart dúinn a chéile a fheiceáil arís, a chara.
- Ju pli ofte mi pripensas, des pli mi koleras.: Dá mhinice a smaoiním air is ea is feirge a éiríonn mé.
- Ŝi loĝas en iu ajn domo.: Cónaíonn sí in aon teach.
