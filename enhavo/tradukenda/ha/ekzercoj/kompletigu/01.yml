- Marko estas en la ĉambro.: Marko yana cikin dakin.
- Li sidas sur seĝo.: Yana zaune akan kujera.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Wani malami yana koyarwa. Wani ma'aikaci yana aiki. Dalibi ya koya.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko da Aleksandro dalibai ne kuma ’yan wasa.
- La patrino de Marko estas instruistino.: Mahaifiyar Marko malama ce.
- La seĝo estas en la ĉambro.: Kujerar tana dakin.
- La libro estas de li, ĝi estas lia.: Littafin nasa ne; nasa ne.
- Mia nomo estas Marko.: Sunana Marko.
