- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko yana da aboki namiji da abokiyar mace. Abokai ne.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Yana yin kofi kuma suna sha a gidanmu.
- Ili iras al la hotelo.: Suna zuwa otal.
- Ŝi vidas, ke Marko amas ŝin.: Ta ga Marko yana sonta.
- Ili havas facilajn lernolibrojn.: Suna da litattafai masu sauƙi.
