- Mia amiko skribas multe.: Abokina yana rubutu da yawa.
- Bela kelnerino estas belulino.: Kyakkyawar ma'aikaciyar mace ce kyakkyawa.
- Ni havas multajn belajn aferojn.: Muna da kyawawan abubuwa da yawa.
- Ni kune lernas en lernejo.: Muna koyo tare a makaranta.
- Miaj gepatroj manĝas en manĝejo.: Iyayena suna cin abinci a ɗakin cin abinci.
- La kuko estas manĝebla.: Kek ɗin ana iya ci.
