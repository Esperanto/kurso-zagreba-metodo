- Ana kaj Marko iris tra la strato.: Ana da Marko suka bi kan titi.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Suna zuwa wani cafe, suka je kan tebur, suka ga uban zaune akan kujera.
- Ana metis tri kukojn sur seĝon.: Ana ajiye waina guda uku akan kujera.
- Ŝi remetis poste la kukojn sur la tablon.: Daga baya ta mayar da biredin kan teburin.
