- Dankon, sinjoro. Nedankinde.: Na gode yallabai. Marabanku.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Sa’a guda gajeru ce, rana ta fi tsayi, wata ita ce mafi tsayi.
- Mi legas pli multajn librojn ol mia amiko.: Na karanta littattafai fiye da abokina.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Na aika dogayen wasiƙu zuwa ga abokina sa’ad da yake Tokyo.
- La libro estas leginda.: Littafin ya cancanci karantawa.
