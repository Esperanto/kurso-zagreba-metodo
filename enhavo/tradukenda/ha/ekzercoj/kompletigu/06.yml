- La gepatroj ĉiam deziras, ke mi lernu multon.: Iyaye koyaushe suna fatan in koyi abubuwa da yawa.
- Mia amiko deziras, ke mi iru kanti kun li.: Abokina yana fatan in je waƙa tare da shi.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Uban yana son yaronsa ya ci wainar da ke kan tebur.
- Ni loĝas en malgranda ĉambro.: Muna zaune a wani karamin daki.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Na ji ba dadi lokacin da na gan ku.
- Ĉiuj rimarkis, ke ŝi estas belega.: Kowa ya lura cewa tayi kyau sosai.
