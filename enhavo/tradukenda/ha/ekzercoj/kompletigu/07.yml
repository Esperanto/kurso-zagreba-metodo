- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Da sauri ya sha abin safiya domin ya zo makaranta da wuri.
- Mi ankoraŭ ne aŭdis novaĵon.: Har yanzu ban ji wani labari ba.
- En tiu momento Marko ekkriis.: Nan take Marko ya yi kuka.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Yaron da ba ya son sauran yara maza da mata ba shi da abokai maza ko kawayen mata.
