- Ni ordigis ĉion kaj transdonis al ili.: Muka tsara komai muka mika musu.
- Mi petas glason da kafo kaj iom da akvo.: Ina neman gilashin kofi da ruwa.
- Doloris lin la kapo. Li malsaniĝis.: Kansa yayi zafi. Ya yi rashin lafiya.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Yarinyar tana son zama kyakkyawa, don haka ta ƙawata fuskarta.
