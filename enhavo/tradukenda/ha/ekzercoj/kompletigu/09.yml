- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Idan ina da kuɗi da yawa kamar ra'ayoyi, zan yi tafiya a duniya.
- En ĉiu vortaro mankas kelkaj vortoj.: A cikin kowane ƙamus wasu kalmomi sun ɓace.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Mutumin da ya daɗe yana ba da labari a teburin cin abinci zai kasance da yunwa.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Dole ne ya kula kuma ba a bar shi ya daɗe a waje da ruwan sama ba. Don haka sai ya yi sanyi.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Yana da ra'ayinsa sarai, amma zai gaskata duk abin da kike faɗa, kamar ke ce matarsa.
