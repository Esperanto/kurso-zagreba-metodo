- La knabino ĵetis la paperon en la paperujon.: Yarinyar ta jefa takardar cikin kwandon shara.
- Kie estas mia skribilo, mi volas respondi al li.: Ina alkalami na? Ina so in amsa masa.
- La suno malaperis kaj nun estas preskaŭ malhele.: Rana ta bace kuma yanzu ta kusa duhu.
- Bonvolu manĝi la panon per manĝilo.: Da fatan za a ci gurasar tare da kayan abinci.
- Pardonu min, mi ne rajtas resti.: Ku gafarce ni, ban yarda in zauna ba.
