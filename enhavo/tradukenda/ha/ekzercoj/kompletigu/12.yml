- Antaŭ kvarona horo ili revenis.: Kwata daya suka dawo.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Bayan wannan mugunyar bala'i, sai jama'a suka tafi, tsofaffin garuruwa suka wargaje.
- Ni devus revidi nin, mia amiko.: Yakamata mu sake ganin juna abokina.
- Ju pli ofte mi pripensas, des pli mi koleras.: Sau da yawa na yi tunani game da shi, na ƙara yin fushi.
- Ŝi loĝas en iu ajn domo.: Tana zaune a kowane gida.
