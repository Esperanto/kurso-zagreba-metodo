- Marko estas en la ĉambro.: מרקו בחדר.
- Li sidas sur seĝo.: הוא יושב על כיסא.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: מורה מלמד. עובד עובד. תלמיד לומד.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: מרקו ואלכסנדרו הם סטודנטים וספורטאים.
- La patrino de Marko estas instruistino.: אמו של מרקו היא מורה.
- La seĝo estas en la ĉambro.: הכיסא נמצא בחדר.
- La libro estas de li, ĝi estas lia.: הספר שייך לו; זה שלו.
- Mia nomo estas Marko.: שמי מרקו.
