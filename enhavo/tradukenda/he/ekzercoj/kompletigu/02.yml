- Marko havas amikon kaj amikinon. Ili estas geamikoj.: למרקו יש חבר זכר וחברה. הם חברים.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: הוא מכין קפה ושותים אותו בבית שלנו.
- Ili iras al la hotelo.: הם הולכים למלון.
- Ŝi vidas, ke Marko amas ŝin.: היא רואה שמרקו אוהב אותה.
- Ili havas facilajn lernolibrojn.: יש להם ספרי לימוד קלים.
