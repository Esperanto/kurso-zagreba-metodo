- Mia amiko skribas multe.: חבר שלי כותב הרבה.
- Bela kelnerino estas belulino.: מלצרית יפה היא אישה יפה.
- Ni havas multajn belajn aferojn.: יש לנו הרבה דברים יפים.
- Ni kune lernas en lernejo.: אנחנו לומדים ביחד בבית הספר.
- Miaj gepatroj manĝas en manĝejo.: ההורים שלי אוכלים בחדר אוכל.
- La kuko estas manĝebla.: העוגה אכילה.
