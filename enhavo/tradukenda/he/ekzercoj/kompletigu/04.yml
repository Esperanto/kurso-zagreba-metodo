- Ana kaj Marko iris tra la strato.: אנה ומרקו הלכו ברחוב.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: הם הגיעו לבית קפה, הלכו לשולחן וראו את האב יושב על כיסא.
- Ana metis tri kukojn sur seĝon.: אנה הניחה שלוש עוגות על כיסא.
- Ŝi remetis poste la kukojn sur la tablon.: מאוחר יותר היא החזירה את העוגות על השולחן.
