- Dankon, sinjoro. Nedankinde.: תודה לך, אדוני. אתה מוזמן.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: שעה היא קצרה, יום ארוך יותר, חודש הוא הארוך ביותר.
- Mi legas pli multajn librojn ol mia amiko.: קראתי יותר ספרים מחברי.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: שלחתי מכתבים ארוכים לחבר שלי כשהיה בטוקיו.
- La libro estas leginda.: הספר שווה קריאה.
