- La gepatroj ĉiam deziras, ke mi lernu multon.: הורים תמיד מאחלים שאלמד הרבה.
- Mia amiko deziras, ke mi iru kanti kun li.: חבר שלי רוצה שאלך לשיר איתו.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: האב רוצה שהילד שלו יאכל את העוגה שעל השולחן.
- Ni loĝas en malgranda ĉambro.: אנחנו גרים בחדר קטן.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: נעשיתי לא רגוע כשראיתי אותך.
- Ĉiuj rimarkis, ke ŝi estas belega.: כולם שמו לב שהיא מאוד יפה.
