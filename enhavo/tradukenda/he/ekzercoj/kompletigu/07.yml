- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: הוא שתה את משקה הבוקר שלו מהר מאוד כדי להגיע מוקדם לבית הספר.
- Mi ankoraŭ ne aŭdis novaĵon.: עדיין לא שמעתי חדשות.
- En tiu momento Marko ekkriis.: באותו רגע מרקו צעק.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: לנער שלא אוהב בנים ובנות אחרים אין לו לא חברים גברים ולא חברים.
