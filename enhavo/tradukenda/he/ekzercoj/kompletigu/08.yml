- Ni ordigis ĉion kaj transdonis al ili.: סידרנו הכל ומסרנו להם.
- Mi petas glason da kafo kaj iom da akvo.: אני מבקש כוס קפה וקצת מים.
- Doloris lin la kapo. Li malsaniĝis.: הראש שלו כאב. הוא נהיה חולה.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: הילדה אוהבת להיות יפה, ומסיבה זו היא מייפה את פניה.
