- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: אם היה לי כמה כסף כמו רעיונות, הייתי מסתובב ברחבי העולם.
- En ĉiu vortaro mankas kelkaj vortoj.: בכל מילון חסרות כמה מילים.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: אדם שממשיך לספר סיפורים לאורך זמן ליד שולחן האוכל יישאר רעב.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: הוא נאלץ לשים לב ולא נתנו לו לשהות זמן רב בחוץ בגשם. לכן הוא התקרר.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: יש לו את הרעיון הברור שלו, אבל הוא יאמין לכל מה שאתה אומר, כאילו היית אשתו.
