- La knabino ĵetis la paperon en la paperujon.: הילדה זרקה את הנייר לסל הנייר.
- Kie estas mia skribilo, mi volas respondi al li.: איפה העט שלי? אני רוצה לענות לו.
- La suno malaperis kaj nun estas preskaŭ malhele.: השמש נעלמה ועכשיו כמעט חושך.
- Bonvolu manĝi la panon per manĝilo.: נא לאכול את הלחם בכלי אכילה.
- Pardonu min, mi ne rajtas resti.: סלח לי, אסור לי להישאר.
