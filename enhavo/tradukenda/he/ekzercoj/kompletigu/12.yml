- Antaŭ kvarona horo ili revenis.: הם חזרו לפני רבע שעה.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: לאחר האסון הנורא, הלכו האנשים והערים הישנות התפרקו.
- Ni devus revidi nin, mia amiko.: אנחנו צריכים להתראות שוב, ידידי.
- Ju pli ofte mi pripensas, des pli mi koleras.: ככל שאני חושב על זה לעתים קרובות יותר, אני כועס יותר.
- Ŝi loĝas en iu ajn domo.: היא גרה בכל בית.
