- Marko estas en la ĉambro.: मार्को कमरे में है.
- Li sidas sur seĝo.: वह एक कुर्सी पर बैठता है.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: एक शिक्षक पढ़ाता है. एक मजदूर काम करता है. एक विद्यार्थी सीखता है.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: मार्को और अलेक्जेंड्रो छात्र और एथलीट हैं।
- La patrino de Marko estas instruistino.: मार्को की माँ एक शिक्षिका हैं।
- La seĝo estas en la ĉambro.: कुर्सी कमरे में है.
- La libro estas de li, ĝi estas lia.: किताब उसकी है; यह उसका है.
- Mia nomo estas Marko.: मेरा नाम मार्को है.
