- Marko havas amikon kaj amikinon. Ili estas geamikoj.: मार्को का एक पुरुष मित्र और एक महिला मित्र है। वे दोस्त हैं।
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: वह कॉफ़ी बनाता है और वे इसे हमारे घर में पीते हैं।
- Ili iras al la hotelo.: वे होटल जाते हैं.
- Ŝi vidas, ke Marko amas ŝin.: वह देखती है कि मार्को उससे प्यार करता है।
- Ili havas facilajn lernolibrojn.: उनके पास आसान पाठ्यपुस्तकें हैं।
