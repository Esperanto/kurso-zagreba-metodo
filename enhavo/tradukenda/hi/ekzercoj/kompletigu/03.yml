- Mia amiko skribas multe.: मेरा दोस्त बहुत लिखता है.
- Bela kelnerino estas belulino.: एक खूबसूरत वेट्रेस एक खूबसूरत महिला होती है।
- Ni havas multajn belajn aferojn.: हमारे पास कई खूबसूरत चीजें हैं.
- Ni kune lernas en lernejo.: हम स्कूल में एक साथ सीखते हैं।
- Miaj gepatroj manĝas en manĝejo.: मेरे माता-पिता भोजन कक्ष में खाना खाते हैं।
- La kuko estas manĝebla.: केक खाने योग्य है.
