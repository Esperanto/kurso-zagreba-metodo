- Ana kaj Marko iris tra la strato.: एना और मार्को सड़क पर चले गए।
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: वे एक कैफे में आये, एक मेज के पास गये और देखा कि पिता एक कुर्सी पर बैठे हैं।
- Ana metis tri kukojn sur seĝon.: एना ने एक कुर्सी पर तीन केक रखे।
- Ŝi remetis poste la kukojn sur la tablon.: बाद में उसने केक वापस मेज पर रख दिये।
