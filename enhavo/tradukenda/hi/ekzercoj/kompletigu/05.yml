- Dankon, sinjoro. Nedankinde.: धन्यवाद महोदय। आपका स्वागत है।
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: एक घंटा छोटा है, एक दिन बड़ा है, एक महीना सबसे लंबा है।
- Mi legas pli multajn librojn ol mia amiko.: मैं अपने दोस्त से ज्यादा किताबें पढ़ता हूं।
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: जब मेरा दोस्त टोक्यो में था तो मैंने उसे लंबे पत्र भेजे।
- La libro estas leginda.: किताब पढ़ने लायक है.
