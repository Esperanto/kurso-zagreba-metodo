- La gepatroj ĉiam deziras, ke mi lernu multon.: माता-पिता हमेशा चाहते हैं कि मैं बहुत कुछ सीखूं।
- Mia amiko deziras, ke mi iru kanti kun li.: मेरे दोस्त की इच्छा है कि मैं उसके साथ गाने जाऊं।
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: पिता चाहता है कि उसका बच्चा मेज पर रखा केक खाए।
- Ni loĝas en malgranda ĉambro.: हम एक छोटे से कमरे में रहते हैं.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: जब मैंने तुम्हें देखा तो मैं असहज हो गया।
- Ĉiuj rimarkis, ke ŝi estas belega.: सभी ने नोटिस किया कि वह बेहद खूबसूरत हैं.
