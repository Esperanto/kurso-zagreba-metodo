- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: स्कूल जल्दी आने के लिए उसने सुबह का पेय जल्दी-जल्दी पी लिया।
- Mi ankoraŭ ne aŭdis novaĵon.: मैंने अभी तक कोई खबर नहीं सुनी है.
- En tiu momento Marko ekkriis.: उसी क्षण मार्को चिल्लाया।
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: जो लड़का दूसरे लड़के-लड़कियों से प्यार नहीं करता, उसके न तो पुरुष मित्र होते हैं और न ही महिला मित्र।
