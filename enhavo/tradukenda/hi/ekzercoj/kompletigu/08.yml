- Ni ordigis ĉion kaj transdonis al ili.: हमने सब कुछ व्यवस्थित करके उन्हें सौंप दिया।
- Mi petas glason da kafo kaj iom da akvo.: मैं एक गिलास कॉफ़ी और थोड़ा पानी माँगता हूँ।
- Doloris lin la kapo. Li malsaniĝis.: उसके सिर पर चोट लगी. वह बीमार हो गया.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: लड़कियों को खूबसूरत दिखना पसंद होता है और इसी वजह से वह अपने चेहरे को खूबसूरत बनाती हैं।
