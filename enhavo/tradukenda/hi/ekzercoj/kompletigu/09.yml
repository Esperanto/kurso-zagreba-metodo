- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: यदि मेरे पास विचारों जितना पैसा होता, तो मैं दुनिया भर में यात्रा करता।
- En ĉiu vortaro mankas kelkaj vortoj.: प्रत्येक शब्दकोष में कुछ शब्द गायब हैं।
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: जो व्यक्ति खाने की मेज़ पर देर तक कहानियाँ सुनाता रहता है, वह भूखा ही रहेगा।
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: उसे ध्यान देना था और बारिश में ज्यादा देर तक बाहर रहने की अनुमति नहीं थी। इसलिए उसे सर्दी लग गयी.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: उसके पास अपना स्पष्ट विचार है, लेकिन वह आपकी हर बात पर विश्वास करेगा, जैसे कि आप उसकी पत्नी हों।
