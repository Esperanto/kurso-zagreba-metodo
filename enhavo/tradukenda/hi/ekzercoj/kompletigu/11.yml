- La knabino ĵetis la paperon en la paperujon.: लड़की ने कागज को रद्दी की टोकरी में फेंक दिया।
- Kie estas mia skribilo, mi volas respondi al li.: मेरी कलम कहाँ है? मैं उसका जवाब देना चाहता हूं.
- La suno malaperis kaj nun estas preskaŭ malhele.: सूरज गायब हो गया और अब लगभग अंधेरा हो गया है।
- Bonvolu manĝi la panon per manĝilo.: कृपया रोटी को खाने के बर्तन से खाएं।
- Pardonu min, mi ne rajtas resti.: मुझे माफ़ कर दो, मुझे रहने की इजाज़त नहीं है.
