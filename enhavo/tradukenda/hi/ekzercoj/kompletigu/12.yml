- Antaŭ kvarona horo ili revenis.: वे पौन घंटे पहले लौटे थे.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: भयानक दुर्भाग्य के बाद, लोग चले गए और पुराने शहर नष्ट हो गए।
- Ni devus revidi nin, mia amiko.: हमें एक दूसरे से दोबारा मिलना चाहिए, मेरे दोस्त।
- Ju pli ofte mi pripensas, des pli mi koleras.: जितनी बार मैं इसके बारे में सोचता हूं, मुझे उतना ही गुस्सा आता है।
- Ŝi loĝas en iu ajn domo.: वह किसी भी घर में रहती है.
