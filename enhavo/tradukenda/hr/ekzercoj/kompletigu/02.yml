- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ima prijatelja i prijateljicu. Oni su prijatelji.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Skuha kavu i piju je u našem domu.
- Ili iras al la hotelo.: Odlaze u hotel.
- Ŝi vidas, ke Marko amas ŝin.: Vidi da je Marko voli.
- Ili havas facilajn lernolibrojn.: Imaju lake udžbenike.
