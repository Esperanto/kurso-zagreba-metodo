- Mia amiko skribas multe.: Moj prijatelj puno piše.
- Bela kelnerino estas belulino.: Lijepa konobarica je lijepa žena.
- Ni havas multajn belajn aferojn.: Imamo puno lijepih stvari.
- Ni kune lernas en lernejo.: Zajedno učimo u školi.
- Miaj gepatroj manĝas en manĝejo.: Moji roditelji jedu u blagovaonici.
- La kuko estas manĝebla.: Kolač je jestiv.
