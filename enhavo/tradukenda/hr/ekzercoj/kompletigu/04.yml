- Ana kaj Marko iris tra la strato.: Ana i Marko išli su ulicom.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Došli su u kafić, otišli do stola i vidjeli oca kako sjedi na stolici.
- Ana metis tri kukojn sur seĝon.: Ana je na stolicu stavila tri kolača.
- Ŝi remetis poste la kukojn sur la tablon.: Kasnije je kolače vratila na stol.
