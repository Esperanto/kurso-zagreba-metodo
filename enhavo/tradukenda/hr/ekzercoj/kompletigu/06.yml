- La gepatroj ĉiam deziras, ke mi lernu multon.: Roditelji uvijek žele da naučim puno.
- Mia amiko deziras, ke mi iru kanti kun li.: Moj prijatelj želi da idem pjevati s njim.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Otac želi da njegovo dijete pojede kolač koji je na stolu.
- Ni loĝas en malgranda ĉambro.: Živimo u maloj sobi.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Bilo mi je nelagodno kad sam te vidio.
- Ĉiuj rimarkis, ke ŝi estas belega.: Svi su primijetili da je jako lijepa.
