- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Jutarnje piće popio je vrlo brzo kako bi ranije došao u školu.
- Mi ankoraŭ ne aŭdis novaĵon.: Još nisam čuo nikakve vijesti.
- En tiu momento Marko ekkriis.: U tom trenutku Marko je povikao.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Dječak koji ne voli druge dječake i djevojčice nema ni muške ni ženske prijateljice.
