- Ni ordigis ĉion kaj transdonis al ili.: Sve smo posložili i predali im.
- Mi petas glason da kafo kaj iom da akvo.: Tražim čašu kave i malo vode.
- Doloris lin la kapo. Li malsaniĝis.: Boljela ga je glava. Razbolio se.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Djevojka voli biti lijepa i iz tog razloga uljepšava svoje lice.
