- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Da imam toliko novca koliko ideja, putovao bih oko svijeta.
- En ĉiu vortaro mankas kelkaj vortoj.: U svakom rječniku neke riječi nedostaju.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Osoba koja dugo priča priče za stolom ostat će gladna.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Morao je paziti i nije smio dugo ostati vani na kiši. Stoga se prehladio.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: On ima svoju jasnu ideju, ali vjerovat će vam u sve što kažete, kao da ste mu žena.
