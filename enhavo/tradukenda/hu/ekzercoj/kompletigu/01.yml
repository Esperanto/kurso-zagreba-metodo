- Marko estas en la ĉambro.: Marko a szobában van.
- Li sidas sur seĝo.: Egy széken ül.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Egy tanár tanít. Egy munkás dolgozik. Egy diák tanul.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko és Aleksandro diákok és sportolók.
- La patrino de Marko estas instruistino.: Marko édesanyja tanárnő.
- La seĝo estas en la ĉambro.: A szék a szobában van.
- La libro estas de li, ĝi estas lia.: A könyv az övé; az övé.
- Mia nomo estas Marko.: A nevem Marko.
