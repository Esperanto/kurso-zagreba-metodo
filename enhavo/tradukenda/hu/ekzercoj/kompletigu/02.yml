- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Markónak van egy férfi és egy nőbarátja. Ők barátok.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Kávét főz és otthonunkban isszák.
- Ili iras al la hotelo.: A szállodába mennek.
- Ŝi vidas, ke Marko amas ŝin.: Látja, hogy Marko szereti.
- Ili havas facilajn lernolibrojn.: Könnyű tankönyveik vannak.
