- Mia amiko skribas multe.: A barátom sokat ír.
- Bela kelnerino estas belulino.: Egy gyönyörű pincérnő gyönyörű nő.
- Ni havas multajn belajn aferojn.: Sok szép dolgunk van.
- Ni kune lernas en lernejo.: Együtt tanulunk az iskolában.
- Miaj gepatroj manĝas en manĝejo.: A szüleim egy ebédlőben esznek.
- La kuko estas manĝebla.: A sütemény ehető.
