- Ana kaj Marko iris tra la strato.: Ana és Marko végigmentek az utcán.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Bementek egy kávézóba, odamentek egy asztalhoz, és meglátták, hogy az apa egy széken ül.
- Ana metis tri kukojn sur seĝon.: Ana három tortát tett egy székre.
- Ŝi remetis poste la kukojn sur la tablon.: Később visszatette a süteményeket az asztalra.
