- Dankon, sinjoro. Nedankinde.: Köszönöm, uram. Szívesen.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Egy óra rövid, egy nap hosszabb, egy hónap a leghosszabb.
- Mi legas pli multajn librojn ol mia amiko.: Több könyvet olvasok, mint a barátom.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Hosszú leveleket küldtem a barátomnak, amikor Tokióban volt.
- La libro estas leginda.: A könyvet érdemes elolvasni.
