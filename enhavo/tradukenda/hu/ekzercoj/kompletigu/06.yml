- La gepatroj ĉiam deziras, ke mi lernu multon.: A szülők mindig azt kívánják, hogy sokat tanuljak.
- Mia amiko deziras, ke mi iru kanti kun li.: A barátom szeretné, ha elmennék vele énekelni.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Az apa azt akarja, hogy gyermeke megegye az asztalon lévő süteményt.
- Ni loĝas en malgranda ĉambro.: Egy kis szobában lakunk.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Nyugtalan lettem, amikor megláttalak.
- Ĉiuj rimarkis, ke ŝi estas belega.: Mindenki észrevette, hogy nagyon szép.
