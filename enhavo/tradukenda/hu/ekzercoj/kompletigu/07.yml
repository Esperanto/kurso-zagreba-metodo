- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Nagyon gyorsan megitta a reggeli italát, hogy korán jöjjön az iskolába.
- Mi ankoraŭ ne aŭdis novaĵon.: Még nem hallottam semmi hírt.
- En tiu momento Marko ekkriis.: Ebben a pillanatban Marko felkiáltott.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Annak a fiúnak, aki nem szeret más fiúkat és lányokat, nincsenek sem férfi barátai, sem női barátai.
