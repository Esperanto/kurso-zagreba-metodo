- Ni ordigis ĉion kaj transdonis al ili.: Mindent rendbe tettünk és átadtunk nekik.
- Mi petas glason da kafo kaj iom da akvo.: Kérek egy pohár kávét és egy kis vizet.
- Doloris lin la kapo. Li malsaniĝis.: Fájt a feje. Beteg lett.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: A lány szeret szép lenni, ezért megszépíti az arcát.
