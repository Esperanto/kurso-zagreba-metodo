- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ha annyi pénzem lenne, mint ötletem, körbeutaznám a világot.
- En ĉiu vortaro mankas kelkaj vortoj.: Minden szótárból hiányzik néhány szó.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Aki sokáig mesél az étkezőasztalnál, az éhes marad.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Figyelnie kellett, és nem maradhatott sokáig kint az esőben. Ezért megfázott.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Világos az elképzelése, de mindent el fog hinni, amit mondasz, mintha a felesége lennél.
