- En juneco oni havas ankaŭ belecon.: Fiatalkorban is van szépség.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: A főnököknek egyszerűsíteniük kell a bonyolult munkákat.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Ekkoriban már egy sportklub klubvezetője lett.
- Monon oni metas en monujon.: Az ember pénzt tesz a tárcába.
- Sekvu la ekzemplon de la bonaj familianoj.: Kövesd a jó családtagok példáját.
