- La knabino ĵetis la paperon en la paperujon.: A lány a papírt a papírkosárba dobta.
- Kie estas mia skribilo, mi volas respondi al li.: Hol van a tollam? szeretnék neki válaszolni.
- La suno malaperis kaj nun estas preskaŭ malhele.: A nap eltűnt, és most már majdnem sötét van.
- Bonvolu manĝi la panon per manĝilo.: Kérjük, a kenyeret evőeszközzel fogyasszák.
- Pardonu min, mi ne rajtas resti.: Bocsáss meg, nem szabad maradnom.
