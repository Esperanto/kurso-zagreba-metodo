- Antaŭ kvarona horo ili revenis.: Negyed órája tértek vissza.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: A szörnyű szerencsétlenség után az emberek elmentek, és a régi városok széthullottak.
- Ni devus revidi nin, mia amiko.: Újra látnunk kellene egymást, barátom.
- Ju pli ofte mi pripensas, des pli mi koleras.: Minél gyakrabban gondolok rá, annál dühösebb leszek.
- Ŝi loĝas en iu ajn domo.: Bármelyik házban él.
