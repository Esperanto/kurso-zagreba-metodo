- Marko estas en la ĉambro.: Marko ada di dalam kamar.
- Li sidas sur seĝo.: Dia duduk di kursi.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Seorang guru mengajar. Seorang pekerja sedang bekerja. Seorang siswa belajar.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko dan Aleksandro adalah pelajar dan atlet.
- La patrino de Marko estas instruistino.: Ibu Marko adalah seorang guru.
- La seĝo estas en la ĉambro.: Kursinya ada di dalam ruangan.
- La libro estas de li, ĝi estas lia.: Buku itu miliknya; itu miliknya.
- Mia nomo estas Marko.: Nama saya Marko.
