- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko mempunyai seorang teman laki-laki dan seorang teman perempuan. Mereka adalah teman.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Dia membuat kopi dan mereka meminumnya di rumah kami.
- Ili iras al la hotelo.: Mereka pergi ke hotel.
- Ŝi vidas, ke Marko amas ŝin.: Dia melihat bahwa Marko mencintainya.
- Ili havas facilajn lernolibrojn.: Mereka memiliki buku pelajaran yang mudah.
