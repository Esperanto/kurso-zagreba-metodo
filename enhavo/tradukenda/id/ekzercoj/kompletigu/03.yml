- Mia amiko skribas multe.: Teman saya banyak menulis.
- Bela kelnerino estas belulino.: Pelayan cantik adalah wanita cantik.
- Ni havas multajn belajn aferojn.: Banyak hal indah yang kita punya.
- Ni kune lernas en lernejo.: Kami belajar bersama di sekolah.
- Miaj gepatroj manĝas en manĝejo.: Orang tuaku makan di ruang makan.
- La kuko estas manĝebla.: Kue itu bisa dimakan.
