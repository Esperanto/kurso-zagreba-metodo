- Ana kaj Marko iris tra la strato.: Ana dan Marko menyusuri jalan.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Mereka datang ke sebuah kafe, pergi ke meja, dan melihat sang ayah sedang duduk di kursi.
- Ana metis tri kukojn sur seĝon.: Ana meletakkan tiga kue di kursi.
- Ŝi remetis poste la kukojn sur la tablon.: Dia kemudian meletakkan kue itu kembali di atas meja.
