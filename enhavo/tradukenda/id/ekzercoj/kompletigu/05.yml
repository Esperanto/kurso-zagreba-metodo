- Dankon, sinjoro. Nedankinde.: Terima kasih tuan. Terima kasih kembali.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Satu jam itu singkat, satu hari lebih panjang, satu bulan paling lama.
- Mi legas pli multajn librojn ol mia amiko.: Saya membaca lebih banyak buku daripada teman saya.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Saya mengirim surat panjang kepada teman saya ketika dia berada di Tokyo.
- La libro estas leginda.: Buku ini layak dibaca.
