- La gepatroj ĉiam deziras, ke mi lernu multon.: Orang tua selalu berharap agar saya belajar banyak.
- Mia amiko deziras, ke mi iru kanti kun li.: Temanku ingin aku pergi bernyanyi bersamanya.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Sang ayah ingin anaknya memakan kue yang ada di atas meja.
- Ni loĝas en malgranda ĉambro.: Kami tinggal di sebuah ruangan kecil.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Aku menjadi gelisah saat melihatmu.
- Ĉiuj rimarkis, ke ŝi estas belega.: Semua orang memperhatikan bahwa dia sangat cantik.
