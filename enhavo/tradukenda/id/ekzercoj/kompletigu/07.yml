- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Dia meminum minuman paginya dengan sangat cepat agar bisa datang lebih awal ke sekolah.
- Mi ankoraŭ ne aŭdis novaĵon.: Saya belum mendengar kabar apa pun.
- En tiu momento Marko ekkriis.: Saat itu Marko berteriak.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Seorang anak laki-laki yang tidak mencintai laki-laki dan perempuan lain tidak memiliki teman laki-laki atau perempuan.
