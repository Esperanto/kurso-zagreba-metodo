- Ni ordigis ĉion kaj transdonis al ili.: Kami membereskan semuanya dan menyerahkannya kepada mereka.
- Mi petas glason da kafo kaj iom da akvo.: Saya meminta segelas kopi dan air.
- Doloris lin la kapo. Li malsaniĝis.: Kepalanya sakit. Dia jatuh sakit.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Gadis itu suka menjadi cantik, dan oleh karena itu dia mempercantik wajahnya.
