- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Jika saya punya uang sebanyak ide, saya akan berkeliling dunia.
- En ĉiu vortaro mankas kelkaj vortoj.: Di setiap kamus ada beberapa kata yang hilang.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Seseorang yang terus bercerita dalam waktu lama di meja makan akan tetap merasa lapar.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ia harus berhati-hati dan tidak boleh berlama-lama di luar di tengah hujan. Oleh karena itu dia masuk angin.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Dia memiliki gagasan yang jelas, tetapi dia akan mempercayai semua yang Anda katakan, seolah-olah Anda adalah istrinya.
