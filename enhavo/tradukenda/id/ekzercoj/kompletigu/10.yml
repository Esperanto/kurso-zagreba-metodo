- En juneco oni havas ankaŭ belecon.: Di masa muda seseorang juga memiliki kecantikan.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Atasan harus menyederhanakan pekerjaan yang rumit.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Di usia itu dia sudah menjadi ketua klub di sebuah klub olah raga.
- Monon oni metas en monujon.: Seseorang memasukkan uang ke dalam dompet.
- Sekvu la ekzemplon de la bonaj familianoj.: Ikuti teladan anggota keluarga yang baik.
