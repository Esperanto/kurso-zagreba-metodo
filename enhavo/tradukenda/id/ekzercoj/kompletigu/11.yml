- La knabino ĵetis la paperon en la paperujon.: Gadis itu melemparkan kertas itu ke keranjang sampah.
- Kie estas mia skribilo, mi volas respondi al li.: Dimana penaku? Saya ingin menjawabnya.
- La suno malaperis kaj nun estas preskaŭ malhele.: Matahari menghilang dan sekarang hampir gelap.
- Bonvolu manĝi la panon per manĝilo.: Silakan makan roti itu dengan alat makan.
- Pardonu min, mi ne rajtas resti.: Maafkan saya, saya tidak diizinkan untuk tinggal.
