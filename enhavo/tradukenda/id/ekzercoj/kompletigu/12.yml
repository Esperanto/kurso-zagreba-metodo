- Antaŭ kvarona horo ili revenis.: Mereka kembali seperempat jam yang lalu.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Setelah kemalangan yang mengerikan itu, orang-orang pergi dan kota-kota tua runtuh.
- Ni devus revidi nin, mia amiko.: Kita harus bertemu lagi, temanku.
- Ju pli ofte mi pripensas, des pli mi koleras.: Semakin sering aku memikirkannya, aku jadi semakin marah.
- Ŝi loĝas en iu ajn domo.: Dia tinggal di rumah mana pun.
