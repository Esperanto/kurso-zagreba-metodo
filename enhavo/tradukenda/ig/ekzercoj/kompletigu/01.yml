- Marko estas en la ĉambro.: Marko nọ n'ime ụlọ ahụ.
- Li sidas sur seĝo.: Ọ nọ ọdụ n'elu oche.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Onye nkuzi na-akụzi. Onye ọrụ na-arụ ọrụ. Nwa akwụkwọ na-amụ.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko na Aleksandro bụ ụmụ akwụkwọ na ndị egwuregwu.
- La patrino de Marko estas instruistino.: Nne Marko bụ onye nkuzi nwaanyị.
- La seĝo estas en la ĉambro.: Oche ahụ dị n'ime ụlọ ahụ.
- La libro estas de li, ĝi estas lia.: Akwụkwọ ahụ bụ nke ya; ọ bụ nke ya.
- Mia nomo estas Marko.: Aha m bụ Marko.
