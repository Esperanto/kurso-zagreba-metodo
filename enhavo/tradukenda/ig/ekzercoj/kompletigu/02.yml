- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko nwere enyi nwoke na enyi nwaanyị. Ha bụ ndị enyi.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ọ na-eme kọfị, ha na-aṅụ ya n'ụlọ anyị.
- Ili iras al la hotelo.: Ha na-aga n'ụlọ nkwari akụ.
- Ŝi vidas, ke Marko amas ŝin.: Ọ na-ahụ na Marko hụrụ ya n'anya.
- Ili havas facilajn lernolibrojn.: Ha nwere akwụkwọ nkuzi dị mfe.
