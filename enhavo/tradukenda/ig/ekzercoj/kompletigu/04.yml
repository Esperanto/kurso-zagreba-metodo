- Ana kaj Marko iris tra la strato.: Ana na Marko gara site n'okporo ụzọ.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ha bịara n'ụlọ kọfị, gaa na tebụl, ma hụ nna ahụ ka ọ nọ ọdụ n'oche.
- Ana metis tri kukojn sur seĝon.: Ana tinyere kek atọ n'elu oche.
- Ŝi remetis poste la kukojn sur la tablon.: Mgbe e mesịrị, ọ tinyere kek ndị ahụ azụ n'elu tebụl.
