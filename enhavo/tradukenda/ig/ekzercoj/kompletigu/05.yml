- Dankon, sinjoro. Nedankinde.: Daalụ, nna ukwu. Ọ dịghị ihe ọ bụ.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Otu awa dị mkpụmkpụ, otu ụbọchị dị ogologo karịa, otu ọnwa bụ nke kacha ogologo.
- Mi legas pli multajn librojn ol mia amiko.: Ana m agụ akwụkwọ karịa enyi m.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Ezitere m enyi m akwụkwọ ozi ogologo mgbe ọ nọ na Tokyo.
- La libro estas leginda.: Akwụkwọ ahụ kwesịrị ịgụ.
