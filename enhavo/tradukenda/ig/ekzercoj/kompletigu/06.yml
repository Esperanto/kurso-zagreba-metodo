- La gepatroj ĉiam deziras, ke mi lernu multon.: Ndị mụrụ m na-achọ mgbe niile ka m mụta ọtụtụ ihe.
- Mia amiko deziras, ke mi iru kanti kun li.: Enyi m chọrọ ka m gaa soro ya bụrụ abụ.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Nna ahụ chọrọ ka nwa ya rie kek dị n'elu tebụl.
- Ni loĝas en malgranda ĉambro.: Anyị bi n'ime obere ụlọ.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Obi malitere ịma m jijiji mgbe m hụrụ gị.
- Ĉiuj rimarkis, ke ŝi estas belega.: Onye ọ bụla hụrụ na ọ mara ezigbo mma.
