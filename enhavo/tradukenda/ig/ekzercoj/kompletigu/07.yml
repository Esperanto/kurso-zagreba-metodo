- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ọ ṅụrụ ihe ọṅụṅụ ụtụtụ ya ngwa ngwa nke ukwuu ka ọ bịa ụlọ akwụkwọ n'oge.
- Mi ankoraŭ ne aŭdis novaĵon.: Anụbeghị m ozi ọhụrụ.
- En tiu momento Marko ekkriis.: N'oge ahụ Marko malitere iti mkpu.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Nwa nwoke na-adịghị ahụ ụmụaka ndị ọzọ n'anya enweghị enyi nwoke ma ọ bụ enyi nwaanyị.
