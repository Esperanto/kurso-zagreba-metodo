- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ọ bụrụ na m nwere ego dịka echiche m nwere, m ga na-eme njem gburugburu ụwa.
- En ĉiu vortaro mankas kelkaj vortoj.: N'akwụkwọ okwu ọ bụla, ụfọdụ okwu na-efu.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Onye na-akọ akụkọ ogologo oge n'akụkụ tebụl nri ga-anọgide agụụ na-agụ ya.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ọ ghaghị ịkpachara anya ma ekweghị ya ịnọ ogologo oge n'èzí n'ime mmiri ozuzo. Ya mere oyi jidere ya.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: O nwere echiche ya doro anya, ma ọ ga-ekwere ihe niile ị ga-ekwu, dịka a ga-asị na ị bụ nwunye ya.
