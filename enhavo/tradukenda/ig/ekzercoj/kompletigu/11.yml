- La knabino ĵetis la paperon en la paperujon.: Nwa agbọghọ ahụ tụbara akwụkwọ ahụ n'ime akpa akwụkwọ mkpofu.
- Kie estas mia skribilo, mi volas respondi al li.: Ebee ka mkpịsị edemede m dị? Achọrọ m ịza ya.
- La suno malaperis kaj nun estas preskaŭ malhele.: Anyanwụ apụọla, ugbu a ọ fọrọ obere ka ọ gbaa ọchịchịrị.
- Bonvolu manĝi la panon per manĝilo.: Biko jiri ngwa iri nri rie achịcha ahụ.
- Pardonu min, mi ne rajtas resti.: Gbaghara m, enweghị m ikike ịnọ.
