- Antaŭ kvarona horo ili revenis.: Ha laghachiri nkeji iri na ise gara aga.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Mgbe ọdachi ahụ jọgburu onwe ya gasịrị, ndị mmadụ pụọla, obodo ochie ndị ahụ wee daa n'ibe.
- Ni devus revidi nin, mia amiko.: Anyị kwesịrị ịhụ ibe anyị ọzọ, enyi m.
- Ju pli ofte mi pripensas, des pli mi koleras.: Ka m na-eche ya ugboro ugboro, ka iwe na-ewe m.
- Ŝi loĝas en iu ajn domo.: Ọ bi n'ụlọ ọ bụla.
