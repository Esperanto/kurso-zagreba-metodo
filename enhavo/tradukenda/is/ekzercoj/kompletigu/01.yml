- Marko estas en la ĉambro.: Marko er í herberginu.
- Li sidas sur seĝo.: Hann situr á stól.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Kennari kennir. Vinnumaður vinnur. Nemandi lærir.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko og Aleksandro eru nemendur og íþróttamenn.
- La patrino de Marko estas instruistino.: Móðir Marko er kennari.
- La seĝo estas en la ĉambro.: Stóllinn er í herberginu.
- La libro estas de li, ĝi estas lia.: Bókin tilheyrir honum; það er hans.
- Mia nomo estas Marko.: Ég heiti Marko.
