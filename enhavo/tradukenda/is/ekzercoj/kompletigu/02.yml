- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko á karlkyns vin og kvenkyns vin. Þeir eru vinir.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Hann býr til kaffi og þau drekka það heima hjá okkur.
- Ili iras al la hotelo.: Þeir fara á hótelið.
- Ŝi vidas, ke Marko amas ŝin.: Hún sér að Marko elskar hana.
- Ili havas facilajn lernolibrojn.: Þeir eiga auðveldar kennslubækur.
