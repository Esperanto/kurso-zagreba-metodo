- Mia amiko skribas multe.: Vinur minn skrifar mikið.
- Bela kelnerino estas belulino.: Falleg þjónustustúlka er falleg kona.
- Ni havas multajn belajn aferojn.: Við eigum marga fallega hluti.
- Ni kune lernas en lernejo.: Við lærum saman í skólanum.
- Miaj gepatroj manĝas en manĝejo.: Foreldrar mínir borða í borðstofu.
- La kuko estas manĝebla.: Kakan er æt.
