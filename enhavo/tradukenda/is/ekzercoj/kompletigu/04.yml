- Ana kaj Marko iris tra la strato.: Ana og Marko fóru eftir götunni.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Þau komu á kaffihús, gengu að borði og sáu föðurinn sitja á stól.
- Ana metis tri kukojn sur seĝon.: Ana setti þrjár kökur á stól.
- Ŝi remetis poste la kukojn sur la tablon.: Síðar setti hún kökurnar aftur á borðið.
