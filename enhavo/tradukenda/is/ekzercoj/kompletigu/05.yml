- Dankon, sinjoro. Nedankinde.: Þakka þér fyrir, herra. Vertu velkominn.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Klukkutími er stuttur, dagur er lengri, mánuður er lengstur.
- Mi legas pli multajn librojn ol mia amiko.: Ég les fleiri bækur en vinur minn.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Ég sendi löng bréf til vinar míns meðan hann var í Tókýó.
- La libro estas leginda.: Bókin er þess virði að lesa.
