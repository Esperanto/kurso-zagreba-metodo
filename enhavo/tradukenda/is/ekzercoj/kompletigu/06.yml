- La gepatroj ĉiam deziras, ke mi lernu multon.: Foreldrar vilja alltaf að ég læri mikið.
- Mia amiko deziras, ke mi iru kanti kun li.: Vinur minn óskar þess að ég fari að syngja með honum.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Faðirinn vill að barnið sitt borði kökuna sem er á borðinu.
- Ni loĝas en malgranda ĉambro.: Við búum í litlu herbergi.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Ég varð órólegur þegar ég sá þig.
- Ĉiuj rimarkis, ke ŝi estas belega.: Allir tóku eftir því að hún er mjög falleg.
