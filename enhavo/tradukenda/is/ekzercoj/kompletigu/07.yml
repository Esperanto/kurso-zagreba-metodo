- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Hann drakk morgundrykkinn sinn mjög fljótt til að koma snemma í skólann.
- Mi ankoraŭ ne aŭdis novaĵon.: Ég hef ekki enn heyrt neinar fréttir.
- En tiu momento Marko ekkriis.: Á því augnabliki hrópaði Marko.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Strákur sem elskar ekki aðra stráka og stelpur á hvorki karlkyns vini né kvenkyns vini.
