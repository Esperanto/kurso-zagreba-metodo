- Ni ordigis ĉion kaj transdonis al ili.: Við komum öllu í lag og afhentum þeim.
- Mi petas glason da kafo kaj iom da akvo.: Ég bið um kaffiglas og vatn.
- Doloris lin la kapo. Li malsaniĝis.: Hann var sár í höfðinu. Hann varð veikur.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Stúlkunni finnst gaman að vera falleg og þess vegna fegrar hún andlit sitt.
