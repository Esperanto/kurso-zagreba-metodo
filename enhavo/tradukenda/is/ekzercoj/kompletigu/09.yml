- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ef ég ætti jafn mikinn pening og hugmyndir myndi ég ferðast um heiminn.
- En ĉiu vortaro mankas kelkaj vortoj.: Í hverja orðabók vantar nokkur orð.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Sá sem heldur áfram að segja sögur í langan tíma við borðstofuborðið verður áfram svangur.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Hann varð að taka eftir og mátti ekki vera lengi úti í rigningunni. Þess vegna fékk hann kvef.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Hann hefur sína skýru hugmynd, en hann mun trúa öllu sem þú segir, eins og þú værir konan hans.
