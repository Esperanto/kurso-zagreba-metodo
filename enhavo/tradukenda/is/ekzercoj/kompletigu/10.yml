- En juneco oni havas ankaŭ belecon.: Í æsku hefur maður líka fegurð.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Yfirmenn ættu að einfalda flókin störf.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Á þeim aldri var hann þegar orðinn klúbbstjóri íþróttafélags.
- Monon oni metas en monujon.: Maður setur peninga í veski.
- Sekvu la ekzemplon de la bonaj familianoj.: Fylgdu fordæmi góðra fjölskyldumeðlima.
