- La knabino ĵetis la paperon en la paperujon.: Stúlkan henti pappírnum í ruslakörfuna.
- Kie estas mia skribilo, mi volas respondi al li.: Hvar er penninn minn? Ég vil svara honum.
- La suno malaperis kaj nun estas preskaŭ malhele.: Sólin hvarf og nú er nánast orðið dimmt.
- Bonvolu manĝi la panon per manĝilo.: Vinsamlega borðið brauðið með mataráhöldum.
- Pardonu min, mi ne rajtas resti.: Fyrirgefðu, ég má ekki vera.
