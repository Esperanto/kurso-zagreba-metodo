- Antaŭ kvarona horo ili revenis.: Þeir komu aftur fyrir stundarfjórðungi.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Eftir hina hræðilegu ógæfu fór fólkið í burtu og gömlu borgirnar hrundu í sundur.
- Ni devus revidi nin, mia amiko.: Við ættum að hittast aftur, vinur minn.
- Ju pli ofte mi pripensas, des pli mi koleras.: Því oftar sem ég hugsa um það, því reiðari verð ég.
- Ŝi loĝas en iu ajn domo.: Hún býr í hvaða húsi sem er.
