- Marko estas en la ĉambro.: Marko è nella stanza.
- Li sidas sur seĝo.: Si siede su una sedia.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Un insegnante insegna. Un operaio lavora. Uno studente impara.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko e Aleksandro sono studenti e atleti.
- La patrino de Marko estas instruistino.: La madre di Marko è un'insegnante.
- La seĝo estas en la ĉambro.: La sedia è nella stanza.
- La libro estas de li, ĝi estas lia.: Il libro appartiene a lui; è suo.
- Mia nomo estas Marko.: Mi chiamo Marko.
