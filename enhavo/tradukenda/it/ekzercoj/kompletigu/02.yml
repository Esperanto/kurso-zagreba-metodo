- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ha un amico maschio e un'amica. Sono amici.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Fa il caffè e lo bevono a casa nostra.
- Ili iras al la hotelo.: Vanno in albergo.
- Ŝi vidas, ke Marko amas ŝin.: Vede che Marko la ama.
- Ili havas facilajn lernolibrojn.: Hanno libri di testo facili.
