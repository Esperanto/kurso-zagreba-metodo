- Mia amiko skribas multe.: Il mio amico scrive molto.
- Bela kelnerino estas belulino.: Una bella cameriera è una bella donna.
- Ni havas multajn belajn aferojn.: Abbiamo tante cose belle.
- Ni kune lernas en lernejo.: Impariamo insieme a scuola.
- Miaj gepatroj manĝas en manĝejo.: I miei genitori mangiano in una sala da pranzo.
- La kuko estas manĝebla.: La torta è commestibile.
