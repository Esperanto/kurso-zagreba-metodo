- Ana kaj Marko iris tra la strato.: Ana e Marko sono andati lungo la strada.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Giunsero in un bar, si avvicinarono a un tavolo e videro il padre seduto su una sedia.
- Ana metis tri kukojn sur seĝon.: Ana ha messo tre torte su una sedia.
- Ŝi remetis poste la kukojn sur la tablon.: Più tardi ha rimesso le torte sul tavolo.
