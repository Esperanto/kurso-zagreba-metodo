- Dankon, sinjoro. Nedankinde.: Grazie, signore. Prego.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Un'ora è breve, un giorno è più lungo, un mese è il più lungo.
- Mi legas pli multajn librojn ol mia amiko.: Ho letto più libri del mio amico.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Ho inviato lunghe lettere al mio amico mentre era a Tokyo.
- La libro estas leginda.: Vale la pena leggere il libro.
