- La gepatroj ĉiam deziras, ke mi lernu multon.: I genitori desiderano sempre che io impari molto.
- Mia amiko deziras, ke mi iru kanti kun li.: Il mio amico desidera che vada a cantare con lui.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Il padre vuole che suo figlio mangi la torta che è sul tavolo.
- Ni loĝas en malgranda ĉambro.: Viviamo in una piccola stanza.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Mi sono sentito a disagio quando ti ho visto.
- Ĉiuj rimarkis, ke ŝi estas belega.: Tutti hanno notato che è molto bella.
