- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ha bevuto la sua bevanda mattutina molto velocemente per arrivare presto a scuola.
- Mi ankoraŭ ne aŭdis novaĵon.: Non ho ancora avuto notizie.
