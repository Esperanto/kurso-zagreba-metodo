- Ni ordigis ĉion kaj transdonis al ili.: Abbiamo messo tutto in ordine e glielo abbiamo consegnato.
- Mi petas glason da kafo kaj iom da akvo.: Chiedo un bicchiere di caffè e un po' d'acqua.
- Doloris lin la kapo. Li malsaniĝis.: Gli faceva male la testa. Si ammalò.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Alla ragazza piace essere bella e per questo abbellisce il suo viso.
