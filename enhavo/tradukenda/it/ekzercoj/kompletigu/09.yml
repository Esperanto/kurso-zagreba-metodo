- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Se avessi tanti soldi quanto idee, viaggerei in tutto il mondo.
- En ĉiu vortaro mankas kelkaj vortoj.: In ogni dizionario mancano alcune parole.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Una persona che continua a raccontare storie a lungo a tavola rimarrà affamata.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Doveva prestare attenzione e non gli era permesso restare fuori a lungo sotto la pioggia. Perciò ha preso un raffreddore.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ha le idee chiare, ma crederà a tutto quello che dici, come se fossi sua moglie.
