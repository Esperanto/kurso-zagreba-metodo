- En juneco oni havas ankaŭ belecon.: Nella giovinezza si ha anche la bellezza.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: I capi dovrebbero semplificare i lavori complicati.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: A quell'età era già diventato il dirigente di una società sportiva.
- Monon oni metas en monujon.: Uno mette i soldi in un portafoglio.
- Sekvu la ekzemplon de la bonaj familianoj.: Seguite l’esempio dei buoni membri della famiglia.
