- La knabino ĵetis la paperon en la paperujon.: La ragazza gettò la carta nel cestino della carta straccia.
- Kie estas mia skribilo, mi volas respondi al li.: Dov'è la mia penna? Voglio rispondergli.
- La suno malaperis kaj nun estas preskaŭ malhele.: Il sole è scomparso e ora è quasi buio.
- Bonvolu manĝi la panon per manĝilo.: Per favore, mangia il pane con una posata.
- Pardonu min, mi ne rajtas resti.: Perdonami, non mi è permesso restare.
