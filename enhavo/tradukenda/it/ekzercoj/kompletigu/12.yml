- Antaŭ kvarona horo ili revenis.: Sono tornati un quarto d'ora fa.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Dopo la terribile disgrazia, la gente se ne andò e le antiche città crollarono.
- Ni devus revidi nin, mia amiko.: Dovremmo rivederci, amico mio.
- Ju pli ofte mi pripensas, des pli mi koleras.: Più spesso ci penso, più mi arrabbio.
- Ŝi loĝas en iu ajn domo.: Vive in qualsiasi casa.
