- Marko estas en la ĉambro.: マルコは部屋にいます。
- Li sidas sur seĝo.: 彼は椅子に座っています。
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: 先生が教えます。労働者が働いています。学生は学びます。
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: マルコとアレクサンドロは学生でありアスリートです。
- La patrino de Marko estas instruistino.: マルコの母親は教師です。
- La seĝo estas en la ĉambro.: 椅子は部屋にあります。
- La libro estas de li, ĝi estas lia.: その本は彼のものです。それは彼のものです。
- Mia nomo estas Marko.: 私の名前はマルコです。
