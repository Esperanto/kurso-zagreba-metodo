- Marko havas amikon kaj amikinon. Ili estas geamikoj.: マルコには男の友達と女の友達がいます。彼らは友達です。
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: 彼はコーヒーを作ってくれて、我が家でもそれを飲んでいます。
- Ili iras al la hotelo.: 彼らはホテルに行きます。
- Ŝi vidas, ke Marko amas ŝin.: 彼女はマルコが彼女を愛していることに気づきました。
- Ili havas facilajn lernolibrojn.: 簡単な教科書があります。
