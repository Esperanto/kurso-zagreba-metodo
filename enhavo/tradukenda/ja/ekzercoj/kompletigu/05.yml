- Dankon, sinjoro. Nedankinde.: ありがとうございます。どういたしまして。
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: 1時間は短く、1日は長く、1ヶ月は最も長いです。
- Mi legas pli multajn librojn ol mia amiko.: 私は友達よりもたくさん本を読みます。
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: 私は友人が東京にいる間に長い手紙を送りました。
- La libro estas leginda.: その本は読む価値があります。
