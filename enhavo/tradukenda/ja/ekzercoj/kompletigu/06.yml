- La gepatroj ĉiam deziras, ke mi lernu multon.: 両親はいつも私にたくさんのことを学んでほしいと願っています。
- Mia amiko deziras, ke mi iru kanti kun li.: 友達は私が一緒に歌いに行くことを望んでいます。
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: 父親は子供にテーブルの上にあるケーキを食べてもらいたいと思っています。
- Ni loĝas en malgranda ĉambro.: 私たちは小さな部屋に住んでいます。
- Mi fariĝis maltrankvila, kiam mi vidis vin.: あなたを見て不安になった。
- Ĉiuj rimarkis, ke ŝi estas belega.: 誰もが彼女がとても美しいことに気づきました。
