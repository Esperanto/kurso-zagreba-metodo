- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: 彼は学校に早く来るために朝の飲み物をとても早く飲みました。
- Mi ankoraŭ ne aŭdis novaĵon.: まだ何の知らせも聞いていません。
- En tiu momento Marko ekkriis.: その瞬間、マルコが叫びました。
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: 他の男の子や女の子を愛さない男の子には、男友達も女友達もいません。
