- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: もし私にアイデアと同じだけのお金があれば、世界中を旅するのに。
- En ĉiu vortaro mankas kelkaj vortoj.: どの辞書にもいくつかの単語が抜けています。
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: 食卓で長時間物語を語り続ける人は、お腹が空いたままになります。
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: 彼は注意を払う必要があり、雨の中で長時間外にいることは許されませんでした。それで彼は風邪を引いた。
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: 彼には明確な考えがありますが、まるであなたが彼の妻であるかのように、あなたの言うことをすべて信じるでしょう。
