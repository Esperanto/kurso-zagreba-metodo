- La knabino ĵetis la paperon en la paperujon.: 少女はその紙をくずかごに投げ入れた。
- Kie estas mia skribilo, mi volas respondi al li.: 私のペンはどこにありますか?私は彼に答えたいです。
- La suno malaperis kaj nun estas preskaŭ malhele.: 太陽が消えて、今はほぼ真っ暗です。
- Bonvolu manĝi la panon per manĝilo.: パンは食器を使ってお召し上がりください。
- Pardonu min, mi ne rajtas resti.: 許してください、私は滞在することを許可されていません。
