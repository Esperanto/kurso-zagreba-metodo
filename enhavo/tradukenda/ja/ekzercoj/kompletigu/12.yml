- Antaŭ kvarona horo ili revenis.: 彼らは15分前に戻ってきた。
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ひどい不幸の後、人々は去り、古い都市は崩壊しました。
- Ni devus revidi nin, mia amiko.: また会いましょう、友よ。
- Ju pli ofte mi pripensas, des pli mi koleras.: それについて考えれば考えるほど、私は腹が立ちます。
- Ŝi loĝas en iu ajn domo.: 彼女はどんな家にも住んでいます。
