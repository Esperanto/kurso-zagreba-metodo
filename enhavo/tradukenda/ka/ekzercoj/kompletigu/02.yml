- Marko havas amikon kaj amikinon. Ili estas geamikoj.: მარკოს ჰყავს მეგობარი მამაკაცი და მეგობარი ქალი. ისინი მეგობრები არიან.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: ყავას აკეთებს და ჩვენს სახლში სვამენ.
- Ili iras al la hotelo.: ისინი მიდიან სასტუმროში.
- Ŝi vidas, ke Marko amas ŝin.: ხედავს, რომ მარკოს უყვარს.
- Ili havas facilajn lernolibrojn.: მათ აქვთ მარტივი სახელმძღვანელოები.
