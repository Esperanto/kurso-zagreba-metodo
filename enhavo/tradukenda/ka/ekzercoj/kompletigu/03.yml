- Mia amiko skribas multe.: ჩემი მეგობარი ბევრს წერს.
- Bela kelnerino estas belulino.: ლამაზი მიმტანი ლამაზი ქალია.
- Ni havas multajn belajn aferojn.: ბევრი ლამაზი რამ გვაქვს.
- Ni kune lernas en lernejo.: სკოლაში ერთად ვსწავლობთ.
- Miaj gepatroj manĝas en manĝejo.: ჩემი მშობლები სასადილო ოთახში ჭამენ.
- La kuko estas manĝebla.: ნამცხვარი საკვებია.
