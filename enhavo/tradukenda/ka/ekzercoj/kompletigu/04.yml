- Ana kaj Marko iris tra la strato.: ანა და მარკო ქუჩაში გავიდნენ.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: მივიდნენ კაფეში, მიადგნენ მაგიდას და დაინახეს, რომ მამა სკამზე იჯდა.
- Ana metis tri kukojn sur seĝon.: ანამ სკამზე სამი ნამცხვარი დადო.
- Ŝi remetis poste la kukojn sur la tablon.: მოგვიანებით მან ნამცხვრები მაგიდაზე დააბრუნა.
