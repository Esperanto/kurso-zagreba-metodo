- Dankon, sinjoro. Nedankinde.: გმადლობთ, ბატონო. გაგიმარჯოს.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: საათი მოკლეა, დღე უფრო გრძელი, თვე ყველაზე გრძელი.
- Mi legas pli multajn librojn ol mia amiko.: მე უფრო მეტ წიგნს ვკითხულობ, ვიდრე ჩემს მეგობარს.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: ჩემს მეგობარს ტოკიოში ყოფნისას გრძელი წერილები გავუგზავნე.
- La libro estas leginda.: წიგნის წაკითხვა ღირს.
