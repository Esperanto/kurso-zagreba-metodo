- La gepatroj ĉiam deziras, ke mi lernu multon.: მშობლებს ყოველთვის სურთ, რომ ბევრი რამ ვისწავლო.
- Mia amiko deziras, ke mi iru kanti kun li.: ჩემს მეგობარს სურს, რომ მასთან ერთად ვიმღერო.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: მამას სურს, რომ მისმა შვილმა შეჭამოს ტორტი, რომელიც მაგიდაზეა.
- Ni loĝas en malgranda ĉambro.: ჩვენ ვცხოვრობთ პატარა ოთახში.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: უხერხული გავხდი, როცა გნახე.
- Ĉiuj rimarkis, ke ŝi estas belega.: ყველამ შეამჩნია, რომ ის ძალიან ლამაზია.
