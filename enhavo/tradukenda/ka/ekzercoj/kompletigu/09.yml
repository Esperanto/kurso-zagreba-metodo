- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: იმდენი ფული რომ მქონდეს, რამდენიც იდეები, ვიმოგზაურებდი მთელ მსოფლიოში.
- En ĉiu vortaro mankas kelkaj vortoj.: ყველა ლექსიკონში რამდენიმე სიტყვა აკლია.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: ადამიანი, რომელიც დიდხანს ყვება ისტორიებს სასადილო მაგიდასთან, რჩება მშიერი.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: მას ყურადღების მიქცევა მოუწია და წვიმის დროს გარეთ დიდხანს გაჩერების უფლება არ მისცეს. ამიტომ გაცივდა.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: მას აქვს თავისი მკაფიო წარმოდგენა, მაგრამ ყველაფერს დაიჯერებს, რასაც შენ ამბობ, თითქოს მისი ცოლი იყო.
