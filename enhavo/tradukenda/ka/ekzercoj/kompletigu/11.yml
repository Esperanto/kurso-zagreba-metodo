- La knabino ĵetis la paperon en la paperujon.: გოგონამ ქაღალდი ქაღალდის კალათაში ჩააგდო.
- Kie estas mia skribilo, mi volas respondi al li.: სად არის ჩემი კალამი? მინდა ვუპასუხო მას.
- La suno malaperis kaj nun estas preskaŭ malhele.: მზე გაქრა და ახლა თითქმის ბნელა.
- Bonvolu manĝi la panon per manĝilo.: გთხოვთ მიირთვათ პური ჭურჭლით.
- Pardonu min, mi ne rajtas resti.: მაპატიე, დარჩენის უფლება არ მაქვს.
