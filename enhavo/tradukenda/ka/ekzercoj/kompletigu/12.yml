- Antaŭ kvarona horo ili revenis.: მეოთხედი საათის წინ დაბრუნდნენ.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: საშინელი უბედურების შემდეგ ხალხი წავიდა და ძველი ქალაქები დაინგრა.
- Ni devus revidi nin, mia amiko.: ისევ უნდა ვნახოთ ერთმანეთი, მეგობარო.
- Ju pli ofte mi pripensas, des pli mi koleras.: რაც უფრო ხშირად ვფიქრობ ამაზე, მით უფრო ვბრაზდები.
- Ŝi loĝas en iu ajn domo.: ის ნებისმიერ სახლში ცხოვრობს.
