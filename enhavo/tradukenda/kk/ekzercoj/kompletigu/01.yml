- Marko estas en la ĉambro.: Марко бөлмеде.
- Li sidas sur seĝo.: Ол орындыққа отырады.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Мұғалім сабақ береді. Жұмысшы жұмыс істейді. Оқушы үйренеді.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Марко мен Александро студенттер мен спортшылар.
- La patrino de Marko estas instruistino.: Марконың анасы мұғалім.
- La seĝo estas en la ĉambro.: Орындық бөлмеде.
- La libro estas de li, ĝi estas lia.: Кітап оған тиесілі; бұл оның.
- Mia nomo estas Marko.: Менің атым Марко.
