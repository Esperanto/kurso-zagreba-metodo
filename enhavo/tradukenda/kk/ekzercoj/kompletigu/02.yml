- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Марконың ұл досы мен қыз досы бар. Олар – достар.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ол кофе дайындайды, ал олар оны біздің үйде ішеді.
- Ili iras al la hotelo.: Олар қонақ үйге барады.
- Ŝi vidas, ke Marko amas ŝin.: Ол Марконың өзін жақсы көретінін көреді.
- Ili havas facilajn lernolibrojn.: Оларда жеңіл оқулықтар бар.
