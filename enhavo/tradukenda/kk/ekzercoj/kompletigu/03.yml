- Mia amiko skribas multe.: Менің досым көп жазады.
- Bela kelnerino estas belulino.: Әдемі даяшы – сұлу.
- Ni havas multajn belajn aferojn.: Бізде көптеген әдемі заттар бар.
- Ni kune lernas en lernejo.: Мектепте бірге оқимыз.
- Miaj gepatroj manĝas en manĝejo.: Менің ата-анам асханада тамақ ішеді.
- La kuko estas manĝebla.: Торт жеуге жарамды.
