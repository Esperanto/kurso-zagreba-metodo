- Ana kaj Marko iris tra la strato.: Ана мен Марко көше бойымен жүрді.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Олар кафеге келіп, үстелге барып, әкенің орындықта отырғанын көрді.
- Ana metis tri kukojn sur seĝon.: Ана үш тортты орындыққа қойды.
- Ŝi remetis poste la kukojn sur la tablon.: Кейін ол торттарды қайтадан үстелге қойды.
