- Dankon, sinjoro. Nedankinde.: Рахмет, сэр. Оқасы жоқ.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Бір сағат қысқа, бір күн ұзағырақ, бір ай ең ұзақ.
- Mi legas pli multajn librojn ol mia amiko.: Мен досыма қарағанда көбірек кітап оқимын.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Мен досыма Токиода жүргенде ұзақ хаттар жібердім.
- La libro estas leginda.: Кітап оқуға тұрарлық.
