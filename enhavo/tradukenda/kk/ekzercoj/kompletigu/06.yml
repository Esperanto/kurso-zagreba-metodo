- La gepatroj ĉiam deziras, ke mi lernu multon.: Ата-ана маған көп нәрсені үйренуді қалайды.
- Mia amiko deziras, ke mi iru kanti kun li.: Менің досым онымен бірге ән айтуымды қалайды.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Әкесі баласының үстелдегі тортты жегенін қалайды.
- Ni loĝas en malgranda ĉambro.: Біз кішкентай бөлмеде тұрамыз.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Мен сені көргенде мазасызданып қалдым.
- Ĉiuj rimarkis, ke ŝi estas belega.: Оның өте сұлу екенін бәрі байқады.
