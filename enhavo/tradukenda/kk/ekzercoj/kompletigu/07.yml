- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ол мектепке ерте келу үшін таңғы сусынын өте тез ішті.
- Mi ankoraŭ ne aŭdis novaĵon.: Мен әлі ешқандай жаңалық естіген жоқпын.
- En tiu momento Marko ekkriis.: Сол кезде Марко айқайлады.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Өзге ұл-қыздарды жақсы көрмейтін баланың ұл достары да, қыз достары да болмайды.
