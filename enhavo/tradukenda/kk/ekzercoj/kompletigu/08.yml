- Ni ordigis ĉion kaj transdonis al ili.: Барлығын ретке келтіріп, соларға тапсырдық.
- Mi petas glason da kafo kaj iom da akvo.: Мен бір стақан кофе мен су сұраймын.
- Doloris lin la kapo. Li malsaniĝis.: Басы ауырды. Ол ауырып қалды.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Қыз әдемі болғанды ұнатады, сол себепті де ол бетін әдемі етеді.
