- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Егер менде идея сияқты көп ақша болса, мен әлемді кезер едім.
- En ĉiu vortaro mankas kelkaj vortoj.: Әрбір сөздікте бірнеше сөз жетіспейді.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Дастархан басында ұзақ әңгіме айтып отырған адам аш қалады.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Оған сақ болуға тура келді және жаңбырда ұзақ сыртта қалуына рұқсат етілмеді. Сондықтан оған суық тиіп қалды.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Оның өз айқын пікірі бар, бірақ сіз оның әйелі болғандай, айтқаныңыздың бәріне сенеді.
