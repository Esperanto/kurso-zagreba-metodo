- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Егер менде идея сияқты көп ақша болса, мен әлемді кезер едім.
- En ĉiu vortaro mankas kelkaj vortoj.: Әрбір сөздікте кейбір сөздер жетіспейді.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Дастархан басында ұзақ әңгіме айтып отырған адам аш қалады.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Оған назар аударуға тура келді және жаңбырда ұзақ уақыт бойы сыртта қалуға рұқсат етілмеді. Сондықтан ол суық тиіп қалды.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Оның нақты ойы бар, бірақ ол сіздің әйелі сияқты сіздің барлық айтқаныңызға сенеді.
