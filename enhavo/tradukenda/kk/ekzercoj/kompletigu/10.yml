- En juneco oni havas ankaŭ belecon.: Жастық шақта да сұлулық бар.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Бастықтар күрделі жұмыстарды жеңілдету керек.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Бұл жасында ол спорт клубының жетекшісі атанды.
- Monon oni metas en monujon.: Ақшаны әмиянға салады.
- Sekvu la ekzemplon de la bonaj familianoj.: Жақсы отбасы мүшелерінен үлгі ал.
