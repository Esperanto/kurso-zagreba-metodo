- La knabino ĵetis la paperon en la paperujon.: Қыз қағазды макулатура себетіне лақтырды.
- Kie estas mia skribilo, mi volas respondi al li.: Менің қалам қайда? Мен оған жауап бергім келеді.
- La suno malaperis kaj nun estas preskaŭ malhele.: Күн батты, енді айнала дерлік қараңғы.
- Bonvolu manĝi la panon per manĝilo.: Нанды ас құралдарымен жеп қойыңыз.
- Pardonu min, mi ne rajtas resti.: Кешіріңіз, маған қалуға рұқсат жоқ.
