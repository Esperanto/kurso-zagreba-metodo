- Antaŭ kvarona horo ili revenis.: Олар ширек сағат бұрын оралды.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Қорқынышты бақытсыздықтан кейін адамдар кетіп, ескі қалалар қирады.
- Ni devus revidi nin, mia amiko.: Біз бір-бірімізді қайта көруіміз керек, досым.
- Ju pli ofte mi pripensas, des pli mi koleras.: Неғұрлым жиі ойлансам, соғұрлым ашуланамын.
- Ŝi loĝas en iu ajn domo.: Ол кез келген үйде тұрады.
