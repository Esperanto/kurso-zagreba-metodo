- Marko estas en la ĉambro.: Marko នៅក្នុងបន្ទប់។
- Li sidas sur seĝo.: គាត់អង្គុយលើកៅអី។
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: គ្រូម្នាក់បង្រៀន។ កម្មករម្នាក់ធ្វើការ។ សិស្សរៀន។
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko និង Aleksandr គឺជាសិស្ស និងអត្តពលិក។
- La patrino de Marko estas instruistino.: ម្តាយរបស់ Marko គឺជាគ្រូបង្រៀន។
- La seĝo estas en la ĉambro.: កៅអីស្ថិតនៅក្នុងបន្ទប់។
- La libro estas de li, ĝi estas lia.: សៀវភៅជាកម្មសិទ្ធិរបស់គាត់; វាជារបស់គាត់។
- Mia nomo estas Marko.: ខ្ញុំឈ្មោះម៉ាកកូ។
