- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko មានមិត្តប្រុស និងមិត្តស្រី។ ពួកគេជាមិត្តភក្តិ។
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: គាត់ធ្វើកាហ្វេ ហើយគេផឹកនៅផ្ទះយើង។
- Ili iras al la hotelo.: ពួកគេទៅសណ្ឋាគារ។
- Ŝi vidas, ke Marko amas ŝin.: នាងមើលឃើញថា Marko ស្រឡាញ់នាង។
- Ili havas facilajn lernolibrojn.: ពួកគេមានសៀវភៅសិក្សាងាយស្រួល។
