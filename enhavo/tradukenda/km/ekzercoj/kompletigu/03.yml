- Mia amiko skribas multe.: មិត្តរបស់ខ្ញុំសរសេរច្រើន។
- Bela kelnerino estas belulino.: អ្នកបម្រើដ៏ស្រស់ស្អាតគឺជាស្ត្រីដ៏ស្រស់ស្អាត។
- Ni havas multajn belajn aferojn.: យើងមានរបស់ស្អាតៗជាច្រើន។
- Ni kune lernas en lernejo.: យើងរៀនជាមួយគ្នានៅសាលា។
- Miaj gepatroj manĝas en manĝejo.: ឪពុកម្តាយរបស់ខ្ញុំញ៉ាំនៅក្នុងបន្ទប់បាយ។
- La kuko estas manĝebla.: នំគឺអាចបរិភោគបាន។
