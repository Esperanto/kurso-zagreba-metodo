- Ana kaj Marko iris tra la strato.: អាណា និងម៉ាកកូបានទៅតាមផ្លូវ។
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: គេមកហាងកាហ្វេ ចូលទៅតុមួយ ហើយឃើញឪពុកអង្គុយលើកៅអី។
- Ana metis tri kukojn sur seĝon.: អាណាដាក់នំបីនៅលើកៅអី។
- Ŝi remetis poste la kukojn sur la tablon.: ក្រោយមកនាងបានដាក់នំនៅលើតុវិញ។
