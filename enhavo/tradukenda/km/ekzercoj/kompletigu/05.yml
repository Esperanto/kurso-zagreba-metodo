- Dankon, sinjoro. Nedankinde.: សូមអរគុណលោក។ អ្នកស្វាគមន៍។
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: មួយម៉ោងខ្លី មួយថ្ងៃវែងជាង មួយខែវែងជាងគេ។
- Mi legas pli multajn librojn ol mia amiko.: ខ្ញុំអានសៀវភៅច្រើនជាងមិត្តរបស់ខ្ញុំ។
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: ខ្ញុំបានផ្ញើសំបុត្រជាយូរមកកាន់មិត្តភក្តិរបស់ខ្ញុំពេលគាត់នៅតូក្យូ។
- La libro estas leginda.: សៀវភៅនេះមានតម្លៃអាន។
