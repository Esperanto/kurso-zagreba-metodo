- La gepatroj ĉiam deziras, ke mi lernu multon.: ឪពុកម្តាយតែងតែប្រាថ្នាឱ្យខ្ញុំរៀនច្រើន។
- Mia amiko deziras, ke mi iru kanti kun li.: មិត្តរបស់ខ្ញុំប្រាថ្នាថាខ្ញុំទៅច្រៀងជាមួយគាត់។
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: ឪពុកចង់ឱ្យកូនរបស់គាត់ញ៉ាំនំដែលមាននៅលើតុ។
- Ni loĝas en malgranda ĉambro.: យើងរស់នៅក្នុងបន្ទប់តូចមួយ។
- Mi fariĝis maltrankvila, kiam mi vidis vin.: ខ្ញុំពិបាកចិត្តពេលឃើញអ្នក។
- Ĉiuj rimarkis, ke ŝi estas belega.: គ្រប់គ្នាសង្កេតឃើញថា នាងពិតជាស្រស់ស្អាតខ្លាំងណាស់។
