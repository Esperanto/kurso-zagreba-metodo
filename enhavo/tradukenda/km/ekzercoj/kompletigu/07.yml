- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: គាត់ផឹកស្រាពេលព្រឹកយ៉ាងលឿនដើម្បីមកសាលាលឿន។
- Mi ankoraŭ ne aŭdis novaĵon.: ខ្ញុំមិនទាន់បានឮដំណឹងណាមួយទេ។
- En tiu momento Marko ekkriis.: នៅពេលនោះ Marko ស្រែកឡើង។
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: ប្រុសមិនស្រលាញ់ប្រុសស្រីឯទៀត មិនមានមិត្តប្រុសឬមិត្តស្រី។
