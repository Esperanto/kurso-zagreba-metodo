- Ni ordigis ĉion kaj transdonis al ili.: យើងដាក់អ្វីគ្រប់យ៉ាងតាមលំដាប់ ហើយប្រគល់ទៅឲ្យគេ។
- Mi petas glason da kafo kaj iom da akvo.: ខ្ញុំសុំកាហ្វេមួយកែវ និងទឹកខ្លះ។
- Doloris lin la kapo. Li malsaniĝis.: ក្បាលរបស់គាត់ឈឺចាប់។ គាត់ធ្លាក់ខ្លួនឈឺ។
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: ក្មេងស្រីចូលចិត្តស្អាតហើយសម្រាប់ហេតុផលនោះនាងធ្វើឱ្យមុខរបស់នាងស្រស់ស្អាត។
