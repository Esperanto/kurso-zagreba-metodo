- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: ប្រសិនបើខ្ញុំមានលុយច្រើនតាមគំនិត ខ្ញុំនឹងធ្វើដំណើរជុំវិញពិភពលោក។
- En ĉiu vortaro mankas kelkaj vortoj.: នៅក្នុងវចនានុក្រមនីមួយៗ ពាក្យមួយចំនួនត្រូវបានបាត់។
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: មនុស្សម្នាក់ដែលបន្តនិទានរឿងអស់រយៈពេលយូរនៅតុបរិភោគអាហារនឹងនៅតែឃ្លាន។
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: គាត់ត្រូវយកចិត្តទុកដាក់ ហើយមិនត្រូវបានអនុញ្ញាតឱ្យនៅខាងក្រៅយូរក្នុងពេលភ្លៀងទេ។ ដូច្នេះគាត់ចាប់ផ្តាសាយ។
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: គាត់មានគំនិតច្បាស់លាស់ ប៉ុន្តែគាត់នឹងជឿគ្រប់យ៉ាងដែលអ្នកនិយាយ ដូចជាអ្នកជាប្រពន្ធគាត់។
