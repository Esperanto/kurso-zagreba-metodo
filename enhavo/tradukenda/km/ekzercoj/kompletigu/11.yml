- La knabino ĵetis la paperon en la paperujon.: ក្មេងស្រីបោះក្រដាសនោះចូលក្នុងកន្ត្រកសំណល់។
- Kie estas mia skribilo, mi volas respondi al li.: តើប៊ិចរបស់ខ្ញុំនៅឯណា? ខ្ញុំចង់ឆ្លើយគាត់។
- La suno malaperis kaj nun estas preskaŭ malhele.: ព្រះអាទិត្យបានបាត់ទៅហើយ ឥឡូវនេះជិតងងឹតហើយ។
- Bonvolu manĝi la panon per manĝilo.: សូមញ៉ាំនំប៉័ងជាមួយឧបករណ៍បរិភោគ។
- Pardonu min, mi ne rajtas resti.: អត់ទោសឱ្យខ្ញុំ ខ្ញុំមិនត្រូវបានអនុញ្ញាតឱ្យស្នាក់នៅទេ។
