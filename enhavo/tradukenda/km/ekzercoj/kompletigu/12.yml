- Antaŭ kvarona horo ili revenis.: ពួកគេបានត្រឡប់មកវិញកាលពីមួយភាគបួននៃមួយម៉ោងមុន។
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ក្រោយពីមានគ្រោះអាក្រក់ ប្រជាជនក៏រលត់ទៅ ហើយទីក្រុងចាស់ក៏រលំទៅ។
- Ni devus revidi nin, mia amiko.: យើងគួរតែជួបគ្នាម្តងទៀត, មិត្តរបស់ខ្ញុំ។
- Ju pli ofte mi pripensas, des pli mi koleras.: ខ្ញុំកាន់តែគិតអំពីវាជាញឹកញាប់ ខ្ញុំកាន់តែខឹង។
- Ŝi loĝas en iu ajn domo.: នាងរស់នៅក្នុងផ្ទះណាមួយ។
