- Marko estas en la ĉambro.: 마르코가 방에 있어요.
- Li sidas sur seĝo.: 그는 의자에 앉아 있다.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: 선생님이 가르치십니다. 노동자가 일합니다. 학생은 배운다.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko와 Aleksandro는 학생이자 운동선수입니다.
- La patrino de Marko estas instruistino.: Marko의 어머니는 교사입니다.
- La seĝo estas en la ĉambro.: 의자는 방에 있어요.
- La libro estas de li, ĝi estas lia.: 그 책은 그 사람의 것이다. 그것은 그의 것입니다.
- Mia nomo estas Marko.: 제 이름은 마르코입니다.
