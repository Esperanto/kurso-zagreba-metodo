- Marko havas amikon kaj amikinon. Ili estas geamikoj.: 마르코에게는 남자친구와 여자친구가 있습니다. 그들은 친구입니다.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: 그는 커피를 끓여서 우리 집에서 마신다.
- Ili iras al la hotelo.: 그들은 호텔로 간다.
- Ŝi vidas, ke Marko amas ŝin.: 그녀는 Marko가 그녀를 사랑하는 것을 봅니다.
- Ili havas facilajn lernolibrojn.: 그들은 쉬운 교과서를 가지고 있습니다.
