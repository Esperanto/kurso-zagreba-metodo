- Mia amiko skribas multe.: 내 친구는 글을 많이 쓴다.
- Bela kelnerino estas belulino.: 아름다운 웨이트리스는 아름다운 여성입니다.
- Ni havas multajn belajn aferojn.: 우리에게는 아름다운 것들이 많이 있습니다.
- Ni kune lernas en lernejo.: 우리는 학교에서 함께 배웁니다.
- Miaj gepatroj manĝas en manĝejo.: 우리 부모님은 식당에서 식사를 하신다.
- La kuko estas manĝebla.: 케이크는 먹을 수 있습니다.
