- Ana kaj Marko iris tra la strato.: Ana와 Marko는 거리를 따라 걸었습니다.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: 그들은 카페에 와서 테이블로 가더니 아버지가 의자에 앉아 있는 것을 보았습니다.
- Ana metis tri kukojn sur seĝon.: 아나는 케이크 세 개를 의자 위에 놓았습니다.
- Ŝi remetis poste la kukojn sur la tablon.: 그녀는 나중에 케이크를 다시 테이블 위에 올려 놓았습니다.
