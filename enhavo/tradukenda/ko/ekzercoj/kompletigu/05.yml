- Dankon, sinjoro. Nedankinde.: 감사합니다. 천만에요.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: 한 시간은 짧고, 하루는 길며, 한 달은 길다.
- Mi legas pli multajn librojn ol mia amiko.: 나는 친구보다 책을 더 많이 읽었다.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: 나는 친구가 도쿄에 있는 동안 그에게 장문의 편지를 보냈습니다.
- La libro estas leginda.: 그 책은 읽을 가치가 있다.
