- La gepatroj ĉiam deziras, ke mi lernu multon.: 부모님은 항상 내가 많이 배우기를 바라십니다.
- Mia amiko deziras, ke mi iru kanti kun li.: 내 친구는 내가 그와 함께 노래 부르기를 원합니다.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: 아버지는 아이가 식탁 위에 있는 케이크를 먹기를 원합니다.
- Ni loĝas en malgranda ĉambro.: 우리는 작은 방에 살고 있습니다.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: 나는 당신을 보고 불안해졌습니다.
- Ĉiuj rimarkis, ke ŝi estas belega.: 모두가 그녀가 매우 아름답다는 것을 알아차렸습니다.
