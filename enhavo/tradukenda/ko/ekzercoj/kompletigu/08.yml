- Ni ordigis ĉion kaj transdonis al ili.: 우리는 모든 것을 정리하고 그들에게 넘겨주었습니다.
- Mi petas glason da kafo kaj iom da akvo.: 커피 한 잔과 물을 좀 달라고 합니다.
- Doloris lin la kapo. Li malsaniĝis.: 머리가 아팠어요. 그는 병이 들었습니다.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: 그 소녀는 아름다운 것을 좋아하기 때문에 얼굴을 아름답게 합니다.
