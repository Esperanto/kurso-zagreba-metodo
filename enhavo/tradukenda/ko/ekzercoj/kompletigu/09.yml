- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: 아이디어만큼 돈이 있다면 전 세계를 여행할 것입니다.
- En ĉiu vortaro mankas kelkaj vortoj.: 모든 사전에는 일부 단어가 누락되어 있습니다.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: 식탁에서 오랫동안 이야기를 계속하는 사람은 배가 고프다.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: 그는 주의를 기울여야 했고, 비오는 날 밖에 오래 머물 수 없었습니다. 그래서 그는 감기에 걸렸다.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: 그는 자신의 생각이 분명하지만 마치 당신이 그의 아내인 것처럼 당신이 말하는 모든 것을 믿을 것입니다.
