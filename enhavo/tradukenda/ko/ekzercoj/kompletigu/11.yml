- La knabino ĵetis la paperon en la paperujon.: 소녀는 종이를 쓰레기통에 던졌습니다.
- Kie estas mia skribilo, mi volas respondi al li.: 내 펜은 어디에 있나요? 나는 그에게 대답하고 싶다.
- La suno malaperis kaj nun estas preskaŭ malhele.: 해가 사라져 이제 거의 어두워졌습니다.
- Bonvolu manĝi la panon per manĝilo.: 빵은 식기로 먹어주세요.
- Pardonu min, mi ne rajtas resti.: 죄송합니다. 저는 머무를 수 없습니다.
