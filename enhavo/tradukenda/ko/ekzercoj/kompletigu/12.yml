- Antaŭ kvarona horo ili revenis.: 그들은 15분 전에 돌아왔습니다.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: 끔찍한 불행이 있은 후 사람들은 떠나고 오래된 도시들은 무너졌습니다.
- Ni devus revidi nin, mia amiko.: 우리 다시 만나야 해, 친구.
- Ju pli ofte mi pripensas, des pli mi koleras.: 그것에 대해 자주 생각할수록 나는 더 화가 납니다.
- Ŝi loĝas en iu ajn domo.: 그녀는 어느 집에나 산다.
