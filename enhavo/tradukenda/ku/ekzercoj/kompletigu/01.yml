- Marko estas en la ĉambro.: Marko di odeyê de ye.
- Li sidas sur seĝo.: Ew li ser kursiyek rûniştiye.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Mamoste ders dide. Karkerek dixebite. Xwendekarek fêr dibe.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko û Aleksandro xwendekar û werzişvan in.
- La patrino de Marko estas instruistino.: Diya Marko mamoste ye.
- La seĝo estas en la ĉambro.: Kursî li odeyê ye.
- La libro estas de li, ĝi estas lia.: Pirtûk aîdî wî ye; ya wî ye.
- Mia nomo estas Marko.: Navê min Marko ye.
