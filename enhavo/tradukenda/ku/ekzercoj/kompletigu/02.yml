- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko hevalek mêr û hevalek jin heye. Ew heval in.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ew qehweyê çêdike û li mala me vedixwin.
- Ili iras al la hotelo.: Ew diçin otêlê.
- Ŝi vidas, ke Marko amas ŝin.: Ew dibîne ku Marko jê hez dike.
- Ili havas facilajn lernolibrojn.: Pirtûkên wan ên hêsan hene.
