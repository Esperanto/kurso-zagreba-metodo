- Mia amiko skribas multe.: Hevalê min gelek dinivîse.
- Bela kelnerino estas belulino.: Garsonek bedew jinek bedew e.
- Ni havas multajn belajn aferojn.: Gelek tiştên me yên xweş hene.
- Ni kune lernas en lernejo.: Em li dibistanê bi hev re fêr dibin.
- Miaj gepatroj manĝas en manĝejo.: Dê û bavê min li jûreyek xwarinê dixwin.
- La kuko estas manĝebla.: Kek tê xwarin.
