- Ana kaj Marko iris tra la strato.: Ana û Marko li kolanê çûn.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Hatin qehwexaneyekê, çûn ser masekê, dîtin ku bav li ser kursî rûniştiye.
- Ana metis tri kukojn sur seĝon.: Ana sê kulikan danî ser kursiyek.
- Ŝi remetis poste la kukojn sur la tablon.: Wê paşê kek dîsa danî ser masê.
