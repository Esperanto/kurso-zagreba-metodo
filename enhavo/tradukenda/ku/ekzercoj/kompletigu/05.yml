- Dankon, sinjoro. Nedankinde.: Spas dikim, ezbenî. Rica dikim.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Saetek kurt e, rojek dirêj e, mehek herî dirêj e.
- Mi legas pli multajn librojn ol mia amiko.: Min ji hevalê xwe zêdetir pirtûk dixwend.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Dema ku ew li Tokyoyê bû min ji hevalê xwe re nameyên dirêj şandin.
- La libro estas leginda.: Pirtûk hêjayî xwendinê ye.
