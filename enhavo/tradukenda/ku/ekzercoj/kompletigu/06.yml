- La gepatroj ĉiam deziras, ke mi lernu multon.: Dêûbav her gav dixwazin ku ez gelek tiştan fêr bibim.
- Mia amiko deziras, ke mi iru kanti kun li.: Hevalê min dixwaze ku ez herim bi wî re stranan bêje.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Bav dixwaze ku zarokê wî kekê ku li ser sifrê ye bixwe.
- Ni loĝas en malgranda ĉambro.: Em di odeyek piçûk de dijîn.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Dema min tu dît ez nerehet bûm.
- Ĉiuj rimarkis, ke ŝi estas belega.: Her kesî dît ku ew pir xweşik e.
