- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ji bo ku zû were dibistanê wî vexwarina xwe ya sibehê pir zû vexwar.
- Mi ankoraŭ ne aŭdis novaĵon.: Min hêj tu xeber nebihîstiye.
- En tiu momento Marko ekkriis.: Wê gavê Marko qêriya.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Kurê ku ji xort û keçên din hez neke, ne hevalên wî yên mêr û ne jî hevalên jin hene.
