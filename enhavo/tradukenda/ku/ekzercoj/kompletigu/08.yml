- Ni ordigis ĉion kaj transdonis al ili.: Me her tişt rêz kir û radestî wan kir.
- Mi petas glason da kafo kaj iom da akvo.: Ez qehweyek û hinek av dixwazim.
- Doloris lin la kapo. Li malsaniĝis.: Serê wî êşiya. Ew nexweş bû.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Keçik ji bedewbûnê hez dike û ji ber vê yekê rûyê xwe xweş dike.
