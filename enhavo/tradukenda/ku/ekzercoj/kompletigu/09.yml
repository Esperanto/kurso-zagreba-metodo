- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ger bi qasî ramanan pereyê min hebûya, ez ê li seranserê cîhanê bigerim.
- En ĉiu vortaro mankas kelkaj vortoj.: Di her ferhengê de hin peyv kêm in.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Kesê ku demeke dirêj li ser maseya xwarinê çîrokan bibêje, wê birçî bimîne.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Diviyabû bala xwe bidaya û nehiştin ku di bin baranê de dirêj li derve bimîne. Loma serma girt.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ew ramana xwe ya zelal heye, lê ew ê her tiştê ku hûn dibêjin bawer bike, mîna ku hûn jina wî bin.
