- En juneco oni havas ankaŭ belecon.: Di xortaniyê de jî xweşikbûn heye.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Divê patron karên tevlihev hêsan bikin.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Di wî temenî de ew jixwe bû serokê klûbê yê klûbek werzîşê.
- Monon oni metas en monujon.: Meriv pereyan dixe berîka.
- Sekvu la ekzemplon de la bonaj familianoj.: Nimûneya endamên malbata baş bişopînin.
