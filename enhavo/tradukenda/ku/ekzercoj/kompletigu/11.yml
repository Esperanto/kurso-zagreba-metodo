- La knabino ĵetis la paperon en la paperujon.: Keçikê kaxiz avêt selika kaxizên çopê.
- Kie estas mia skribilo, mi volas respondi al li.: Qelema min li ku ye? Ez dixwazim bersiva wî bidim.
- La suno malaperis kaj nun estas preskaŭ malhele.: Roj winda bû û niha hema hema tarî ye.
- Bonvolu manĝi la panon per manĝilo.: Ji kerema xwe nan bi tewra xwarinê bixwin.
- Pardonu min, mi ne rajtas resti.: Li min bibore, destûr nayê dayîn ku ez bimînim.
