- Antaŭ kvarona horo ili revenis.: Berî çaryek saetekê vegeriyan.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Piştî bextreşiya xedar, xelk çûn û bajarên kevn ji hev ketin.
- Ni devus revidi nin, mia amiko.: Divê em dîsa hevdu bibînin, hevalê min.
- Ju pli ofte mi pripensas, des pli mi koleras.: Her ku ez li ser wê difikirim, ez bêtir hêrs dibim.
- Ŝi loĝas en iu ajn domo.: Ew li her malê dijî.
