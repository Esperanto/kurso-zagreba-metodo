- Marko estas en la ĉambro.: Marko ຢູ່ໃນຫ້ອງ.
- Li sidas sur seĝo.: ລາວນັ່ງຢູ່ເທິງຕັ່ງ.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: ຄູສອນ. ພະນັກງານເຮັດວຽກ. ນັກສຶກສາຮຽນຮູ້.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ແລະ Aleksandro ເປັນນັກຮຽນແລະນັກກິລາ.
- La patrino de Marko estas instruistino.: ແມ່ຂອງ Marko ເປັນຄູສອນ.
- La seĝo estas en la ĉambro.: ເກົ້າອີ້ຢູ່ໃນຫ້ອງ.
- La libro estas de li, ĝi estas lia.: ຫນັງສືເປັນຂອງລາວ; ມັນແມ່ນຂອງລາວ.
- Mia nomo estas Marko.: ຂ້ອຍຊື່ Marko.
