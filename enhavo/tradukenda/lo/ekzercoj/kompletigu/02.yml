- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ມີຫມູ່ຜູ້ຊາຍແລະຫມູ່ເພື່ອນຍິງ. ພວກເຂົາເປັນເພື່ອນ.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: ລາວເຮັດກາເຟ ແລະເຂົາເຈົ້າດື່ມໃນບ້ານຂອງພວກເຮົາ.
- Ili iras al la hotelo.: ພວກເຂົາໄປໂຮງແຮມ.
- Ŝi vidas, ke Marko amas ŝin.: ນາງເຫັນວ່າ Marko ຮັກນາງ.
- Ili havas facilajn lernolibrojn.: ເຂົາເຈົ້າມີປຶ້ມແບບຮຽນງ່າຍ.
