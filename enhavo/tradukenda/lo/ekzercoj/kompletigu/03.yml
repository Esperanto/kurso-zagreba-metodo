- Mia amiko skribas multe.: ເພື່ອນຂອງຂ້ອຍຂຽນຫຼາຍ.
- Bela kelnerino estas belulino.: ພະນັກງານເສີບຍິງທີ່ງາມແມ່ນຜູ້ຍິງງາມ.
- Ni havas multajn belajn aferojn.: ພວກເຮົາມີສິ່ງທີ່ສວຍງາມຫຼາຍ.
- Ni kune lernas en lernejo.: ເຮົາຮຽນນຳກັນຢູ່ໂຮງຮຽນ.
- Miaj gepatroj manĝas en manĝejo.: ພໍ່ແມ່ຂອງຂ້ອຍກິນເຂົ້າຢູ່ໃນຫ້ອງຮັບປະທານອາຫານ.
- La kuko estas manĝebla.: ເຄັກແມ່ນສາມາດກິນໄດ້.
