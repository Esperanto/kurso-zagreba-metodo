- Ana kaj Marko iris tra la strato.: Ana ແລະ Marko ໄດ້ໄປຕາມຖະຫນົນ.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: ເຂົາເຈົ້າມາທີ່ຮ້ານກາເຟ, ໄປທີ່ໂຕະ, ແລະເຫັນພໍ່ນັ່ງຢູ່ເທິງຕັ່ງ.
- Ana metis tri kukojn sur seĝon.: ອານາວາງເຄັກສາມອັນໃສ່ເທິງຕັ່ງ.
- Ŝi remetis poste la kukojn sur la tablon.: ຕໍ່ມານາງໄດ້ເອົາເຄັກເຫຼົ່ານັ້ນຄືນໃສ່ເທິງໂຕະ.
