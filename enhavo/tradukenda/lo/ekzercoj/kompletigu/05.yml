- Dankon, sinjoro. Nedankinde.: ຂໍຂອບໃຈທ່ານ, ທ່ານ. ທ່ານຍິນດີຕ້ອນຮັບ.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: ຊົ່ວໂມງສັ້ນ, ມື້ຫນຶ່ງຍາວກວ່າ, ເດືອນແມ່ນຍາວທີ່ສຸດ.
- Mi legas pli multajn librojn ol mia amiko.: ຂ້ອຍອ່ານປຶ້ມຫຼາຍກວ່າໝູ່ຂອງຂ້ອຍ.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: ຂ້ອຍໄດ້ສົ່ງຈົດໝາຍຍາວໄປຫາໝູ່ໃນຂະນະທີ່ລາວຢູ່ໂຕກຽວ.
- La libro estas leginda.: ປື້ມແມ່ນມີມູນຄ່າການອ່ານ.
