- La gepatroj ĉiam deziras, ke mi lernu multon.: ພໍ່ແມ່ສະເຫມີປາຖະຫນາໃຫ້ຂ້າພະເຈົ້າໄດ້ຮຽນຮູ້ຫຼາຍ.
- Mia amiko deziras, ke mi iru kanti kun li.: ຫມູ່ຂອງຂ້ອຍປາດຖະຫນາໃຫ້ຂ້ອຍໄປຮ້ອງເພງກັບລາວ.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: ພໍ່ຢາກໃຫ້ລູກກິນເຄັກທີ່ຢູ່ເທິງໂຕະ.
- Ni loĝas en malgranda ĉambro.: ພວກເຮົາອາໄສຢູ່ໃນຫ້ອງຂະຫນາດນ້ອຍ.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: ຂ້ອຍຮູ້ສຶກບໍ່ສະບາຍໃຈເມື່ອເຫັນເຈົ້າ.
- Ĉiuj rimarkis, ke ŝi estas belega.: ທຸກຄົນສັງເກດເຫັນວ່ານາງງາມຫຼາຍ.
