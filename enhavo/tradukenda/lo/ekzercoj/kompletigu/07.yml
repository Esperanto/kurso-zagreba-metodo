- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: ລາວດື່ມນ້ຳຕອນເຊົ້າໄວເພື່ອມາໂຮງຮຽນ.
- Mi ankoraŭ ne aŭdis novaĵon.: ຂ້າພະເຈົ້າຍັງບໍ່ທັນໄດ້ຍິນຂ່າວໃດໆ.
- En tiu momento Marko ekkriis.: ໃນເວລານັ້ນ Marko ຮ້ອງອອກມາ.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: ເດັກຊາຍຜູ້ທີ່ບໍ່ຮັກເດັກຊາຍແລະຜູ້ຍິງຜູ້ອື່ນບໍ່ມີຫມູ່ເພື່ອນຂອງຜູ້ຊາຍຫຼືເພື່ອນຍິງ.
