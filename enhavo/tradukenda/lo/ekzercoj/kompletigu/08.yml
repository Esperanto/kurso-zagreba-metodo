- Ni ordigis ĉion kaj transdonis al ili.: ພວກເຮົາຈັດວາງທຸກສິ່ງທຸກຢ່າງເປັນລະບຽບແລະມອບໃຫ້ເຂົາເຈົ້າ.
- Mi petas glason da kafo kaj iom da akvo.: ຂ້ອຍຂໍກາເຟຈອກນຶ່ງ ແລະນໍ້າແດ່.
- Doloris lin la kapo. Li malsaniĝis.: ຫົວຂອງລາວເຈັບ. ລາວເຈັບປ່ວຍ.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: ເດັກຍິງມັກງາມ, ແລະສໍາລັບເຫດຜົນນັ້ນ, ນາງເຮັດໃຫ້ໃບຫນ້າຂອງນາງງາມ.
