- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: ຖ້າຂ້ອຍມີເງິນຫຼາຍເທົ່າກັບຄວາມຄິດ, ຂ້ອຍຈະເດີນທາງໄປທົ່ວໂລກ.
- En ĉiu vortaro mankas kelkaj vortoj.: ໃນວັດຈະນານຸກົມທຸກຄຳບາງຄຳຂາດຫາຍໄປ.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: ຄົນທີ່ເລົ່າເລື່ອງຕ່າງໆເປັນເວລາດົນນານຢູ່ທີ່ໂຕະອາຫານຈະຫິວເຂົ້າ.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: ລາວຕ້ອງເອົາໃຈໃສ່ແລະບໍ່ໄດ້ຮັບອະນຸຍາດໃຫ້ຢູ່ຂ້າງນອກດົນໃນຝົນ. ສະນັ້ນ ລາວເປັນຫວັດ.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: ລາວມີຄວາມຄິດທີ່ຊັດເຈນຂອງລາວ, ແຕ່ລາວຈະເຊື່ອທຸກສິ່ງທີ່ເຈົ້າເວົ້າ, ຄືກັບວ່າເຈົ້າເປັນພັນລະຍາຂອງລາວ.
