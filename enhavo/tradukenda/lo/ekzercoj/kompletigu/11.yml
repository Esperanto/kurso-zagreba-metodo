- La knabino ĵetis la paperon en la paperujon.: ເດັກຍິງໄດ້ຖິ້ມກະດາດເຂົ້າໄປໃນກະຕ່າຂີ້ເຫຍື້ອ.
- Kie estas mia skribilo, mi volas respondi al li.: ປາກກາຂອງຂ້ອຍຢູ່ໃສ? ຂ້ອຍຕ້ອງການຕອບລາວ.
- La suno malaperis kaj nun estas preskaŭ malhele.: ຕາເວັນໄດ້ຫາຍໄປ ແລະຕອນນີ້ມັນເກືອບມືດແລ້ວ.
- Bonvolu manĝi la panon per manĝilo.: ກະລຸນາກິນເຂົ້າຈີ່ດ້ວຍເຄື່ອງກິນ.
- Pardonu min, mi ne rajtas resti.: ໃຫ້ອະໄພຂ້ອຍ, ຂ້ອຍບໍ່ໄດ້ຮັບອະນຸຍາດໃຫ້ຢູ່.
