- Antaŭ kvarona horo ili revenis.: ພວກເຂົາກັບມາເມື່ອ 15 ນາທີກ່ອນ.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ຫຼັງຈາກຄວາມໂຊກຮ້າຍຮ້າຍແຮງ, ຜູ້ຄົນໄດ້ຈາກໄປ ແລະ ບັນດາເມືອງເກົ່າໄດ້ພັງທະລາຍລົງ.
- Ni devus revidi nin, mia amiko.: ພວກເຮົາຄວນຈະພົບກັນອີກ, ເພື່ອນຂອງຂ້ອຍ.
- Ju pli ofte mi pripensas, des pli mi koleras.: ຍິ່ງຂ້ອຍຄິດເຖິງມັນເລື້ອຍເທົ່າໃດ, ຂ້ອຍຍິ່ງໃຈຮ້າຍຫຼາຍເທົ່ານັ້ນ.
- Ŝi loĝas en iu ajn domo.: ນາງອາໃສຢູ່ໃນເຮືອນໃດ.
