- Antaŭ kvarona horo ili revenis.: ພວກເຂົາເຈົ້າກັບຄືນໄປຫນຶ່ງສ່ວນສີ່ຂອງຫນຶ່ງຊົ່ວໂມງກ່ອນຫນ້ານີ້.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ຫຼັງຈາກຄວາມໂຊກຮ້າຍຮ້າຍແຮງ, ປະຊາຊົນໄດ້ໄປແລະຕົວເມືອງເກົ່າໄດ້ຫຼຸດລົງ.
- Ni devus revidi nin, mia amiko.: ພວກເຮົາຄວນຈະພົບກັນອີກ, ເພື່ອນຂອງຂ້ອຍ.
- Ju pli ofte mi pripensas, des pli mi koleras.: ເລື້ອຍໆຂ້ອຍຄິດກ່ຽວກັບມັນ, ຂ້ອຍກໍ່ໃຈຮ້າຍຫຼາຍຂຶ້ນ.
- Ŝi loĝas en iu ajn domo.: ນາງອາໃສຢູ່ໃນເຮືອນໃດ.
