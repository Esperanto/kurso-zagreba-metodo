- Marko estas en la ĉambro.: Marko yra kambaryje.
- Li sidas sur seĝo.: Jis sėdi ant kėdės.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Mokytojas moko. Dirba darbuotojas. Mokinys mokosi.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ir Aleksandro yra studentai ir sportininkai.
- La patrino de Marko estas instruistino.: Marko mama yra mokytoja.
- La seĝo estas en la ĉambro.: Kėdė yra kambaryje.
- La libro estas de li, ĝi estas lia.: Knyga priklauso jam; tai jo.
- Mia nomo estas Marko.: Mano vardas Marko.
