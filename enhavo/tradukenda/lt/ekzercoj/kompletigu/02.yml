- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko turi draugą vyrą ir draugę moterį. Jie yra draugai.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Jis verda kavą ir ją geria mūsų namuose.
- Ili iras al la hotelo.: Jie eina į viešbutį.
- Ŝi vidas, ke Marko amas ŝin.: Ji mato, kad Marko ją myli.
- Ili havas facilajn lernolibrojn.: Jie turi lengvus vadovėlius.
