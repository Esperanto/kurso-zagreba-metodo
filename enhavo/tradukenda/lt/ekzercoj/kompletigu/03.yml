- Mia amiko skribas multe.: Mano draugas daug rašo.
- Bela kelnerino estas belulino.: Graži padavėja yra graži moteris.
- Ni havas multajn belajn aferojn.: Mes turime daug gražių dalykų.
- Ni kune lernas en lernejo.: Mokykloje mokomės kartu.
- Miaj gepatroj manĝas en manĝejo.: Mano tėvai valgo valgomajame.
- La kuko estas manĝebla.: Tortas valgomas.
