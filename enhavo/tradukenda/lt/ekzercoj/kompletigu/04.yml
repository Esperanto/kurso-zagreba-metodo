- Ana kaj Marko iris tra la strato.: Ana ir Marko nuėjo gatve.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Jie atėjo į kavinę, nuėjo prie stalo ir pamatė tėvą, sėdintį ant kėdės.
- Ana metis tri kukojn sur seĝon.: Ana padėjo tris pyragus ant kėdės.
- Ŝi remetis poste la kukojn sur la tablon.: Vėliau ji vėl padėjo pyragus ant stalo.
