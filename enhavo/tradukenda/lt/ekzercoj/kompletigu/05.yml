- Dankon, sinjoro. Nedankinde.: Ačiū, pone. Sveiki atvykę.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Valanda yra trumpa, diena ilgesnė, mėnuo – ilgiausias.
- Mi legas pli multajn librojn ol mia amiko.: Aš skaitau daugiau knygų nei mano draugas.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Išsiunčiau ilgus laiškus savo draugui, kai jis buvo Tokijuje.
- La libro estas leginda.: Knyga verta perskaityti.
