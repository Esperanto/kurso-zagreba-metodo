- La gepatroj ĉiam deziras, ke mi lernu multon.: Tėvai visada nori, kad aš daug išmokčiau.
- Mia amiko deziras, ke mi iru kanti kun li.: Mano draugas nori, kad aš eičiau su juo dainuoti.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Tėvas nori, kad jo vaikas valgytų pyragą, esantį ant stalo.
- Ni loĝas en malgranda ĉambro.: Mes gyvename mažame kambarėlyje.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Man pasidarė neramu, kai pamačiau tave.
- Ĉiuj rimarkis, ke ŝi estas belega.: Visi pastebėjo, kad ji labai graži.
