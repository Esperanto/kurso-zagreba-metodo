- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Jis labai greitai išgėrė rytinį gėrimą, kad galėtų anksti ateiti į mokyklą.
- Mi ankoraŭ ne aŭdis novaĵon.: Dar negirdėjau jokių naujienų.
- En tiu momento Marko ekkriis.: Tuo metu Marko sušuko.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Berniukas, kuris nemyli kitų berniukų ir mergaičių, neturi nei draugų, nei moterų.
