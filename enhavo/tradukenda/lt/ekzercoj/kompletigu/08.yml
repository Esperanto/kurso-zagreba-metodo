- Ni ordigis ĉion kaj transdonis al ili.: Viską sutvarkėme ir perdavėme jiems.
- Mi petas glason da kafo kaj iom da akvo.: Prašau stiklinės kavos ir vandens.
- Doloris lin la kapo. Li malsaniĝis.: Jam skaudėjo galvą. Jis susirgo.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Mergina mėgsta būti graži, dėl to ir gražina veidą.
