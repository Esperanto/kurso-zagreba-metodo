- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Jei turėčiau tiek pinigų, kiek idėjų, keliaučiau po pasaulį.
- En ĉiu vortaro mankas kelkaj vortoj.: Kiekviename žodyne trūksta kai kurių žodžių.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ilgą laiką prie valgomojo stalo pasakojantis žmogus liks alkanas.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Jis turėjo būti dėmesingas ir jam nebuvo leista ilgai būti lauke per lietų. Todėl jis peršalo.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Jis turi aiškią mintį, bet patikės viskuo, ką sakai, tarsi būtum jo žmona.
