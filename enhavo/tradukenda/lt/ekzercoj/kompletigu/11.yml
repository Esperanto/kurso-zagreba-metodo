- La knabino ĵetis la paperon en la paperujon.: Mergina įmetė popierių į makulatūros krepšį.
- Kie estas mia skribilo, mi volas respondi al li.: Kur mano rašiklis? Noriu jam atsakyti.
- La suno malaperis kaj nun estas preskaŭ malhele.: Saulė dingo ir dabar beveik tamsu.
- Bonvolu manĝi la panon per manĝilo.: Duoną valgykite su valgomuoju indu.
- Pardonu min, mi ne rajtas resti.: Atleiskite, man neleidžiama pasilikti.
