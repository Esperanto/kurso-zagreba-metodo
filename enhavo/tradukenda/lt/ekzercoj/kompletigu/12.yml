- Antaŭ kvarona horo ili revenis.: Jie grįžo prieš ketvirtį valandos.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Po baisios nelaimės žmonės pasitraukė ir senieji miestai subyrėjo.
- Ni devus revidi nin, mia amiko.: Turėtume vėl susitikti, mano drauge.
- Ju pli ofte mi pripensas, des pli mi koleras.: Kuo dažniau apie tai galvoju, tuo pykstu.
- Ŝi loĝas en iu ajn domo.: Ji gyvena bet kuriame name.
