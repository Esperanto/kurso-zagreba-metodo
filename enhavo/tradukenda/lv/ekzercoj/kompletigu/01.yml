- Marko estas en la ĉambro.: Marko ir istabā.
- Li sidas sur seĝo.: Viņš sēž uz krēsla.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Skolotājs māca. Strādnieks strādā. Skolēns mācās.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko un Aleksandro ir studenti un sportisti.
- La patrino de Marko estas instruistino.: Marko mamma ir skolotāja.
- La seĝo estas en la ĉambro.: Krēsls atrodas istabā.
- La libro estas de li, ĝi estas lia.: Grāmata pieder viņam; tā ir viņa.
- Mia nomo estas Marko.: Mani sauc Marko.
