- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ir draugs vīrietis un draugs. Viņi ir draugi.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Viņš vāra kafiju, un viņi to dzer mūsu mājās.
- Ili iras al la hotelo.: Viņi dodas uz viesnīcu.
- Ŝi vidas, ke Marko amas ŝin.: Viņa redz, ka Marko viņu mīl.
- Ili havas facilajn lernolibrojn.: Viņiem ir vienkāršas mācību grāmatas.
