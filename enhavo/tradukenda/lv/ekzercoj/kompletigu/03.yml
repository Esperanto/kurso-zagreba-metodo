- Mia amiko skribas multe.: Mans draugs daudz raksta.
- Bela kelnerino estas belulino.: Skaista viesmīle ir skaista sieviete.
- Ni havas multajn belajn aferojn.: Mums ir daudz skaistu lietu.
- Ni kune lernas en lernejo.: Mēs skolā mācāmies kopā.
- Miaj gepatroj manĝas en manĝejo.: Mani vecāki ēd ēdamistabā.
- La kuko estas manĝebla.: Kūka ir ēdama.
