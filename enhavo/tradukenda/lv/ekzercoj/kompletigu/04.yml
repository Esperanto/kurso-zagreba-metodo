- Ana kaj Marko iris tra la strato.: Ana un Marko devās pa ielu.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Viņi atnāca uz kafejnīcu, piegāja pie galda un ieraudzīja tēvu sēžam uz krēsla.
- Ana metis tri kukojn sur seĝon.: Ana nolika trīs kūkas uz krēsla.
- Ŝi remetis poste la kukojn sur la tablon.: Vēlāk viņa atkal nolika kūkas uz galda.
