- Dankon, sinjoro. Nedankinde.: Paldies, kungs. Laipni lūdzam.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Stunda ir īsa, diena ir garāka, mēnesis ir visilgākais.
- Mi legas pli multajn librojn ol mia amiko.: Es lasu vairāk grāmatu nekā mans draugs.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Es savam draugam nosūtīju garas vēstules, kamēr viņš bija Tokijā.
- La libro estas leginda.: Grāmata ir lasīšanas vērta.
