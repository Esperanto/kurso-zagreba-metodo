- La gepatroj ĉiam deziras, ke mi lernu multon.: Vecāki vienmēr vēlas, lai es daudz mācītos.
- Mia amiko deziras, ke mi iru kanti kun li.: Mans draugs vēlas, lai es eju kopā ar viņu dziedāt.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Tēvs vēlas, lai viņa bērns ēd kūku, kas ir uz galda.
- Ni loĝas en malgranda ĉambro.: Mēs dzīvojam mazā istabā.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Es kļuvu nemierīgs, kad ieraudzīju tevi.
- Ĉiuj rimarkis, ke ŝi estas belega.: Visi pamanīja, ka viņa ir ļoti skaista.
