- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Viņš ļoti ātri izdzēra rīta dzērienu, lai agri ierastos skolā.
- Mi ankoraŭ ne aŭdis novaĵon.: Nekādas ziņas vēl neesmu dzirdējis.
- En tiu momento Marko ekkriis.: Tajā brīdī Marko iesaucās.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Zēnam, kurš nemīl citus zēnus un meitenes, nav ne vīriešu, ne draugu.
