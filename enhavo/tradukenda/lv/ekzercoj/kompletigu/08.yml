- Ni ordigis ĉion kaj transdonis al ili.: Mēs visu sakārtojām un nodevām viņiem.
- Mi petas glason da kafo kaj iom da akvo.: Es lūdzu glāzi kafijas un nedaudz ūdens.
- Doloris lin la kapo. Li malsaniĝis.: Viņam sāpēja galva. Viņam kļuva slikti.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Meitenei patīk būt skaistai, un tāpēc viņa izdaiļo savu seju.
