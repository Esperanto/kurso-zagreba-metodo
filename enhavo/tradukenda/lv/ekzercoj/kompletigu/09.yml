- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ja man būtu tik daudz naudas, cik ideju, es ceļotu pa pasauli.
- En ĉiu vortaro mankas kelkaj vortoj.: Katrā vārdnīcā trūkst dažu vārdu.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Cilvēks, kurš ilgu laiku turpina stāstīt stāstus pie pusdienu galda, paliks izsalcis.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Viņam bija jāpievērš uzmanība, un viņš nedrīkstēja ilgi uzturēties ārā lietus laikā. Tāpēc viņš saaukstējās.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Viņam ir skaidrs priekšstats, bet viņš ticēs visam, ko jūs sakāt, it kā jūs būtu viņa sieva.
