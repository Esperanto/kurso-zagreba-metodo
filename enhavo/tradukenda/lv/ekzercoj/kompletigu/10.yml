- En juneco oni havas ankaŭ belecon.: Jaunībā ir arī skaistums.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Priekšniekiem ir jāvienkāršo sarežģīti darbi.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Tajā vecumā viņš jau bija kļuvis par sporta kluba vadītāju.
- Monon oni metas en monujon.: Naudu liek makā.
- Sekvu la ekzemplon de la bonaj familianoj.: Sekojiet labo ģimenes locekļu piemēram.
