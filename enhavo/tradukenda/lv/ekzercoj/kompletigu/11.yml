- La knabino ĵetis la paperon en la paperujon.: Meitene iemeta papīru makulatūras grozā.
- Kie estas mia skribilo, mi volas respondi al li.: Kur ir mana pildspalva? Es gribu viņam atbildēt.
- La suno malaperis kaj nun estas preskaŭ malhele.: Saule pazuda un tagad ir gandrīz tumšs.
- Bonvolu manĝi la panon per manĝilo.: Lūdzu, ēdiet maizi ar ēšanas piederumu.
- Pardonu min, mi ne rajtas resti.: Piedod man, es nedrīkstu palikt.
