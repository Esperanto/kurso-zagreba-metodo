- Antaŭ kvarona horo ili revenis.: Viņi atgriezās pirms ceturtdaļas stundas.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Pēc šausmīgās nelaimes cilvēki aizgāja un vecās pilsētas sabruka.
- Ni devus revidi nin, mia amiko.: Mums vajadzētu atkal satikties, mans draugs.
- Ju pli ofte mi pripensas, des pli mi koleras.: Jo biežāk es par to domāju, jo dusmīgāka kļūstu.
- Ŝi loĝas en iu ajn domo.: Viņa dzīvo jebkurā mājā.
