- Marko estas en la ĉambro.: Ao amin'ny efitrano i Marko.
- Li sidas sur seĝo.: Mipetraka eo ambony seza izy.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Mpampianatra no mampianatra. Miasa ny mpiasa iray. Mianatra ny mpianatra iray.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Mpianatra sy atleta i Marko sy Aleksandro.
- La patrino de Marko estas instruistino.: Mpampianatra ny renin'i Marko.
- La seĝo estas en la ĉambro.: Ao amin'ny efitrano ny seza.
- La libro estas de li, ĝi estas lia.: Azy ny boky; azy io.
- Mia nomo estas Marko.: Marko no anarako.
