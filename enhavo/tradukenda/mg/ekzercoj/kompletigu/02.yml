- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Manana namana lahy sy sakaiza vavy i Marko. Mpinamana izy ireo.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Manao kafe izy ary misotro izany ao an-tranonay.
- Ili iras al la hotelo.: Mandeha any amin'ny hotely izy ireo.
- Ŝi vidas, ke Marko amas ŝin.: Hitany fa tia azy i Marko.
- Ili havas facilajn lernolibrojn.: Manana boky fianarana mora izy ireo.
