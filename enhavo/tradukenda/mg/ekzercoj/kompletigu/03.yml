- Mia amiko skribas multe.: Manoratra betsaka ny namako.
- Bela kelnerino estas belulino.: Ny mpandroso sakafo tsara tarehy dia vehivavy tsara tarehy.
- Ni havas multajn belajn aferojn.: Manana zavatra tsara maro isika.
- Ni kune lernas en lernejo.: Miara-mianatra any an-tsekoly izahay.
- Miaj gepatroj manĝas en manĝejo.: Misakafo ao amin'ny efitra fisakafoana ny ray aman-dreniko.
- La kuko estas manĝebla.: Azo hanina ny mofomamy.
