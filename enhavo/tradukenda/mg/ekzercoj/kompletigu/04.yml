- Ana kaj Marko iris tra la strato.: Nandeha teny an-dalana i Ana sy Marko.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Tonga tao amin’ny trano fisotroana kafe iray izy ireo, nankao amin’ny latabatra iray, ary nahita ilay raim-pianakaviana nipetraka teo ambony seza.
- Ana metis tri kukojn sur seĝon.: Nametraka mofo telo teo ambony seza i Ana.
- Ŝi remetis poste la kukojn sur la tablon.: Naveriny teo ambony latabatra indray ireo mofomamy.
