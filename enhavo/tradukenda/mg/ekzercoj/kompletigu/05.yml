- Dankon, sinjoro. Nedankinde.: Misaotra tompoko. Tsisy fisaorana.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Ny adiny iray dia fohy, iray andro no lava kokoa, iray volana no lava indrindra.
- Mi legas pli multajn librojn ol mia amiko.: Namaky boky bebe kokoa noho ny namako aho.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Nandefa taratasy lava ho an’ilay namako aho fony izy tany Tokyo.
- La libro estas leginda.: Mendrika vakiana ilay boky.
