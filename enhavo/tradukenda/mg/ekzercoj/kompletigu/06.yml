- La gepatroj ĉiam deziras, ke mi lernu multon.: Maniry foana ny ray aman-dreny mba hianatra zavatra maro aho.
- Mia amiko deziras, ke mi iru kanti kun li.: Maniry ny hiaraka hihira aminy ny namako.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Tian’ilay raim-pianakaviana hohanin’ny zanany ilay mofomamy eo ambony latabatra.
- Ni loĝas en malgranda ĉambro.: Efitra kely izahay no mipetraka.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Lasa sahiran-tsaina aho rehefa nahita anao.
- Ĉiuj rimarkis, ke ŝi estas belega.: Tsikaritry ny rehetra fa tena tsara tarehy izy.
