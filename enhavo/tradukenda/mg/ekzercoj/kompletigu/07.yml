- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Nosotroiny haingana dia haingana ny fisotrony maraina mba hahatongavana any am-pianarana.
- Mi ankoraŭ ne aŭdis novaĵon.: Tsy mbola nandre vaovao aho.
- En tiu momento Marko ekkriis.: Tamin'izay fotoana izay dia niantsoantso i Marko.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Ny ankizilahy tsy tia ankizilahy sy ankizivavy hafa dia tsy manana namana lahy na vavy.
