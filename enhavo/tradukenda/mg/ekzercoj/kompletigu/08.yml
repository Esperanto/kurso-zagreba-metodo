- Ni ordigis ĉion kaj transdonis al ili.: Nalaminay ny zava-drehetra ary natolotray azy ireo.
- Mi petas glason da kafo kaj iom da akvo.: Mangataka kafe iray vera sy rano aho.
- Doloris lin la kapo. Li malsaniĝis.: Narary ny lohany. Narary izy.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Tian'ilay tovovavy ny ho tsara tarehy, ary noho izany antony izany no nanatsarany ny tarehiny.
