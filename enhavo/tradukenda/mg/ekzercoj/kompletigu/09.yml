- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Raha nanam-bola be toy ny hevitra aho dia nitety an'izao tontolo izao.
- En ĉiu vortaro mankas kelkaj vortoj.: Ao amin'ny rakibolana tsirairay dia misy teny tsy ampy.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ny olona mitantara tantara lava eo amin'ny latabatra fisakafoana dia hijanona ho noana.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Tsy maintsy nihaino izy ary tsy navela nijanona teny ivelany nandritra ny orana. Noho izany dia voan'ny sery izy.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Manana ny heviny mazava izy, nefa hino izay rehetra lazainao, toy ny hoe vadiny ianao.
