- En juneco oni havas ankaŭ belecon.: Amin'ny fahatanorana dia manana hatsarana koa ny iray.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Tokony hanatsotra asa sarotra ny lehibeny.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Tamin'izany taona izany dia efa lasa mpitarika klioba amin'ny klioba ara-panatanjahantena izy.
- Monon oni metas en monujon.: Ny iray dia mametraka vola ao anaty poketra.
- Sekvu la ekzemplon de la bonaj familianoj.: Araho ny ohatr’ireo mpianakavy tsara.
