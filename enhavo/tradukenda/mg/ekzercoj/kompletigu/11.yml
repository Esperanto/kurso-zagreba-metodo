- La knabino ĵetis la paperon en la paperujon.: Natsipin’ilay tovovavy tao anaty harona fako ilay taratasy.
- Kie estas mia skribilo, mi volas respondi al li.: Aiza ny peniko? Te-hamaly azy aho.
- La suno malaperis kaj nun estas preskaŭ malhele.: Nanjavona ny masoandro ary efa ho maizina ny andro.
- Bonvolu manĝi la panon per manĝilo.: Mba hano ny mofo miaraka amin'ny fitaovana fihinanana.
- Pardonu min, mi ne rajtas resti.: Mamelà ahy fa tsy mahazo mijanona aho.
