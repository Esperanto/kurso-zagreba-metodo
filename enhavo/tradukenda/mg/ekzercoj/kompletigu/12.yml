- Antaŭ kvarona horo ili revenis.: Niverina izy ireo tamin’ny ampahefatry ny ora lasa izay.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Taorian'ny loza nahatsiravina dia lasa ny olona ary nirodana ny tanàna taloha.
- Ni devus revidi nin, mia amiko.: Tokony hifankahita indray isika ry namako.
- Ju pli ofte mi pripensas, des pli mi koleras.: Arakaraka ny hieritreretana azy matetika no vao mainka tezitra aho.
- Ŝi loĝas en iu ajn domo.: Mipetraka amin'ny trano rehetra izy.
