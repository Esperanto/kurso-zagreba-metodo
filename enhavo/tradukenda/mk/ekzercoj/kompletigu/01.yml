- Marko estas en la ĉambro.: Марко е во собата.
- Li sidas sur seĝo.: Тој седи на стол.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Учител предава. Работник работи. Ученик учи.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Марко и Александар се ученици и спортисти.
- La patrino de Marko estas instruistino.: Мајката на Марко е учителка.
- La seĝo estas en la ĉambro.: Столот е во собата.
- La libro estas de li, ĝi estas lia.: Книгата е од него, таа е негова.
- Mia nomo estas Marko.: Моето име е Марко.
