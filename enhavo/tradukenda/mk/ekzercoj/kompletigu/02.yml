- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Марко има пријател и пријателка. Тие се пријатели.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Тој вари кафе и тие го пијат во нашиот дом.
- Ili iras al la hotelo.: Тие одат во хотелот.
- Ŝi vidas, ke Marko amas ŝin.: Таа гледа дека Марко ја сака.
- Ili havas facilajn lernolibrojn.: Тие имаат лесни учебници.
