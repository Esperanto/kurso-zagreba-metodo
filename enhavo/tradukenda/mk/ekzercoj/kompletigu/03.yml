- Mia amiko skribas multe.: Мојот пријател пишува многу.
- Bela kelnerino estas belulino.: Убава келнерка е убавица.
- Ni havas multajn belajn aferojn.: Имаме многу убави работи.
- Ni kune lernas en lernejo.: Ние заедно учиме во училиште.
- Miaj gepatroj manĝas en manĝejo.: Моите родители јадат во трпезарија.
- La kuko estas manĝebla.: Колачот може да се јаде.
