- Ana kaj Marko iris tra la strato.: Ана и Марко поминаа низ улицата.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Тие дојдоа во кафуле, отидоа до маса и го видоа таткото како седи на стол.
- Ana metis tri kukojn sur seĝon.: Ана стави три колачи на стол.
- Ŝi remetis poste la kukojn sur la tablon.: Потоа таа ги врати колачите на масата.
