- Dankon, sinjoro. Nedankinde.: Благодарам, господине. Нема за што.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Часот е краток, денот е подолг, месецот е најдолг.
- Mi legas pli multajn librojn ol mia amiko.: Читам повеќе книги од мојот пријател.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Му испратив долги писма на мојот пријател додека беше во Токио.
- La libro estas leginda.: Книгата вреди да се чита.
