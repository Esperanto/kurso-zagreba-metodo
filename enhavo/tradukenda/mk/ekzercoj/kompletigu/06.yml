- La gepatroj ĉiam deziras, ke mi lernu multon.: Родителите секогаш сакаат да научам многу.
- Mia amiko deziras, ke mi iru kanti kun li.: Мојот пријател сака да одам да пеам со него.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Таткото сака неговото дете да го изеде колачот што е на масата.
- Ni loĝas en malgranda ĉambro.: Живееме во мала соба.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Станав немирен кога те видов.
- Ĉiuj rimarkis, ke ŝi estas belega.: Сите забележаа дека таа е многу убава.
