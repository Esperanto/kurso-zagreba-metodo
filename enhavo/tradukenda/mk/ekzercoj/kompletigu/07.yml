- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Тој многу брзо го испи својот утрински пијалак за рано да дојде на училиште.
- Mi ankoraŭ ne aŭdis novaĵon.: Сè уште не сум слушнал новост.
- En tiu momento Marko ekkriis.: Во тој момент Марко извика.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Момче што не ги сака другите момчиња и девојчиња нема ни пријатели ни пријателки.
