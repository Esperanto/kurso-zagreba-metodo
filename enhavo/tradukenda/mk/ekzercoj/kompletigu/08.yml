- Ni ordigis ĉion kaj transdonis al ili.: Средивме сè и им го предадовме.
- Mi petas glason da kafo kaj iom da akvo.: Барам чаша кафе и малку вода.
- Doloris lin la kapo. Li malsaniĝis.: Го болеше главата. Се разболе.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Девојчето сака да биде убаво и затоа го разубавува своето лице.
