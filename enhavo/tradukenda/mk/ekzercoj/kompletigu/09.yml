- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ако имав толку пари колку идеи, би патувал околу светот.
- En ĉiu vortaro mankas kelkaj vortoj.: Во секој речник недостасуваат неколку зборови.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Човек што долго раскажува на трпезата ќе остане гладен.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Тој мораше да внимава и не смееше долго да останува надвор на дожд. Затоа настина.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Тој има своја јасна идеја, но ќе поверува во сè што ќе кажеш, како да си негова сопруга.
