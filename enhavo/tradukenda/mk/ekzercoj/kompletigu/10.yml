- En juneco oni havas ankaŭ belecon.: Во младоста човек има и убавина.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Шефовите би требало да ги поедностават сложените работи.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: На таа возраст тој веќе стана раководител на спортски клуб.
- Monon oni metas en monujon.: Парите се ставаат во паричник.
- Sekvu la ekzemplon de la bonaj familianoj.: Следи го примерот на добрите членови на семејството.
