- La knabino ĵetis la paperon en la paperujon.: Девојчето ја фрли хартијата во корпата за хартија.
- Kie estas mia skribilo, mi volas respondi al li.: Каде е моето пенкало? Сакам да му одговорам.
- La suno malaperis kaj nun estas preskaŭ malhele.: Сонцето исчезна и сега е речиси темно.
- Bonvolu manĝi la panon per manĝilo.: Те молам, јади го лебот со прибор.
- Pardonu min, mi ne rajtas resti.: Прости ми, не смеам да останам.
