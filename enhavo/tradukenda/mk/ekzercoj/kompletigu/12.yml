- Antaŭ kvarona horo ili revenis.: Пред четврт час тие се вратија.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: По ужасната несреќа луѓето си заминаа и старите градови се распаднаа.
- Ni devus revidi nin, mia amiko.: Треба повторно да се видиме, мој пријателе.
- Ju pli ofte mi pripensas, des pli mi koleras.: Колку почесто размислувам за тоа, толку повеќе се лутам.
- Ŝi loĝas en iu ajn domo.: Таа живее во која било куќа.
