- Marko estas en la ĉambro.: मार्को खोलीत आहे.
- Li sidas sur seĝo.: तो खुर्चीवर बसतो.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: एक शिक्षक शिकवतो. एक कामगार काम करतो. विद्यार्थी शिकतो.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: मार्को आणि अलेक्झांड्रो हे विद्यार्थी आणि खेळाडू आहेत.
- La patrino de Marko estas instruistino.: मार्कोची आई शिक्षिका आहे.
- La seĝo estas en la ĉambro.: खुर्ची खोलीत आहे.
- La libro estas de li, ĝi estas lia.: पुस्तक त्यांचे आहे; ते त्याचे आहे.
- Mia nomo estas Marko.: माझे नाव मार्को आहे.
