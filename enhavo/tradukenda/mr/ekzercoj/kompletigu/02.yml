- Marko havas amikon kaj amikinon. Ili estas geamikoj.: मार्कोला एक पुरुष मित्र आणि एक महिला मित्र आहे. ते मित्र आहेत.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: तो कॉफी बनवतो आणि ते आमच्या घरी पितात.
- Ili iras al la hotelo.: ते हॉटेलमध्ये जातात.
- Ŝi vidas, ke Marko amas ŝin.: मार्को तिच्यावर प्रेम करतो हे तिला दिसते.
- Ili havas facilajn lernolibrojn.: त्यांच्याकडे सुलभ पाठ्यपुस्तके आहेत.
