- Mia amiko skribas multe.: माझा मित्र खूप लिहितो.
- Bela kelnerino estas belulino.: एक सुंदर वेट्रेस एक सुंदर स्त्री आहे.
- Ni havas multajn belajn aferojn.: आपल्याकडे अनेक सुंदर गोष्टी आहेत.
- Ni kune lernas en lernejo.: आम्ही शाळेत एकत्र शिकतो.
- Miaj gepatroj manĝas en manĝejo.: माझे पालक जेवणाच्या खोलीत जेवतात.
- La kuko estas manĝebla.: केक खाण्यायोग्य आहे.
