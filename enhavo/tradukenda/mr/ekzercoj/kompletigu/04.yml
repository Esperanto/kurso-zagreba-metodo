- Ana kaj Marko iris tra la strato.: आना आणि मार्को रस्त्यावर गेले.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: ते एका कॅफेमध्ये आले, एका टेबलावर गेले आणि वडिलांना खुर्चीवर बसलेले पाहिले.
- Ana metis tri kukojn sur seĝon.: अनाने खुर्चीवर तीन केक ठेवले.
- Ŝi remetis poste la kukojn sur la tablon.: तिने नंतर केक पुन्हा टेबलावर ठेवले.
