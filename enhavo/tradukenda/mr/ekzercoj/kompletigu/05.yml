- Dankon, sinjoro. Nedankinde.: धन्यवाद सर. तुमचे स्वागत आहे.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: एक तास लहान आहे, एक दिवस मोठा आहे, एक महिना सर्वात मोठा आहे.
- Mi legas pli multajn librojn ol mia amiko.: मी माझ्या मित्रापेक्षा जास्त पुस्तके वाचतो.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: तो टोकियोमध्ये असताना मी माझ्या मित्राला लांबलचक पत्रे पाठवली.
- La libro estas leginda.: पुस्तक वाचण्यासारखे आहे.
