- La gepatroj ĉiam deziras, ke mi lernu multon.: मी खूप शिकावे अशी पालकांची नेहमीच इच्छा असते.
- Mia amiko deziras, ke mi iru kanti kun li.: माझ्या मित्राची इच्छा आहे की मी त्याच्याबरोबर गाणे गायला आहे.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: वडिलांची इच्छा आहे की आपल्या मुलाने टेबलावर असलेला केक खावा.
- Ni loĝas en malgranda ĉambro.: आम्ही एका छोट्या खोलीत राहतो.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: तुला पाहून मी अस्वस्थ झालो.
- Ĉiuj rimarkis, ke ŝi estas belega.: प्रत्येकाच्या लक्षात आले की ती खूप सुंदर आहे.
