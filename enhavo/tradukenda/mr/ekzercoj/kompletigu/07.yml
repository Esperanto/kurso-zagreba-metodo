- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: शाळेत लवकर यावे म्हणून त्याने सकाळचे पेय फार लवकर प्यायले.
- Mi ankoraŭ ne aŭdis novaĵon.: मी अजून एकही बातमी ऐकलेली नाही.
- En tiu momento Marko ekkriis.: त्याच क्षणी मार्को ओरडला.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: जो मुलगा इतर मुला-मुलींवर प्रेम करत नाही त्याला ना पुरुष मित्र असतात ना स्त्री मैत्रिणी.
