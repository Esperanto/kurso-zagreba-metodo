- Ni ordigis ĉion kaj transdonis al ili.: आम्ही सर्वकाही व्यवस्थित केले आणि ते त्यांच्याकडे दिले.
- Mi petas glason da kafo kaj iom da akvo.: मी एक ग्लास कॉफी आणि थोडे पाणी मागतो.
- Doloris lin la kapo. Li malsaniĝis.: त्याचे डोके दुखले. तो आजारी पडला.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: मुलीला सुंदर व्हायला आवडते आणि त्या कारणास्तव ती तिच्या चेहऱ्याची शोभा वाढवते.
