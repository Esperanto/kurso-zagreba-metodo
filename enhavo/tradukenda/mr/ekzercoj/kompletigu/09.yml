- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: जर माझ्याकडे कल्पनांइतके पैसे असतील तर मी जगभर फिरेन.
- En ĉiu vortaro mankas kelkaj vortoj.: प्रत्येक शब्दकोशात काही शब्द गहाळ आहेत.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: जो माणूस जेवणाच्या टेबलावर बराच वेळ कथा सांगत राहतो त्याला भूक लागते.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: त्याच्याकडे लक्ष द्यावे लागले आणि पावसात जास्त वेळ बाहेर राहण्याची परवानगी नव्हती. त्यामुळे त्याला सर्दी झाली.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: त्याला त्याची स्पष्ट कल्पना आहे, परंतु आपण जे काही बोलता त्या प्रत्येक गोष्टीवर तो विश्वास ठेवेल, जसे की आपण त्याची पत्नी आहात.
