- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: त्या वयात तो आधीच स्पोर्ट्स क्लबचा क्लब लीडर बनला होता.
- Monon oni metas en monujon.: एकजण पाकिटात पैसे ठेवतो.
- Sekvu la ekzemplon de la bonaj familianoj.: चांगल्या कुटुंबातील सदस्यांच्या उदाहरणाचे अनुसरण करा.
