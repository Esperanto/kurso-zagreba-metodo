- La knabino ĵetis la paperon en la paperujon.: मुलीने पेपर टाकाऊ टोपलीत टाकला.
- Kie estas mia skribilo, mi volas respondi al li.: माझे पेन कुठे आहे? मला त्याला उत्तर द्यायचे आहे.
- La suno malaperis kaj nun estas preskaŭ malhele.: सूर्य नाहीसा झाला आणि आता जवळजवळ अंधार झाला आहे.
- Bonvolu manĝi la panon per manĝilo.: कृपया भाकरी खाण्याच्या भांड्याने खा.
- Pardonu min, mi ne rajtas resti.: मला माफ कर, मला राहण्याची परवानगी नाही.
