- Antaŭ kvarona horo ili revenis.: ते पाऊण तासापूर्वी परतले.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: भयंकर दुर्दैवानंतर, लोक निघून गेले आणि जुनी शहरे तुटली.
- Ni devus revidi nin, mia amiko.: मित्रा, आपण पुन्हा एकमेकांना भेटले पाहिजे.
- Ju pli ofte mi pripensas, des pli mi koleras.: जितक्या वेळा मी याबद्दल विचार करतो, तितकाच मला राग येतो.
- Ŝi loĝas en iu ajn domo.: ती कोणत्याही घरात राहते.
