- Marko estas en la ĉambro.: Marko berada di dalam bilik.
- Li sidas sur seĝo.: Dia duduk di atas kerusi.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Seorang guru mengajar. Seorang pekerja bekerja. Seorang pelajar belajar.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko dan Aleksandro adalah pelajar dan atlet.
- La patrino de Marko estas instruistino.: Ibu Marko ialah seorang guru.
- La seĝo estas en la ĉambro.: Kerusi ada di dalam bilik.
- La libro estas de li, ĝi estas lia.: Buku itu miliknya; ia adalah miliknya.
- Mia nomo estas Marko.: Nama saya Marko.
