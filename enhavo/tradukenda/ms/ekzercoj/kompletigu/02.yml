- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko mempunyai seorang kawan lelaki dan seorang kawan perempuan. Mereka berkawan.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Dia membuat kopi dan mereka meminumnya di rumah kami.
- Ili iras al la hotelo.: Mereka pergi ke hotel.
- Ŝi vidas, ke Marko amas ŝin.: Dia nampak Marko sayangkan dia.
- Ili havas facilajn lernolibrojn.: Mereka mempunyai buku teks yang mudah.
