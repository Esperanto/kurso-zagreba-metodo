- Mia amiko skribas multe.: Kawan saya banyak menulis.
- Bela kelnerino estas belulino.: Pelayan yang cantik adalah wanita yang cantik.
- Ni havas multajn belajn aferojn.: Kami mempunyai banyak perkara yang indah.
- Ni kune lernas en lernejo.: Kami belajar bersama di sekolah.
- Miaj gepatroj manĝas en manĝejo.: Ibu bapa saya makan di ruang makan.
- La kuko estas manĝebla.: Kek boleh dimakan.
