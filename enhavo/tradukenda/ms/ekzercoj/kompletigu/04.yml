- Ana kaj Marko iris tra la strato.: Ana dan Marko pergi di sepanjang jalan.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Mereka datang ke kafe, pergi ke meja, dan melihat bapa duduk di atas kerusi.
- Ana metis tri kukojn sur seĝon.: Ana meletakkan tiga biji kek di atas kerusi.
- Ŝi remetis poste la kukojn sur la tablon.: Dia kemudian meletakkan semula kek di atas meja.
