- Dankon, sinjoro. Nedankinde.: Terima kasih, tuan. Anda dialu-alukan.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Sejam adalah singkat, sehari lebih lama, sebulan adalah yang paling lama.
- Mi legas pli multajn librojn ol mia amiko.: Saya membaca lebih banyak buku daripada rakan saya.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Saya menghantar surat panjang kepada rakan saya semasa dia berada di Tokyo.
- La libro estas leginda.: Buku itu berbaloi untuk dibaca.
