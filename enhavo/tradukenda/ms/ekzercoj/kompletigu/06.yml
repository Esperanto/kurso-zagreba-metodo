- La gepatroj ĉiam deziras, ke mi lernu multon.: Ibu bapa sentiasa mengharapkan saya belajar banyak.
- Mia amiko deziras, ke mi iru kanti kun li.: Kawan saya ingin saya pergi menyanyi bersamanya.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Si ayah mahu anaknya makan kek yang ada di atas meja.
- Ni loĝas en malgranda ĉambro.: Kami tinggal dalam bilik kecil.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Saya menjadi tidak senang apabila saya melihat awak.
- Ĉiuj rimarkis, ke ŝi estas belega.: Semua orang perasan bahawa dia sangat cantik.
