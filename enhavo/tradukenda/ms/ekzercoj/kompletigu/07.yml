- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Dia minum minuman paginya dengan cepat untuk datang awal ke sekolah.
- Mi ankoraŭ ne aŭdis novaĵon.: Saya masih belum mendengar sebarang berita.
- En tiu momento Marko ekkriis.: Ketika itu Marko menjerit.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Seorang lelaki yang tidak mencintai lelaki dan perempuan lain tidak mempunyai kawan lelaki mahupun perempuan.
