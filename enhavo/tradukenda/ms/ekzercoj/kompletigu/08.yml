- Ni ordigis ĉion kaj transdonis al ili.: Kami menyusun semuanya dan menyerahkannya kepada mereka.
- Mi petas glason da kafo kaj iom da akvo.: Saya minta segelas kopi dan sedikit air.
- Doloris lin la kapo. Li malsaniĝis.: Kepalanya sakit. Dia menjadi sakit.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Gadis itu suka cantik, dan atas sebab itu dia mencantikkan wajahnya.
