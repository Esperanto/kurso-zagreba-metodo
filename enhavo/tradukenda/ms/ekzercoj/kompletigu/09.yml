- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Jika saya mempunyai wang sebanyak idea, saya akan mengembara ke seluruh dunia.
- En ĉiu vortaro mankas kelkaj vortoj.: Dalam setiap kamus beberapa perkataan hilang.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Seseorang yang asyik bercerita lama-lama di meja makan akan terus kelaparan.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Dia terpaksa memberi perhatian dan tidak dibenarkan berada di luar lama dalam hujan. Oleh itu dia diserang selsema.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Dia mempunyai idea yang jelas, tetapi dia akan mempercayai semua yang anda katakan, seolah-olah anda isterinya.
