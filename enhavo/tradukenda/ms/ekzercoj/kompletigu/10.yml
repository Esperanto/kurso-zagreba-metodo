- En juneco oni havas ankaŭ belecon.: Pada masa muda seseorang juga mempunyai kecantikan.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Bos harus memudahkan kerja yang rumit.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Pada usia itu dia sudah pun menjadi ketua kelab sebuah kelab sukan.
- Monon oni metas en monujon.: Seseorang memasukkan wang ke dalam dompet.
- Sekvu la ekzemplon de la bonaj familianoj.: Ikuti contoh ahli keluarga yang baik.
