- La knabino ĵetis la paperon en la paperujon.: Gadis itu melemparkan kertas itu ke dalam bakul sampah.
- Kie estas mia skribilo, mi volas respondi al li.: Di manakah pen saya? Saya nak jawab dia.
- La suno malaperis kaj nun estas preskaŭ malhele.: Matahari hilang dan kini hampir gelap.
- Bonvolu manĝi la panon per manĝilo.: Sila makan roti dengan peralatan makan.
- Pardonu min, mi ne rajtas resti.: Maafkan saya, saya tidak dibenarkan tinggal.
