- Antaŭ kvarona horo ili revenis.: Mereka kembali seperempat jam yang lalu.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Selepas kemalangan yang dahsyat itu, orang ramai pergi dan kota-kota lama runtuh.
- Ni devus revidi nin, mia amiko.: Kita patut berjumpa lagi, kawan.
- Ju pli ofte mi pripensas, des pli mi koleras.: Semakin kerap saya memikirkannya, semakin saya marah.
- Ŝi loĝas en iu ajn domo.: Dia tinggal di mana-mana rumah.
