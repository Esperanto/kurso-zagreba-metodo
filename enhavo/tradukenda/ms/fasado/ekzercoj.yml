Forigu: Menetapkan semula
Kompletigu la frazojn: Lengkapi ayat-ayat
Por la Esperantaj literoj vi ankaŭ rajtas skribi cx, gx, hx, jx, sx kaj ux.: 'Untuk mengguna huruf Bahasa Esperanto, anda boleh mengguna x seperti ini: cx, gx, hx, jx, sx dan ux.'
Solvu: Menyelesai
Traduku: menerjemahi
Traduku kaj respondu: menerjemahi dan mejawabi
