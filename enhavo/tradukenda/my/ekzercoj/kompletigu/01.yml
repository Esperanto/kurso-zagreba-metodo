- Marko estas en la ĉambro.: Marko အခန်းထဲမှာ
- Li sidas sur seĝo.: ကုလားထိုင်ပေါ်တွင် သူထိုင်သည်။
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: ဆရာမတစ်ယောက်က သင်ပေးတယ်။ အလုပ်သမားတစ်ယောက်။ ကျောင်းသားတစ်ယောက်က သင်ယူတယ်။
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko နှင့် Aleksandr တို့သည် ကျောင်းသားများနှင့် အားကစားသမားများဖြစ်သည်။
- La patrino de Marko estas instruistino.: Marko ရဲ့အမေက ကျောင်းဆရာမပါ။
- La seĝo estas en la ĉambro.: ကုလားထိုင်က အခန်းထဲမှာ။
- La libro estas de li, ĝi estas lia.: ထိုစာအုပ်သည် သူပိုင်သည်။ ဒါဟာသူ့ရဲ့။
- Mia nomo estas Marko.: ကျွန်တော့်နာမည် Marko ပါ။
