- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko တွင် ယောက်ျားလေးသူငယ်ချင်းနှင့် အမျိုးသမီးသူငယ်ချင်းတစ်ယောက်ရှိသည်။ သူတို့က သူငယ်ချင်း။
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: သူက ကော်ဖီသောက်ပြီး ငါတို့အိမ်မှာ သောက်တယ်။
- Ili iras al la hotelo.: ဟိုတယ်ကို သွားကြတယ်။
- Ŝi vidas, ke Marko amas ŝin.: Marko က သူမကို ချစ်ကြောင်း သူမမြင်သည်။
- Ili havas facilajn lernolibrojn.: သူတို့မှာ လွယ်တဲ့ ပြဋ္ဌာန်းစာအုပ်တွေရှိတယ်။
