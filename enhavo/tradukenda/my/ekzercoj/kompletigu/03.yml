- Mia amiko skribas multe.: ကျွန်တော့်သူငယ်ချင်းက စာရေးတယ်။
- Bela kelnerino estas belulino.: လှပသော စားပွဲထိုးသည် လှပသော အမျိုးသမီးဖြစ်သည်။
- Ni havas multajn belajn aferojn.: ကျွန်ုပ်တို့တွင် လှပသောအရာများစွာရှိသည်။
- Ni kune lernas en lernejo.: ကျောင်းမှာ အတူတူ သင်ယူတယ်။
- Miaj gepatroj manĝas en manĝejo.: ကျွန်တော့်မိဘတွေက ထမင်းစားခန်းထဲမှာ စားတယ်။
- La kuko estas manĝebla.: ကိတ်မုန့်က စားလို့ရတယ်။
