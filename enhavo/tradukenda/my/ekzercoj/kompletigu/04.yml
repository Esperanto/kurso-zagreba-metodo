- Ana kaj Marko iris tra la strato.: Ana နဲ့ Marko က လမ်းပေါ်လျှောက်သွားတယ်။
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: ကော်ဖီဆိုင်သို့ လာကာ စားပွဲသို့သွားကာ ကုလားထိုင်ပေါ်တွင် ဖခင်ထိုင်နေသည်ကို တွေ့လိုက်ရသည်။
- Ana metis tri kukojn sur seĝon.: Ana က ကိတ်မုန့်သုံးခုကို ကုလားထိုင်ပေါ်တင်လိုက်တယ်။
- Ŝi remetis poste la kukojn sur la tablon.: နောက်တော့ သူက ကိတ်မုန့်တွေကို စားပွဲပေါ် ပြန်တင်လိုက်တယ်။
