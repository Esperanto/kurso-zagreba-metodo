- Dankon, sinjoro. Nedankinde.: ကျေးဇူးတင်ပါတယ်ခင်ဗျာ။ ရပါတယ်။
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: တစ်နာရီက တိုတောင်းတယ်၊ တစ်ရက်က ပိုရှည်တယ်၊ တစ်လက အရှည်ဆုံးပဲ။
- Mi legas pli multajn librojn ol mia amiko.: သူငယ်ချင်းထက် စာအုပ်တွေ ပိုဖတ်တယ်။
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: တိုကျိုမှာရှိစဉ်က ကျွန်တော့်သူငယ်ချင်းဆီ စာရှည်ကြီး ပို့လိုက်တယ်။
- La libro estas leginda.: စာအုပ်က ဖတ်ရတာ တန်တယ်။
