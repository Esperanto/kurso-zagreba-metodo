- La gepatroj ĉiam deziras, ke mi lernu multon.: မိဘတွေက များများသင်ယူစေချင်တယ်။
- Mia amiko deziras, ke mi iru kanti kun li.: သူငယ်ချင်းက သူနဲ့အတူ သီချင်းဆိုဖို့ ဆန္ဒရှိတယ်။
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: အဖေက သူ့ကလေးကို စားပွဲပေါ်က ကိတ်မုန့်စားစေချင်တယ်။
- Ni loĝas en malgranda ĉambro.: ကျွန်တော်တို့ နေထိုင်တဲ့ အခန်းကျဉ်းလေးထဲမှာ။
- Mi fariĝis maltrankvila, kiam mi vidis vin.: မင်းကိုတွေ့တော့ စိတ်မကောင်းဖြစ်သွားတယ်။
- Ĉiuj rimarkis, ke ŝi estas belega.: သူမသည် အလွန်လှပသည်ကို လူတိုင်း သတိထားမိသည်။
