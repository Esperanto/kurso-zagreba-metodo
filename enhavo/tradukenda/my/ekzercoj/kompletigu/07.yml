- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: ကျောင်းကို စောစောရောက်ဖို့အတွက် မနက်က အသောက်ကို ခပ်မြန်မြန်သောက်တယ်။
- Mi ankoraŭ ne aŭdis novaĵon.: သတင်းတော့မကြားရသေးပါဘူး။
- En tiu momento Marko ekkriis.: ထိုအချိန်တွင် Marko အော်ဟစ်လိုက်သည်။
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: တခြားယောက်ျားလေးတွေနဲ့ မိန်းကလေးတွေကို မချစ်တဲ့ ယောက်ျားလေးမှာ ယောက်ျားလေးသူငယ်ချင်းတွေရော မိန်းကလေးသူငယ်ချင်းတွေလည်း မရှိပါဘူး။
