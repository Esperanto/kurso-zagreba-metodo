- Ni ordigis ĉion kaj transdonis al ili.: ငါတို့က အရာအားလုံးကို စနစ်တကျထားပြီး သူတို့လက်ထဲ အပ်လိုက်တယ်။
- Mi petas glason da kafo kaj iom da akvo.: ကော်ဖီတစ်ခွက်နဲ့ ရေနည်းနည်းတောင်းတယ်။
- Doloris lin la kapo. Li malsaniĝis.: ခေါင်းကိုက်တယ်။ သူနေမကောင်းဖြစ်သွားတယ်။
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: ကောင်မလေးက လှတာကို ကြိုက်တယ်၊ အဲဒါကြောင့် သူ့မျက်နှာကို လှတယ်။
