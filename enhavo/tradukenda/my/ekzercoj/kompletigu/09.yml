- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: စိတ်ကူးတွေအတိုင်းပဲ ပိုက်ဆံရှိရင် ကမ္ဘာပတ်သွားမယ်။
- En ĉiu vortaro mankas kelkaj vortoj.: အဘိဓာန်တိုင်းတွင် အချို့သော စကားလုံးများ ပျောက်နေသည်။
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: ထမင်းစားပွဲမှာ အချိန်အကြာကြီး ပုံပြင်တွေပြောနေသူတစ်ယောက်ဟာ ဗိုက်ဆာနေလိမ့်မယ်။
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: သတိထားရမှာက မိုးရေထဲမှာ အပြင်မှာ အကြာကြီးနေခွင့် မရဘူး။ ထို့ကြောင့် သူ အအေးမိသွားသည်။
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: သူ့မှာ ရှင်းလင်းပြတ်သားတဲ့ အကြံဥာဏ်ရှိပေမယ့် မင်းပြောသမျှကို မင်းမိန်းမလို ယုံလိမ့်မယ်။
