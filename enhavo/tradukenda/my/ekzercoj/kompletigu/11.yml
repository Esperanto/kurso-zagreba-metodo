- La knabino ĵetis la paperon en la paperujon.: ကောင်မလေးက စာရွက်ကို အမှိုက်တောင်းထဲကို ပစ်ချလိုက်တယ်။
- Kie estas mia skribilo, mi volas respondi al li.: ငါ့ဘောပင် ဘယ်မှာလဲ ငါသူ့ကိုဖြေချင်တယ်။
- La suno malaperis kaj nun estas preskaŭ malhele.: နေက ပျောက်ကွယ်သွားပြီး အခုဆို မှောင်လုနီးပါး ဖြစ်နေပြီ။
- Bonvolu manĝi la panon per manĝilo.: ကျေးဇူးပြု၍ ထမင်းစားပန်းကန်ဖြင့် မုန့်စားပါ။
- Pardonu min, mi ne rajtas resti.: ခွင့်လွှတ်ပါ၊ မနေနိုင်ပါ။
