- Antaŭ kvarona horo ili revenis.: လွန်ခဲ့တဲ့ တစ်နာရီလောက်က သူတို့ပြန်လာတာ။
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ဆိုးဆိုးရွားရွား ဆိုးဆိုးရွားရွား ဖြစ်ပြီးနောက် လူတွေ ထွက်သွားပြီး မြို့ဟောင်းတွေ ပြိုကျသွားတယ်။
- Ni devus revidi nin, mia amiko.: ငါတို့ အချင်းချင်း ပြန်တွေ့သင့်တယ် သူငယ်ချင်း။
- Ju pli ofte mi pripensas, des pli mi koleras.: မကြာခဏတွေးလေလေ ဒေါသဖြစ်လေလေပါပဲ။
- Ŝi loĝas en iu ajn domo.: သူမသည် မည်သည့်အိမ်တွင်မဆို နေထိုင်သည်။
