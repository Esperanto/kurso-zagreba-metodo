- Marko estas en la ĉambro.: मार्को कोठामा छ।
- Li sidas sur seĝo.: उनी कुर्सीमा बस्छन् ।
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: शिक्षक पढाउनुहुन्छ। कामदारले काम गर्छ । एक विद्यार्थीले सिक्छ।
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: मार्को र अलेक्जान्ड्रो विद्यार्थी र खेलाडी हुन्।
- La patrino de Marko estas instruistino.: मार्कोकी आमा शिक्षक हुन्।
- La seĝo estas en la ĉambro.: कुर्सी कोठामा छ।
- La libro estas de li, ĝi estas lia.: पुस्तक उहाँको हो; यो उनको हो।
- Mia nomo estas Marko.: मेरो नाम मार्को हो।
