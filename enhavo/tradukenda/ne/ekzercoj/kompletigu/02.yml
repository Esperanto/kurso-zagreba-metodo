- Marko havas amikon kaj amikinon. Ili estas geamikoj.: मार्कोको एक पुरुष साथी र एक महिला साथी छ। उनीहरु साथी हुन् ।
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: उसले कफी बनाउँछ र हाम्रो घरमा पिउछ।
- Ili iras al la hotelo.: उनीहरु होटल जान्छन् ।
- Ŝi vidas, ke Marko amas ŝin.: मार्कोले उसलाई माया गरेको देख्छिन्।
- Ili havas facilajn lernolibrojn.: तिनीहरूसँग सजिलो पाठ्यपुस्तकहरू छन्।
