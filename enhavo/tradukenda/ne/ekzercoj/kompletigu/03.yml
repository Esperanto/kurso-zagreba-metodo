- Mia amiko skribas multe.: मेरो साथी धेरै लेख्छ।
- Bela kelnerino estas belulino.: एक सुन्दर वेट्रेस एक सुन्दर महिला हो।
- Ni havas multajn belajn aferojn.: हामीसँग धेरै सुन्दर चीजहरू छन्।
- Ni kune lernas en lernejo.: हामी स्कुलमा सँगै पढ्छौँ ।
- Miaj gepatroj manĝas en manĝejo.: मेरा आमाबाबुले भोजन कक्षमा खाना खानुहुन्छ।
- La kuko estas manĝebla.: केक खान योग्य छ।
