- Ana kaj Marko iris tra la strato.: एना र मार्को सडकमा गए।
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: तिनीहरू एउटा क्याफेमा आए, टेबुलमा गए, र बुबालाई कुर्सीमा बसिरहेको देखे।
- Ana metis tri kukojn sur seĝon.: एनाले कुर्सीमा तीनवटा केक राखिन्।
- Ŝi remetis poste la kukojn sur la tablon.: पछि उनले केकहरू टेबलमा राखिन्।
