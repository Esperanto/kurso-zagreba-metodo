- Dankon, sinjoro. Nedankinde.: धन्यवाद, सर। तपाईंलाई स्वागत छ।
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: एक घण्टा छोटो छ, एक दिन लामो छ, एक महिना लामो छ।
- Mi legas pli multajn librojn ol mia amiko.: साथीभन्दा धेरै किताब पढ्छु ।
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: टोकियोमा हुँदा मैले मेरो साथीलाई लामो पत्रहरू पठाएँ।
- La libro estas leginda.: पुस्तक पढ्न लायक छ।
