- La gepatroj ĉiam deziras, ke mi lernu multon.: आमाबाबु सधैं चाहन्छन् कि मैले धेरै सिक्नुहोस्।
- Mia amiko deziras, ke mi iru kanti kun li.: मेरो साथी म उहाँसँग गाउन चाहन्छु।
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: बुबा आफ्नो बच्चाले टेबुलमा भएको केक खान चाहन्छन्।
- Ni loĝas en malgranda ĉambro.: हामी एउटा सानो कोठामा बस्छौं।
- Mi fariĝis maltrankvila, kiam mi vidis vin.: तिमीलाई देख्दा मलाई असहज भयो।
- Ĉiuj rimarkis, ke ŝi estas belega.: सबैले याद गरे कि उनी धेरै सुन्दर छिन्।
