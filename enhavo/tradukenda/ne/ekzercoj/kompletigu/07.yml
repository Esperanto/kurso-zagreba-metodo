- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: स्कुल चाँडै आउनको लागि उसले बिहानको पेय धेरै छिटो पियो।
- Mi ankoraŭ ne aŭdis novaĵon.: मैले अहिलेसम्म कुनै खबर सुनेको छैन ।
- En tiu momento Marko ekkriis.: त्यसैबेला मार्को करायो ।
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: अरु केटा र केटीलाई माया नगर्ने केटाको न पुरुष साथी हुन्छ न महिला साथी ।
