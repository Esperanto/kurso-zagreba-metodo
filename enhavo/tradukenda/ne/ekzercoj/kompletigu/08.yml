- Ni ordigis ĉion kaj transdonis al ili.: हामीले सबै कुरा मिलाएर उनीहरूलाई दियौं।
- Mi petas glason da kafo kaj iom da akvo.: म एक गिलास कफी र केहि पानी माग्छु।
- Doloris lin la kapo. Li malsaniĝis.: उनको टाउको दुख्यो। उनी बिरामी भए ।
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: केटीलाई सुन्दर हुन मनपर्छ, र यस कारणले उनी आफ्नो अनुहार सुन्दर बनाउँछिन्।
