- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: यदि मसँग विचारहरू जत्तिकै पैसा थियो भने, म संसारभर घुम्ने थिएँ।
- En ĉiu vortaro mankas kelkaj vortoj.: प्रत्येक शब्दकोशमा केही शब्दहरू हराइरहेका छन्।
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: खाने टेबलमा लामो समयसम्म कथा सुनाउने व्यक्ति भोकै रहन्छ ।
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: उसले ध्यान दिनुपर्u200dयो र वर्षामा धेरै समय बाहिर बस्न दिइएन। त्यसैले उनलाई चिसो लाग्यो ।
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: उहाँसँग उहाँको स्पष्ट विचार छ, तर उसले तपाईंले भनेको सबै कुरा विश्वास गर्नेछ, मानौं तपाईं उहाँकी पत्नी हुनुहुन्छ।
