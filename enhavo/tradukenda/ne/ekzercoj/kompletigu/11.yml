- La knabino ĵetis la paperon en la paperujon.: केटीले कागज फोहोरको टोकरीमा फालिन् ।
- Kie estas mia skribilo, mi volas respondi al li.: मेरो कलम कहाँ छ? म उसलाई जवाफ दिन चाहन्छु।
- La suno malaperis kaj nun estas preskaŭ malhele.: घाम गायब भयो र अब लगभग अँध्यारो छ।
- Bonvolu manĝi la panon per manĝilo.: कृपया खाने भाँडोमा रोटी खानुहोस्।
- Pardonu min, mi ne rajtas resti.: मलाई माफ गर्नुहोस्, मलाई बस्न अनुमति छैन।
