- Antaŭ kvarona horo ili revenis.: उनीहरु डेढ घण्टा अगाडि फर्किएका थिए ।
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: भयानक दुर्भाग्य पछि, मानिसहरू टाढा गए र पुराना सहरहरू टुक्रिए।
- Ni devus revidi nin, mia amiko.: हामीले एक अर्कालाई फेरि भेट्नुपर्छ, मेरो साथी।
- Ju pli ofte mi pripensas, des pli mi koleras.: जति पटक म यसको बारेमा सोच्छु, म उति रिसाउछु।
- Ŝi loĝas en iu ajn domo.: जुनसुकै घरमा बस्छिन् ।
