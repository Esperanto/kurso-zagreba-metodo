- Marko estas en la ĉambro.: Marko is in de kamer.
- Li sidas sur seĝo.: Hij zit op een stoel.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Een leraar geeft les. Een arbeider werkt. Een student leert.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko en Aleksandro zijn studenten en atleten.
- La patrino de Marko estas instruistino.: Marko's moeder is lerares.
- La seĝo estas en la ĉambro.: De stoel staat in de kamer.
- La libro estas de li, ĝi estas lia.: Het boek is van hem; het is van hem.
- Mia nomo estas Marko.: Mijn naam is Marko.
