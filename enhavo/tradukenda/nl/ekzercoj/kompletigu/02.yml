- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko heeft een mannelijke vriend en een vrouwelijke vriend. Ze zijn vrienden.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Hij zet koffie en dat drinken ze bij ons thuis.
- Ili iras al la hotelo.: Ze gaan naar het hotel.
- Ŝi vidas, ke Marko amas ŝin.: Ze ziet dat Marko van haar houdt.
- Ili havas facilajn lernolibrojn.: Ze hebben gemakkelijke schoolboeken.
