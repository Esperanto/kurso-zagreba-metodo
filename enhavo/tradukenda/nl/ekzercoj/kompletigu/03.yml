- Mia amiko skribas multe.: Mijn vriend schrijft veel.
- Bela kelnerino estas belulino.: Een mooie serveerster is een mooie vrouw.
- Ni havas multajn belajn aferojn.: Wij hebben veel mooie dingen.
- Ni kune lernas en lernejo.: Wij leren samen op school.
- Miaj gepatroj manĝas en manĝejo.: Mijn ouders eten in een eetkamer.
- La kuko estas manĝebla.: De taart is eetbaar.
