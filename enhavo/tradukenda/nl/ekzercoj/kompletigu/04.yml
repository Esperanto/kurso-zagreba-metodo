- Ana kaj Marko iris tra la strato.: Ana en Marko gingen door de straat.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ze kwamen naar een café, gingen naar een tafel en zagen de vader op een stoel zitten.
- Ana metis tri kukojn sur seĝon.: Ana zette drie taarten op een stoel.
- Ŝi remetis poste la kukojn sur la tablon.: Later zette ze de taarten weer op tafel.
