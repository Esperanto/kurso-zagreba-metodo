- Dankon, sinjoro. Nedankinde.: Dank u, meneer. Graag gedaan.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Een uur is kort, een dag is langer, een maand is het langst.
- Mi legas pli multajn librojn ol mia amiko.: Ik lees meer boeken dan mijn vriend.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Ik stuurde lange brieven naar mijn vriend terwijl hij in Tokio was.
- La libro estas leginda.: Het boek is de moeite waard om te lezen.
