- La gepatroj ĉiam deziras, ke mi lernu multon.: Ouders willen altijd dat ik veel leer.
- Mia amiko deziras, ke mi iru kanti kun li.: Mijn vriend wil dat ik met hem ga zingen.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: De vader wil dat zijn kind de taart eet die op tafel staat.
- Ni loĝas en malgranda ĉambro.: Wij wonen in een kleine kamer.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Ik werd ongemakkelijk toen ik je zag.
- Ĉiuj rimarkis, ke ŝi estas belega.: Iedereen merkte dat ze erg mooi is.
