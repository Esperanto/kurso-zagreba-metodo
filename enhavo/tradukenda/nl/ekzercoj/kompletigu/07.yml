- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Hij dronk zijn ochtenddrankje heel snel op, zodat hij vroeg naar school kon komen.
- Mi ankoraŭ ne aŭdis novaĵon.: Ik heb nog geen nieuws gehoord.
