- Ni ordigis ĉion kaj transdonis al ili.: Wij hebben alles in orde gebracht en aan hen overgedragen.
- Mi petas glason da kafo kaj iom da akvo.: Ik vraag om een glas koffie en wat water.
- Doloris lin la kapo. Li malsaniĝis.: Zijn hoofd deed pijn. Hij werd ziek.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Het meisje houdt ervan mooi te zijn, en om die reden verfraait ze haar gezicht.
