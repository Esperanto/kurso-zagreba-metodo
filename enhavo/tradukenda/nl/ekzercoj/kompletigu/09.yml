- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Als ik zoveel geld als ideeën had, zou ik de wereld rondreizen.
- En ĉiu vortaro mankas kelkaj vortoj.: In elk woordenboek ontbreken enkele woorden.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Iemand die aan de eettafel lange tijd verhalen blijft vertellen, zal hongerig blijven.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Hij moest opletten en mocht niet lang buiten blijven in de regen. Daarom werd hij verkouden.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Hij heeft zijn duidelijke idee, maar hij zal alles geloven wat je zegt, alsof je zijn vrouw bent.
