- En juneco oni havas ankaŭ belecon.: In de jeugd heb je ook schoonheid.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Bazen moeten ingewikkelde taken vereenvoudigen.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Op die leeftijd was hij al clubleider van een sportclub geworden.
- Monon oni metas en monujon.: Men stopt geld in een portemonnee.
- Sekvu la ekzemplon de la bonaj familianoj.: Volg het voorbeeld van de goede familieleden.
