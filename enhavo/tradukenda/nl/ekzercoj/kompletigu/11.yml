- La knabino ĵetis la paperon en la paperujon.: Het meisje gooide het papier in de prullenmand.
- Kie estas mia skribilo, mi volas respondi al li.: Waar is mijn pen? Ik wil hem antwoorden.
- La suno malaperis kaj nun estas preskaŭ malhele.: De zon is verdwenen en nu is het bijna donker.
- Bonvolu manĝi la panon per manĝilo.: Eet het brood alstublieft met eetgerei.
- Pardonu min, mi ne rajtas resti.: Vergeef me, ik mag niet blijven.
