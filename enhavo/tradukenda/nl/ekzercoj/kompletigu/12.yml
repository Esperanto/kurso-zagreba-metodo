- Antaŭ kvarona horo ili revenis.: Ze zijn een kwartier geleden teruggekomen.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Na het verschrikkelijke ongeluk gingen de mensen weg en vielen de oude steden uiteen.
- Ni devus revidi nin, mia amiko.: We zouden elkaar weer moeten zien, mijn vriend.
- Ju pli ofte mi pripensas, des pli mi koleras.: Hoe vaker ik erover nadenk, hoe bozer ik word.
- Ŝi loĝas en iu ajn domo.: Ze woont in elk huis.
