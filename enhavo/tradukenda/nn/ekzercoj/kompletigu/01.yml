- Marko estas en la ĉambro.: Marko er i rommet.
- Li sidas sur seĝo.: Han sit på ein stol.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Ein lærar underviser. Ein arbeider jobber. Ein elev lærar.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko og Aleksandro er studenter og idrettsutøvere.
- La patrino de Marko estas instruistino.: Markos mor er lærar.
- La seĝo estas en la ĉambro.: Stolen er i rommet.
- La libro estas de li, ĝi estas lia.: Boka høyrer til han; det er hans.
- Mia nomo estas Marko.: Eg heter Marko.
