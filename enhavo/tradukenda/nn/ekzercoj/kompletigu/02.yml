- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko har ein mannleg ven og ein kvinneleg ven. De er vener.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Han lager kaffi og dei drikk den heime hos oss.
- Ili iras al la hotelo.: De går til hotellet.
- Ŝi vidas, ke Marko amas ŝin.: Ho ser at Marko elsker henne.
- Ili havas facilajn lernolibrojn.: De har enkle lærebøker.
