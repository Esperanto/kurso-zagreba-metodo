- Mia amiko skribas multe.: Venen min skriv mykje.
- Bela kelnerino estas belulino.: Ein vakker servitør er ein vakker kvinne.
- Ni havas multajn belajn aferojn.: Vi har mange vakre ting.
- Ni kune lernas en lernejo.: Vi lærar saman på skolen.
- Miaj gepatroj manĝas en manĝejo.: Foreldrene mine et i ein spisestue.
- La kuko estas manĝebla.: Kaken er spiselig.
