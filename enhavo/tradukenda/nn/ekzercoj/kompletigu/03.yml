- Mia amiko skribas multe.: Venen min skriv mykje.
- Bela kelnerino estas belulino.: Ei vakker servitrise er ei vakker kvinne.
- Ni havas multajn belajn aferojn.: Vi har mange vakre ting.
- Ni kune lernas en lernejo.: Vi lærer saman på skulen.
- Miaj gepatroj manĝas en manĝejo.: Foreldra mine et i ei spisestove.
- La kuko estas manĝebla.: Kaken er spiselig.
