- Ana kaj Marko iris tra la strato.: Ana og Marko gjekk langs gaten.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: De kom til ein kafé, gjekk til eit bord og så faren sitte på ein stol.
- Ana metis tri kukojn sur seĝon.: Ana la tre kaker på ein stol.
- Ŝi remetis poste la kukojn sur la tablon.: Ho satte senere kakene tilbake på bordet.
