- Dankon, sinjoro. Nedankinde.: Takk, herre. Ingenting å takke for.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Ein time er kort, ein dag er lengre, ein månad er lengst.
- Mi legas pli multajn librojn ol mia amiko.: Eg les fleire bøker enn venen min.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Eg sende lange brev til venen min medan han var i Tokyo.
- La libro estas leginda.: Boka er verd å lese.
