- Dankon, sinjoro. Nedankinde.: Takk, sir. Du er velkommen.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Ein time er kort, ein dag er lengre, ein måned er lengst.
- Mi legas pli multajn librojn ol mia amiko.: Eg les fleire bøker enn venen min.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Eg sendte lange brev til venen min medan han var i Tokyo.
- La libro estas leginda.: Boka er verdt å lese.
