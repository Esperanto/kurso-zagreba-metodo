- La gepatroj ĉiam deziras, ke mi lernu multon.: Foreldre ønskjer alltid at eg lærer mykje.
- Mia amiko deziras, ke mi iru kanti kun li.: Venen min ønskjer at eg skal syngje med han.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Faren vil at barnet hans skal spise kaken som står på bordet.
- Ni loĝas en malgranda ĉambro.: Vi bor i eit lite rom.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Eg blei uroleg da eg så deg.
- Ĉiuj rimarkis, ke ŝi estas belega.: Alle la merke til at ho er veldig vakker.
