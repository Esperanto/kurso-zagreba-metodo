- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Han drakk morgondrikken svært raskt for å kome tidleg til skulen.
- Mi ankoraŭ ne aŭdis novaĵon.: Eg har ennå ikkje høyrt nokre nyheiter.
- En tiu momento Marko ekkriis.: I det øyeblikket ropte Marko.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Ein gut som ikkje elsker andre gutter og jenter har verken mannlege vener eller kvinnelege vener.
