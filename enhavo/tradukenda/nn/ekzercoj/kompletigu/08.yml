- Ni ordigis ĉion kaj transdonis al ili.: Vi satte alt i stand og overleverte det til dem.
- Mi petas glason da kafo kaj iom da akvo.: Eg ber om eit glass kaffi og litt vatn.
- Doloris lin la kapo. Li malsaniĝis.: Han fekk vondt i hovudet. Han vart sjuk.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Jenta likar å vere vakker, og derfor pyntar ho andletet sitt.
