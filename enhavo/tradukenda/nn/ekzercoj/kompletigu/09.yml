- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Viss eg hadde like mykje penger som ideer, ville eg reist verden rundt.
- En ĉiu vortaro mankas kelkaj vortoj.: I kvar ordbok mangler nokre ord.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ein person som fortsetter å fortelle historier i lang tid ved spisebordet, vil forbli sulten.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Han måtte ta hensyn og fikk ikkje vere ute lenge i regnet. Derfor blei han forkjølet.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Han har sin klare idé, men han vil tro på alt du seier, som om du var hans kone.
