- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Viss eg hadde like mykje pengar som idear, ville eg reist verda rundt.
- En ĉiu vortaro mankas kelkaj vortoj.: I kvar ordbok manglar nokre ord.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ein person som held fram med å fortelje historier lenge ved matbordet, vil framleis vere svolten.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Han måtte passe på og fekk ikkje vere ute lenge i regnet. Derfor blei han forkjøla.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Han har sin klare idé, men han vil tro på alt du seier, som om du var hans kone.
