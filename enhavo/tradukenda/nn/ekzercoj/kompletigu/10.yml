- En juneco oni havas ankaŭ belecon.: I ungdom har ein også skjønnhet.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Sjefer bør forenkle kompliserte jobber.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: I den alderen var han allereie blitt klubbleiar i ein idrettsklubb.
- Monon oni metas en monujon.: Ein legg pengar i ein lommebok.
- Sekvu la ekzemplon de la bonaj familianoj.: Følg dømet til dei gode familiemedlemmene.
