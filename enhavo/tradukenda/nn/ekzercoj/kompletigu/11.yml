- La knabino ĵetis la paperon en la paperujon.: Jenta kastet papiret i papirkurven.
- Kie estas mia skribilo, mi volas respondi al li.: Kor er pennen min? Eg vil svare han.
- La suno malaperis kaj nun estas preskaŭ malhele.: Sola forsvann og no er det nesten mørkt.
- Bonvolu manĝi la panon per manĝilo.: Vennligst spis brødet med eit spiseredskap.
- Pardonu min, mi ne rajtas resti.: Tilgi meg, eg har ikkje lov til å bli.
