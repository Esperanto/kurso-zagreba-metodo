- Antaŭ kvarona horo ili revenis.: De kom tilbake for eit kvarter siden.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Etter den forferdelige ulykken dro folket bort og dei gamle byane falt frå kvarandre.
- Ni devus revidi nin, mia amiko.: Vi burde sjå kvarandre igjen, min ven.
- Ju pli ofte mi pripensas, des pli mi koleras.: Jo oftere eg tenker på det, jo sintere blir eg.
- Ŝi loĝas en iu ajn domo.: Ho bor i kva for nokret som helst hus.
