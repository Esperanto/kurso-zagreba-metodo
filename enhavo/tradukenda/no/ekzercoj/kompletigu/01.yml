- Marko estas en la ĉambro.: Marko er i rommet.
- Li sidas sur seĝo.: Han sitter på en stol.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: En lærer underviser. En arbeider jobber. En elev lærer.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko og Aleksandro er studenter og idrettsutøvere.
- La patrino de Marko estas instruistino.: Markos mor er lærer.
- La seĝo estas en la ĉambro.: Stolen er i rommet.
- La libro estas de li, ĝi estas lia.: Boken tilhører ham; det er hans.
- Mia nomo estas Marko.: Jeg heter Marko.
