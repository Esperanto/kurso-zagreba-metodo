- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko har en mannlig venn og en kvinnelig venn. De er venner.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Han lager kaffe og de drikker den hjemme hos oss.
- Ili iras al la hotelo.: De går til hotellet.
- Ŝi vidas, ke Marko amas ŝin.: Hun ser at Marko elsker henne.
- Ili havas facilajn lernolibrojn.: De har enkle lærebøker.
