- Mia amiko skribas multe.: Vennen min skriver mye.
- Bela kelnerino estas belulino.: En vakker servitør er en vakker kvinne.
- Ni havas multajn belajn aferojn.: Vi har mange vakre ting.
- Ni kune lernas en lernejo.: Vi lærer sammen på skolen.
- Miaj gepatroj manĝas en manĝejo.: Foreldrene mine spiser i en spisestue.
- La kuko estas manĝebla.: Kaken er spiselig.
