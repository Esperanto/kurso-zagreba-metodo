- Ana kaj Marko iris tra la strato.: Ana og Marko gikk langs gaten.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: De kom til en kafé, gikk til et bord og så faren sitte på en stol.
- Ana metis tri kukojn sur seĝon.: Ana la tre kaker på en stol.
- Ŝi remetis poste la kukojn sur la tablon.: Hun satte senere kakene tilbake på bordet.
