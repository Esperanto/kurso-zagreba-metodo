- Dankon, sinjoro. Nedankinde.: Takk, sir. Du er velkommen.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: En time er kort, en dag er lengre, en måned er lengst.
- Mi legas pli multajn librojn ol mia amiko.: Jeg leser flere bøker enn vennen min.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Jeg sendte lange brev til vennen min mens han var i Tokyo.
- La libro estas leginda.: Boken er verdt å lese.
