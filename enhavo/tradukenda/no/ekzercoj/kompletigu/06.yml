- La gepatroj ĉiam deziras, ke mi lernu multon.: Foreldre ønsker alltid at jeg lærer mye.
- Mia amiko deziras, ke mi iru kanti kun li.: Vennen min ønsker at jeg skal synge med ham.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Faren vil at barnet hans skal spise kaken som står på bordet.
- Ni loĝas en malgranda ĉambro.: Vi bor i et lite rom.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Jeg ble urolig da jeg så deg.
- Ĉiuj rimarkis, ke ŝi estas belega.: Alle la merke til at hun er veldig vakker.
