- Ni ordigis ĉion kaj transdonis al ili.: Vi satte alt i stand og overleverte det til dem.
- Mi petas glason da kafo kaj iom da akvo.: Jeg ber om et glass kaffe og litt vann.
- Doloris lin la kapo. Li malsaniĝis.: Hodet hans gjorde vondt. Han ble syk.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Jenta liker å være vakker, og av den grunn forskjønner hun ansiktet sitt.
