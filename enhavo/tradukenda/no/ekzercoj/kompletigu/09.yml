- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Hvis jeg hadde like mye penger som ideer, ville jeg reist verden rundt.
- En ĉiu vortaro mankas kelkaj vortoj.: I hver ordbok mangler noen ord.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: En person som fortsetter å fortelle historier i lang tid ved spisebordet, vil forbli sulten.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Han måtte ta hensyn og fikk ikke være ute lenge i regnet. Derfor ble han forkjølet.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Han har sin klare idé, men han vil tro på alt du sier, som om du var hans kone.
