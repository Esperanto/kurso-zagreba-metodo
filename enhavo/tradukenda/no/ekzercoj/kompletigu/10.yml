- En juneco oni havas ankaŭ belecon.: I ungdom har man også skjønnhet.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Sjefer bør forenkle kompliserte jobber.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: I den alderen var han allerede blitt klubbleder i en idrettsklubb.
- Monon oni metas en monujon.: Man legger penger i en lommebok.
- Sekvu la ekzemplon de la bonaj familianoj.: Følg eksemplet til de gode familiemedlemmene.
