- La knabino ĵetis la paperon en la paperujon.: Jenta kastet papiret i papirkurven.
- Kie estas mia skribilo, mi volas respondi al li.: Hvor er pennen min? Jeg vil svare ham.
- La suno malaperis kaj nun estas preskaŭ malhele.: Solen forsvant, og nå er det nesten mørkt.
- Bonvolu manĝi la panon per manĝilo.: Vennligst spis brødet med et spiseredskap.
- Pardonu min, mi ne rajtas resti.: Tilgi meg, jeg har ikke lov til å bli.
