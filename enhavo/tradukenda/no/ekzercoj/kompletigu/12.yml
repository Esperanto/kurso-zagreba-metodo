- Antaŭ kvarona horo ili revenis.: De kom tilbake for et kvarter siden.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Etter den forferdelige ulykken dro folket bort og de gamle byene falt fra hverandre.
- Ni devus revidi nin, mia amiko.: Vi burde se hverandre igjen, min venn.
- Ju pli ofte mi pripensas, des pli mi koleras.: Jo oftere jeg tenker på det, jo sintere blir jeg.
- Ŝi loĝas en iu ajn domo.: Hun bor i hvilket som helst hus.
