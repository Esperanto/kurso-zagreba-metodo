- Marko estas en la ĉambro.: ਮਾਰਕੋ ਕਮਰੇ ਵਿੱਚ ਹੈ।
- Li sidas sur seĝo.: ਉਹ ਕੁਰਸੀ 'ਤੇ ਬੈਠਦਾ ਹੈ।
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: ਇੱਕ ਅਧਿਆਪਕ ਪੜ੍ਹਾਉਂਦਾ ਹੈ। ਇੱਕ ਵਰਕਰ ਕੰਮ ਕਰਦਾ ਹੈ। ਇੱਕ ਵਿਦਿਆਰਥੀ ਸਿੱਖਦਾ ਹੈ।
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: ਮਾਰਕੋ ਅਤੇ ਅਲੈਗਜ਼ੈਂਡਰੋ ਵਿਦਿਆਰਥੀ ਅਤੇ ਐਥਲੀਟ ਹਨ।
- La patrino de Marko estas instruistino.: ਮਾਰਕੋ ਦੀ ਮਾਂ ਅਧਿਆਪਕਾ ਹੈ।
- La seĝo estas en la ĉambro.: ਕੁਰਸੀ ਕਮਰੇ ਵਿੱਚ ਹੈ।
- La libro estas de li, ĝi estas lia.: ਕਿਤਾਬ ਉਸ ਦੀ ਹੈ; ਇਹ ਉਸਦਾ ਹੈ।
- Mia nomo estas Marko.: ਮੇਰਾ ਨਾਮ ਮਾਰਕੋ ਹੈ।
