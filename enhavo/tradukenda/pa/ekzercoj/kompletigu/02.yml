- Marko havas amikon kaj amikinon. Ili estas geamikoj.: ਮਾਰਕੋ ਦਾ ਇੱਕ ਪੁਰਸ਼ ਦੋਸਤ ਅਤੇ ਇੱਕ ਔਰਤ ਦੋਸਤ ਹੈ। ਉਹ ਦੋਸਤ ਹਨ।
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: ਉਹ ਕੌਫੀ ਬਣਾਉਂਦਾ ਹੈ ਅਤੇ ਉਹ ਇਸਨੂੰ ਸਾਡੇ ਘਰ ਪੀਂਦਾ ਹੈ।
- Ili iras al la hotelo.: ਉਹ ਹੋਟਲ ਜਾਂਦੇ ਹਨ।
- Ŝi vidas, ke Marko amas ŝin.: ਉਹ ਦੇਖਦੀ ਹੈ ਕਿ ਮਾਰਕੋ ਉਸ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ।
- Ili havas facilajn lernolibrojn.: ਉਨ੍ਹਾਂ ਕੋਲ ਆਸਾਨ ਪਾਠ ਪੁਸਤਕਾਂ ਹਨ।
