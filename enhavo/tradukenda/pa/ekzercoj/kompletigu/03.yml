- Mia amiko skribas multe.: ਮੇਰਾ ਦੋਸਤ ਬਹੁਤ ਲਿਖਦਾ ਹੈ।
- Bela kelnerino estas belulino.: ਇੱਕ ਸੁੰਦਰ ਵੇਟਰੈਸ ਇੱਕ ਸੁੰਦਰ ਔਰਤ ਹੈ.
- Ni havas multajn belajn aferojn.: ਸਾਡੇ ਕੋਲ ਬਹੁਤ ਸਾਰੀਆਂ ਸੁੰਦਰ ਚੀਜ਼ਾਂ ਹਨ.
- Ni kune lernas en lernejo.: ਅਸੀਂ ਸਕੂਲ ਵਿੱਚ ਇਕੱਠੇ ਸਿੱਖਦੇ ਹਾਂ।
- Miaj gepatroj manĝas en manĝejo.: ਮੇਰੇ ਮਾਪੇ ਇੱਕ ਡਾਇਨਿੰਗ ਰੂਮ ਵਿੱਚ ਖਾਂਦੇ ਹਨ।
- La kuko estas manĝebla.: ਕੇਕ ਖਾਣ ਯੋਗ ਹੈ।
