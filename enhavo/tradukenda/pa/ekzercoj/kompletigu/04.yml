- Ana kaj Marko iris tra la strato.: ਐਨਾ ਅਤੇ ਮਾਰਕੋ ਗਲੀ ਦੇ ਨਾਲ-ਨਾਲ ਚਲੇ ਗਏ।
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: ਉਹ ਇੱਕ ਕੈਫੇ ਵਿੱਚ ਆਏ, ਇੱਕ ਮੇਜ਼ ਤੇ ਗਏ, ਅਤੇ ਪਿਤਾ ਨੂੰ ਕੁਰਸੀ ਤੇ ਬੈਠੇ ਦੇਖਿਆ।
- Ana metis tri kukojn sur seĝon.: ਐਨਾ ਨੇ ਕੁਰਸੀ 'ਤੇ ਤਿੰਨ ਕੇਕ ਰੱਖੇ।
- Ŝi remetis poste la kukojn sur la tablon.: ਉਸਨੇ ਬਾਅਦ ਵਿੱਚ ਕੇਕ ਨੂੰ ਮੇਜ਼ ਉੱਤੇ ਵਾਪਸ ਰੱਖ ਦਿੱਤਾ।
