- Dankon, sinjoro. Nedankinde.: ਧੰਨਵਾਦ, ਸਰ. ਤੁਹਾਡਾ ਸਵਾਗਤ ਹੈ.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: ਇੱਕ ਘੰਟਾ ਛੋਟਾ ਹੈ, ਇੱਕ ਦਿਨ ਲੰਬਾ ਹੈ, ਇੱਕ ਮਹੀਨਾ ਸਭ ਤੋਂ ਲੰਬਾ ਹੈ।
- Mi legas pli multajn librojn ol mia amiko.: ਮੈਂ ਆਪਣੇ ਦੋਸਤ ਨਾਲੋਂ ਵੱਧ ਕਿਤਾਬਾਂ ਪੜ੍ਹਦਾ ਹਾਂ।
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: ਮੈਂ ਆਪਣੇ ਦੋਸਤ ਨੂੰ ਲੰਬੇ ਪੱਤਰ ਭੇਜੇ ਜਦੋਂ ਉਹ ਟੋਕੀਓ ਵਿੱਚ ਸੀ।
- La libro estas leginda.: ਪੁਸਤਕ ਪੜ੍ਹਨ ਯੋਗ ਹੈ।
