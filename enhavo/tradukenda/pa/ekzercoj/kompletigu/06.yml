- La gepatroj ĉiam deziras, ke mi lernu multon.: ਮਾਪੇ ਹਮੇਸ਼ਾ ਚਾਹੁੰਦੇ ਹਨ ਕਿ ਮੈਂ ਬਹੁਤ ਕੁਝ ਸਿੱਖੇ।
- Mia amiko deziras, ke mi iru kanti kun li.: ਮੇਰਾ ਦੋਸਤ ਚਾਹੁੰਦਾ ਹੈ ਕਿ ਮੈਂ ਉਸ ਨਾਲ ਗਾਉਣ ਜਾਵਾਂ।
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: ਪਿਤਾ ਚਾਹੁੰਦਾ ਹੈ ਕਿ ਉਸਦਾ ਬੱਚਾ ਮੇਜ਼ 'ਤੇ ਪਿਆ ਕੇਕ ਖਾਵੇ।
- Ni loĝas en malgranda ĉambro.: ਅਸੀਂ ਇੱਕ ਛੋਟੇ ਜਿਹੇ ਕਮਰੇ ਵਿੱਚ ਰਹਿੰਦੇ ਹਾਂ।
- Mi fariĝis maltrankvila, kiam mi vidis vin.: ਤੈਨੂੰ ਦੇਖ ਕੇ ਮੈਂ ਬੇਚੈਨ ਹੋ ਗਿਆ।
- Ĉiuj rimarkis, ke ŝi estas belega.: ਸਾਰਿਆਂ ਨੇ ਦੇਖਿਆ ਕਿ ਉਹ ਬਹੁਤ ਖੂਬਸੂਰਤ ਹੈ।
