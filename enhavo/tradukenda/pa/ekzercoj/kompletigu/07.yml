- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: ਸਕੂਲ ਜਲਦੀ ਆਉਣ ਲਈ ਉਸਨੇ ਸਵੇਰ ਦਾ ਡਰਿੰਕ ਬਹੁਤ ਜਲਦੀ ਪੀ ਲਿਆ।
- Mi ankoraŭ ne aŭdis novaĵon.: ਮੈਂ ਅਜੇ ਤੱਕ ਕੋਈ ਖ਼ਬਰ ਨਹੀਂ ਸੁਣੀ।
- En tiu momento Marko ekkriis.: ਉਸੇ ਪਲ ਮਾਰਕੋ ਚੀਕਿਆ.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: ਇੱਕ ਲੜਕਾ ਜੋ ਦੂਜੇ ਮੁੰਡਿਆਂ ਅਤੇ ਕੁੜੀਆਂ ਨੂੰ ਪਿਆਰ ਨਹੀਂ ਕਰਦਾ ਉਸ ਦੇ ਨਾ ਤਾਂ ਮਰਦ ਦੋਸਤ ਹਨ ਅਤੇ ਨਾ ਹੀ ਇਸਤਰੀ ਦੋਸਤ ਹਨ।
