- Ni ordigis ĉion kaj transdonis al ili.: ਅਸੀਂ ਸਭ ਕੁਝ ਵਿਵਸਥਿਤ ਕਰ ਕੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸੌਂਪ ਦਿੱਤਾ।
- Mi petas glason da kafo kaj iom da akvo.: ਮੈਂ ਇੱਕ ਗਲਾਸ ਕੌਫੀ ਅਤੇ ਕੁਝ ਪਾਣੀ ਮੰਗਦਾ ਹਾਂ।
- Doloris lin la kapo. Li malsaniĝis.: ਉਸਦੇ ਸਿਰ ਵਿੱਚ ਸੱਟ ਲੱਗੀ। ਉਹ ਬੀਮਾਰ ਹੋ ਗਿਆ।
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: ਲੜਕੀ ਨੂੰ ਸੁੰਦਰ ਹੋਣਾ ਪਸੰਦ ਹੈ, ਅਤੇ ਇਸ ਕਾਰਨ ਉਹ ਆਪਣੇ ਚਿਹਰੇ ਨੂੰ ਸੁੰਦਰ ਬਣਾਉਂਦੀ ਹੈ.
