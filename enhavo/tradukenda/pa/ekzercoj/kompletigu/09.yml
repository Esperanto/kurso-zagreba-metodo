- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: ਜੇ ਮੇਰੇ ਕੋਲ ਵਿਚਾਰਾਂ ਜਿੰਨਾ ਪੈਸਾ ਹੁੰਦਾ, ਤਾਂ ਮੈਂ ਦੁਨੀਆ ਭਰ ਦੀ ਯਾਤਰਾ ਕਰਾਂਗਾ.
- En ĉiu vortaro mankas kelkaj vortoj.: ਹਰ ਡਿਕਸ਼ਨਰੀ ਵਿਚ ਕੁਝ ਸ਼ਬਦ ਗਾਇਬ ਹਨ।
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: ਜੋ ਵਿਅਕਤੀ ਖਾਣੇ ਦੀ ਮੇਜ਼ 'ਤੇ ਲੰਬੇ ਸਮੇਂ ਤੱਕ ਕਹਾਣੀਆਂ ਸੁਣਾਉਂਦਾ ਰਹਿੰਦਾ ਹੈ, ਉਹ ਭੁੱਖਾ ਰਹੇਗਾ।
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: ਉਸ ਨੂੰ ਧਿਆਨ ਦੇਣਾ ਪਿਆ ਅਤੇ ਬਾਰਿਸ਼ ਵਿੱਚ ਜ਼ਿਆਦਾ ਦੇਰ ਬਾਹਰ ਨਹੀਂ ਰਹਿਣ ਦਿੱਤਾ ਗਿਆ। ਇਸ ਲਈ ਉਸ ਨੂੰ ਜ਼ੁਕਾਮ ਹੋ ਗਿਆ।
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: ਉਸਦਾ ਸਪਸ਼ਟ ਵਿਚਾਰ ਹੈ, ਪਰ ਉਹ ਤੁਹਾਡੀ ਹਰ ਗੱਲ ਤੇ ਵਿਸ਼ਵਾਸ ਕਰੇਗਾ, ਜਿਵੇਂ ਕਿ ਤੁਸੀਂ ਉਸਦੀ ਪਤਨੀ ਹੋ।
