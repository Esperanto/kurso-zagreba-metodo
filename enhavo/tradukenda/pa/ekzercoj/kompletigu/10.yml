- En juneco oni havas ankaŭ belecon.: ਜਵਾਨੀ ਵਿੱਚ ਵੀ ਸੁੰਦਰਤਾ ਹੁੰਦੀ ਹੈ।
- Malsimplajn laborojn ĉefoj devus plisimpligi.: ਬੌਸ ਨੂੰ ਗੁੰਝਲਦਾਰ ਨੌਕਰੀਆਂ ਨੂੰ ਸਰਲ ਬਣਾਉਣਾ ਚਾਹੀਦਾ ਹੈ।
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: ਉਸ ਉਮਰ ਵਿੱਚ ਉਹ ਪਹਿਲਾਂ ਹੀ ਇੱਕ ਸਪੋਰਟਸ ਕਲੱਬ ਦਾ ਕਲੱਬ ਲੀਡਰ ਬਣ ਚੁੱਕਾ ਸੀ।
- Monon oni metas en monujon.: ਇੱਕ ਬਟੂਏ ਵਿੱਚ ਪੈਸੇ ਪਾਉਂਦਾ ਹੈ।
- Sekvu la ekzemplon de la bonaj familianoj.: ਚੰਗੇ ਪਰਿਵਾਰ ਦੇ ਮੈਂਬਰਾਂ ਦੀ ਮਿਸਾਲ ਉੱਤੇ ਚੱਲੋ।
