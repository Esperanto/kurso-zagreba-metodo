- La knabino ĵetis la paperon en la paperujon.: ਕੁੜੀ ਨੇ ਕਾਗਜ਼ ਵੇਸਟ ਪੇਪਰ ਦੀ ਟੋਕਰੀ ਵਿੱਚ ਸੁੱਟ ਦਿੱਤਾ।
- Kie estas mia skribilo, mi volas respondi al li.: ਮੇਰੀ ਕਲਮ ਕਿੱਥੇ ਹੈ? ਮੈਂ ਉਸਨੂੰ ਜਵਾਬ ਦੇਣਾ ਚਾਹੁੰਦਾ ਹਾਂ।
- La suno malaperis kaj nun estas preskaŭ malhele.: ਸੂਰਜ ਅਲੋਪ ਹੋ ਗਿਆ ਹੈ ਅਤੇ ਹੁਣ ਲਗਭਗ ਹਨੇਰਾ ਹੈ.
- Bonvolu manĝi la panon per manĝilo.: ਕਿਰਪਾ ਕਰਕੇ ਰੋਟੀ ਖਾਣ ਦੇ ਬਰਤਨ ਨਾਲ ਖਾਓ।
- Pardonu min, mi ne rajtas resti.: ਮੈਨੂੰ ਮਾਫ਼ ਕਰ, ਮੈਨੂੰ ਰਹਿਣ ਦੀ ਇਜਾਜ਼ਤ ਨਹੀਂ ਹੈ।
