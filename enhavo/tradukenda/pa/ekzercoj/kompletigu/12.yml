- Antaŭ kvarona horo ili revenis.: ਉਹ ਡੇਢ ਘੰਟਾ ਪਹਿਲਾਂ ਵਾਪਸ ਆਏ ਸਨ।
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ਭਿਆਨਕ ਬਦਕਿਸਮਤੀ ਤੋਂ ਬਾਅਦ, ਲੋਕ ਚਲੇ ਗਏ ਅਤੇ ਪੁਰਾਣੇ ਸ਼ਹਿਰ ਟੁੱਟ ਗਏ.
- Ni devus revidi nin, mia amiko.: ਸਾਨੂੰ ਇੱਕ ਦੂਜੇ ਨੂੰ ਦੁਬਾਰਾ ਮਿਲਣਾ ਚਾਹੀਦਾ ਹੈ, ਮੇਰੇ ਦੋਸਤ.
- Ju pli ofte mi pripensas, des pli mi koleras.: ਜਿੰਨੀ ਵਾਰ ਮੈਂ ਇਸ ਬਾਰੇ ਸੋਚਦਾ ਹਾਂ, ਮੈਂ ਉਨਾ ਹੀ ਗੁੱਸੇ ਹੋ ਜਾਂਦਾ ਹਾਂ।
- Ŝi loĝas en iu ajn domo.: ਉਹ ਕਿਸੇ ਵੀ ਘਰ ਵਿੱਚ ਰਹਿੰਦੀ ਹੈ।
