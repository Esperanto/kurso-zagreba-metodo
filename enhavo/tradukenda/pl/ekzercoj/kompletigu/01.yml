- Marko estas en la ĉambro.: Marko jest w pokoju.
- Li sidas sur seĝo.: Siedzi na krześle.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Nauczyciel uczy. Pracownik pracuje. Uczeń uczy się.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko i Aleksandro są studentami i sportowcami.
- La patrino de Marko estas instruistino.: Matka Marko jest nauczycielką.
- La seĝo estas en la ĉambro.: Krzesło jest w pokoju.
- La libro estas de li, ĝi estas lia.: Książka należy do niego; to jest jego.
- Mia nomo estas Marko.: Nazywam się Marko.
