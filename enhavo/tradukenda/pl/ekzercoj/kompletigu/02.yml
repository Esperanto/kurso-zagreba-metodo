- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ma przyjaciela i przyjaciółkę. Są przyjaciółmi.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Robi kawę i piją ją u nas w domu.
- Ili iras al la hotelo.: Idą do hotelu.
- Ŝi vidas, ke Marko amas ŝin.: Widzi, że Marko ją kocha.
- Ili havas facilajn lernolibrojn.: Mają łatwe podręczniki.
