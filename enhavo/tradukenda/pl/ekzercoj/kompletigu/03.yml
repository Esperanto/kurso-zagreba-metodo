- Mia amiko skribas multe.: Mój przyjaciel dużo pisze.
- Bela kelnerino estas belulino.: Piękna kelnerka to piękna kobieta.
- Ni havas multajn belajn aferojn.: Mamy wiele pięknych rzeczy.
- Ni kune lernas en lernejo.: Uczymy się razem w szkole.
- Miaj gepatroj manĝas en manĝejo.: Moi rodzice jedzą w jadalni.
- La kuko estas manĝebla.: Ciasto jest jadalne.
