- Ana kaj Marko iris tra la strato.: Ana i Marko poszli ulicą.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Przyszli do kawiarni, podeszli do stołu i zobaczyli ojca siedzącego na krześle.
- Ana metis tri kukojn sur seĝon.: Ana położyła trzy ciasta na krześle.
- Ŝi remetis poste la kukojn sur la tablon.: Później odłożyła ciasta z powrotem na stół.
