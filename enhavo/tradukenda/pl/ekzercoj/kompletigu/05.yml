- Dankon, sinjoro. Nedankinde.: Dziękuję, proszę pana. Nie ma za co.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Godzina jest krótka, dzień dłuższy, miesiąc najdłuższy.
- Mi legas pli multajn librojn ol mia amiko.: Czytam więcej książek niż mój przyjaciel.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Wysyłałem długie listy do mojego przyjaciela, kiedy był w Tokio.
- La libro estas leginda.: Książka jest warta przeczytania.
