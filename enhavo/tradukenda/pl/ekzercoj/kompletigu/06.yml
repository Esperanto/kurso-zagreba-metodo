- La gepatroj ĉiam deziras, ke mi lernu multon.: Rodzice zawsze życzą sobie, żebym się dużo nauczył.
- Mia amiko deziras, ke mi iru kanti kun li.: Mój przyjaciel życzy sobie, żebym z nim zaśpiewała.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Ojciec chce, żeby jego dziecko zjadło ciasto, które leży na stole.
- Ni loĝas en malgranda ĉambro.: Mieszkamy w małym pokoju.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Poczułem się nieswojo, kiedy cię zobaczyłem.
- Ĉiuj rimarkis, ke ŝi estas belega.: Wszyscy zauważyli, że jest bardzo piękna.
