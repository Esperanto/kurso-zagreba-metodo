- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Bardzo szybko wypił swój poranny drink, aby wcześniej przyjść do szkoły.
- Mi ankoraŭ ne aŭdis novaĵon.: Nie słyszałem jeszcze żadnych wieści.
- En tiu momento Marko ekkriis.: W tym momencie Marko krzyknął.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Chłopiec, który nie kocha innych chłopców i dziewcząt, nie ma ani przyjaciół płci męskiej, ani żeńskiej.
