- Ni ordigis ĉion kaj transdonis al ili.: Wszystko uporządkowaliśmy i przekazaliśmy im.
- Mi petas glason da kafo kaj iom da akvo.: Proszę o szklankę kawy i trochę wody.
- Doloris lin la kapo. Li malsaniĝis.: Bolała go głowa. Zachorował.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Dziewczyna lubi być piękna, dlatego upiększa swoją twarz.
