- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Gdybym miał tyle pieniędzy, co pomysłów, podróżowałbym po całym świecie.
- En ĉiu vortaro mankas kelkaj vortoj.: W każdym słowniku brakuje jakiegoś słowa.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Osoba, która przy stole długo opowiada historie, pozostanie głodna.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Musiał uważać i nie wolno mu było długo przebywać na zewnątrz podczas deszczu. Dlatego się przeziębił.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ma jasne pojęcie, ale uwierzy we wszystko, co powiesz, jakbyś była jego żoną.
