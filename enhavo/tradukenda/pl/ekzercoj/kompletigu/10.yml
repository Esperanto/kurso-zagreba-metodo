- En juneco oni havas ankaŭ belecon.: W młodości też jest piękno.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Szefowie powinni upraszczać skomplikowane zadania.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: W tym wieku był już liderem klubu sportowego.
- Monon oni metas en monujon.: Jeden wkłada pieniądze do portfela.
- Sekvu la ekzemplon de la bonaj familianoj.: Naśladuj przykład dobrych członków rodziny.
