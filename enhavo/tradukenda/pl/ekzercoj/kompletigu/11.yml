- La knabino ĵetis la paperon en la paperujon.: Dziewczyna wrzuciła gazetę do kosza na śmieci.
- Kie estas mia skribilo, mi volas respondi al li.: Gdzie jest mój długopis? Chcę mu odpowiedzieć.
- La suno malaperis kaj nun estas preskaŭ malhele.: Słońce zniknęło i jest już prawie ciemno.
- Bonvolu manĝi la panon per manĝilo.: Prosimy o spożywanie chleba za pomocą naczynia do jedzenia.
- Pardonu min, mi ne rajtas resti.: Wybacz mi, nie wolno mi zostać.
