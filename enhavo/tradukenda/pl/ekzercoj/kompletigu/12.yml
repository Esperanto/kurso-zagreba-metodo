- Antaŭ kvarona horo ili revenis.: Wrócili kwadrans temu.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Po strasznym nieszczęściu ludzie odeszli, a stare miasta rozpadły się.
- Ni devus revidi nin, mia amiko.: Powinniśmy się znowu spotkać, przyjacielu.
- Ju pli ofte mi pripensas, des pli mi koleras.: Im częściej o tym myślę, tym bardziej jestem zły.
- Ŝi loĝas en iu ajn domo.: Mieszka w każdym domu.
