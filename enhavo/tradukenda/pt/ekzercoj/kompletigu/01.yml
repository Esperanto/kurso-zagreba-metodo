- Marko estas en la ĉambro.: O Marko está na sala.
- Li sidas sur seĝo.: Ele senta-se numa cadeira.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Um professor ensina. Um trabalhador trabalha. Um estudante aprende.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko e Aleksandro são estudantes e atletas.
- La patrino de Marko estas instruistino.: A mãe do Marko é professora.
- La seĝo estas en la ĉambro.: A cadeira está na sala.
- La libro estas de li, ĝi estas lia.: O livro pertence-lhe; é dele.
- Mia nomo estas Marko.: O meu nome é Marko.
