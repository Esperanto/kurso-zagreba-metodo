- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko tem um amigo e uma amiga. Eles são amigos.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ele faz café e eles bebem-no em nossa casa.
- Ili iras al la hotelo.: Eles vão para o hotel.
- Ŝi vidas, ke Marko amas ŝin.: Ela vê que o Marko a ama.
- Ili havas facilajn lernolibrojn.: Eles têm livros didáticos fáceis.
