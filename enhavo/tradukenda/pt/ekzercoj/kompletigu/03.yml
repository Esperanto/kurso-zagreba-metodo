- Mia amiko skribas multe.: O meu amigo escreve muito.
- Bela kelnerino estas belulino.: Uma bela empregada é uma mulher bonita.
- Ni havas multajn belajn aferojn.: Temos muitas coisas bonitas.
- Ni kune lernas en lernejo.: Aprendemos juntos na escola.
- Miaj gepatroj manĝas en manĝejo.: Os meus pais comem numa sala de jantar.
- La kuko estas manĝebla.: O bolo é comestível.
