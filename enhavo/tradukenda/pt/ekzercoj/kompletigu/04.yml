- Ana kaj Marko iris tra la strato.: Ana e o Marko foram pela rua.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Eles foram a um café, dirigiram-se a uma mesa e viram o pai sentado numa cadeira.
- Ana metis tri kukojn sur seĝon.: A Ana colocou três bolos numa cadeira.
- Ŝi remetis poste la kukojn sur la tablon.: Ela mais tarde colocou os bolos de volta na mesa.
