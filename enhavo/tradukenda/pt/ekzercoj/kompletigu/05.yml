- Dankon, sinjoro. Nedankinde.: Obrigado, senhor. De nada.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Uma hora é curta, um dia é mais longo, um mês é o mais longo.
- Mi legas pli multajn librojn ol mia amiko.: Eu leio mais livros do que o meu amigo.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Enviei longas cartas ao meu amigo enquanto ele estava em Tóquio.
- La libro estas leginda.: O livro vale a pena ser lido.
