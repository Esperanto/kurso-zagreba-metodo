- La gepatroj ĉiam deziras, ke mi lernu multon.: Os pais desejam sempre que eu aprenda muito.
- Mia amiko deziras, ke mi iru kanti kun li.: O meu amigo deseja que eu vá cantar com ele.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: O pai quer que o seu filho coma o bolo que está sobre a mesa.
- Ni loĝas en malgranda ĉambro.: Vivemos numa pequena sala.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Fiquei inquieto quando te vi.
- Ĉiuj rimarkis, ke ŝi estas belega.: Todos notaram que ela é muito bonita.
