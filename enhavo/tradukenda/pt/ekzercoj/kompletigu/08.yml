- Ni ordigis ĉion kaj transdonis al ili.: Colocámos tudo em ordem e entregámo-lo a eles.
- Mi petas glason da kafo kaj iom da akvo.: Peço um copo de café e um pouco de água.
- Doloris lin la kapo. Li malsaniĝis.: A cabeça dele doía. Ele ficou doente.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: A rapariga gosta de ser bonita, e por essa razão ela embeleza o seu rosto.
