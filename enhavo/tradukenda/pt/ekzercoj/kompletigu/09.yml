- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Se eu tivesse tanto dinheiro quanto ideias, eu viajaria pelo mundo.
- En ĉiu vortaro mankas kelkaj vortoj.: Em todos os dicionários, algumas palavras estão em falta.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Uma pessoa que continua a contar histórias durante muito tempo à mesa permanecerá com fome.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ele tinha de prestar atenção e não lhe era permitido ficar muito tempo lá fora na chuva. Portanto, ele apanhou um resfriado.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ele tem a sua ideia clara, mas acreditará em tudo o que disseres, como se fosses a sua esposa.
