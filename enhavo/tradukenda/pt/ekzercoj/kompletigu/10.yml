- En juneco oni havas ankaŭ belecon.: Na juventude também se tem beleza.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Os chefes devem simplificar trabalhos complicados.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Aos anos que tinha, ele já se tinha tornado o líder do clube de um clube desportivo.
- Monon oni metas en monujon.: Alguém põe dinheiro numa carteira.
- Sekvu la ekzemplon de la bonaj familianoj.: Segue o exemplo dos bons membros da família.
