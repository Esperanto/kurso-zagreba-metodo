- La knabino ĵetis la paperon en la paperujon.: A rapariga atirou o papel para o caixote do lixo de papel.
- Kie estas mia skribilo, mi volas respondi al li.: Onde está a minha caneta? Quero responder-lhe.
- La suno malaperis kaj nun estas preskaŭ malhele.: O sol desapareceu e agora está quase escuro.
- Bonvolu manĝi la panon per manĝilo.: Por favor, coma o pão com um talher.
- Pardonu min, mi ne rajtas resti.: Perdoa-me, não me é permitido ficar.
