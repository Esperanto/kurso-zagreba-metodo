- Antaŭ kvarona horo ili revenis.: Eles regressaram há um quarto de hora.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Após a terrível desgraça, as pessoas foram embora e as velhas cidades desmoronaram-se.
- Ni devus revidi nin, mia amiko.: Devíamos ver-nos novamente, meu amigo.
- Ju pli ofte mi pripensas, des pli mi koleras.: Quanto mais penso nisso, mais zangado fico.
- Ŝi loĝas en iu ajn domo.: Ela vive em qualquer casa.
