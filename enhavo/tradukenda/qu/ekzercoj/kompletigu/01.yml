- Marko estas en la ĉambro.: Markoqa chay cuartopin kashan.
- Li sidas sur seĝo.: Huk tiyanapi tiyaykun.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Huk yachachiqmi yachachin. Huk llamkaqmi llamkan. Huk yachakuqmi yachan.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Markowan Aleksandrowanqa yachakuqkunam, pukllaqkunapas.
- La patrino de Marko estas instruistino.: Marko maman yachachiqmi.
- La seĝo estas en la ĉambro.: Chay tiyanaqa cuartopin kashan.
- La libro estas de li, ĝi estas lia.: Chay libroqa paypaqmi; paypaqmi.
- Mia nomo estas Marko.: Ñoqaq sutiyqa Marko.
