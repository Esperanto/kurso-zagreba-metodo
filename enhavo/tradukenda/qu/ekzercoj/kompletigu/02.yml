- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Markoqa qari amiganmi, warmi amiganmi. Paykunaqa amigokunan kanku.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Payqa kukata ruran, wasiykupitaq ukyanku.
- Ili iras al la hotelo.: Paykunaqa hotelmanmi rinku.
- Ŝi vidas, ke Marko amas ŝin.: Payqa rikunmi Marko munakusqanta.
- Ili havas facilajn lernolibrojn.: Paykunaqa facil librokunayoqmi kanku.
