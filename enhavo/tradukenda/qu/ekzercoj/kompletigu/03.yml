- Mia amiko skribas multe.: Amigayqa achkatam qillqan.
- Bela kelnerino estas belulino.: Sumaq camareraqa sumaq warmim.
- Ni havas multajn belajn aferojn.: Askha sumaq imaymanayoqmi kanchis.
- Ni kune lernas en lernejo.: Yachay wasipi kuska yachanchik.
- Miaj gepatroj manĝas en manĝejo.: Tayta-mamaymi mikuna wasipi mikunku.
- La kuko estas manĝebla.: Chay tortaqa mikhuypaqmi.
