- Ana kaj Marko iris tra la strato.: Anawan Markowanmi calleninta rirqanku.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Huk cafeteriaman chayaspa, huk mesaman rispanku, taytata huk sillapi tiyachkaqta rikurqaku.
- Ana metis tri kukojn sur seĝon.: Ana kimsa tortata huk tiyanaman churarqa.
- Ŝi remetis poste la kukojn sur la tablon.: Qhepamanmi chay tortakunata mesaman kutichipurqan.
