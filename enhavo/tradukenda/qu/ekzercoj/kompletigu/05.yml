- Dankon, sinjoro. Nedankinde.: Gracias, wiraqocha. Imamanta.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Huk horaqa pisilla, huk p’unchaw aswan unay, huk killa aswan unay.
- Mi legas pli multajn librojn ol mia amiko.: Amigoymanta aswan achka librokunatam leeni.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Tokio llaqtapi kashaqtinmi amigoyman unay cartakunata apachirqani.
- La libro estas leginda.: Chay libroqa leenapaq hinan.
