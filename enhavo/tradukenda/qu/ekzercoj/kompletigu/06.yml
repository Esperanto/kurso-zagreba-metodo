- La gepatroj ĉiam deziras, ke mi lernu multon.: Tayta-mamakunaqa munankupunim achkata yachanaypaq.
- Mia amiko deziras, ke mi iru kanti kun li.: Amigoyqa munanmi paywan takiq rinaypaq.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Taytaqa munanmi wawan chay mesapi kaq tortata mikhunanta.
- Ni loĝas en malgranda ĉambro.: Huch’uy cuartollapin tiyayku.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Qanta rikuspaymi mana hawkachu tarikurqani.
- Ĉiuj rimarkis, ke ŝi estas belega.: Lliwmi repararqaku ancha sumaqllaña kasqanta.
