- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Yachay wasiman temprano hamunanpaqmi tutamanta upyananta ancha utqaylla upyaq.
- Mi ankoraŭ ne aŭdis novaĵon.: Manaraqmi ima willakuytapas uyarinichu.
- En tiu momento Marko ekkriis.: Chay ratopin Markoqa qaparirqan.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Huk qhari wawakunata, warmi wawakunata mana munakuq qhariqa manan qhari amigoyoqchu nitaq warmi amigoyoqchu.
