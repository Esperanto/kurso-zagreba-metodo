- Ni ordigis ĉion kaj transdonis al ili.: Tukuy imata ordenpi churaspaykutaq paykunaman entregarqayku.
- Mi petas glason da kafo kaj iom da akvo.: Huk vaso kukata, yakuta ima mañakuni.
- Doloris lin la kapo. Li malsaniĝis.: Umanpas nanarqa. Unqururqa.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Sipasmanqa gustanmi sumaq kay, chayraykum uyanta sumaqyachin.
