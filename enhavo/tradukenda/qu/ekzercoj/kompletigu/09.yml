- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Sichus yuyaykuna hina askha qolqey kanman chayqa, pachantinpin puriyman.
- En ĉiu vortaro mankas kelkaj vortoj.: Sapa diccionariopi wakin simikuna faltan.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Mikhuna wasipi unayta willakuq runaqa yarqasqallapunim kanqa.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Payqa allintan qhawarinan karqan, manataqmi parapi unaytachu hawapi qhepakunan karqan. Chayraykum chiriwan hapirurqa.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Payqa sut’i yuyaykuynintan hap’in, ichaqa tukuy rimasqaykitan creenqa, esposanpas kankiman hina.
