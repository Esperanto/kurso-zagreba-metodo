- En juneco oni havas ankaŭ belecon.: Wayna-sipas kayninpipas sumaq kayniyoqmi.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Jefekunaqa sasa llamkaykunatam pisiyachinanku.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Chay edadpiqa huk deporte clubpa club umalliqninñam karqa.
- Monon oni metas en monujon.: Hukninmi qullqita billeteraman churan.
- Sekvu la ekzemplon de la bonaj familianoj.: Allin ayllupi kaqkunapa ejemplonta qatikuy.
