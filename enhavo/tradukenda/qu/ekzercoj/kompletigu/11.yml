- La knabino ĵetis la paperon en la paperujon.: Chay sipasqa chay papelta basura papel canastaman wikch’uykusqa.
- Kie estas mia skribilo, mi volas respondi al li.: Maypitaq plumayqa kachkan? Payta kutichiyta munani.
- La suno malaperis kaj nun estas preskaŭ malhele.: Inti chinkaruptin kunanqa yaqa tutayarunña.
- Bonvolu manĝi la panon per manĝilo.: Ama hina kaspa, mikuna apaykachanawan t'antata mikhuy.
- Pardonu min, mi ne rajtas resti.: Pampachaykuway, manan qhepakunaychu.
