- Antaŭ kvarona horo ili revenis.: Paykunaqa huk cuarto hora ñawpaqtaraqmi kutimurqaku.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Chay manchay desgracia qhepamanmi runakunaqa ripurqanku, mawk’a llaqtakunataq thunipurqanku.
- Ni devus revidi nin, mia amiko.: Hukmantam tupanakunanchik, amistad.
- Ju pli ofte mi pripensas, des pli mi koleras.: Sapa kuti chaypi yuyaykusqayman hinan astawan phiñakuni.
- Ŝi loĝas en iu ajn domo.: Ima wasipipas tiyan.
