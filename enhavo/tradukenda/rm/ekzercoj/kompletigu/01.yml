- Marko estas en la ĉambro.: Marko è en la stanza.
- Li sidas sur seĝo.: El sesa sin ina sutga.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: In magister instruescha. In lavurant lavura. In scolar emprenda.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ed Aleksandro èn scolars e sportists.
- La patrino de Marko estas instruistino.: La mamma da Marko è magistra.
- La seĝo estas en la ĉambro.: La sutga è en la stanza.
- La libro estas de li, ĝi estas lia.: Il cudesch è dad el; el è ses.
- Mia nomo estas Marko.: Mes num è Marko.
