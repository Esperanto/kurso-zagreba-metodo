- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ha in ami ed ina amia. Els èn amis.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: El fa café ed els al baivan en nossa chasa.
- Ili iras al la hotelo.: Els van a l'hotel.
- Ŝi vidas, ke Marko amas ŝin.: Ella vesa che Marko l'ama.
- Ili havas facilajn lernolibrojn.: Els han cudeschs d'emprender simpels.
