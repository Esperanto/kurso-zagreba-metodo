- Mia amiko skribas multe.: Mes ami scriva bler.
- Bela kelnerino estas belulino.: Ina bella camariera è ina bella dunna.
- Ni havas multajn belajn aferojn.: Nus avain bleras bellas chaussas.
- Ni kune lernas en lernejo.: Nus emprendan ensemen en scola.
- Miaj gepatroj manĝas en manĝejo.: Mes geniturs mangian en ina sala da mangiar.
- La kuko estas manĝebla.: La turta è mangiabla.
