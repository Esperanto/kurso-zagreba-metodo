- Ana kaj Marko iris tra la strato.: Ana e Marko èn ids per la via.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Els èn vegnids tar in café, èn ids tar ina maisa ed han vis il bab seser sin ina sutga.
- Ana metis tri kukojn sur seĝon.: Ana ha mess trais turtas sin ina sutga.
- Ŝi remetis poste la kukojn sur la tablon.: Pli tard ha ella mess las turtas enavos sin la maisa.
