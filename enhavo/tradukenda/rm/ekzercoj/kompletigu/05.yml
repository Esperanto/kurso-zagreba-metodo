- Dankon, sinjoro. Nedankinde.: Grazia, signur. Anzi.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: In'ura è curta, in di è pli lung, in mais è il pli lung.
- Mi legas pli multajn librojn ol mia amiko.: Jau legel dapli cudeschs che mes ami.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Jau hai tramess lungas brevs a mes ami durant ch'el era a Tokio.
- La libro estas leginda.: Il cudesch vala la paina da vegnir legì.
