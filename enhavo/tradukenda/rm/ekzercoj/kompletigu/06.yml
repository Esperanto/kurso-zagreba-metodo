- La gepatroj ĉiam deziras, ke mi lernu multon.: Ils geniturs giavischan adina che jau emprendia bler.
- Mia amiko deziras, ke mi iru kanti kun li.: Mes ami giavischa che jau gia chantond cun el.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Il bab vul che ses uffant mangia la turta che è sin la maisa.
- Ni loĝas en malgranda ĉambro.: Nus abitain en ina pitschna stanza.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Jau sun vegnì inquiet cura che jau t'hai vis.
- Ĉiuj rimarkis, ke ŝi estas belega.: Tuts han remartgà ch'ella è fitg bella.
