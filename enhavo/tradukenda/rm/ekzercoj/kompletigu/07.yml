- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: El ha bavì fitg spert sia bavronda dal damaun per vegnir baud a scola.
- Mi ankoraŭ ne aŭdis novaĵon.: Jau n'hai anc betg udì novas.
- En tiu momento Marko ekkriis.: En quel mument ha Marko clamà.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: In buob che n'ama betg auters buobs e mattas n'ha ni amis ni amias.
