- Ni ordigis ĉion kaj transdonis al ili.: Nus avain mess tut en urden e surdà quai ad els.
- Mi petas glason da kafo kaj iom da akvo.: Jau dumond in magiel café ed in pau aua.
- Doloris lin la kapo. Li malsaniĝis.: Il chau al fascheva mal. El è vegnì malsaun.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: La matta ama d'esser bella, e perquai embellischa ella sia fatscha.
