- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Sche jau avess tant daners sco ideas, viagiass jau enturn il mund.
- En ĉiu vortaro mankas kelkaj vortoj.: En mintga dicziunari mancan intgins pleds.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ina persuna che raquinta ditg a la maisa da mangiar vegn a restar fomenta.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: El stueva far attenziun e na dastgava betg restar ditg ordaifer en la plievgia. Perquai ha el piglià in sfradent.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: El ha sia clera idea, ma el vegn a crair tut quai che ti diras, sco sche ti fissas sia dunna.
