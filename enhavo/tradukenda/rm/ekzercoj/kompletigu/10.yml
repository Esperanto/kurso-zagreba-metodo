- En juneco oni havas ankaŭ belecon.: En la giuventetgna han ins era bellezza.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Schefs duessan simplifitgar lavurs cumplitgadas.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: En quella vegliadetgna era el gia daventà manader dal club d'in club da sport.
- Monon oni metas en monujon.: Daners mettan ins en ina bursa.
- Sekvu la ekzemplon de la bonaj familianoj.: Suandai l'exempel dals buns commembers da famiglia.
