- La knabino ĵetis la paperon en la paperujon.: La matta ha bittà il palpiri en il chanaster da palpiri.
- Kie estas mia skribilo, mi volas respondi al li.: Nua è mes rispli? Jau vi respunder ad el.
- La suno malaperis kaj nun estas preskaŭ malhele.: Il sulegl è svanì ed ussa èsi quasi stgir.
- Bonvolu manĝi la panon per manĝilo.: Per plaschair mangia il paun cun in utensil da mangiar.
- Pardonu min, mi ne rajtas resti.: Perstgisa mai, jau na dastg betg restar.
