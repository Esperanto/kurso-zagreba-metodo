- Antaŭ kvarona horo ili revenis.: Els èn turnads avant in quart d'ura.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Suenter la terribla disgrazia èn ils umans ids davent e las veglias citads èn crudadas ensemen.
- Ni devus revidi nin, mia amiko.: Nus stuessan ans vesair puspè, mes ami.
- Ju pli ofte mi pripensas, des pli mi koleras.: Pli savens che jau ponderesch davart quai, pli grit vegn jau.
- Ŝi loĝas en iu ajn domo.: Ella abita en ina chasa qualunque.
