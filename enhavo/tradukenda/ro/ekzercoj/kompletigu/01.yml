- Marko estas en la ĉambro.: Marko este în cameră.
- Li sidas sur seĝo.: El stă pe un scaun.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Un profesor predă. Un muncitor lucrează. Un elev învață.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko și Aleksandro sunt studenți și sportivi.
- La patrino de Marko estas instruistino.: Mama lui Marko este profesoară.
- La seĝo estas en la ĉambro.: Scaunul este în cameră.
- La libro estas de li, ĝi estas lia.: Cartea îi aparține; este a lui.
- Mia nomo estas Marko.: Numele meu este Marko.
