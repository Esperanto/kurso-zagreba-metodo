- Mia amiko skribas multe.: Prietenul meu scrie mult.
- Bela kelnerino estas belulino.: O chelneriță frumoasă este o femeie frumoasă.
- Ni havas multajn belajn aferojn.: Avem multe lucruri frumoase.
- Ni kune lernas en lernejo.: Învățăm împreună la școală.
- Miaj gepatroj manĝas en manĝejo.: Părinții mei mănâncă într-o sufragerie.
- La kuko estas manĝebla.: Tortul este comestibil.
