- Ana kaj Marko iris tra la strato.: Ana și Marko au mers pe stradă.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Au venit la o cafenea, s-au dus la o masă și l-au văzut pe tatăl stând pe un scaun.
- Ana metis tri kukojn sur seĝon.: Ana a pus trei prăjituri pe un scaun.
- Ŝi remetis poste la kukojn sur la tablon.: Mai târziu a pus prăjiturile înapoi pe masă.
