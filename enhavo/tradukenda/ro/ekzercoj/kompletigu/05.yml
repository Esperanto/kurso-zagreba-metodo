- Dankon, sinjoro. Nedankinde.: Mulțumesc, domnule. Cu plăcere.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: O oră este scurtă, o zi este mai lungă, o lună este cea mai lungă.
- Mi legas pli multajn librojn ol mia amiko.: Am citit mai multe cărți decât prietenul meu.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Am trimis scrisori lungi prietenului meu în timp ce era în Tokyo.
- La libro estas leginda.: Cartea merită citită.
