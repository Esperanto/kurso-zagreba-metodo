- La gepatroj ĉiam deziras, ke mi lernu multon.: Părinții își doresc întotdeauna să învăț multe.
- Mia amiko deziras, ke mi iru kanti kun li.: Prietenul meu își dorește să mă duc să cânt cu el.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Tatăl vrea ca copilul lui să mănânce prăjitura care este pe masă.
- Ni loĝas en malgranda ĉambro.: Locuim intr-o camera mica.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Am devenit neliniștit când te-am văzut.
- Ĉiuj rimarkis, ke ŝi estas belega.: Toată lumea a observat că este foarte frumoasă.
