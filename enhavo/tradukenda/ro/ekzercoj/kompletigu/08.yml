- Ni ordigis ĉion kaj transdonis al ili.: Am pus totul în ordine și le-am predat.
- Mi petas glason da kafo kaj iom da akvo.: Cer un pahar de cafea și niște apă.
- Doloris lin la kapo. Li malsaniĝis.: Îl durea capul. S-a îmbolnăvit.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Fetei îi place să fie frumoasă și din acest motiv își înfrumusețează fața.
