- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Daca as avea la fel de multi bani ca idei, as calatori in jurul lumii.
- En ĉiu vortaro mankas kelkaj vortoj.: În fiecare dicționar lipsesc unele cuvinte.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: O persoană care continuă să povestească mult timp la masa de mese va rămâne foame.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Trebuia să fie atent și nu avea voie să stea mult afară pe ploaie. Prin urmare a răcit.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Are ideea lui clară, dar va crede tot ce spui, ca și cum ai fi soția lui.
