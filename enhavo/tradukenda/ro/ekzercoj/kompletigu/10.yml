- En juneco oni havas ankaŭ belecon.: In tinerete are si frumusete.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Sefii ar trebui sa simplifice joburile complicate.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: La acea vârstă devenise deja conducătorul unui club sportiv.
- Monon oni metas en monujon.: Unul pune bani într-un portofel.
- Sekvu la ekzemplon de la bonaj familianoj.: Urmați exemplul membrilor buni ai familiei.
