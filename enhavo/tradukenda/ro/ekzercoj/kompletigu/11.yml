- La knabino ĵetis la paperon en la paperujon.: Fata a aruncat hârtia în coșul de gunoi.
- Kie estas mia skribilo, mi volas respondi al li.: Unde este stiloul meu? vreau să-i răspund.
- La suno malaperis kaj nun estas preskaŭ malhele.: Soarele a dispărut și acum este aproape întuneric.
- Bonvolu manĝi la panon per manĝilo.: Vă rugăm să mâncați pâinea cu un ustensil de mâncare.
- Pardonu min, mi ne rajtas resti.: Iartă-mă, nu am voie să stau.
