- Antaŭ kvarona horo ili revenis.: S-au întors acum un sfert de oră.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: După cumplita nenorocire, oamenii au plecat și orașele vechi s-au prăbușit.
- Ni devus revidi nin, mia amiko.: Ar trebui să ne vedem din nou, prietene.
- Ju pli ofte mi pripensas, des pli mi koleras.: Cu cât mă gândesc mai des la asta, cu atât devin mai furios.
- Ŝi loĝas en iu ajn domo.: Ea locuiește în orice casă.
