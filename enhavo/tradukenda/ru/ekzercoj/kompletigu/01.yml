- Marko estas en la ĉambro.: Марко в комнате.
- Li sidas sur seĝo.: Он сидит на стуле.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Учитель учит. Рабочий работает. Студент учится.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Марко и Александро — студенты и спортсмены.
- La patrino de Marko estas instruistino.: Мать Марко - учительница.
- La seĝo estas en la ĉambro.: Стул находится в комнате.
- La libro estas de li, ĝi estas lia.: Книга принадлежит ему; это его.
- Mia nomo estas Marko.: Меня зовут Марко.
