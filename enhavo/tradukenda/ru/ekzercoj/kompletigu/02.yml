- Marko havas amikon kaj amikinon. Ili estas geamikoj.: У Марко есть друг-мужчина и подруга. Они друзья.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Он варит кофе, и они пьют его у нас дома.
- Ili iras al la hotelo.: Они идут в отель.
- Ŝi vidas, ke Marko amas ŝin.: Она видит, что Марко любит ее.
- Ili havas facilajn lernolibrojn.: У них есть простые учебники.
