- Mia amiko skribas multe.: Мой друг много пишет.
- Bela kelnerino estas belulino.: Красивая официантка – красивая женщина.
- Ni havas multajn belajn aferojn.: У нас много красивых вещей.
- Ni kune lernas en lernejo.: Мы учимся вместе в школе.
- Miaj gepatroj manĝas en manĝejo.: Мои родители едят в столовой.
- La kuko estas manĝebla.: Торт съедобен.
