- Ana kaj Marko iris tra la strato.: Ана и Марко пошли по улице.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Они пришли в кафе, подошли к столику и увидели отца, сидящего на стуле.
- Ana metis tri kukojn sur seĝon.: Ана положила на стул три пирожных.
- Ŝi remetis poste la kukojn sur la tablon.: Позже она положила пирожные обратно на стол.
