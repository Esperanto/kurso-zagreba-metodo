- Dankon, sinjoro. Nedankinde.: Спасибо, сэр. Пожалуйста.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Час короток, день длиннее, месяц самый длинный.
- Mi legas pli multajn librojn ol mia amiko.: Я прочитал больше книг, чем мой друг.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Я отправлял длинные письма своему другу, пока он был в Токио.
- La libro estas leginda.: Книга стоит прочтения.
