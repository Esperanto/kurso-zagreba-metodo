- La gepatroj ĉiam deziras, ke mi lernu multon.: Родители всегда желают, чтобы я многому научился.
- Mia amiko deziras, ke mi iru kanti kun li.: Мой друг хочет, чтобы я спел с ним.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Отец хочет, чтобы его ребенок съел торт, который лежит на столе.
- Ni loĝas en malgranda ĉambro.: Мы живем в маленькой комнате.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Мне стало не по себе, когда я увидел тебя.
- Ĉiuj rimarkis, ke ŝi estas belega.: Все заметили, что она очень красивая.
