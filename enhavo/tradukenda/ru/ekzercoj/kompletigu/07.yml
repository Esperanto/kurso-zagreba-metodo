- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Он очень быстро выпил свой утренний напиток, чтобы пораньше прийти в школу.
- Mi ankoraŭ ne aŭdis novaĵon.: Я пока не слышал никаких новостей.
- En tiu momento Marko ekkriis.: В этот момент Марко вскрикнул.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: У мальчика, который не любит других мальчиков и девочек, нет ни друзей-мужчин, ни подруг-женщин.
