- Ni ordigis ĉion kaj transdonis al ili.: Мы все привели в порядок и передали им.
- Mi petas glason da kafo kaj iom da akvo.: Я прошу стакан кофе и немного воды.
- Doloris lin la kapo. Li malsaniĝis.: У него болела голова. Ему стало плохо.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Девушке нравится быть красивой, и поэтому она украшает свое лицо.
