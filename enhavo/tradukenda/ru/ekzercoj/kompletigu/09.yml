- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Если бы у меня было столько же денег, сколько идей, я бы путешествовал по миру.
- En ĉiu vortaro mankas kelkaj vortoj.: В каждом словаре отсутствуют некоторые слова.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Человек, который долго рассказывает истории за обеденным столом, останется голодным.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ему пришлось быть внимательным, и ему не разрешили долго оставаться на улице под дождем. Поэтому он простудился.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: У него есть четкое представление, но он поверит всему, что вы скажете, как если бы вы были его женой.
