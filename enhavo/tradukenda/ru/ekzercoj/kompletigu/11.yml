- La knabino ĵetis la paperon en la paperujon.: Девушка выбросила бумагу в корзину для мусора.
- Kie estas mia skribilo, mi volas respondi al li.: Где моя ручка? Я хочу ему ответить.
- La suno malaperis kaj nun estas preskaŭ malhele.: Солнце исчезло, и теперь почти темно.
- Bonvolu manĝi la panon per manĝilo.: Пожалуйста, ешьте хлеб с помощью столовых приборов.
- Pardonu min, mi ne rajtas resti.: Простите меня, мне не разрешено оставаться.
