- Antaŭ kvarona horo ili revenis.: Они вернулись четверть часа назад.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: После страшного несчастья люди ушли, и старые города развалились.
- Ni devus revidi nin, mia amiko.: Нам нужно снова увидеться, друг мой.
- Ju pli ofte mi pripensas, des pli mi koleras.: Чем чаще я об этом думаю, тем злее становлюсь.
- Ŝi loĝas en iu ajn domo.: Она живет в любом доме.
