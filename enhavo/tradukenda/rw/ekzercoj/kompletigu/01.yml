- Marko estas en la ĉambro.: Marko ari mucyumba.
- Li sidas sur seĝo.: Yicaye ku ntebe.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Umwarimu arigisha. Umukozi arakora. Umunyeshuri ariga.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko na Aleksandro ni abanyeshuri nabakinnyi.
- La patrino de Marko estas instruistino.: Nyina wa Marko ni umwarimu.
- La seĝo estas en la ĉambro.: Intebe iri mucyumba.
- La libro estas de li, ĝi estas lia.: Igitabo ni icye; ni iye.
- Mia nomo estas Marko.: Nitwa Marko.
