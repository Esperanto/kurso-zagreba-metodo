- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko afite inshuti yumugabo ninshuti yumugore. Ni inshuti.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Akora ikawa bakayinywa iwacu.
- Ili iras al la hotelo.: Bajya muri hoteri.
- Ŝi vidas, ke Marko amas ŝin.: Abona ko Marko amukunda.
- Ili havas facilajn lernolibrojn.: Bafite ibitabo byoroshye.
