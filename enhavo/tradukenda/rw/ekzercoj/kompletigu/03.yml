- Mia amiko skribas multe.: Inshuti yanjye yanditse byinshi.
- Bela kelnerino estas belulino.: Umukozi mwiza ni umugore mwiza.
- Ni havas multajn belajn aferojn.: Dufite ibintu byinshi byiza.
- Ni kune lernas en lernejo.: Twigira hamwe kwishuri.
- Miaj gepatroj manĝas en manĝejo.: Ababyeyi banjye barya mu cyumba bariramo.
- La kuko estas manĝebla.: Cake irashobora kuribwa.
