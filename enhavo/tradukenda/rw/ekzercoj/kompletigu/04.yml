- Ana kaj Marko iris tra la strato.: Ana na Marko bagiye mu muhanda.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Bageze kuri cafe, bajya kumeza, babona se yicaye ku ntebe.
- Ana metis tri kukojn sur seĝon.: Ana yashyize udutsima dutatu ku ntebe.
- Ŝi remetis poste la kukojn sur la tablon.: Nyuma yaje gusubiza imigati kumeza.
