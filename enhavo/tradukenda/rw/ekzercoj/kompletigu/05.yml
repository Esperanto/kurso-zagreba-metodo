- Dankon, sinjoro. Nedankinde.: Urakoze, nyakubahwa. Urahawe ikaze.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Isaha ni ngufi, umunsi ni muremure, ukwezi ni muremure.
- Mi legas pli multajn librojn ol mia amiko.: Nasomye ibitabo byinshi kuruta inshuti yanjye.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Noherereje inshuti yanjye amabaruwa maremare igihe yari i Tokiyo.
- La libro estas leginda.: Igitabo gikwiye gusoma.
