- La gepatroj ĉiam deziras, ke mi lernu multon.: Ababyeyi burigihe bifuza ko niga byinshi.
- Mia amiko deziras, ke mi iru kanti kun li.: Inshuti yanjye yifuza ko njya kuririmbana nawe.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Se yifuza ko umwana we arya agati kari kumeza.
- Ni loĝas en malgranda ĉambro.: Tuba mucyumba gito.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Nakubonye numvise ntuje.
- Ĉiuj rimarkis, ke ŝi estas belega.: Abantu bose babonye ko ari mwiza cyane.
