- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Yanyoye ibinyobwa bya mugitondo vuba cyane kugirango aze kare kwishuri.
- Mi ankoraŭ ne aŭdis novaĵon.: Sinigeze numva amakuru.
- En tiu momento Marko ekkriis.: Muri ako kanya, Marko arataka.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Umuhungu udakunda abandi bahungu nabakobwa ntabwo afite inshuti zabagabo cyangwa inshuti zabakobwa.
