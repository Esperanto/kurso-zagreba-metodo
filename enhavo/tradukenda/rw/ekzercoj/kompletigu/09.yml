- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Iyaba nari mfite amafaranga menshi nkibitekerezo, nazenguruka isi.
- En ĉiu vortaro mankas kelkaj vortoj.: Muri buri nkoranyamagambo hari amagambo abura.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Umuntu ukomeza kuvuga inkuru igihe kinini kumeza yo kurya azakomeza gusonza.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Yagombaga kwitondera kandi ntiyemerewe kuguma hanze igihe kinini mu mvura. Ni yo mpamvu yafashe ubukonje.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Afite igitekerezo cye gisobanutse, ariko azizera ibyo uvuga byose, nkaho uri umugore we.
