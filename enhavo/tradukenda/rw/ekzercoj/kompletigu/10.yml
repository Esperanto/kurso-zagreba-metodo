- En juneco oni havas ankaŭ belecon.: Mu rubyiruko umuntu agira ubwiza.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Boss agomba koroshya imirimo igoye.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Muri iyo myaka yari amaze kuba umuyobozi wikipe yikipe yimikino.
- Monon oni metas en monujon.: Umuntu ashyira amafaranga mu gikapo.
- Sekvu la ekzemplon de la bonaj familianoj.: Kurikiza urugero rwabagize umuryango mwiza.
