- La knabino ĵetis la paperon en la paperujon.: Umukobwa yajugunye impapuro mu gitebo.
- Kie estas mia skribilo, mi volas respondi al li.: Ikaramu yanjye iri he? Ndashaka kumusubiza.
- La suno malaperis kaj nun estas preskaŭ malhele.: Izuba ryarazimye none ni umwijima.
- Bonvolu manĝi la panon per manĝilo.: Nyamuneka urye umutsima hamwe nibikoresho byo kurya.
- Pardonu min, mi ne rajtas resti.: Mumbabarire, ntabwo nemerewe kuguma.
