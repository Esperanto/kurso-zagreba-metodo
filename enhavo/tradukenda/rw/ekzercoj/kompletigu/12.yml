- Antaŭ kvarona horo ili revenis.: Bagarutse kimwe cya kane cyisaha ishize.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Nyuma yamakuba akomeye, abantu baragiye imigi ishaje irasenyuka.
- Ni devus revidi nin, mia amiko.: Tugomba kongera kubonana, nshuti yanjye.
- Ju pli ofte mi pripensas, des pli mi koleras.: Kenshi ndabitekerezaho, uburakari ndahinduka.
- Ŝi loĝas en iu ajn domo.: Aba mu nzu iyo ari yo yose.
