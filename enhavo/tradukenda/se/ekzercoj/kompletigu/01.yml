- Marko estas en la ĉambro.: Marko lea lanjas.
- Li sidas sur seĝo.: Son čohkká stuolus.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Oahpaheaddji oahpaha. Bargi bargá. Oahppi oahppá.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ja Aleksandro leaba oahppit ja valáštallit.
- La patrino de Marko estas instruistino.: Marko eadni lea oahpaheaddji.
- La seĝo estas en la ĉambro.: Stuollu lea lanjas.
- La libro estas de li, ĝi estas lia.: Girji gullá sutnje; dat lea su.
- Mia nomo estas Marko.: Mu namma lea Marko.
