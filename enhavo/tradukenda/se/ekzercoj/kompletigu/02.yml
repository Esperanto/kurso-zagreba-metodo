- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Markos lea almmáiolmmoš ja nissonolmmoš. Soai leaba skihpárat.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Son ráhkada gáfe ja sii juhket dan min ruovttus.
- Ili iras al la hotelo.: Sii mannet hoteallai.
- Ŝi vidas, ke Marko amas ŝin.: Son oaidná ahte Marko ráhkista su.
- Ili havas facilajn lernolibrojn.: Sis leat álkes oahppogirjjit.
