- Mia amiko skribas multe.: Mu ustit čállá olu.
- Bela kelnerino estas belulino.: Ilus bálvaleaddji lea ilus nisu.
- Ni havas multajn belajn aferojn.: Mis leat olu fiinna áššit.
- Ni kune lernas en lernejo.: Mii oahppat ovttas skuvllas.
- Miaj gepatroj manĝas en manĝejo.: Mu vánhemat borraba boradanlanjas.
- La kuko estas manĝebla.: Gáhkku lea borramuššan.
