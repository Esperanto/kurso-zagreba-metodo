- Ana kaj Marko iris tra la strato.: Ana ja Marko vácciiga geainnu mielde.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Soai bohte muhtin kafeai, manne muhtin beavddi lusa ja oidne áhči čohkkámin stuolus.
- Ana metis tri kukojn sur seĝon.: Ana bijai golmma gáhku stuolu ala.
- Ŝi remetis poste la kukojn sur la tablon.: Maŋŋil son bijai gáhkuid fas beavddi ala.
