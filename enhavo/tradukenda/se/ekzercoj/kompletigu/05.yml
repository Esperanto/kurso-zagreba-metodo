- Dankon, sinjoro. Nedankinde.: Giitu, hearrá. Leage buorre.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Diibmu lea oanehis, beaivi lea guhkit, mánnu lea guhkimus.
- Mi legas pli multajn librojn ol mia amiko.: Mun lohken eanet girjjiid go mu ustit.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Mun sáddejin guhkes reivviid iežan ustibiidda go son lei Tokyos.
- La libro estas leginda.: Girji lea lohkama árvu.
