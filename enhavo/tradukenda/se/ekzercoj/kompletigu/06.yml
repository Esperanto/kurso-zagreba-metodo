- La gepatroj ĉiam deziras, ke mi lernu multon.: Váhnemat sávvet álo ahte mun oahpan olu.
- Mia amiko deziras, ke mi iru kanti kun li.: Mu ustit sávvá ahte mun vuolggán lávlut suinna.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Áhčči háliida ahte su mánná galgá borrat dan gáhku mii lea beavddi alde.
- Ni loĝas en malgranda ĉambro.: Mii orrut unna lanjas.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Mun šadden eahpesihkkarin go oidnen du.
- Ĉiuj rimarkis, ke ŝi estas belega.: Buohkat fuomášedje ahte son lea hui ilus.
