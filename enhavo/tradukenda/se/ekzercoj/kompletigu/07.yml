- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Son juhká iežas iđitjuogu hui jođánit vai beasai árrat skuvlii.
- Mi ankoraŭ ne aŭdis novaĵon.: In leat vuos gullan makkárge ođđasiid.
- En tiu momento Marko ekkriis.: Dalle Marko čuorvvui.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Bárdni gii ii ráhkis eará bártniid ja nieiddaid ii leat almmáiolbmoguoibmi ii ge nissonguoibmi.
