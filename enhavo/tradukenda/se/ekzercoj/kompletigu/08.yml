- Ni ordigis ĉion kaj transdonis al ili.: Mii bijaimet visot ortnegii ja geigiimet daid sin háldui.
- Mi petas glason da kafo kaj iom da akvo.: Bivddán glássa gáfe ja veahá čázi.
- Doloris lin la kapo. Li malsaniĝis.: Su oaivi váivvida. Son buohccái.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Nieida liiko leahkit čáppat, ja dan dihte son čábbáda iežas muođuid.
