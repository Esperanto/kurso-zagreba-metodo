- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Jus mus livččii seamma ollu ruhta go jurdagat, de mátkkoštivččen miehtá máilmmi.
- En ĉiu vortaro mankas kelkaj vortoj.: Juohke sátnegirjjis váilot muhtun sánit.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Olmmoš gii guhká muitala muitalusaid borramušbeavddis, bissu nealgái.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Son fertii giddet fuomášumi ja ii beassan orrut olgun guhká arvvis. Danne son oaččui buozalmasvuođa.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Sus lea iežas čielga jurdda, muhto son jáhkká visot maid don dadjat, dego livččet su áddjá.
