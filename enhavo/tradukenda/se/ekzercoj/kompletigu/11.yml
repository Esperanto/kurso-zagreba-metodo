- La knabino ĵetis la paperon en la paperujon.: Nieida bálkestii báberruđaid nuoskkidanbáberkurbii.
- Kie estas mia skribilo, mi volas respondi al li.: Gos lea mu penna? Mun háliidan vástidit sutnje.
- La suno malaperis kaj nun estas preskaŭ malhele.: Beaivváš jávkkai ja dál lea measta seavdnjat.
- Bonvolu manĝi la panon per manĝilo.: Bora láibbi borranrusttegiin.
- Pardonu min, mi ne rajtas resti.: Ándagassii, mus ii leat lohpi orrut.
