- Antaŭ kvarona horo ili revenis.: Sii máhcce njealjádas diimmu dassái.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Maŋŋá dan hirbmat lihkohisvuođa, de olbmot manne eret ja boares gávpogat gahčče.
- Ni devus revidi nin, mia amiko.: Mii galggašeimmet fas oaidnit nubbi nuppi, mu ustit.
- Ju pli ofte mi pripensas, des pli mi koleras.: Mađi dávjjibut jurddašan dan birra, dađi vihaheapmin šaddan.
- Ŝi loĝas en iu ajn domo.: Son orru vaikko makkár viesus.
