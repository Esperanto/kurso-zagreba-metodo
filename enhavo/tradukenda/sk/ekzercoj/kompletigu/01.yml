- Marko estas en la ĉambro.: Marko je v izbe.
- Li sidas sur seĝo.: Sedí na stoličke.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Učiteľ učí. Robotník pracuje. Študent sa učí.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko a Aleksandro sú študenti a športovci.
- La patrino de Marko estas instruistino.: Markova mama je učiteľka.
- La seĝo estas en la ĉambro.: Stolička je v miestnosti.
- La libro estas de li, ĝi estas lia.: Kniha patrí jemu; je to jeho.
- Mia nomo estas Marko.: Volám sa Marko.
