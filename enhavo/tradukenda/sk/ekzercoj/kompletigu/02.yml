- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko má kamaráta a kamarátku. Sú priatelia.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Varí kávu a u nás doma ju pijú.
- Ili iras al la hotelo.: Idú do hotela.
- Ŝi vidas, ke Marko amas ŝin.: Vidí, že ju Marko miluje.
- Ili havas facilajn lernolibrojn.: Majú ľahké učebnice.
