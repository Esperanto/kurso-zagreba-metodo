- Mia amiko skribas multe.: Môj priateľ veľa píše.
- Bela kelnerino estas belulino.: Krásna čašníčka je krásna žena.
- Ni havas multajn belajn aferojn.: Máme veľa krásnych vecí.
- Ni kune lernas en lernejo.: Učíme sa spolu v škole.
- Miaj gepatroj manĝas en manĝejo.: Moji rodičia jedia v jedálni.
- La kuko estas manĝebla.: Torta je jedlá.
