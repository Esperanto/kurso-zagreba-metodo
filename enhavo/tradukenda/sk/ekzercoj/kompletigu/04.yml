- Ana kaj Marko iris tra la strato.: Ana a Marko išli po ulici.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Prišli do kaviarne, podišli k stolu a videli otca sedieť na stoličke.
- Ana metis tri kukojn sur seĝon.: Ana položila tri koláče na stoličku.
- Ŝi remetis poste la kukojn sur la tablon.: Neskôr položila koláče späť na stôl.
