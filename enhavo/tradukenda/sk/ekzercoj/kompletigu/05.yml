- Dankon, sinjoro. Nedankinde.: Ďakujem, pane. nemáš za čo.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Hodina je krátka, deň dlhší, mesiac najdlhší.
- Mi legas pli multajn librojn ol mia amiko.: Čítam viac kníh ako môj kamarát.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Keď bol v Tokiu, poslal som svojmu kamarátovi dlhé listy.
- La libro estas leginda.: Kniha stojí za prečítanie.
