- La gepatroj ĉiam deziras, ke mi lernu multon.: Rodičia si vždy želajú, aby som sa veľa naučil.
- Mia amiko deziras, ke mi iru kanti kun li.: Môj priateľ si želá, aby som si s ním išiel zaspievať.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Otec chce, aby jeho dieťa zjedlo koláč, ktorý je na stole.
- Ni loĝas en malgranda ĉambro.: Bývame v malej izbe.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Keď som ťa uvidel, znepokojil som sa.
- Ĉiuj rimarkis, ke ŝi estas belega.: Všetci si všimli, že je veľmi krásna.
