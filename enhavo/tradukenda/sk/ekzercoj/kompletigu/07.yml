- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ranný drink vypil veľmi rýchlo, aby prišiel skoro do školy.
- Mi ankoraŭ ne aŭdis novaĵon.: Zatiaľ som nepočul žiadne správy.
- En tiu momento Marko ekkriis.: V tej chvíli Marko vykríkol.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Chlapec, ktorý nemiluje iných chlapcov a dievčatá, nemá ani kamarátov, ani kamarátky.
