- Ni ordigis ĉion kaj transdonis al ili.: Všetko sme dali do poriadku a odovzdali im to.
- Mi petas glason da kafo kaj iom da akvo.: Pýtam si pohár kávy a trochu vody.
- Doloris lin la kapo. Li malsaniĝis.: Bolela ho hlava. Ochorel.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Dievča je rada krásne, a preto si skrášľuje tvár.
