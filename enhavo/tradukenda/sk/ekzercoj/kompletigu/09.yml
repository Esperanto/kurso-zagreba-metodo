- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Keby som mal toľko peňazí ako nápadov, cestoval by som po svete.
- En ĉiu vortaro mankas kelkaj vortoj.: V každom slovníku niektoré slová chýbajú.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Človek, ktorý pri jedálenskom stole dlho rozpráva príbehy, zostane hladný.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Musel dávať pozor a nesmel zostať dlho vonku v daždi. Preto prechladol.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Má jasnú predstavu, ale uverí všetkému, čo poviete, ako keby ste boli jeho manželkou.
