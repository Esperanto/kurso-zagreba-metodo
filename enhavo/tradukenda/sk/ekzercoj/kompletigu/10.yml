- En juneco oni havas ankaŭ belecon.: V mladosti má človek aj krásu.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Šéfovia by si mali zjednodušiť zložité úlohy.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Už v tom veku sa stal vedúcim športového klubu.
- Monon oni metas en monujon.: Jeden vloží peniaze do peňaženky.
- Sekvu la ekzemplon de la bonaj familianoj.: Nasledujte príklad dobrých členov rodiny.
