- La knabino ĵetis la paperon en la paperujon.: Dievča hodilo papier do odpadkového koša.
- Kie estas mia skribilo, mi volas respondi al li.: Kde je moje pero? Chcem mu odpovedať.
- La suno malaperis kaj nun estas preskaŭ malhele.: Slnko zmizlo a teraz je takmer tma.
- Bonvolu manĝi la panon per manĝilo.: Jedzte chlieb pomocou kuchynského náčinia.
- Pardonu min, mi ne rajtas resti.: Prepáčte, nemám dovolené zostať.
