- Antaŭ kvarona horo ili revenis.: Vrátili sa pred štvrťhodinou.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Po hroznom nešťastí ľudia odišli a staré mestá sa rozpadli.
- Ni devus revidi nin, mia amiko.: Mali by sme sa znova vidieť, môj priateľ.
- Ju pli ofte mi pripensas, des pli mi koleras.: Čím častejšie na to myslím, tým som nahnevanejšia.
- Ŝi loĝas en iu ajn domo.: Býva v akomkoľvek dome.
