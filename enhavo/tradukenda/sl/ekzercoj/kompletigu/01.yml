- Marko estas en la ĉambro.: Marko je v sobi.
- Li sidas sur seĝo.: Sedi na stolu.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Učitelj poučuje. Delavec dela. Študent se uči.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko in Aleksandro sta študenta in športnika.
- La patrino de Marko estas instruistino.: Markova mama je učiteljica.
- La seĝo estas en la ĉambro.: Stol je v sobi.
- La libro estas de li, ĝi estas lia.: Knjiga pripada njemu; to je njegovo.
- Mia nomo estas Marko.: Moje ime je Marko.
