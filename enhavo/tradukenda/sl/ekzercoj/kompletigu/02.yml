- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ima prijatelja in prijateljico. Prijatelja sta.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Skuha kavo in pijejo jo pri nas doma.
- Ili iras al la hotelo.: Gredo v hotel.
- Ŝi vidas, ke Marko amas ŝin.: Vidi, da jo ima Marko rad.
- Ili havas facilajn lernolibrojn.: Imajo lahke učbenike.
