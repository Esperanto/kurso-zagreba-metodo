- Mia amiko skribas multe.: Moj prijatelj veliko piše.
- Bela kelnerino estas belulino.: Lepa natakarica je lepa ženska.
- Ni havas multajn belajn aferojn.: Veliko lepih stvari imamo.
- Ni kune lernas en lernejo.: V šoli se učimo skupaj.
- Miaj gepatroj manĝas en manĝejo.: Moji starši jedo v jedilnici.
- La kuko estas manĝebla.: Torta je užitna.
