- Ana kaj Marko iris tra la strato.: Ana in Marko sta šla po ulici.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Prišla sta v kavarno, stopila do mize in zagledala očeta, sedečega na stolu.
- Ana metis tri kukojn sur seĝon.: Ana je na stol postavila tri torte.
- Ŝi remetis poste la kukojn sur la tablon.: Kasneje je torte postavila nazaj na mizo.
