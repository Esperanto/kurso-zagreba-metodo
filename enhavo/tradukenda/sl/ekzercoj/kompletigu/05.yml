- Dankon, sinjoro. Nedankinde.: Hvala, gospod. Vabljeni.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Ura je kratka, dan je daljši, mesec je najdaljši.
- Mi legas pli multajn librojn ol mia amiko.: Preberem več knjig kot moj prijatelj.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Prijatelju sem pošiljal dolga pisma, ko je bil v Tokiu.
- La libro estas leginda.: Knjiga je vredna branja.
