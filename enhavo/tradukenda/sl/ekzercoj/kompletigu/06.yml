- La gepatroj ĉiam deziras, ke mi lernu multon.: Starši si vedno želijo, da bi se veliko naučil.
- Mia amiko deziras, ke mi iru kanti kun li.: Prijatelj si želi, da grem peti z njim.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Oče želi, da njegov otrok poje torto, ki je na mizi.
- Ni loĝas en malgranda ĉambro.: Živimo v majhni sobici.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Postalo mi je nelagodno, ko sem te videl.
- Ĉiuj rimarkis, ke ŝi estas belega.: Vsi so opazili, da je zelo lepa.
