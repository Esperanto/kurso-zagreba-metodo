- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Jutranjo pijačo je spil zelo hitro, da bi prišel zgodaj v šolo.
- Mi ankoraŭ ne aŭdis novaĵon.: Nisem še izvedel nobene novice.
- En tiu momento Marko ekkriis.: Takrat je Marko zajokal.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Fant, ki ne ljubi drugih fantov in deklet, nima ne prijateljev ne prijateljic.
