- Ni ordigis ĉion kaj transdonis al ili.: Vse smo uredili in jim predali.
- Mi petas glason da kafo kaj iom da akvo.: Prosim za kozarec kave in malo vode.
- Doloris lin la kapo. Li malsaniĝis.: Glava ga je bolela. Zbolel je.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Deklica je rada lepa in zato polepša svoj obraz.
