- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Če bi imel toliko denarja kot idej, bi potoval okoli sveta.
- En ĉiu vortaro mankas kelkaj vortoj.: V vsakem slovarju nekaj besed manjka.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Oseba, ki dolgo časa pripoveduje zgodbe za jedilno mizo, bo ostala lačna.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Moral je biti pozoren in ni smel ostati dolgo zunaj na dežju. Zato se je prehladil.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ima svojo jasno predstavo, vendar bo verjel vsemu, kar boste rekli, kot da ste njegova žena.
