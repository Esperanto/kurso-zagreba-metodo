- En juneco oni havas ankaŭ belecon.: V mladosti je tudi lepota.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Šefi bi morali poenostaviti zapletena dela.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Pri teh letih je že postal klubski vodja športnega društva.
- Monon oni metas en monujon.: Eden da denar v denarnico.
- Sekvu la ekzemplon de la bonaj familianoj.: Zgledujte se po dobrih družinskih članih.
