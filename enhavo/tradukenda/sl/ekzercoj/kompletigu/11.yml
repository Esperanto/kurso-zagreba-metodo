- La knabino ĵetis la paperon en la paperujon.: Deklica je vrgla papir v koš za smeti.
- Kie estas mia skribilo, mi volas respondi al li.: Kje je moje pero? Želim mu odgovoriti.
- La suno malaperis kaj nun estas preskaŭ malhele.: Sonce je izginilo in zdaj je skoraj temno.
- Bonvolu manĝi la panon per manĝilo.: Prosimo, jejte kruh z jedilnim priborom.
- Pardonu min, mi ne rajtas resti.: Oprosti mi, ne smem ostati.
