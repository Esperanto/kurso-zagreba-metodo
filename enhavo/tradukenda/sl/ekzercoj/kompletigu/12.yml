- Antaŭ kvarona horo ili revenis.: Vrnili so se pred četrt ure.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Po strašni nesreči so ljudje odšli in stara mesta so razpadla.
- Ni devus revidi nin, mia amiko.: Morala bi se spet videti, prijatelj moj.
- Ju pli ofte mi pripensas, des pli mi koleras.: Pogosteje kot razmišljam o tem, bolj sem jezna.
- Ŝi loĝas en iu ajn domo.: Živi v kateri koli hiši.
