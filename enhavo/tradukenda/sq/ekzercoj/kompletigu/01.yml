- Marko estas en la ĉambro.: Marko është në dhomë.
- Li sidas sur seĝo.: Ai ulet në një karrige.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Një mësues jep mësim. Punon një punëtor. Një student mëson.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko dhe Aleksandro janë studentë dhe sportistë.
- La patrino de Marko estas instruistino.: Nëna e Markos është mësuese.
- La seĝo estas en la ĉambro.: Karrigia është në dhomë.
- La libro estas de li, ĝi estas lia.: Libri i përket atij; është e tij.
- Mia nomo estas Marko.: Emri im është Marko.
