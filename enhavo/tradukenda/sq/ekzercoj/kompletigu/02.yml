- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ka një shok mashkull dhe një shoqe femër. Ata janë miq.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ai bën kafe dhe e pinë në shtëpinë tonë.
- Ili iras al la hotelo.: Ata shkojnë në hotel.
- Ŝi vidas, ke Marko amas ŝin.: Ajo sheh që Marko e do atë.
- Ili havas facilajn lernolibrojn.: Ata kanë tekste të lehta shkollore.
