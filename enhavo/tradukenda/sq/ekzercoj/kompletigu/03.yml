- Mia amiko skribas multe.: Shoku im shkruan shumë.
- Bela kelnerino estas belulino.: Një kameriere e bukur është një grua e bukur.
- Ni havas multajn belajn aferojn.: Kemi shumë gjëra të bukura.
- Ni kune lernas en lernejo.: Ne mësojmë së bashku në shkollë.
- Miaj gepatroj manĝas en manĝejo.: Prindërit e mi hanë në një dhomë ngrënieje.
- La kuko estas manĝebla.: Torta është e ngrënshme.
