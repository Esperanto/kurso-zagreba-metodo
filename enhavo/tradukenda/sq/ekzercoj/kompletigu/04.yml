- Ana kaj Marko iris tra la strato.: Ana dhe Marko shkuan përgjatë rrugës.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ata erdhën në një kafene, shkuan në një tavolinë dhe panë babain të ulur në një karrige.
- Ana metis tri kukojn sur seĝon.: Ana vendosi tre ëmbëlsira në një karrige.
- Ŝi remetis poste la kukojn sur la tablon.: Më vonë ajo i vendosi ëmbëlsirat përsëri në tryezë.
