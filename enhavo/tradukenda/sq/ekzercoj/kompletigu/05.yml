- Dankon, sinjoro. Nedankinde.: Faleminderit zotëri. Ju jeni të mirëpritur.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Një orë është e shkurtër, një ditë është më e gjatë, një muaj është më i gjati.
- Mi legas pli multajn librojn ol mia amiko.: Kam lexuar më shumë libra se shoku im.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: I dërgova letra të gjata mikut tim kur ai ishte në Tokio.
- La libro estas leginda.: Libri ia vlen të lexohet.
