- La gepatroj ĉiam deziras, ke mi lernu multon.: Prindërit dëshirojnë gjithmonë që unë të mësoj shumë.
- Mia amiko deziras, ke mi iru kanti kun li.: Shoku im dëshiron që unë të shkoj të këndoj me të.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Babai dëshiron që fëmija i tij të hajë tortën që është në tryezë.
- Ni loĝas en malgranda ĉambro.: Ne jetojmë në një dhomë të vogël.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: U bëra i shqetësuar kur të pashë.
- Ĉiuj rimarkis, ke ŝi estas belega.: Të gjithë e vunë re se ajo ishte shumë e bukur.
