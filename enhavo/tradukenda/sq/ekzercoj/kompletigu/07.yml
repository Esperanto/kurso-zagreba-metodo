- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Ai e pinte pijen e mëngjesit shumë shpejt për të ardhur herët në shkollë.
- Mi ankoraŭ ne aŭdis novaĵon.: Nuk kam dëgjuar ende asnjë lajm.
- En tiu momento Marko ekkriis.: Në atë moment Marko bërtiti.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Një djalë që nuk i do djemtë dhe vajzat e tjera, nuk ka as miq meshkuj dhe as shoqe femra.
