- Ni ordigis ĉion kaj transdonis al ili.: I vendosëm gjithçka në rregull dhe ua dorëzuam atyre.
- Mi petas glason da kafo kaj iom da akvo.: Kërkoj një gotë kafe dhe pak ujë.
- Doloris lin la kapo. Li malsaniĝis.: I dhimbte koka. Ai u sëmur.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Vajzës i pëlqen të jetë e bukur dhe për këtë arsye ia zbukuron fytyrën.
