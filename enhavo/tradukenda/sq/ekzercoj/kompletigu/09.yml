- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Nëse do të kisha aq para sa idetë, do të udhëtoja nëpër botë.
- En ĉiu vortaro mankas kelkaj vortoj.: Në çdo fjalor mungojnë disa fjalë.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Një person që vazhdon të tregojë histori për një kohë të gjatë në tryezën e ngrënies do të mbetet i uritur.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ai duhej t'i kushtonte vëmendje dhe nuk u lejua të qëndronte gjatë jashtë në shi. Prandaj ai u ftoh.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ai e ka idenë e tij të qartë, por do t'i besojë gjithçka që do të thuash, sikur të jesh gruaja e tij.
