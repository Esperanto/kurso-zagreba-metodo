- La knabino ĵetis la paperon en la paperujon.: Vajza e hodhi letrën në koshin e letrës së mbeturinave.
- Kie estas mia skribilo, mi volas respondi al li.: Ku është stilolapsi im? Unë dua t'i përgjigjem atij.
- La suno malaperis kaj nun estas preskaŭ malhele.: Dielli u zhduk dhe tani është pothuajse errësirë.
- Bonvolu manĝi la panon per manĝilo.: Ju lutemi hani bukën me një enë ushqimi.
- Pardonu min, mi ne rajtas resti.: Më falni, nuk më lejohet të qëndroj.
