- Antaŭ kvarona horo ili revenis.: Ata u kthyen një çerek ore më parë.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Pas fatkeqësisë së tmerrshme, njerëzit u larguan dhe qytetet e vjetra u shkatërruan.
- Ni devus revidi nin, mia amiko.: Ne duhet të shihemi përsëri, miku im.
- Ju pli ofte mi pripensas, des pli mi koleras.: Sa më shpesh e mendoj, aq më shumë zemërohem.
- Ŝi loĝas en iu ajn domo.: Ajo jeton në çdo shtëpi.
