- Marko estas en la ĉambro.: Marko je u sobi.
- Li sidas sur seĝo.: Seda na stolicu.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Učiteljica predaje. Radnik radi. Učenik uči.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko i Aleksandro su studenti i sportisti.
- La patrino de Marko estas instruistino.: Markova majka je učiteljica.
- La seĝo estas en la ĉambro.: Stolica je u sobi.
- La libro estas de li, ĝi estas lia.: Knjiga pripada njemu; to je njegovo.
- Mia nomo estas Marko.: Moje ime je Marko.
