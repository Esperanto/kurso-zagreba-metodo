- Dankon, sinjoro. Nedankinde.: Hvala, gospodine. Nema na čemu.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Sat je kratak, dan je duži, mesec je najduži.
- Mi legas pli multajn librojn ol mia amiko.: Čitam više knjiga nego moj prijatelj.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Poslao sam duga pisma svom prijatelju dok je bio u Tokiju.
- La libro estas leginda.: Knjigu vredi pročitati.
