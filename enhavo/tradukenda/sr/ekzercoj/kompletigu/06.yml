- La gepatroj ĉiam deziras, ke mi lernu multon.: Roditelji uvek žele da naučim puno.
- Mia amiko deziras, ke mi iru kanti kun li.: Moj prijatelj želi da idem da pevam s njim.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Otac želi da njegovo dete pojede kolač koji je na stolu.
- Ni loĝas en malgranda ĉambro.: Živimo u maloj sobi.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Postao sam nemiran kada sam te video.
- Ĉiuj rimarkis, ke ŝi estas belega.: Svi su primetili da je jako lepa.
