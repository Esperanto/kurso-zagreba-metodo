- Ni ordigis ĉion kaj transdonis al ili.: Sve smo posložili i predali im.
- Mi petas glason da kafo kaj iom da akvo.: Tražim čašu kafe i malo vode.
- Doloris lin la kapo. Li malsaniĝis.: Bolela ga je glava. Razboleo se.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Devojka voli da bude lepa i zato ulepšava svoje lice.
