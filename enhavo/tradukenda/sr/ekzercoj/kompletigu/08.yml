- Ni ordigis ĉion kaj transdonis al ili.: Sve smo posložili i predali im.
- Mi petas glason da kafo kaj iom da akvo.: Tražim čašu kafe i malo vode.
- Doloris lin la kapo. Li malsaniĝis.: Boljela ga je glava. Razbolio se.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Djevojka voli biti lepa i iz tog razloga ulepšava svoda li jece.
