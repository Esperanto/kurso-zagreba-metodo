- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Da imam toliko novca koliko ideja, putovao bih oko sveta.
- En ĉiu vortaro mankas kelkaj vortoj.: U svakom rečniku neke reči nedostaju.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Osoba koja dugo priča priče za stolom ostaće gladna.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Morao je da pazi i nije smeo dugo da ostane napolju na kiši. Zato se prehladio.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: On ima svoju jasnu ideju, ali verovaće svemu što kažete, kao da ste mu žena.
