- En juneco oni havas ankaŭ belecon.: U mladosti ima i ljepote.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Šefovi bi trebali pojednostaviti komplicirane poslove.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: U toj dobi već je postao voditelj sportskog kluba.
- Monon oni metas en monujon.: Jedan stavlja novac u novčanik.
- Sekvu la ekzemplon de la bonaj familianoj.: Sledite primer dobrih članova porodice.
