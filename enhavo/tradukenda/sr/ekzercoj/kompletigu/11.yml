- La knabino ĵetis la paperon en la paperujon.: Djevojčica je bacila papir u koš za smeće.
- Kie estas mia skribilo, mi volas respondi al li.: Gde je moja olovka? Želim mu odgovoriti.
- La suno malaperis kaj nun estas preskaŭ malhele.: Sunce je nestalo i sada je gotovo mrak.
- Bonvolu manĝi la panon per manĝilo.: Molimo jedite hleb s priborom za jelo.
- Pardonu min, mi ne rajtas resti.: Izvinite mi, nije mi dopušteno ostati.
