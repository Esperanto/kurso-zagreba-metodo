- Antaŭ kvarona horo ili revenis.: Vratili su se pre četvrt sata.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Nakon strašne nesreće, ljudi su otišli, a stari gradovi su se raspali.
- Ni devus revidi nin, mia amiko.: Trebali bismo se ponovo videti, prijatelju.
- Ju pli ofte mi pripensas, des pli mi koleras.: Šta češće razmišljam o tome, postajem ljući.
- Ŝi loĝas en iu ajn domo.: Živi u bilo kojoj kući.
