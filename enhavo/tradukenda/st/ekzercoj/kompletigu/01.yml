- Marko estas en la ĉambro.: Marko o ka phaposing.
- Li sidas sur seĝo.: O lula setulong.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Tichere ea ruta. Mosebetsi oa sebetsa. Moithuti oa ithuta.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko le Aleksandro ke liithuti le baatlelete.
- La patrino de Marko estas instruistino.: '''Mè oa Marko ke mosuoe.'
- La seĝo estas en la ĉambro.: Setulo se ka kamoreng.
- La libro estas de li, ĝi estas lia.: Buka ke ea hae; ke ea hae.
- Mia nomo estas Marko.: Lebitso la ka ke Marko.
