- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko o na le motsoalle oa monna le motsoalle oa mosali. Ke metsoalle.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: O etsa kofi mme ba e noa lapeng la rona.
- Ili iras al la hotelo.: Ba ea hoteleng.
- Ŝi vidas, ke Marko amas ŝin.: O bona hore Mareka oa mo rata.
- Ili havas facilajn lernolibrojn.: Ba na le libuka tse bonolo tsa ho ithuta.
