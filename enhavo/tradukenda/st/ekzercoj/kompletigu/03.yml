- Mia amiko skribas multe.: Motsoalle oa ka o ngola haholo.
- Bela kelnerino estas belulino.: Moeti e motle ke mosali e motle.
- Ni havas multajn belajn aferojn.: Re na le lintho tse ngata tse ntle.
- Ni kune lernas en lernejo.: Re ithuta hammoho sekolong.
- Miaj gepatroj manĝas en manĝejo.: Batsoali ba ka ba jella phaposing ea ho jela.
- La kuko estas manĝebla.: Kuku ea jeoa.
