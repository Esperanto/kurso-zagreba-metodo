- Ana kaj Marko iris tra la strato.: Ana le Marko ba ile ba tsamaea seterateng.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ba fihla khefing, ba ea tafoleng, mme ba bona ntate a lutse setulong.
- Ana metis tri kukojn sur seĝon.: Ana o ile a beha likuku tse tharo setulong.
- Ŝi remetis poste la kukojn sur la tablon.: Hamorao o ile a khutlisetsa likuku tseo tafoleng.
