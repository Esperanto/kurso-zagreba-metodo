- Dankon, sinjoro. Nedankinde.: Kea leboha, Mohlomphehi. Ho lebohile nna.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Hora e khuts'oane, letsatsi le lelelele, khoeli ke eona e telele ka ho fetisisa.
- Mi legas pli multajn librojn ol mia amiko.: Ke bala libuka tse ngata ho feta motsoalle oa ka.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Ke ile ka romella motsoalle oa ka mangolo a malelele ha a ntse a le Tokyo.
- La libro estas leginda.: Buka e loketse ho baloa.
