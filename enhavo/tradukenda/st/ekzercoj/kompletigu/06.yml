- La gepatroj ĉiam deziras, ke mi lernu multon.: Kamehla batsoali ba lakatsa eka nka ithuta ho hongata.
- Mia amiko deziras, ke mi iru kanti kun li.: Motsoalle oa ka o lakatsa eka nka ea bina le eena.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Ntate o batla hore ngoana oa hae a je kuku e holim'a tafole.
- Ni loĝas en malgranda ĉambro.: Re lula kamoreng e nyenyane.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Ke ile ka tshwenyeha ha ke o bona.
- Ĉiuj rimarkis, ke ŝi estas belega.: Bohle ba ile ba hlokomela hore o motle haholo.
