- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: O ile a noa seno sa hae sa hoseng ka potlako e le hore a tle sekolong esale hoseng.
- Mi ankoraŭ ne aŭdis novaĵon.: Ha ke so utloe litaba.
- En tiu momento Marko ekkriis.: Ka yona nako eo, Mareka a hoeletsa.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Moshanyana ea sa rateng bashanyana ba bang le banana ha a na metsoalle ea banna kapa metsoalle ea basali.
