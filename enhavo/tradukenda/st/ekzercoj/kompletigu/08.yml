- Ni ordigis ĉion kaj transdonis al ili.: Re ile ra beha ntho e ’ngoe le e ’ngoe ka tlhophiso ’me ra ba neha eona.
- Mi petas glason da kafo kaj iom da akvo.: Ke kopa khalase ea kofi le metsi.
- Doloris lin la kapo. Li malsaniĝis.: Hlooho ya hae e ne e le bohloko. O ile a kula.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Ngoanana o rata ho ba motle, 'me ka lebaka leo o khabisa sefahleho sa hae.
