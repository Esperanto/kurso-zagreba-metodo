- Ni ordigis ĉion kaj transdonis al ili.: Re ile ra hlophisa ntho e nngwe le e nngwe mme ra ba neha yona.
- Mi petas glason da kafo kaj iom da akvo.: Ke kopa khalase ea kofi le metsi.
- Doloris lin la kapo. Li malsaniĝis.: Hlooho ya hae e ne e le bohloko. O ile a kula.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Ngoanana o rata ho ba motle, mme ka lebaka leo o kgabisa sefahleho sa hae.
