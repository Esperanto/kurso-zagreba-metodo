- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Haeba ke ne ke e-na le tjhelete e ngata jwalo ka mehopolo, ke ne ke tla tsamaya ho pota lefatshe.
- En ĉiu vortaro mankas kelkaj vortoj.: Bukaneng e nngwe le e nngwe mantswe a mmalwa a haella.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Motho ea lulang a pheta lipale nako e telele tafoleng ea ho jela o tla lula a lapile.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: O ile a tlameha ho ela hloko mme a se ke a dumeletswa ho dula ka ntle nako e telele pula e na. Kahoo o ile a tshwarwa ke sefuba.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: O na le maikutlo a hae a hlakileng, empa o tla dumela ntho e nngwe le e nngwe eo o e buang, jwalo ka ha eka o mosadi wa hae.
