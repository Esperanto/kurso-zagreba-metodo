- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Haeba ke ne ke e-na le chelete e ngata joaloka mehopolo, ke ne ke tla tsamaea ho pota lefatše.
- En ĉiu vortaro mankas kelkaj vortoj.: Bukaneng e ’ngoe le e ’ngoe mantsoe a haellang.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Motho ea lulang a pheta lipale nako e telele tafoleng ea ho jela o tla lula a lapile.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: O ile a tlameha ho ela hloko ’me a se ke a lumelloa ho lula ka ntle nako e telele pula e na. Kahoo o ile a tšoaroa ke sefuba.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: O na le maikutlo a hae a hlakileng, empa o tla lumela ntho e ’ngoe le e ’ngoe eo u e buang, joalokaha eka u mosali oa hae.
