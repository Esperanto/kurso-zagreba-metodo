- En juneco oni havas ankaŭ belecon.: Bocheng motho o boetse o na le botle.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Baokameli ba lokela ho nolofatsa mesebetsi e rarahaneng.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Lilemong tseo e ne e se e le moetapele oa sehlopha sa sehlopha sa lipapali.
- Monon oni metas en monujon.: Motho o kenya chelete ka sepacheng.
- Sekvu la ekzemplon de la bonaj familianoj.: Latela mohlala oa litho tse molemo tsa lelapa.
