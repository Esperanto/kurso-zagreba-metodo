- La knabino ĵetis la paperon en la paperujon.: Ngoanana o ile a akhela pampiri ka har'a basketeng ea litšila.
- Kie estas mia skribilo, mi volas respondi al li.: Pene yaka e kae? Ke batla ho mo araba.
- La suno malaperis kaj nun estas preskaŭ malhele.: Letsatsi le ile la nyamela 'me joale ho se ho le lefifi.
- Bonvolu manĝi la panon per manĝilo.: Ka kopo, ja bohobe ka sejana sa ho jela.
- Pardonu min, mi ne rajtas resti.: Ntšoarele, ha kea lumelloa ho lula.
