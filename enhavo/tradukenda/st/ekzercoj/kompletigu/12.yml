- Antaŭ kvarona horo ili revenis.: Ba khutlile kotara ea hora e fetileng.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Ka mora tlokotsi e tshabehang, batho ba ile ba tsamaya mme metse ya kgale ya heleha.
- Ni devus revidi nin, mia amiko.: Re lokela ho bonana hape, motsoalle oa ka.
- Ju pli ofte mi pripensas, des pli mi koleras.: Ha ke nahana ka eona hangata, kea halefa le ho feta.
- Ŝi loĝas en iu ajn domo.: O lula ntlong efe kapa efe.
