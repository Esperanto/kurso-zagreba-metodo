- Marko estas en la ĉambro.: Marko är i rummet.
- Li sidas sur seĝo.: Han sitter på en stol.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: En lärare undervisar. En arbetare arbetar. En elev lär sig.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko och Aleksandro är studenter och idrottare.
- La patrino de Marko estas instruistino.: Markos mamma är lärare.
- La seĝo estas en la ĉambro.: Stolen står i rummet.
- La libro estas de li, ĝi estas lia.: Boken tillhör honom; det är hans.
- Mia nomo estas Marko.: Jag heter Marko.
