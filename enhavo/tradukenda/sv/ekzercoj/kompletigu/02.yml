- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko har en manlig vän och en kvinnlig vän. De är vänner.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Han kokar kaffe och de dricker det hemma hos oss.
- Ili iras al la hotelo.: De går till hotellet.
- Ŝi vidas, ke Marko amas ŝin.: Hon ser att Marko älskar henne.
- Ili havas facilajn lernolibrojn.: De har lätta läroböcker.
