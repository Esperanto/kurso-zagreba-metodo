- Mia amiko skribas multe.: Min vän skriver mycket.
- Bela kelnerino estas belulino.: En vacker servitris är en vacker kvinna.
- Ni havas multajn belajn aferojn.: Vi har många vackra saker.
- Ni kune lernas en lernejo.: Vi lär oss tillsammans i skolan.
- Miaj gepatroj manĝas en manĝejo.: Mina föräldrar äter i en matsal.
- La kuko estas manĝebla.: Kakan är ätbar.
