- Ana kaj Marko iris tra la strato.: Ana och Marko gick längs gatan.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: De kom till ett kafé, gick till ett bord och såg pappan sitta på en stol.
- Ana metis tri kukojn sur seĝon.: Ana satte tre kakor på en stol.
- Ŝi remetis poste la kukojn sur la tablon.: Hon ställde senare tillbaka kakorna på bordet.
