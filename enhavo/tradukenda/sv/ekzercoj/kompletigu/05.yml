- Dankon, sinjoro. Nedankinde.: Tack, sir. Du är välkommen.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: En timme är kort, en dag är längre, en månad är längst.
- Mi legas pli multajn librojn ol mia amiko.: Jag läser fler böcker än min vän.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Jag skickade långa brev till min vän när han var i Tokyo.
- La libro estas leginda.: Boken är läsvärd.
