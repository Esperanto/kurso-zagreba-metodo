- La gepatroj ĉiam deziras, ke mi lernu multon.: Föräldrar önskar alltid att jag lär mig mycket.
- Mia amiko deziras, ke mi iru kanti kun li.: Min vän önskar att jag går och sjunger med honom.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Pappan vill att hans barn ska äta kakan som står på bordet.
- Ni loĝas en malgranda ĉambro.: Vi bor i ett litet rum.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Jag blev orolig när jag såg dig.
- Ĉiuj rimarkis, ke ŝi estas belega.: Alla märkte att hon är väldigt vacker.
