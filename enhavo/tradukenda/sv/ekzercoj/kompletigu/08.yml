- Ni ordigis ĉion kaj transdonis al ili.: Vi gjorde ordning på allt och lämnade över det till dem.
- Mi petas glason da kafo kaj iom da akvo.: Jag ber om ett glas kaffe och lite vatten.
- Doloris lin la kapo. Li malsaniĝis.: Hans huvud gjorde ont. Han blev sjuk.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Flickan gillar att vara vacker, och av den anledningen förskönar hon sitt ansikte.
