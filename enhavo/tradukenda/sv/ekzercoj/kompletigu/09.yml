- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Om jag hade lika mycket pengar som idéer skulle jag resa runt i världen.
- En ĉiu vortaro mankas kelkaj vortoj.: I varje ordbok saknas några ord.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: En person som fortsätter att berätta historier länge vid matbordet kommer att förbli hungrig.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Han fick vara uppmärksam och fick inte vara ute länge i regnet. Därför blev han förkyld.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Han har sin klara idé, men han kommer att tro på allt du säger, som om du vore hans fru.
