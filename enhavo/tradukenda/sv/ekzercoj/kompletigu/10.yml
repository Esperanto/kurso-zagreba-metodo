- En juneco oni havas ankaŭ belecon.: I ungdomen har man också skönhet.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Chefer borde förenkla komplicerade jobb.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Vid den åldern hade han redan blivit klubbledare för en idrottsförening.
- Monon oni metas en monujon.: Man lägger pengar i en plånbok.
- Sekvu la ekzemplon de la bonaj familianoj.: Följ de goda familjemedlemmarnas exempel.
