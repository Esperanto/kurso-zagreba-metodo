- La knabino ĵetis la paperon en la paperujon.: Flickan kastade papperet i papperskorgen.
- Kie estas mia skribilo, mi volas respondi al li.: Var är min penna? Jag vill svara honom.
- La suno malaperis kaj nun estas preskaŭ malhele.: Solen försvann och nu är det nästan mörkt.
- Bonvolu manĝi la panon per manĝilo.: Vänligen ät brödet med ett matredskap.
- Pardonu min, mi ne rajtas resti.: Förlåt mig, jag får inte stanna.
