- Antaŭ kvarona horo ili revenis.: De kom tillbaka för en kvart sedan.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Efter den fruktansvärda olyckan gick folket bort och de gamla städerna föll isär.
- Ni devus revidi nin, mia amiko.: Vi borde ses igen, min vän.
- Ju pli ofte mi pripensas, des pli mi koleras.: Ju oftare jag tänker på det, desto argare blir jag.
- Ŝi loĝas en iu ajn domo.: Hon bor i vilket hus som helst.
