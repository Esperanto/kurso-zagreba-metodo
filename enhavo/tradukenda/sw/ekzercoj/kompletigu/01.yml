- Marko estas en la ĉambro.: Marko yuko chumbani.
- Li sidas sur seĝo.: Anakaa kwenye kiti.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Mwalimu anafundisha. Mfanyakazi anafanya kazi. Mwanafunzi anajifunza.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko na Aleksandro ni wanafunzi na wanariadha.
- La patrino de Marko estas instruistino.: Mama ya Marko ni mwalimu.
- La seĝo estas en la ĉambro.: Mwenyekiti yuko chumbani.
- La libro estas de li, ĝi estas lia.: Kitabu ni chake; ni yake.
- Mia nomo estas Marko.: Jina langu ni Marko.
