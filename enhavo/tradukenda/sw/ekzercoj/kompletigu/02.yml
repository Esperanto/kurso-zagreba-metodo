- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ana rafiki wa kiume na rafiki wa kike. Wao ni marafiki.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Anatengeneza kahawa na wanakunywa nyumbani kwetu.
- Ili iras al la hotelo.: Wanaenda hotelini.
- Ŝi vidas, ke Marko amas ŝin.: Anaona kwamba Marko anampenda.
- Ili havas facilajn lernolibrojn.: Wana vitabu rahisi vya kiada.
