- Mia amiko skribas multe.: Rafiki yangu anaandika sana.
- Bela kelnerino estas belulino.: Mhudumu mzuri ni mwanamke mzuri.
- Ni havas multajn belajn aferojn.: Tuna mambo mengi mazuri.
- Ni kune lernas en lernejo.: Tunajifunza pamoja shuleni.
- Miaj gepatroj manĝas en manĝejo.: Wazazi wangu hula katika chumba cha kulia.
- La kuko estas manĝebla.: Keki ni chakula.
