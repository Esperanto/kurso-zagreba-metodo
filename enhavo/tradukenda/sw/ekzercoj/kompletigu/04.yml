- Ana kaj Marko iris tra la strato.: Ana na Marko walikwenda kando ya barabara.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Walifika kwenye cafe, wakaenda kwenye meza, wakamwona baba ameketi kwenye kiti.
- Ana metis tri kukojn sur seĝon.: Ana aliweka keki tatu kwenye kiti.
- Ŝi remetis poste la kukojn sur la tablon.: Baadaye alirudisha keki mezani.
