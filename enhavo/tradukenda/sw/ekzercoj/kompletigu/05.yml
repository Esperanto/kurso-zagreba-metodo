- Dankon, sinjoro. Nedankinde.: Asante, bwana. Unakaribishwa.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Saa ni fupi, siku ni ndefu, mwezi ni mrefu zaidi.
- Mi legas pli multajn librojn ol mia amiko.: Nilisoma vitabu vingi kuliko rafiki yangu.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Nilimtumia rafiki yangu barua ndefu alipokuwa Tokyo.
- La libro estas leginda.: Kitabu kinafaa kusoma.
