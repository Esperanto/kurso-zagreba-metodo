- La gepatroj ĉiam deziras, ke mi lernu multon.: Wazazi huwa wanatamani nijifunze mengi.
- Mia amiko deziras, ke mi iru kanti kun li.: Rafiki yangu anatamani niende kuimba naye.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Baba anataka mtoto wake ale keki iliyo mezani.
- Ni loĝas en malgranda ĉambro.: Tunaishi katika chumba kidogo.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Nilikosa raha nilipokuona.
- Ĉiuj rimarkis, ke ŝi estas belega.: Kila mtu aliona kuwa yeye ni mrembo sana.
