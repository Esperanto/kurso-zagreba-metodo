- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Alikunywa kinywaji chake cha asubuhi haraka sana ili awahi shuleni mapema.
- Mi ankoraŭ ne aŭdis novaĵon.: Bado sijasikia habari yoyote.
- En tiu momento Marko ekkriis.: Wakati huo Marko alilia.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Mvulana ambaye hapendi wavulana wengine na wasichana hana marafiki wa kiume wala marafiki wa kike.
