- Ni ordigis ĉion kaj transdonis al ili.: Tuliweka kila kitu kwa utaratibu na kuwakabidhi.
- Mi petas glason da kafo kaj iom da akvo.: Ninaomba glasi ya kahawa na maji kidogo.
- Doloris lin la kapo. Li malsaniĝis.: Kichwa kilimuuma. Akawa mgonjwa.
