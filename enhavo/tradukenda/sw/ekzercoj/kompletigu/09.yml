- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ikiwa ningekuwa na pesa nyingi kama mawazo, ningesafiri kuzunguka ulimwengu.
- En ĉiu vortaro mankas kelkaj vortoj.: Katika kila kamusi baadhi ya maneno hayapo.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Mtu ambaye anaendelea kusimulia hadithi kwa muda mrefu kwenye meza ya dining atabaki na njaa.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Ilibidi asikilize na hakuruhusiwa kukaa nje kwa muda mrefu kwenye mvua. Kwa hivyo alipata baridi.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ana wazo lake wazi, lakini ataamini kila kitu unachosema, kana kwamba wewe ni mke wake.
