- La knabino ĵetis la paperon en la paperujon.: Msichana aliitupa karatasi kwenye kikapu cha karatasi taka.
- Kie estas mia skribilo, mi volas respondi al li.: Kalamu yangu iko wapi? Nataka kumjibu.
- La suno malaperis kaj nun estas preskaŭ malhele.: Jua lilitoweka na sasa ni karibu giza.
- Bonvolu manĝi la panon per manĝilo.: Tafadhali kula mkate na chombo cha kulia.
- Pardonu min, mi ne rajtas resti.: Nisamehe, siruhusiwi kukaa.
