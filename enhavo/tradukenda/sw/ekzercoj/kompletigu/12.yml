- Antaŭ kvarona horo ili revenis.: Walirudi robo saa iliyopita.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Baada ya msiba mbaya, watu walikwenda na miji ya zamani ikaanguka.
- Ni devus revidi nin, mia amiko.: Tunapaswa kuonana tena, rafiki yangu.
- Ju pli ofte mi pripensas, des pli mi koleras.: Kadiri ninavyofikiria juu yake mara nyingi, ndivyo ninavyokuwa na hasira.
- Ŝi loĝas en iu ajn domo.: Anaishi katika nyumba yoyote.
