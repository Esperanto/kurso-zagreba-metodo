- Marko estas en la ĉambro.: மார்கோ அறையில் இருக்கிறார்.
- Li sidas sur seĝo.: அவர் ஒரு நாற்காலியில் அமர்ந்திருக்கிறார்.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: ஒரு ஆசிரியர் கற்பிக்கிறார். ஒரு தொழிலாளி வேலை செய்கிறார். ஒரு மாணவர் கற்றுக்கொள்கிறார்.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: மார்கோ மற்றும் அலெக்ஸாண்ட்ரோ மாணவர்கள் மற்றும் விளையாட்டு வீரர்கள்.
- La patrino de Marko estas instruistino.: மார்கோவின் தாயார் ஒரு ஆசிரியர்.
- La seĝo estas en la ĉambro.: நாற்காலி அறையில் உள்ளது.
- La libro estas de li, ĝi estas lia.: புத்தகம் அவனுடையது; அது அவருடையது.
- Mia nomo estas Marko.: என் பெயர் மார்கோ.
