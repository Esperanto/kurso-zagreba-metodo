- Marko havas amikon kaj amikinon. Ili estas geamikoj.: மார்கோவுக்கு ஒரு ஆண் நண்பனும் ஒரு பெண் நண்பனும் உள்ளனர். அவர்கள் நண்பர்கள்.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: அவர் காபி செய்கிறார், அவர்கள் அதை எங்கள் வீட்டில் குடிக்கிறார்கள்.
- Ili iras al la hotelo.: ஹோட்டலுக்குச் செல்கிறார்கள்.
- Ŝi vidas, ke Marko amas ŝin.: மார்கோ தன்னை நேசிப்பதை அவள் காண்கிறாள்.
- Ili havas facilajn lernolibrojn.: அவர்களிடம் எளிதான பாடப்புத்தகங்கள் உள்ளன.
