- Mia amiko skribas multe.: என் நண்பர் நிறைய எழுதுவார்.
- Bela kelnerino estas belulino.: ஒரு அழகான பணிப்பெண் ஒரு அழகான பெண்.
- Ni havas multajn belajn aferojn.: எங்களிடம் பல அழகான விஷயங்கள் உள்ளன.
- Ni kune lernas en lernejo.: பள்ளியில் ஒன்றாகக் கற்றுக்கொள்கிறோம்.
- Miaj gepatroj manĝas en manĝejo.: என் பெற்றோர் சாப்பாட்டு அறையில் சாப்பிடுகிறார்கள்.
- La kuko estas manĝebla.: கேக் உண்ணக்கூடியது.
