- Ana kaj Marko iris tra la strato.: அனாவும் மார்கோவும் தெருவில் சென்றனர்.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: அவர்கள் ஒரு ஓட்டலுக்கு வந்து, ஒரு மேசைக்குச் சென்று, தந்தை ஒரு நாற்காலியில் அமர்ந்திருப்பதைப் பார்த்தார்கள்.
- Ana metis tri kukojn sur seĝon.: ஆனா ஒரு நாற்காலியில் மூணு கேக் போட்டார்.
- Ŝi remetis poste la kukojn sur la tablon.: பின்னர் அவள் கேக்குகளை மீண்டும் மேசையில் வைத்தாள்.
