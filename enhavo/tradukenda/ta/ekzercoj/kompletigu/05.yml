- Dankon, sinjoro. Nedankinde.: நன்றி ஐயா. நீங்கள் வரவேற்கிறேன்.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: ஒரு மணிநேரம் குறுகியது, ஒரு நாள் நீண்டது, ஒரு மாதம் மிக நீண்டது.
- Mi legas pli multajn librojn ol mia amiko.: எனது நண்பரை விட நான் அதிக புத்தகங்களைப் படிப்பேன்.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: டோக்கியோவில் இருந்தபோது எனது நண்பருக்கு நீண்ட கடிதங்களை அனுப்பினேன்.
- La libro estas leginda.: புத்தகம் படிக்கத் தகுந்தது.
