- La gepatroj ĉiam deziras, ke mi lernu multon.: நான் நிறைய கற்றுக்கொள்ள வேண்டும் என்று பெற்றோர்கள் எப்போதும் விரும்புகிறார்கள்.
- Mia amiko deziras, ke mi iru kanti kun li.: நான் அவருடன் பாட வேண்டும் என்று என் நண்பர் விரும்புகிறார்.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: தந்தை தனது குழந்தை மேஜையில் இருக்கும் கேக்கை சாப்பிட விரும்புகிறார்.
- Ni loĝas en malgranda ĉambro.: நாங்கள் ஒரு சிறிய அறையில் வசிக்கிறோம்.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: உன்னைப் பார்த்ததும் எனக்குப் பதற்றம் ஏற்பட்டது.
- Ĉiuj rimarkis, ke ŝi estas belega.: அவள் மிகவும் அழகாக இருக்கிறாள் என்பதை அனைவரும் கவனித்தனர்.
