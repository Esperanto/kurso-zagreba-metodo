- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: பள்ளிக்கு சீக்கிரம் வர வேண்டும் என்பதற்காக காலை பானத்தை மிக வேகமாக குடித்தார்.
- Mi ankoraŭ ne aŭdis novaĵon.: நான் இதுவரை எந்த செய்தியும் கேட்கவில்லை.
- En tiu momento Marko ekkriis.: அந்த நேரத்தில் மார்கோ அலறினார்.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: மற்ற பையன்களையும் பெண்களையும் நேசிக்காத ஒரு பையனுக்கு ஆண் நண்பர்களோ பெண் நண்பர்களோ இல்லை.
