- Ni ordigis ĉion kaj transdonis al ili.: எல்லாவற்றையும் ஒழுங்குபடுத்தி அவர்களிடம் ஒப்படைத்தோம்.
- Mi petas glason da kafo kaj iom da akvo.: நான் ஒரு கிளாஸ் காபி மற்றும் கொஞ்சம் தண்ணீர் கேட்கிறேன்.
- Doloris lin la kapo. Li malsaniĝis.: அவன் தலை வலித்தது. அவர் நோய்வாய்ப்பட்டார்.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: பெண் அழகாக இருக்க விரும்புகிறாள், அதனால் அவள் முகத்தை அழகுபடுத்துகிறாள்.
