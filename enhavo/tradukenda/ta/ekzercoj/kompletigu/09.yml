- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: என்னிடம் ஐடியாக்கள் அளவுக்கு பணம் இருந்தால், நான் உலகம் முழுவதும் பயணம் செய்வேன்.
- En ĉiu vortaro mankas kelkaj vortoj.: ஒவ்வொரு அகராதியிலும் சில சொற்கள் விடுபட்டுள்ளன.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: டைனிங் டேபிளில் நீண்ட நேரம் கதைத்துக் கொண்டிருப்பவர் பசியுடன் இருப்பார்.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: அவர் கவனம் செலுத்த வேண்டியிருந்தது மற்றும் மழையில் நீண்ட நேரம் வெளியில் இருக்க அனுமதிக்கப்படவில்லை. அதனால் அவருக்கு சளி பிடித்தது.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: அவருக்கு தெளிவான யோசனை இருக்கிறது, ஆனால் நீங்கள் சொல்வதை எல்லாம் அவர் மனைவி போல் நம்புவார்.
