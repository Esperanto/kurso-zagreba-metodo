- En juneco oni havas ankaŭ belecon.: இளமையில் அழகும் உண்டு.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: முதலாளிகள் சிக்கலான வேலைகளை எளிமையாக்க வேண்டும்.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: அந்த வயதில் அவர் ஏற்கனவே ஒரு விளையாட்டுக் கழகத்தின் கிளப் தலைவராக ஆனார்.
- Monon oni metas en monujon.: ஒருவர் பணப்பையில் பணத்தை வைக்கிறார்.
- Sekvu la ekzemplon de la bonaj familianoj.: நல்ல குடும்ப உறுப்பினர்களின் முன்மாதிரியைப் பின்பற்றுங்கள்.
