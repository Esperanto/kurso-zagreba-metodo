- La knabino ĵetis la paperon en la paperujon.: சிறுமி காகிதத்தை கழிவு காகித கூடைக்குள் வீசினாள்.
- Kie estas mia skribilo, mi volas respondi al li.: என் பேனா எங்கே? நான் அவருக்கு பதில் சொல்ல விரும்புகிறேன்.
- La suno malaperis kaj nun estas preskaŭ malhele.: சூரியன் மறைந்து இப்போது இருட்டாகிவிட்டது.
- Bonvolu manĝi la panon per manĝilo.: தயவுசெய்து ரொட்டியை உண்ணும் பாத்திரத்துடன் சாப்பிடுங்கள்.
- Pardonu min, mi ne rajtas resti.: என்னை மன்னியுங்கள், நான் தங்க அனுமதிக்கப்படவில்லை.
