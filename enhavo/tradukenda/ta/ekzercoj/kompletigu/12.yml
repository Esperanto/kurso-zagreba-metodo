- Antaŭ kvarona horo ili revenis.: கால் மணி நேரத்திற்கு முன் திரும்பினர்.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: பயங்கரமான துரதிர்ஷ்டத்திற்குப் பிறகு, மக்கள் வெளியேறினர், பழைய நகரங்கள் இடிந்து விழுந்தன.
- Ni devus revidi nin, mia amiko.: மீண்டும் ஒருவரை ஒருவர் பார்க்க வேண்டும் நண்பரே.
- Ju pli ofte mi pripensas, des pli mi koleras.: அடிக்கடி நினைக்கும் போது கோபம் அதிகமாகிறது.
- Ŝi loĝas en iu ajn domo.: அவள் எந்த வீட்டிலும் வசிக்கிறாள்.
