- prezentaĵo: விளக்கவுரை
- skribaĉi:
  - கிறுக்கி எழுத
  - மோசமாக எழுத
- klarigi: விளக்க
- pretigi:
  - தயார் செய்ய
  - ஆயத்தப்படுத்த
- ĉevalaĉo:
  - மோசமான குதிரை
  - இழிந்த குதிரை
- disdoni: பகிர்ந்து கொடுக்க
- dekono: பத்தில் ஒன்று
- duonigi: பாதியாக்க
- virinaĉo: இழிந்த பெண்
- ĉiumomente:
  - ஒவ்வொரு கணமும்
  - எப்போதும்
- renkontiĝo: சந்திப்பு
- retrovi: மீண்டும் கண்டுபிடிக்க
