Forigu: மீட்டமை
Kompletigu la frazojn: வாக்கியங்களை நிரப்புக
Por la Esperantaj literoj vi ankaŭ rajtas skribi cx, gx, hx, jx, sx kaj ux.: 'எஸ்பெராண்டோ எழுத்துகளை இப்படியும் எழுதலாம்: cx, gx, hx, jx, sx மற்றும் ux.'
Solvu: தீர்க்கவும்
Traduku: மொழிபெயர்க்கவும்
Traduku kaj respondu: மொழிபெயர்த்து பதிலளிக்கவும்
