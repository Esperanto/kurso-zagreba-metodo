- Marko estas en la ĉambro.: మార్కో గదిలో ఉన్నాడు.
- Li sidas sur seĝo.: అతను ఒక కుర్చీలో కూర్చున్నాడు.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: ఒక ఉపాధ్యాయుడు బోధిస్తాడు. ఒక కార్మికుడు పనిచేస్తున్నాడు. ఒక విద్యార్థి నేర్చుకుంటాడు.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: మార్కో మరియు అలెక్సాండ్రో విద్యార్థులు మరియు క్రీడాకారులు.
- La patrino de Marko estas instruistino.: మార్కో తల్లి ఉపాధ్యాయురాలు.
- La seĝo estas en la ĉambro.: కుర్చీ గదిలో ఉంది.
- La libro estas de li, ĝi estas lia.: పుస్తకం అతనికి చెందినది; అది అతనిది.
- Mia nomo estas Marko.: నా పేరు మార్కో.
