- Marko havas amikon kaj amikinon. Ili estas geamikoj.: మార్కోకు ఒక మగ స్నేహితుడు మరియు ఒక ఆడ స్నేహితుడు ఉన్నారు. వాళ్ళు స్నేహితులు.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: అతను కాఫీ చేస్తాడు మరియు మా ఇంట్లో వారు తాగుతారు.
- Ili iras al la hotelo.: వారు హోటల్u200cకి వెళతారు.
- Ŝi vidas, ke Marko amas ŝin.: మార్కో తనను ప్రేమిస్తున్నాడని ఆమె చూస్తుంది.
- Ili havas facilajn lernolibrojn.: వారికి సులభమైన పాఠ్యపుస్తకాలు ఉన్నాయి.
