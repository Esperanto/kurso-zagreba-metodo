- Mia amiko skribas multe.: నా స్నేహితుడు చాలా వ్రాస్తాడు.
- Bela kelnerino estas belulino.: ఒక అందమైన సేవకురాలు ఒక అందమైన మహిళ.
- Ni havas multajn belajn aferojn.: మనకు చాలా అందమైన విషయాలు ఉన్నాయి.
- Ni kune lernas en lernejo.: స్కూల్లో కలిసి నేర్చుకుంటాం.
- Miaj gepatroj manĝas en manĝejo.: నా తల్లిదండ్రులు భోజనాల గదిలో తింటారు.
- La kuko estas manĝebla.: కేక్ తినదగినది.
