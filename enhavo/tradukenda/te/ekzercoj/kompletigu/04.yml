- Ana kaj Marko iris tra la strato.: అనా మరియు మార్కో వీధి వెంట వెళ్ళారు.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: వారు ఒక కేఫ్u200cకి వచ్చి, ఒక టేబుల్u200cకి వెళ్లి, తండ్రి కుర్చీపై కూర్చోవడం చూశారు.
- Ana metis tri kukojn sur seĝon.: అనా ఒక కుర్చీలో మూడు కేకులను ఉంచింది.
- Ŝi remetis poste la kukojn sur la tablon.: తర్వాత ఆమె కేక్u200cలను తిరిగి టేబుల్u200cపై పెట్టింది.
