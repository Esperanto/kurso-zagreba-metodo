- Dankon, sinjoro. Nedankinde.: ధన్యవాదాలు సార్. మీకు స్వాగతం.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: ఒక గంట చిన్నది, ఒక రోజు ఎక్కువ, ఒక నెల ఎక్కువ.
- Mi legas pli multajn librojn ol mia amiko.: నేను నా స్నేహితుడి కంటే ఎక్కువ పుస్తకాలు చదివాను.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: అతను టోక్యోలో ఉన్నప్పుడు నేను నా స్నేహితుడికి సుదీర్ఘ లేఖలు పంపాను.
- La libro estas leginda.: పుస్తకం చదవదగ్గది.
