- La gepatroj ĉiam deziras, ke mi lernu multon.: నేను చాలా నేర్చుకోవాలని తల్లిదండ్రులు ఎప్పుడూ కోరుకుంటారు.
- Mia amiko deziras, ke mi iru kanti kun li.: నేను అతనితో కలిసి పాడాలని నా స్నేహితుడు కోరుకుంటాడు.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: టేబుల్u200cపై ఉన్న కేక్u200cని తన బిడ్డ తినాలని తండ్రి కోరుకుంటాడు.
- Ni loĝas en malgranda ĉambro.: మేము ఒక చిన్న గదిలో నివసిస్తున్నాము.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: నిన్ను చూడగానే నాకు అశాంతి కలిగింది.
- Ĉiuj rimarkis, ke ŝi estas belega.: ఆమె చాలా అందంగా ఉందని అందరూ గమనించారు.
