- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: అతను పాఠశాలకు త్వరగా రావడానికి ఉదయం పానీయం చాలా త్వరగా తాగాడు.
- Mi ankoraŭ ne aŭdis novaĵon.: నేను ఇంకా ఏ వార్త వినలేదు.
- En tiu momento Marko ekkriis.: ఆ సమయంలో మార్కో అరిచాడు.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: ఇతర అబ్బాయిలను మరియు అమ్మాయిలను ప్రేమించని అబ్బాయికి మగ స్నేహితులు లేదా ఆడ స్నేహితులు ఉండరు.
