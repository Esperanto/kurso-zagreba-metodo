- Ni ordigis ĉion kaj transdonis al ili.: అన్నీ సర్దుకుని వారికి అప్పగించాం.
- Mi petas glason da kafo kaj iom da akvo.: నేను ఒక గ్లాసు కాఫీ మరియు కొంచెం నీరు అడుగుతున్నాను.
- Doloris lin la kapo. Li malsaniĝis.: అతని తల గాయపడింది. అతను అనారోగ్యానికి గురయ్యాడు.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: అమ్మాయి అందంగా ఉండటానికి ఇష్టపడుతుంది మరియు ఆ కారణంగా ఆమె తన ముఖాన్ని అందంగా మార్చుకుంటుంది.
