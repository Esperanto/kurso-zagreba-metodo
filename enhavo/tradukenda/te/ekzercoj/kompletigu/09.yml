- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: నా దగ్గర ఐడియాల కంటే ఎక్కువ డబ్బు ఉంటే, నేను ప్రపంచాన్ని చుట్టేస్తాను.
- En ĉiu vortaro mankas kelkaj vortoj.: ప్రతి డిక్షనరీలో కొన్ని పదాలు లేవు.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: డైనింగ్ టేబుల్ దగ్గర ఎక్కువసేపు కథలు చెప్పుకునే వ్యక్తి ఆకలితో ఉంటాడు.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: అతను శ్రద్ధ వహించాల్సి వచ్చింది మరియు వర్షంలో ఎక్కువసేపు బయట ఉండడానికి అనుమతించబడలేదు. అందువల్ల అతనికి జలుబు పట్టింది.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: అతనికి స్పష్టమైన ఆలోచన ఉంది, కానీ మీరు చెప్పే ప్రతిదాన్ని మీరు అతని భార్యలా నమ్ముతారు.
