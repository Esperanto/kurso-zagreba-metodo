- La knabino ĵetis la paperon en la paperujon.: అమ్మాయి ఆ కాగితాన్ని వేస్ట్u200cపేపర్ బుట్టలోకి విసిరింది.
- Kie estas mia skribilo, mi volas respondi al li.: నా పెన్ ఎక్కడ ఉంది? నేను అతనికి సమాధానం చెప్పాలనుకుంటున్నాను.
- La suno malaperis kaj nun estas preskaŭ malhele.: సూర్యుడు అదృశ్యమయ్యాడు మరియు ఇప్పుడు దాదాపు చీకటిగా ఉంది.
- Bonvolu manĝi la panon per manĝilo.: దయచేసి తినే పాత్రతో రొట్టె తినండి.
- Pardonu min, mi ne rajtas resti.: నన్ను క్షమించు, నేను ఉండడానికి అనుమతి లేదు.
