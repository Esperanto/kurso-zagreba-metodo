- Antaŭ kvarona horo ili revenis.: పావుగంట క్రితం తిరిగి వచ్చారు.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: భయంకరమైన దురదృష్టం తరువాత, ప్రజలు దూరంగా వెళ్ళిపోయారు మరియు పాత నగరాలు విడిపోయాయి.
- Ni devus revidi nin, mia amiko.: మనం మళ్ళీ ఒకరినొకరు చూడాలి మిత్రమా.
- Ju pli ofte mi pripensas, des pli mi koleras.: నేను దాని గురించి ఎంత తరచుగా ఆలోచిస్తున్నానో, నాకు కోపం వస్తుంది.
- Ŝi loĝas en iu ajn domo.: ఆమె ఏ ఇంట్లోనైనా నివసిస్తుంది.
