- Marko estas en la ĉambro.: มาร์โคอยู่ในห้อง
- Li sidas sur seĝo.: เขานั่งอยู่บนเก้าอี้
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: ครูสอน. คนงานทำงาน นักเรียนเรียนรู้
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko และ Aleksandro เป็นนักเรียนและนักกีฬา
- La patrino de Marko estas instruistino.: แม่ของมาร์โคเป็นครู
- La seĝo estas en la ĉambro.: เก้าอี้อยู่ในห้อง
- La libro estas de li, ĝi estas lia.: หนังสือเล่มนี้เป็นของเขา มันเป็นของเขา
- Mia nomo estas Marko.: ฉันชื่อมาร์โค
