- Marko havas amikon kaj amikinon. Ili estas geamikoj.: มาร์โคมีเพื่อนชายและเพื่อนหญิง พวกเขาเป็นเพื่อนกัน
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: เขาชงกาแฟและพวกเขาดื่มที่บ้านเรา
- Ili iras al la hotelo.: พวกเขาไปที่โรงแรม
- Ŝi vidas, ke Marko amas ŝin.: เธอเห็นว่ามาร์โครักเธอ
- Ili havas facilajn lernolibrojn.: พวกเขามีตำราเรียนง่าย ๆ
