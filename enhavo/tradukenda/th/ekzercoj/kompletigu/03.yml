- Mia amiko skribas multe.: เพื่อนของฉันเขียนเยอะมาก
- Bela kelnerino estas belulino.: พนักงานเสิร์ฟที่สวยงามก็คือผู้หญิงที่สวย
- Ni havas multajn belajn aferojn.: เรามีสิ่งสวยงามมากมาย
- Ni kune lernas en lernejo.: เราเรียนรู้ร่วมกันที่โรงเรียน
- Miaj gepatroj manĝas en manĝejo.: พ่อแม่ของฉันกินข้าวในห้องอาหาร
- La kuko estas manĝebla.: เค้กก็กินได้
