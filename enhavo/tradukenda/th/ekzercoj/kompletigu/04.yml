- Ana kaj Marko iris tra la strato.: อานาและมาร์โคเดินไปตามถนน
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: พวกเขามาที่ร้านกาแฟ ไปที่โต๊ะ และเห็นพ่อนั่งอยู่บนเก้าอี้
- Ana metis tri kukojn sur seĝon.: อานาวางเค้กสามชิ้นไว้บนเก้าอี้
- Ŝi remetis poste la kukojn sur la tablon.: หลังจากนั้นเธอก็วางเค้กกลับลงบนโต๊ะ
