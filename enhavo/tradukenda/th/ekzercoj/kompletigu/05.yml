- Dankon, sinjoro. Nedankinde.: ขอบคุณท่าน. ด้วยความยินดี.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: หนึ่งชั่วโมงนั้นสั้น หนึ่งวันยาวนานกว่า หนึ่งเดือนนั้นยาวนานที่สุด
- Mi legas pli multajn librojn ol mia amiko.: ฉันอ่านหนังสือมากกว่าเพื่อน
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: ฉันส่งจดหมายยาวๆ ถึงเพื่อนตอนที่เขาอยู่ในโตเกียว
- La libro estas leginda.: หนังสือเล่มนี้น่าอ่าน
