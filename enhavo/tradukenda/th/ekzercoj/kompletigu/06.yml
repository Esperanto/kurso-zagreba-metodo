- La gepatroj ĉiam deziras, ke mi lernu multon.: พ่อแม่มักจะหวังว่าฉันจะเรียนรู้มาก
- Mia amiko deziras, ke mi iru kanti kun li.: เพื่อนของฉันอยากให้ฉันไปร้องเพลงกับเขา
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: พ่ออยากให้ลูกกินเค้กที่อยู่บนโต๊ะ
- Ni loĝas en malgranda ĉambro.: เราอาศัยอยู่ในห้องเล็กๆ
- Mi fariĝis maltrankvila, kiam mi vidis vin.: ฉันรู้สึกไม่สบายใจเมื่อเห็นคุณ
- Ĉiuj rimarkis, ke ŝi estas belega.: ทุกคนสังเกตเห็นว่าเธอสวยมาก
