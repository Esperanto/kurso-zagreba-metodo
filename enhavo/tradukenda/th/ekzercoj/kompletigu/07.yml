- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: เขาดื่มเครื่องดื่มตอนเช้าอย่างรวดเร็วเพื่อมาโรงเรียนแต่เช้า
- Mi ankoraŭ ne aŭdis novaĵon.: ฉันยังไม่ได้ยินข่าวใดๆ
- En tiu momento Marko ekkriis.: ในขณะนั้นมาร์โคก็ร้องไห้ออกมา
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: เด็กผู้ชายที่ไม่รักเด็กผู้ชายและเด็กผู้หญิงคนอื่นไม่มีทั้งเพื่อนชายและเพื่อนหญิง
