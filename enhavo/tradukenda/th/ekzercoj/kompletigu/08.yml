- Ni ordigis ĉion kaj transdonis al ili.: เราจัดทุกอย่างตามลำดับและส่งมอบให้กับพวกเขา
- Mi petas glason da kafo kaj iom da akvo.: ฉันขอกาแฟหนึ่งแก้วและน้ำ
- Doloris lin la kapo. Li malsaniĝis.: หัวของเขาเจ็บ เขาเริ่มป่วย
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: หญิงสาวชอบที่จะสวย และด้วยเหตุนี้เธอจึงตกแต่งใบหน้าของเธอ
