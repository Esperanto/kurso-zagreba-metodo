- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: ถ้าฉันมีเงินมากพอๆ กับความคิด ฉันจะเดินทางไปทั่วโลก
- En ĉiu vortaro mankas kelkaj vortoj.: ในพจนานุกรมทุกฉบับมีคำบางคำหายไป
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: คนที่เอาแต่เล่านิทานที่โต๊ะอาหารนานๆ จะยังคงหิวอยู่
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: เขาต้องเอาใจใส่และไม่ได้รับอนุญาตให้อยู่ข้างนอกกลางสายฝนเป็นเวลานาน เขาจึงเป็นหวัด
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: เขามีความคิดที่ชัดเจน แต่เขาจะเชื่อทุกสิ่งที่คุณพูดราวกับว่าคุณเป็นภรรยาของเขา
