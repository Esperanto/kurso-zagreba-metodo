- La knabino ĵetis la paperon en la paperujon.: หญิงสาวโยนกระดาษลงในตะกร้ากระดาษเสีย
- Kie estas mia skribilo, mi volas respondi al li.: ปากกาของฉันอยู่ที่ไหน? ฉันอยากจะตอบเขา
- La suno malaperis kaj nun estas preskaŭ malhele.: พระอาทิตย์หายไปและตอนนี้ก็เกือบจะมืดแล้ว
- Bonvolu manĝi la panon per manĝilo.: โปรดรับประทานขนมปังพร้อมกับภาชนะรับประทาน
- Pardonu min, mi ne rajtas resti.: ขออภัย ฉันไม่ได้รับอนุญาตให้อยู่
