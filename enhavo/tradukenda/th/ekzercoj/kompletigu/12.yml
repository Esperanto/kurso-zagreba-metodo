- Antaŭ kvarona horo ili revenis.: พวกเขากลับมาเมื่อสี่ชั่วโมงที่แล้ว
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: หลังจากเคราะห์ร้าย ผู้คนก็จากไป และเมืองเก่าก็พังทลายลง
- Ni devus revidi nin, mia amiko.: เราน่าจะได้เจอกันอีกนะเพื่อน
- Ju pli ofte mi pripensas, des pli mi koleras.: ยิ่งฉันคิดถึงมันบ่อยเท่าไร ฉันก็ยิ่งโกรธมากขึ้นเท่านั้น
- Ŝi loĝas en iu ajn domo.: เธออาศัยอยู่ในบ้านใดก็ได้
