- Marko estas en la ĉambro.: Nasa kwarto si Marko.
- Li sidas sur seĝo.: Umupo siya sa isang upuan.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Nagtuturo ang isang guro. Nagtatrabaho ang isang manggagawa. Natututo ang isang estudyante.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Sina Marko at Aleksandro ay mga estudyante at atleta.
- La patrino de Marko estas instruistino.: Ang nanay ni Marko ay isang guro.
- La seĝo estas en la ĉambro.: Ang upuan ay nasa kwarto.
- La libro estas de li, ĝi estas lia.: Ang aklat ay sa kanya; ito ay kanya.
- Mia nomo estas Marko.: Ang pangalan ko ay Marko.
