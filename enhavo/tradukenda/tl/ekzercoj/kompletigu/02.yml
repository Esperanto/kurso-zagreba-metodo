- Marko havas amikon kaj amikinon. Ili estas geamikoj.: May kaibigang lalaki at kaibigang babae si Marko. Magkaibigan sila.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Nagtitimpla siya ng kape at iniinom nila ito sa aming tahanan.
- Ili iras al la hotelo.: Pumunta sila sa hotel.
- Ŝi vidas, ke Marko amas ŝin.: Nakikita niyang mahal siya ni Marko.
- Ili havas facilajn lernolibrojn.: Mayroon silang madaling mga aklat-aralin.
