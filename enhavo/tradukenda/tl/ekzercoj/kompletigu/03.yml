- Mia amiko skribas multe.: Maraming sumusulat ang kaibigan ko.
- Bela kelnerino estas belulino.: Ang isang magandang waitress ay isang magandang babae.
- Ni havas multajn belajn aferojn.: Marami tayong magagandang bagay.
- Ni kune lernas en lernejo.: Sama-sama tayong natututo sa paaralan.
- Miaj gepatroj manĝas en manĝejo.: Ang aking mga magulang ay kumakain sa isang silid-kainan.
- La kuko estas manĝebla.: Nakakain ang cake.
