- Ana kaj Marko iris tra la strato.: Dumaan sina Ana at Marko sa kalye.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Dumating sila sa isang cafe, pumunta sa isang mesa, at nakita ang ama na nakaupo sa isang upuan.
- Ana metis tri kukojn sur seĝon.: Naglagay si Ana ng tatlong cake sa isang upuan.
- Ŝi remetis poste la kukojn sur la tablon.: Maya-maya ay ibinalik niya ang mga cake sa mesa.
