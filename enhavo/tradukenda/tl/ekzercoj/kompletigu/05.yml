- Dankon, sinjoro. Nedankinde.: Salamat po sir. Bahala ka.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Ang isang oras ay maikli, isang araw ay mas mahaba, isang buwan ang pinakamatagal.
- Mi legas pli multajn librojn ol mia amiko.: Mas marami akong nabasang libro kaysa sa kaibigan ko.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Nagpadala ako ng mahabang liham sa aking kaibigan habang siya ay nasa Tokyo.
- La libro estas leginda.: Ang libro ay sulit na basahin.
