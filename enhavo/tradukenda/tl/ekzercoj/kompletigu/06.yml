- La gepatroj ĉiam deziras, ke mi lernu multon.: Laging hinihiling ng mga magulang na marami akong natutunan.
- Mia amiko deziras, ke mi iru kanti kun li.: Nais ng aking kaibigan na sumama ako sa kanya sa pagkanta.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Gusto ng ama na kainin ng kanyang anak ang cake na nasa mesa.
- Ni loĝas en malgranda ĉambro.: Nakatira kami sa isang maliit na kwarto.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: naging uneasy ako nung nakita kita.
- Ĉiuj rimarkis, ke ŝi estas belega.: Napansin ng lahat na napakaganda niya.
