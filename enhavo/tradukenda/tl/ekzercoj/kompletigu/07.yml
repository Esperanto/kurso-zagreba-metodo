- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Mabilis niyang ininom ang kanyang pang-umagang inumin para makarating ng maaga sa paaralan.
- Mi ankoraŭ ne aŭdis novaĵon.: Wala pa akong narinig na balita.
- En tiu momento Marko ekkriis.: Sa pagkakataong iyon ay sumigaw si Marko.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Ang isang batang lalaki na hindi nagmamahal sa ibang mga lalaki at babae ay walang mga kaibigang lalaki o babae.
