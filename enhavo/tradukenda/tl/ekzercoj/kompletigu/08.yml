- Ni ordigis ĉion kaj transdonis al ili.: Inayos namin ang lahat at iniabot sa kanila.
- Mi petas glason da kafo kaj iom da akvo.: Humingi ako ng isang basong kape at tubig.
- Doloris lin la kapo. Li malsaniĝis.: Sumakit ang ulo niya. Nagkasakit siya.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Ang babae ay gustong maging maganda, at sa kadahilanang iyon ay pinaganda niya ang kanyang mukha.
