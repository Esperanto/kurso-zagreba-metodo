- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Kung may pera ako gaya ng mga ideya, maglalakbay ako sa buong mundo.
- En ĉiu vortaro mankas kelkaj vortoj.: Sa bawat diksyunaryo ay may nawawalang mga salita.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ang taong patuloy na nagkukuwento ng mahabang panahon sa hapag kainan ay mananatiling gutom.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Kailangan niyang bigyang pansin at hindi pinayagang manatili sa labas nang matagal sa ulan. Kaya naman nilalamig siya.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Mayroon siyang malinaw na ideya, ngunit paniniwalaan niya ang lahat ng sasabihin mo, na parang asawa ka niya.
