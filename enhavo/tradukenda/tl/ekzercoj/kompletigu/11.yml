- La knabino ĵetis la paperon en la paperujon.: Inihagis ng dalaga ang papel sa basket ng basura.
- Kie estas mia skribilo, mi volas respondi al li.: Nasaan ang aking panulat? Gusto ko siyang sagutin.
- La suno malaperis kaj nun estas preskaŭ malhele.: Nawala ang araw at ngayon ay halos madilim na.
- Bonvolu manĝi la panon per manĝilo.: Mangyaring kainin ang tinapay na may kagamitan sa pagkain.
- Pardonu min, mi ne rajtas resti.: Patawarin mo ako, hindi ako pinapayagang manatili.
