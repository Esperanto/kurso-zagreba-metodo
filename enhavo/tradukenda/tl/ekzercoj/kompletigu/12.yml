- Antaŭ kvarona horo ili revenis.: Bumalik sila quarter of an hour ago.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Matapos ang kakila-kilabot na kasawian, ang mga tao ay umalis at ang mga lumang lungsod ay gumuho.
- Ni devus revidi nin, mia amiko.: Dapat tayong magkita muli, aking kaibigan.
- Ju pli ofte mi pripensas, des pli mi koleras.: Habang madalas ko itong iniisip, lalo akong nagagalit.
- Ŝi loĝas en iu ajn domo.: Nakatira siya sa kahit saang bahay.
