- Marko estas en la ĉambro.: jan Mako li lon tomo.
- Li sidas sur seĝo.: ona li lon supa monsi.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: jan pi pana sona li pana e sona. jan pali li pali. jan kama sona li kama sona.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: jan Mako en jan Alekansanlo li jan kama sona li jan musi pi sijelo.
- La patrino de Marko estas instruistino.: mama meli pi jan Mako li jan pi pana sona.
- La seĝo estas en la ĉambro.: supa monsi li lon tomo.
- La libro estas de li, ĝi estas lia.: lipu li tan ona; ona li ijo ona.
- Mia nomo estas Marko.: nimi mi li Mako.
