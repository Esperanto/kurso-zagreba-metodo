- Marko havas amikon kaj amikinon. Ili estas geamikoj.: jan Mako li jo e jan pona mije e jan pona meli. ona mute li jan pona.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: ona li seli e telo pimeja, li moku e ona lon tomo pi mi mute.
- Ili iras al la hotelo.: ona mute li tawa tomo lape.
- Ŝi vidas, ke Marko amas ŝin.: 'ona li lukin e ni: jan Mako li olin e ona.'
- Ili havas facilajn lernolibrojn.: ona mute li jo e lipu kama sona pi pona lukin.
