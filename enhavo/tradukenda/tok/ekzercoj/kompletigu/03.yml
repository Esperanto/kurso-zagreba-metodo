- Mia amiko skribas multe.: jan pona mi li sitelen mute.
- Bela kelnerino estas belulino.: jan pali meli pi tomo moku li pona lukin li meli pona lukin.
- Ni havas multajn belajn aferojn.: mi mute li jo e ijo pona lukin mute.
- Ni kune lernas en lernejo.: mi mute li kama sona lon tomo sona lon kulupu.
- Miaj gepatroj manĝas en manĝejo.: mama mije en mama meli mi li moku lon tomo moku.
- La kuko estas manĝebla.: pan suwi li ken moku.
