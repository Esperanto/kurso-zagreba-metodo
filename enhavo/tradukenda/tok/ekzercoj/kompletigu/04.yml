- Ana kaj Marko iris tra la strato.: jan Ana en jan Mako li tawa lon nasin.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: ona mute li kama lon tomo pi telo wawa, li tawa supa, li lukin e mama mije lon supa monsi.
- Ana metis tri kukojn sur seĝon.: jan Ana li pana e pan suwi tu wan lon supa monsi.
- Ŝi remetis poste la kukojn sur la tablon.: tenpo kama la ona li pana sin e pan suwi lon supa.
