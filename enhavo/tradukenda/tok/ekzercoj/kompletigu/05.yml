- Dankon, sinjoro. Nedankinde.: pona tawa sina, jan lawa. ike ala.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: tenpo lili li lili, suno li suli mute, mun li suli nanpa wan.
- Mi legas pli multajn librojn ol mia amiko.: mi lukin e lipu mute mute, jan pona mi li lukin e lipu lili.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: 'mi pana e lipu toki suli tawa jan pona mi lon tenpo ni: ona li lon ma tomo Tokyo.'
- La libro estas leginda.: lipu li pona tawa lukin.
