- La gepatroj ĉiam deziras, ke mi lernu multon.: 'mama mute li wile lon tenpo ale e ni: mi kama sona mute.'
- Mia amiko deziras, ke mi iru kanti kun li.: 'jan pona mi li wile e ni: mi tawa kalama musi lon poka ona.'
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: 'mama mije li wile e ni: jan lili ona li moku e pan suwi lon supa.'
- Ni loĝas en malgranda ĉambro.: mi mute li lon tomo lili.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: 'mi kama pilin ike lon tenpo ni: mi lukin e sina.'
- Ĉiuj rimarkis, ke ŝi estas belega.: 'jan ale li lukin e ni: ona li pona lukin mute.'
