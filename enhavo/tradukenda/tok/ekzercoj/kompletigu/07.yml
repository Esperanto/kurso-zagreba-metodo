- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: 'ona li moku wawa e telo ona pi tenpo suno open, tan ni: ona li kama lon tomo sona lon tenpo pini ala.'
- Mi ankoraŭ ne aŭdis novaĵon.: mi kute ala kin e toki sin.
- En tiu momento Marko ekkriis.: lon tenpo ni la jan Mako li mu wawa.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: mije lili li olin ala e meli lili en mije lili ante la ona li jo ala e jan pona mije e jan pona meli.
