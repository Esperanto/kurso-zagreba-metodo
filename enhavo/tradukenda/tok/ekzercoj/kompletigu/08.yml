- Ni ordigis ĉion kaj transdonis al ili.: mi mute li pona e ijo ale li pana e ona tawa ona mute.
- Mi petas glason da kafo kaj iom da akvo.: mi wile e poki pi telo pimeja e telo lili.
- Doloris lin la kapo. Li malsaniĝis.: lawa ona li pilin ike. ona li kama jo e ike sijelo.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: meli lili li wile pona lukin, tan ni la ona li pona lukin e sinpin ona.
