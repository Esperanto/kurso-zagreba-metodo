- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: mi jo e mani mute sama sona mi la mi tawa lon ma ale.
- En ĉiu vortaro mankas kelkaj vortoj.: lon lipu nimi ale la nimi lili li lon ala.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: jan li toki musi lon tenpo suli lon supa moku la ona li awen wile moku.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: ona li wile lukin pona li ken ala awen lon sewi telo lon tenpo suli. tan ni la ona li kama jo e ike pi telo lete.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: 'ona li jo e sona ona pi pona lukin, taso ona li pilin e toki ale sina, sama ni: sina meli ona.'
