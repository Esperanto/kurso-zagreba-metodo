- En juneco oni havas ankaŭ belecon.: lon tenpo pi jan lili la jan li jo kin e pona lukin.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: jan lawa li wile pona e pali ike.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: lon tenpo ni la ona li kama jan lawa pi kulupu musi sijelo.
- Monon oni metas en monujon.: jan li pana e mani lon poki mani.
- Sekvu la ekzemplon de la bonaj familianoj.: o nasin e nasin pona pi jan pona pi kulupu mama.
