- La knabino ĵetis la paperon en la paperujon.: meli lili li pana e lipu tawa poki lipu jaki.
- Kie estas mia skribilo, mi volas respondi al li.: ilo sitelen mi li lon seme? mi wile toki tawa ona.
- La suno malaperis kaj nun estas preskaŭ malhele.: suno li weka, li pimeja lili.
- Bonvolu manĝi la panon per manĝilo.: o moku e pan kepeken ilo moku.
- Pardonu min, mi ne rajtas resti.: o weka e ike mi; mi ken ala awen.
