- Antaŭ kvarona horo ili revenis.: ona mute li kama sin lon tenpo lili pini.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: ike suli li kama pini la jan mute li tawa weka, li ma tomo majuna li pakala.
- Ni devus revidi nin, mia amiko.: mi mute li wile lukin sin e mi mute, jan pona mi.
- Ju pli ofte mi pripensas, des pli mi koleras.: mi pilin mute e ona la mi kama pilin utala mute.
- Ŝi loĝas en iu ajn domo.: ona li lon tomo seme anu seme.
