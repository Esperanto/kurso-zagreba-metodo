- Marko estas en la ĉambro.: Marko odada.
- Li sidas sur seĝo.: Bir sandalyeye oturuyor.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Bir öğretmen öğretiyor. Bir işçi çalışıyor. Bir öğrenci öğrenir.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ve Aleksandro öğrenci ve sporcudur.
- La patrino de Marko estas instruistino.: Marko'nun annesi bir öğretmendir.
- La seĝo estas en la ĉambro.: Sandalye odada.
- La libro estas de li, ĝi estas lia.: Kitap ona aittir; bu onun.
- Mia nomo estas Marko.: Adım Marko.
