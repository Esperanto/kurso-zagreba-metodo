- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko'nun bir erkek arkadaşı, bir de kadın arkadaşı var. Onlar arkadaş.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Kahve yapıyor ve evimizde içiyorlar.
- Ili iras al la hotelo.: Otele giderler.
- Ŝi vidas, ke Marko amas ŝin.: Marko'nun onu sevdiğini görüyor.
- Ili havas facilajn lernolibrojn.: Kolay ders kitapları var.
