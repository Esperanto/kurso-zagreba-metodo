- Mia amiko skribas multe.: Arkadaşım çok yazıyor.
- Bela kelnerino estas belulino.: Güzel bir garson, güzel bir kadındır.
- Ni havas multajn belajn aferojn.: Çok güzel şeylerimiz var.
- Ni kune lernas en lernejo.: Okulda birlikte öğreniyoruz.
- Miaj gepatroj manĝas en manĝejo.: Annem ve babam yemek odasında yemek yiyorlar.
- La kuko estas manĝebla.: Kek yenilebilir.
