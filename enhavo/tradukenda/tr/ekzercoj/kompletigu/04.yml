- Ana kaj Marko iris tra la strato.: Ana ve Marko cadde boyunca ilerlediler.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Bir kafeye geldiler, bir masaya gittiler ve babanın sandalyede oturduğunu gördüler.
- Ana metis tri kukojn sur seĝon.: Ana sandalyeye üç kek koydu.
- Ŝi remetis poste la kukojn sur la tablon.: Daha sonra kekleri tekrar masaya koydu.
