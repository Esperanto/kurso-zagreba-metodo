- Dankon, sinjoro. Nedankinde.: Teşekkür ederim efendim. Rica ederim.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Bir saat kısa, bir gün daha uzun, bir ay ise en uzundur.
- Mi legas pli multajn librojn ol mia amiko.: Arkadaşımdan daha çok kitap okurum.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Arkadaşım Tokyo'dayken ona uzun mektuplar gönderdim.
- La libro estas leginda.: Kitap okumaya değer.
