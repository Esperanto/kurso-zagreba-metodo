- La gepatroj ĉiam deziras, ke mi lernu multon.: Ebeveynler her zaman çok şey öğrenmemi isterler.
- Mia amiko deziras, ke mi iru kanti kun li.: Arkadaşım onunla şarkı söylememi istiyor.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Baba çocuğunun masadaki pastayı yemesini ister.
- Ni loĝas en malgranda ĉambro.: Küçük bir odada yaşıyoruz.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Seni görünce tedirgin oldum.
- Ĉiuj rimarkis, ke ŝi estas belega.: Herkes onun çok güzel olduğunu fark etti.
