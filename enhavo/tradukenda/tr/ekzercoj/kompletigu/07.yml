- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Okula erken gelebilmek için sabah içkisini çok çabuk içti.
- Mi ankoraŭ ne aŭdis novaĵon.: Henüz bir haber duymadım.
- En tiu momento Marko ekkriis.: O anda Marko bağırdı.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Başka erkek ve kızları sevmeyen bir erkeğin ne erkek arkadaşı ne de kız arkadaşı vardır.
