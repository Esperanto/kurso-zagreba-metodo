- Ni ordigis ĉion kaj transdonis al ili.: Her şeyi düzene koyduk ve onlara teslim ettik.
- Mi petas glason da kafo kaj iom da akvo.: Bir bardak kahve ve biraz su istiyorum.
- Doloris lin la kapo. Li malsaniĝis.: Başı ağrıyordu. Hastalandı.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Kız güzel olmayı sever ve bu nedenle yüzünü güzelleştirir.
