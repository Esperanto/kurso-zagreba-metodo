- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Fikirlerim kadar param olsaydı, dünyayı dolaşırdım.
- En ĉiu vortaro mankas kelkaj vortoj.: Her sözlükte bazı kelimeler eksiktir.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Yemek masasında uzun süre hikâye anlatan kişi aç kalacaktır.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Dikkat etmesi gerekiyordu ve yağmurda dışarıda uzun süre kalmasına izin verilmiyordu. Bu nedenle üşüttü.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Onun net bir fikri var ama söylediğin her şeye sanki onun karısımışsın gibi inanacak.
