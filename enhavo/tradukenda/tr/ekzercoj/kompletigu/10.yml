- En juneco oni havas ankaŭ belecon.: Gençlikte insanın güzelliği de vardır.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Patronlar karmaşık işleri basitleştirmeli.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: O yaşta zaten bir spor kulübünün kulüp lideri olmuştu.
- Monon oni metas en monujon.: Biri cüzdanına para koyar.
- Sekvu la ekzemplon de la bonaj familianoj.: İyi aile üyelerinin örneğini takip edin.
