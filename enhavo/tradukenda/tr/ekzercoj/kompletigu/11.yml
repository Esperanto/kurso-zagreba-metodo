- La knabino ĵetis la paperon en la paperujon.: Kız kağıdı atık kağıt sepetine attı.
- Kie estas mia skribilo, mi volas respondi al li.: Kalemim nerede? Ona cevap vermek istiyorum.
- La suno malaperis kaj nun estas preskaŭ malhele.: Güneş kayboldu ve artık neredeyse karanlık.
- Bonvolu manĝi la panon per manĝilo.: Lütfen ekmeği bir yemek kabıyla yiyin.
- Pardonu min, mi ne rajtas resti.: Bağışlayın, kalmama izin verilmiyor.
