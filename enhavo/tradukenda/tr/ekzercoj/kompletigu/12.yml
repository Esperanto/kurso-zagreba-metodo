- Antaŭ kvarona horo ili revenis.: Çeyrek saat önce döndüler.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Korkunç talihsizliğin ardından insanlar gitti ve eski şehirler yıkıldı.
- Ni devus revidi nin, mia amiko.: Birbirimizi tekrar görmeliyiz dostum.
- Ju pli ofte mi pripensas, des pli mi koleras.: Bunu ne kadar sık düşünürsem o kadar öfkeleniyorum.
- Ŝi loĝas en iu ajn domo.: Herhangi bir evde yaşıyor.
