- Marko estas en la ĉambro.: Марко в кімнаті.
- Li sidas sur seĝo.: Він сідає на стілець.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Викладає вчитель. Працює робітник. Студент навчається.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Марко та Александро – студенти та спортсмени.
- La patrino de Marko estas instruistino.: Мама Марка – вчителька.
- La seĝo estas en la ĉambro.: Крісло в кімнаті.
- La libro estas de li, ĝi estas lia.: Книга належить йому; це його.
- Mia nomo estas Marko.: Мене звуть Марко.
