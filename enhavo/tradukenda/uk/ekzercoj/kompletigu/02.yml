- Marko havas amikon kaj amikinon. Ili estas geamikoj.: У Марко є друг і подруга. Вони друзі.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Він варить каву, і вони п’ють її в нас вдома.
- Ili iras al la hotelo.: Вони їдуть до готелю.
- Ŝi vidas, ke Marko amas ŝin.: Вона бачить, що Марко її любить.
- Ili havas facilajn lernolibrojn.: У них легкі підручники.
