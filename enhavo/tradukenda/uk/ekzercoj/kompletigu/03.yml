- Mia amiko skribas multe.: Мій друг багато пише.
- Bela kelnerino estas belulino.: Красива офіціантка - красива жінка.
- Ni havas multajn belajn aferojn.: У нас є багато красивих речей.
- Ni kune lernas en lernejo.: Ми вчимося разом у школі.
- Miaj gepatroj manĝas en manĝejo.: Мої батьки їдять в їдальні.
- La kuko estas manĝebla.: Торт їстівний.
