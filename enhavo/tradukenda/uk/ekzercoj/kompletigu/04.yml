- Ana kaj Marko iris tra la strato.: Анна і Марко пішли вулицею.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Прийшли в кафе, підійшли до столика і побачили, що батько сидить на стільці.
- Ana metis tri kukojn sur seĝon.: Ана поклала на стілець три тістечка.
- Ŝi remetis poste la kukojn sur la tablon.: Пізніше вона знову поставила тістечка на стіл.
