- Dankon, sinjoro. Nedankinde.: Дякую, сер. Ні за що.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Година коротша, день довший, місяць найдовший.
- Mi legas pli multajn librojn ol mia amiko.: Я читаю більше книг, ніж мій друг.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Я надсилав довгі листи своєму другові, коли він був у Токіо.
- La libro estas leginda.: Книга варта прочитання.
