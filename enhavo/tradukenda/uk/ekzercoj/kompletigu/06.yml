- La gepatroj ĉiam deziras, ke mi lernu multon.: Батьки завжди бажають, щоб я багато вчився.
- Mia amiko deziras, ke mi iru kanti kun li.: Мій друг хоче, щоб я пішла з ним заспівати.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Батько хоче, щоб його дитина з'їла торт, який стоїть на столі.
- Ni loĝas en malgranda ĉambro.: Ми живемо в маленькій кімнаті.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Мені стало не по собі, коли я тебе побачив.
- Ĉiuj rimarkis, ke ŝi estas belega.: Всі помітили, що вона дуже красива.
