- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Він дуже швидко випив свій ранковий напій, щоб прийти раніше до школи.
- Mi ankoraŭ ne aŭdis novaĵon.: Я ще не чув жодних новин.
- En tiu momento Marko ekkriis.: У цю мить Марко скрикнув.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Хлопець, який не любить інших хлопців і дівчат, не має ні друзів, ні друзів.
