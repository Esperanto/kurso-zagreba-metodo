- Ni ordigis ĉion kaj transdonis al ili.: Ми все привели в порядок і передали їм.
- Mi petas glason da kafo kaj iom da akvo.: Я прошу склянку кави і трохи води.
- Doloris lin la kapo. Li malsaniĝis.: Боліла голова. Йому стало погано.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Дівчина любить бути красивою, і тому вона прикрашає своє обличчя.
