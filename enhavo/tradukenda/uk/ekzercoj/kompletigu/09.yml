- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Якби у мене було стільки грошей, скільки ідей, я б подорожував навколо світу.
- En ĉiu vortaro mankas kelkaj vortoj.: У кожному словнику бракує деяких слів.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Людина, яка довго розповідає за обіднім столом, залишиться голодною.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Йому доводилося бути уважним, і йому не дозволяли довго залишатися надворі під дощем. Тому він застудився.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: У нього є своє чітке уявлення, але він повірить всьому, що ви скажете, як якщо б ви його дружина.
