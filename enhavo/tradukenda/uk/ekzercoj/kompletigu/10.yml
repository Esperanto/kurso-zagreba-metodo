- En juneco oni havas ankaŭ belecon.: В молодості теж є краса.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Начальство має спростити складну роботу.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: У цьому віці він уже став керівником клубу спортивного клубу.
- Monon oni metas en monujon.: Один кладе гроші в гаманець.
- Sekvu la ekzemplon de la bonaj familianoj.: Беріть приклад з хороших членів сім’ї.
