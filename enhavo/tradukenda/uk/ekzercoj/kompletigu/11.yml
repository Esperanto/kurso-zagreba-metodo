- La knabino ĵetis la paperon en la paperujon.: Дівчина викинула папір у кошик для паперів.
- Kie estas mia skribilo, mi volas respondi al li.: Де моя ручка? Я хочу йому відповісти.
- La suno malaperis kaj nun estas preskaŭ malhele.: Сонце сховалося, і тепер майже темно.
- Bonvolu manĝi la panon per manĝilo.: Будь ласка, їжте хліб столовим посудом.
- Pardonu min, mi ne rajtas resti.: Вибачте, мені заборонено залишатися.
