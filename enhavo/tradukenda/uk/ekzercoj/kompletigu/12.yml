- Antaŭ kvarona horo ili revenis.: Вони повернулися чверть години тому.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Після страшної біди люди розійшлися, а старі міста розпалися.
- Ni devus revidi nin, mia amiko.: Ми повинні знову побачитися, друже.
- Ju pli ofte mi pripensas, des pli mi koleras.: Чим частіше я думаю про це, тим більше злюся.
- Ŝi loĝas en iu ajn domo.: Вона живе в будь-якому будинку.
