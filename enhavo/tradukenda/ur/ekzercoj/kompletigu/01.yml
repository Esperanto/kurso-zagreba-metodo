- Marko estas en la ĉambro.: مارکو کمرے میں ہے۔
- Li sidas sur seĝo.: وہ کرسی پر بیٹھتا ہے۔
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: ایک استاد پڑھاتا ہے۔ ایک کارکن کام کرتا ہے۔ ایک طالب علم سیکھتا ہے۔
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: مارکو اور الیگزینڈرو طالب علم اور کھلاڑی ہیں۔
- La patrino de Marko estas instruistino.: مارکو کی والدہ ایک ٹیچر ہیں۔
- La seĝo estas en la ĉambro.: کرسی کمرے میں ہے۔
- La libro estas de li, ĝi estas lia.: کتاب اس کی ہے۔ یہ اس کا ہے.
- Mia nomo estas Marko.: میرا نام مارکو ہے۔
