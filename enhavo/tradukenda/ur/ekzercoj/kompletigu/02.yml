- Marko havas amikon kaj amikinon. Ili estas geamikoj.: مارکو کا ایک مرد دوست اور ایک خاتون دوست ہے۔ وہ دوست ہیں۔
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: وہ کافی بناتا ہے اور وہ ہمارے گھر میں پیتے ہیں۔
- Ili iras al la hotelo.: وہ ہوٹل جاتے ہیں۔
- Ŝi vidas, ke Marko amas ŝin.: وہ دیکھتی ہے کہ مارکو اس سے پیار کرتا ہے۔
- Ili havas facilajn lernolibrojn.: ان کے پاس آسان نصابی کتابیں ہیں۔
