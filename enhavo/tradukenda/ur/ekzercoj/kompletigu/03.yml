- Mia amiko skribas multe.: میرا دوست بہت لکھتا ہے۔
- Bela kelnerino estas belulino.: ایک خوبصورت ویٹریس ایک خوبصورت عورت ہے۔
- Ni havas multajn belajn aferojn.: ہمارے پاس بہت سی خوبصورت چیزیں ہیں۔
- Ni kune lernas en lernejo.: ہم اسکول میں ایک ساتھ سیکھتے ہیں۔
- Miaj gepatroj manĝas en manĝejo.: میرے والدین کھانے کے کمرے میں کھاتے ہیں۔
- La kuko estas manĝebla.: کیک کھانے کے قابل ہے۔
