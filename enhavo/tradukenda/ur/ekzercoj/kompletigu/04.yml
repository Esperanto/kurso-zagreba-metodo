- Ana kaj Marko iris tra la strato.: انا اور مارکو سڑک کے ساتھ ساتھ چلے گئے۔
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: وہ ایک کیفے میں آئے، ایک میز پر گئے، اور والد کو کرسی پر بیٹھے دیکھا۔
- Ana metis tri kukojn sur seĝon.: عنا نے ایک کرسی پر تین کیک رکھے۔
- Ŝi remetis poste la kukojn sur la tablon.: اس نے بعد میں کیک واپس میز پر رکھ دیا۔
