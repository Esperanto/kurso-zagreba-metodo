- Dankon, sinjoro. Nedankinde.: شکریہ جناب۔ آپ کا استقبال ہے۔
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: ایک گھنٹہ چھوٹا ہے، ایک دن لمبا ہے، ایک مہینہ سب سے طویل ہے۔
- Mi legas pli multajn librojn ol mia amiko.: میں اپنے دوست سے زیادہ کتابیں پڑھتا ہوں۔
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: میں نے اپنے دوست کو طویل خطوط بھیجے جب وہ ٹوکیو میں تھا۔
- La libro estas leginda.: کتاب پڑھنے کے قابل ہے۔
