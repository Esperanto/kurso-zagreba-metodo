- La gepatroj ĉiam deziras, ke mi lernu multon.: والدین کی ہمیشہ خواہش ہوتی ہے کہ میں بہت کچھ سیکھوں۔
- Mia amiko deziras, ke mi iru kanti kun li.: میرے دوست کی خواہش ہے کہ میں اس کے ساتھ گاوں۔
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: باپ چاہتا ہے کہ اس کا بچہ میز پر پڑا کیک کھائے۔
- Ni loĝas en malgranda ĉambro.: ہم ایک چھوٹے سے کمرے میں رہتے ہیں۔
- Mi fariĝis maltrankvila, kiam mi vidis vin.: آپ کو دیکھ کر میں بے چین ہو گیا۔
- Ĉiuj rimarkis, ke ŝi estas belega.: سب نے دیکھا کہ وہ بہت خوبصورت ہے۔
