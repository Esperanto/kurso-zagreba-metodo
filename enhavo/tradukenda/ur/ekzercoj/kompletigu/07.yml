- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: اسکول جلدی آنے کے لیے اس نے صبح کا مشروب بہت جلدی پیا۔
- Mi ankoraŭ ne aŭdis novaĵon.: میں نے ابھی تک کوئی خبر نہیں سنی۔
- En tiu momento Marko ekkriis.: اسی لمحے مارکو نے پکارا۔
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: جو لڑکا دوسرے لڑکوں اور لڑکیوں سے محبت نہیں کرتا اس کے نہ مرد دوست ہوتے ہیں اور نہ ہی عورت دوست۔
