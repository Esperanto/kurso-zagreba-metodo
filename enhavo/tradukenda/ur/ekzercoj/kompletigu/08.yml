- Ni ordigis ĉion kaj transdonis al ili.: ہم نے سب کچھ ترتیب دے کر ان کے حوالے کر دیا۔
- Mi petas glason da kafo kaj iom da akvo.: میں ایک گلاس کافی اور کچھ پانی مانگتا ہوں۔
- Doloris lin la kapo. Li malsaniĝis.: اس کے سر میں چوٹ لگی۔ وہ بیمار ہو گیا۔
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: لڑکی خوبصورت بننا پسند کرتی ہے، اور اسی وجہ سے وہ اپنے چہرے کو خوبصورت بناتی ہے۔
