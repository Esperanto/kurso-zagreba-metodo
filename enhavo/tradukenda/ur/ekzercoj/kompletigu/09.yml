- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: اگر میرے پاس خیالات جتنا پیسہ ہوتا تو میں پوری دنیا کا سفر کرتا۔
- En ĉiu vortaro mankas kelkaj vortoj.: ہر لغت میں کچھ الفاظ غائب ہیں۔
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: جو شخص کھانے کی میز پر دیر تک کہانیاں سناتا رہے وہ بھوکا رہے گا۔
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: اسے دھیان دینا پڑا اور بارش میں زیادہ دیر باہر رہنے کی اجازت نہیں تھی۔ اس لیے اسے سردی لگ گئی۔
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: اس کا اپنا واضح خیال ہے، لیکن وہ آپ کی ہر بات پر یقین کرے گا، گویا آپ اس کی بیوی ہیں۔
