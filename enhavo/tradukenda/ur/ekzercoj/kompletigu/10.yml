- En juneco oni havas ankaŭ belecon.: جوانی میں حسن بھی ہوتا ہے۔
- Malsimplajn laborojn ĉefoj devus plisimpligi.: مالکان کو پیچیدہ کاموں کو آسان بنانا چاہیے۔
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: اس عمر میں وہ پہلے ہی ایک اسپورٹس کلب کے کلب لیڈر بن چکے تھے۔
- Monon oni metas en monujon.: ایک بٹوے میں پیسے ڈالتا ہے۔
- Sekvu la ekzemplon de la bonaj familianoj.: اچھے خاندان کے افراد کی مثال پر عمل کریں۔
