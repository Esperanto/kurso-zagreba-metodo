- La knabino ĵetis la paperon en la paperujon.: لڑکی نے کاغذ ویسٹ پیپر کی ٹوکری میں پھینک دیا۔
- Kie estas mia skribilo, mi volas respondi al li.: میرا قلم کہاں ہے؟ میں اسے جواب دینا چاہتا ہوں۔
- La suno malaperis kaj nun estas preskaŭ malhele.: سورج غائب ہو گیا اور اب تقریباً اندھیرا ہو چکا ہے۔
- Bonvolu manĝi la panon per manĝilo.: براہ کرم کھانے کے برتن کے ساتھ روٹی کھائیں۔
- Pardonu min, mi ne rajtas resti.: مجھے معاف کر دو، مجھے رہنے کی اجازت نہیں ہے۔
