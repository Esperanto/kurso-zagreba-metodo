- Antaŭ kvarona horo ili revenis.: وہ ایک چوتھائی گھنٹہ پہلے واپس آئے تھے۔
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: خوفناک بدقسمتی کے بعد، لوگ چلے گئے اور پرانے شہر ٹوٹ گئے.
- Ni devus revidi nin, mia amiko.: ہمیں ایک دوسرے کو دوبارہ دیکھنا چاہیے، میرے دوست۔
- Ju pli ofte mi pripensas, des pli mi koleras.: جتنی بار میں اس کے بارے میں سوچتا ہوں، اتنا ہی غصہ آتا جاتا ہوں۔
- Ŝi loĝas en iu ajn domo.: وہ کسی بھی گھر میں رہتی ہے۔
