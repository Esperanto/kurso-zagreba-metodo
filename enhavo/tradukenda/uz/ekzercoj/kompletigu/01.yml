- Marko estas en la ĉambro.: Marko xonada.
- Li sidas sur seĝo.: U stulda o'tiradi.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: O'qituvchi dars beradi. Ishchi ishlaydi. Talaba o'rganadi.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko va Aleksandro talabalar va sportchilardir.
- La patrino de Marko estas instruistino.: Markoning onasi o'qituvchi.
- La seĝo estas en la ĉambro.: Stul xonada.
- La libro estas de li, ĝi estas lia.: Kitob unga tegishli; bu uniki.
- Mia nomo estas Marko.: Mening ismim Marko.
