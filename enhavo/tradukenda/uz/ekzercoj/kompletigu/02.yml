- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Markoning erkak do'sti va ayol do'sti bor. Ular do'st.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: U qahva damlaydi va ular uni bizning uyimizda ichishadi.
- Ili iras al la hotelo.: Ular mehmonxonaga borishadi.
- Ŝi vidas, ke Marko amas ŝin.: U Marko uni sevishini ko'radi.
- Ili havas facilajn lernolibrojn.: Ularda oson darsliklar bor.
