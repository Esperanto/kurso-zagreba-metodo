- Mia amiko skribas multe.: Do'stim ko'p yozadi.
- Bela kelnerino estas belulino.: Chiroyli ofitsiant - go'zal ayol.
- Ni havas multajn belajn aferojn.: Bizda juda ko'p chiroyli narsalar bor.
- Ni kune lernas en lernejo.: Biz maktabda birga o'qiymiz.
- Miaj gepatroj manĝas en manĝejo.: Ota-onam ovqat xonasida ovqatlanishadi.
- La kuko estas manĝebla.: Tort yeyish mumkin.
