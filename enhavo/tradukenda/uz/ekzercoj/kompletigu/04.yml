- Ana kaj Marko iris tra la strato.: Ana va Marko ko'cha bo'ylab ketishdi.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Ular kafega kelishdi, stolga borishdi va stulda o'tirgan otani ko'rishdi.
- Ana metis tri kukojn sur seĝon.: Ana stulga uchta tort qo'ydi.
- Ŝi remetis poste la kukojn sur la tablon.: Keyinroq u keklarni yana stolga qo'ydi.
