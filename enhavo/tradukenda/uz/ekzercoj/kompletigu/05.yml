- Dankon, sinjoro. Nedankinde.: Rahmat, ser. Salomat bo'ling.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Bir soat qisqa, bir kun uzoq, bir oy eng uzun.
- Mi legas pli multajn librojn ol mia amiko.: Men do'stimdan ko'ra ko'proq kitob o'qiyman.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Do'stim Tokioda bo'lganida unga uzun maktublar yubordim.
- La libro estas leginda.: Kitob o'qishga arziydi.
