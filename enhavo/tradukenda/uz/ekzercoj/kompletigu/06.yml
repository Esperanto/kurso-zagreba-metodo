- La gepatroj ĉiam deziras, ke mi lernu multon.: Ota-onalar har doim ko'p narsalarni o'rganishimni xohlashadi.
- Mia amiko deziras, ke mi iru kanti kun li.: Do'stim u bilan birga qo'shiq aytishimni xohlaydi.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Ota farzandiga dasturxon ustida turgan tortni yeyishini xohlaydi.
- Ni loĝas en malgranda ĉambro.: Biz kichkina xonada yashaymiz.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Sizni ko'rganimda bezovta bo'ldim.
- Ĉiuj rimarkis, ke ŝi estas belega.: Uning juda chiroyli ekanligini hamma payqadi.
