- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: U maktabga erta kelish uchun ertalabki ichimlikni juda tez ichdi.
- Mi ankoraŭ ne aŭdis novaĵon.: Men hali hech qanday yangilik eshitmadim.
- En tiu momento Marko ekkriis.: Shu payt Marko baqirib yubordi.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Boshqa o'g'il va qizlarni sevmaydigan bolaning na erkak do'stlari, na ayol do'stlari bo'ladi.
