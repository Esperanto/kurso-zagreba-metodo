- Ni ordigis ĉion kaj transdonis al ili.: Hammasini tartibga solib, ularga topshirdik.
- Mi petas glason da kafo kaj iom da akvo.: Men bir stakan qahva va suv so'rayman.
- Doloris lin la kapo. Li malsaniĝis.: Boshi og'ridi. U kasal bo'lib qoldi.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Qiz go'zal bo'lishni yaxshi ko'radi va shuning uchun u yuzini chiroyli qiladi.
