- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Agar g'oyalarimdek pulim bo'lsa, dunyo bo'ylab sayohat qilgan bo'lardim.
- En ĉiu vortaro mankas kelkaj vortoj.: Har bir lug'atda ba'zi so'zlar yo'q.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Ovqatlanish stolida uzoq vaqt hikoya aytib turadigan odam och qoladi.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: U diqqat qilish kerak edi va yomg'ir ostida uzoq vaqt tashqarida qolishga ruxsat berilmadi. Shuning uchun u shamolladi.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Uning aniq g'oyasi bor, lekin u sizning xotiningiz kabi hamma gapingizga ishonadi.
