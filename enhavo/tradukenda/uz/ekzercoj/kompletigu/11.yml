- La knabino ĵetis la paperon en la paperujon.: Qiz qog'ozni qog'oz savatiga tashladi.
- Kie estas mia skribilo, mi volas respondi al li.: Mening qalam qayerda? Men unga javob bermoqchiman.
- La suno malaperis kaj nun estas preskaŭ malhele.: Quyosh g'oyib bo'ldi va endi deyarli qorong'i.
- Bonvolu manĝi la panon per manĝilo.: Iltimos, nonni idish bilan iste'mol qiling.
- Pardonu min, mi ne rajtas resti.: Meni kechiring, qolishimga ruxsat yo'q.
