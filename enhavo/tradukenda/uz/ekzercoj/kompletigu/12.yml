- Antaŭ kvarona horo ili revenis.: Ular chorak soat oldin qaytib kelishdi.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Dahshatli baxtsizlikdan keyin odamlar ketdi va eski shaharlar parchalanib ketdi.
- Ni devus revidi nin, mia amiko.: Biz yana bir-birimizni ko'rishimiz kerak, do'stim.
- Ju pli ofte mi pripensas, des pli mi koleras.: Bu haqda qanchalik tez-tez o'ylasam, shunchalik g'azablanaman.
- Ŝi loĝas en iu ajn domo.: U har qanday uyda yashaydi.
