- Marko estas en la ĉambro.: Marko đang ở trong phòng.
- Li sidas sur seĝo.: Anh ấy ngồi trên một chiếc ghế.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Một giáo viên dạy. Một công nhân làm việc. Một học sinh học.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko và Aleksandro là sinh viên và vận động viên.
- La patrino de Marko estas instruistino.: Mẹ của Marko là giáo viên.
- La seĝo estas en la ĉambro.: Cái ghế ở trong phòng.
- La libro estas de li, ĝi estas lia.: Cuốn sách thuộc về anh ấy; nó là của anh ấy.
- Mia nomo estas Marko.: Tên tôi là Marko.
