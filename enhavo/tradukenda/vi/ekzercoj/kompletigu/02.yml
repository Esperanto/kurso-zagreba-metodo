- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko có một người bạn nam và một người bạn nữ. Họ là bạn bè.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Anh ấy pha cà phê và họ uống nó ở nhà chúng tôi.
- Ili iras al la hotelo.: Họ đi đến khách sạn.
- Ŝi vidas, ke Marko amas ŝin.: Cô ấy thấy rằng Marko yêu cô ấy.
- Ili havas facilajn lernolibrojn.: Họ có sách giáo khoa dễ dàng.
