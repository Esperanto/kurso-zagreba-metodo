- Mia amiko skribas multe.: Bạn tôi viết rất nhiều.
- Bela kelnerino estas belulino.: Một cô hầu bàn xinh đẹp là một người phụ nữ xinh đẹp.
- Ni havas multajn belajn aferojn.: Chúng tôi có nhiều điều đẹp đẽ.
- Ni kune lernas en lernejo.: Chúng tôi học cùng nhau ở trường.
- Miaj gepatroj manĝas en manĝejo.: Bố mẹ tôi ăn trong phòng ăn.
- La kuko estas manĝebla.: Bánh ăn được.
