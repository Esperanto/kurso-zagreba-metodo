- Ana kaj Marko iris tra la strato.: Ana và Marko đi dọc phố.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Họ đến một quán cà phê, tới một chiếc bàn và nhìn thấy người cha đang ngồi trên ghế.
- Ana metis tri kukojn sur seĝon.: Ana đặt ba chiếc bánh lên ghế.
- Ŝi remetis poste la kukojn sur la tablon.: Sau đó cô ấy đặt những chiếc bánh trở lại bàn.
