- Dankon, sinjoro. Nedankinde.: Cảm ơn ông. Không có gì.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Một giờ thì ngắn, một ngày thì dài, một tháng thì dài nhất.
- Mi legas pli multajn librojn ol mia amiko.: Tôi đọc nhiều sách hơn bạn tôi.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Tôi đã gửi những bức thư dài cho bạn tôi khi anh ấy ở Tokyo.
- La libro estas leginda.: Cuốn sách đáng đọc.
