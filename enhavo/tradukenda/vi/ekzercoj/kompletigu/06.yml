- La gepatroj ĉiam deziras, ke mi lernu multon.: Cha mẹ luôn mong con học được nhiều điều.
- Mia amiko deziras, ke mi iru kanti kun li.: Bạn tôi ước tôi đi hát cùng anh ấy.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Người cha muốn con mình ăn chiếc bánh trên bàn.
- Ni loĝas en malgranda ĉambro.: Chúng tôi sống trong một căn phòng nhỏ.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Tôi trở nên khó chịu khi nhìn thấy bạn.
- Ĉiuj rimarkis, ke ŝi estas belega.: Mọi người đều nhận thấy cô ấy rất xinh đẹp.
