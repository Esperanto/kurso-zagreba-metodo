- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Anh ấy uống đồ uống buổi sáng rất nhanh để đến trường sớm.
- Mi ankoraŭ ne aŭdis novaĵon.: Tôi vẫn chưa nghe được tin tức gì.
- En tiu momento Marko ekkriis.: Đúng lúc đó Marko hét lên.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Một chàng trai không yêu những chàng trai, cô gái khác thì không có bạn nam cũng như bạn nữ.
