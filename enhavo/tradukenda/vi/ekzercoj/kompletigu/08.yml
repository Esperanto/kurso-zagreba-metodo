- Ni ordigis ĉion kaj transdonis al ili.: Chúng tôi sắp xếp mọi thứ theo thứ tự và giao nó cho họ.
- Mi petas glason da kafo kaj iom da akvo.: Tôi yêu cầu một ly cà phê và một ít nước.
- Doloris lin la kapo. Li malsaniĝis.: Đầu anh đau quá. Anh ấy bị bệnh.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Cô gái thích làm đẹp nên khuôn mặt cũng vì vậy mà được làm đẹp.
