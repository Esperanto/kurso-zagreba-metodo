- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Nếu tôi có nhiều tiền như ý tưởng, tôi sẽ đi du lịch vòng quanh thế giới.
- En ĉiu vortaro mankas kelkaj vortoj.: Trong mỗi từ điển đều có một số từ bị thiếu.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Người ngồi kể chuyện lâu trên bàn ăn sẽ vẫn đói.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Anh phải chú ý và không được phép ở ngoài trời mưa lâu. Vì thế anh bị cảm lạnh.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Anh ấy có ý tưởng rõ ràng của mình, nhưng anh ấy sẽ tin mọi điều bạn nói, như thể bạn là vợ anh ấy.
