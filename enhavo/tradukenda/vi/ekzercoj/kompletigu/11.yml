- La knabino ĵetis la paperon en la paperujon.: Cô gái ném tờ giấy vào thùng rác.
- Kie estas mia skribilo, mi volas respondi al li.: Cây bút của tôi đâu? Tôi muốn trả lời anh ấy.
- La suno malaperis kaj nun estas preskaŭ malhele.: Mặt trời đã biến mất và bây giờ trời gần như tối.
- Bonvolu manĝi la panon per manĝilo.: Hãy ăn bánh mì bằng dụng cụ ăn uống.
- Pardonu min, mi ne rajtas resti.: Hãy tha thứ cho tôi, tôi không được phép ở lại.
