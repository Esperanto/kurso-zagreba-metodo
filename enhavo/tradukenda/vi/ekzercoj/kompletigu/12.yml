- Antaŭ kvarona horo ili revenis.: Họ đã quay lại cách đây mười lăm phút.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Sau nỗi bất hạnh khủng khiếp, người dân bỏ đi và các thành phố cổ sụp đổ.
- Ni devus revidi nin, mia amiko.: Chúng ta nên gặp lại nhau, bạn của tôi.
- Ju pli ofte mi pripensas, des pli mi koleras.: Càng nghĩ về điều đó nhiều, tôi càng trở nên tức giận.
- Ŝi loĝas en iu ajn domo.: Cô ấy sống ở bất kỳ ngôi nhà nào.
