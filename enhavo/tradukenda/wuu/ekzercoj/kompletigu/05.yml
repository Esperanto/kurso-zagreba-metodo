- Dankon, sinjoro. Nedankinde.: 谢谢您，先生。不客气。
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: 一小时短，一天长，一个月最长。
- Mi legas pli multajn librojn ol mia amiko.: 我比我朋友读的书还多。
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: 当我的朋友在东京时，我给他写了一封长信。
- La libro estas leginda.: 这本书值得一读。
