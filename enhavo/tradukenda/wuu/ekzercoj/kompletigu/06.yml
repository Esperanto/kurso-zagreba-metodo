- La gepatroj ĉiam deziras, ke mi lernu multon.: 父母总是希望我学到很多东西。
- Mia amiko deziras, ke mi iru kanti kun li.: 我的朋友希望我和他一起去唱歌。
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: 父亲想让他的孩子吃桌上的蛋糕。
- Ni loĝas en malgranda ĉambro.: 我们住在一个小房间里。
- Mi fariĝis maltrankvila, kiam mi vidis vin.: 当我看到你时我变得不安。
- Ĉiuj rimarkis, ke ŝi estas belega.: 大家都注意到她非常漂亮。
