- Marko estas en la ĉambro.: Marko wa ninu yara naa.
- Li sidas sur seĝo.: O joko lori aga.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Olukọni nkọni. Osise kan n ṣiṣẹ. Ọmọ ile-iwe kọ ẹkọ.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko ati Aleksandro jẹ ọmọ ile-iwe ati elere idaraya.
- La patrino de Marko estas instruistino.: Iya Marko jẹ olukọ.
- La seĝo estas en la ĉambro.: Alaga wa ninu yara naa.
- La libro estas de li, ĝi estas lia.: Tirẹ̀ ni ìwé náà; tirẹ̀ ni.
- Mia nomo estas Marko.: Orukọ mi ni Marko.
