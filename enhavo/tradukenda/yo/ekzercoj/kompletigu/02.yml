- Marko havas amikon kaj amikinon. Ili estas geamikoj.: Marko ni ọrẹ akọ ati ọrẹbinrin kan. Wọn jẹ ọrẹ.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Ó ń ṣe kọfí, wọ́n sì máa ń mu nínú ilé wa.
- Ili iras al la hotelo.: Wọn lọ si hotẹẹli naa.
- Ŝi vidas, ke Marko amas ŝin.: O ri pe Marko fẹràn rẹ.
- Ili havas facilajn lernolibrojn.: Wọn ni awọn iwe-ẹkọ ti o rọrun.
