- Mia amiko skribas multe.: Ore mi kowe pupo.
- Bela kelnerino estas belulino.: Obinrin elewa kan jẹ obinrin ẹlẹwa.
- Ni havas multajn belajn aferojn.: A ni ọpọlọpọ awọn ohun lẹwa.
- Ni kune lernas en lernejo.: A kọ ẹkọ papọ ni ile-iwe.
- Miaj gepatroj manĝas en manĝejo.: Awọn obi mi jẹun ni yara ile ounjẹ.
- La kuko estas manĝebla.: Awọn akara oyinbo jẹ e je.
