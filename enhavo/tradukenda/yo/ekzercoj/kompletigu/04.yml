- Ana kaj Marko iris tra la strato.: Ana ati Marko lọ ni opopona.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Wọn wa si kafe kan, wọn lọ si tabili kan, wọn rii baba ti o joko lori aga.
- Ana metis tri kukojn sur seĝon.: Ana fi mẹta àkara lori alaga.
- Ŝi remetis poste la kukojn sur la tablon.: Lẹhinna o gbe awọn akara naa pada sori tabili.
