- Dankon, sinjoro. Nedankinde.: O ṣeun, sir. A ki dupe ara eni.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Wakati kan kuru, ọjọ kan gun, oṣu kan gun julọ.
- Mi legas pli multajn librojn ol mia amiko.: Mo ka awọn iwe diẹ sii ju ọrẹ mi lọ.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Mo fi awọn lẹta gigun ranṣẹ si ọrẹ mi nigbati o wa ni Tokyo.
- La libro estas leginda.: Iwe naa tọsi kika.
