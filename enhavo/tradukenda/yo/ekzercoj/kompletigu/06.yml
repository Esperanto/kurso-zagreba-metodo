- La gepatroj ĉiam deziras, ke mi lernu multon.: Awọn obi nigbagbogbo nfẹ pe Mo kọ ẹkọ pupọ.
- Mia amiko deziras, ke mi iru kanti kun li.: Ọrẹ mi fẹ ki n lọ kọrin pẹlu rẹ.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Bàbá fẹ́ kí ọmọ rẹ̀ jẹ àkàrà tó wà lórí tábìlì.
- Ni loĝas en malgranda ĉambro.: A n gbe ni kekere kan yara.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Inu mi ko balẹ nigbati mo ri ọ.
- Ĉiuj rimarkis, ke ŝi estas belega.: Gbogbo eniyan ṣe akiyesi pe o lẹwa pupọ.
