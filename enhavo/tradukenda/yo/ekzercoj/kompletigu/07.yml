- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: O mu ohun mimu owurọ rẹ ni kiakia ni kiakia lati wa ni kutukutu si ile-iwe.
- Mi ankoraŭ ne aŭdis novaĵon.: Mi o tii gbo iroyin kankan.
- En tiu momento Marko ekkriis.: Ni akoko yẹn Marko kigbe.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Ọmọkunrin ti ko nifẹ awọn ọmọkunrin ati awọn ọmọbirin miiran ko ni ọrẹ akọ tabi ọrẹbinrin.
