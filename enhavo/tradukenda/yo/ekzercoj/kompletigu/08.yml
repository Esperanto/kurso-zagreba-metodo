- Ni ordigis ĉion kaj transdonis al ili.: A ṣeto ohun gbogbo ti a si fi le wọn lọwọ.
- Mi petas glason da kafo kaj iom da akvo.: Mo beere fun gilasi kan ti kofi ati diẹ ninu omi.
- Doloris lin la kapo. Li malsaniĝis.: Ori re dun. O di aisan.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Ọmọbirin naa fẹran lati jẹ lẹwa, ati fun idi yẹn o ṣe ẹwa oju rẹ.
