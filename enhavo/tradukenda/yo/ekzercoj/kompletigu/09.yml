- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ti mo ba ni owo pupọ bi awọn imọran, Emi yoo rin kakiri agbaye.
- En ĉiu vortaro mankas kelkaj vortoj.: Ninu iwe-itumọ kọọkan diẹ ninu awọn ọrọ nsọnu.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Eniyan ti o ba n sọ itan fun igba pipẹ ni tabili ounjẹ yoo wa ni ebi npa.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: O ni lati fetisi ati pe ko gba ọ laaye lati duro ni ita pipẹ ni ojo. Nitorina o mu otutu.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Ó ní èrò tó ṣe kedere, ṣùgbọ́n yóò gba gbogbo ohun tí o sọ gbọ́, bí ẹni pé ìwọ ni aya rẹ̀.
