- En juneco oni havas ankaŭ belecon.: Ni odo eniyan tun ni ẹwa.
- Malsimplajn laborojn ĉefoj devus plisimpligi.: Awọn ọga yẹ ki o rọrun awọn iṣẹ idiju.
- En tiu aĝo li jam fariĝis klubestro de sporta klubo.: Ni ọjọ ori yẹn o ti di aṣaaju ẹgbẹ ti ẹgbẹ ere idaraya kan.
- Monon oni metas en monujon.: Eyan fi owo sinu apamọwọ.
- Sekvu la ekzemplon de la bonaj familianoj.: Tẹ̀ lé àpẹẹrẹ àwọn mẹ́ńbà ìdílé rere.
