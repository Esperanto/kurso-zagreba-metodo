- La knabino ĵetis la paperon en la paperujon.: Ọmọbirin naa ju iwe naa sinu agbọn idọti naa.
- Kie estas mia skribilo, mi volas respondi al li.: Nibo ni peni mi wa? Mo fe da a lohùn.
- La suno malaperis kaj nun estas preskaŭ malhele.: Oorun ti sọnu ati bayi o ti fẹrẹ ṣokunkun.
- Bonvolu manĝi la panon per manĝilo.: Jọwọ jẹ akara pẹlu ohun elo jijẹ.
- Pardonu min, mi ne rajtas resti.: Dariji mi, a ko gba mi laaye lati duro.
