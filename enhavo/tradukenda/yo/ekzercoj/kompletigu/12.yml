- Antaŭ kvarona horo ili revenis.: Wọn pada si mẹẹdogun wakati kan sẹhin.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Lẹhin ipọnju nla, awọn eniyan lọ ati awọn ilu atijọ ti ṣubu.
- Ni devus revidi nin, mia amiko.: O yẹ ki a tun ri ara wa, ọrẹ mi.
- Ju pli ofte mi pripensas, des pli mi koleras.: Bí mo bá ṣe ń ronú nípa rẹ̀ tó, bẹ́ẹ̀ náà ni mo ṣe máa ń bínú sí i.
- Ŝi loĝas en iu ajn domo.: O ngbe ni eyikeyi ile.
