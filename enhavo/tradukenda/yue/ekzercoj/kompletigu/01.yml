- Marko estas en la ĉambro.: Marko 喺房入面。
- Li sidas sur seĝo.: 佢坐喺張椅上。
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: 老師教書。工人工作。學生學習。
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: Marko 同 Aleksandro 係學生同運動員。
- La patrino de Marko estas instruistino.: Marko嘅媽媽係一位老師。
- La seĝo estas en la ĉambro.: 張椅喺房入面。
- La libro estas de li, ĝi estas lia.: 呢本書係佢嘅，屬於佢。
- Mia nomo estas Marko.: 我叫 Marko。
