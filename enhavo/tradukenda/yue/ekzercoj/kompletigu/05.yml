- Dankon, sinjoro. Nedankinde.: 多謝您，先生。不用客氣。
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: 一個鐘好短，一日比較長，一個月最長。
- Mi legas pli multajn librojn ol mia amiko.: 我睇嘅書比我朋友多。
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: 當我朋友喺東京嘅時候，我寄咗長信畀佢。
- La libro estas leginda.: 呢本書值得一讀。
