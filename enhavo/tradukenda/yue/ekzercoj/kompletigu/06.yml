- La gepatroj ĉiam deziras, ke mi lernu multon.: 父母總希望我學好多嘢。
- Mia amiko deziras, ke mi iru kanti kun li.: 我朋友希望我同佢一齊去唱歌。
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: 爸爸想佢嘅小朋友食擺喺枱上嘅蛋糕。
- Ni loĝas en malgranda ĉambro.: 我哋住喺一個細房間。
- Mi fariĝis maltrankvila, kiam mi vidis vin.: 見到你我感到唔安樂。
- Ĉiuj rimarkis, ke ŝi estas belega.: 每個人都注意到佢好靚。
