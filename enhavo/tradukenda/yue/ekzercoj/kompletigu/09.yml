- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: 如果我有同我嘅點子一樣多嘅錢，我會周遊世界。
- En ĉiu vortaro mankas kelkaj vortoj.: 每本字典都有啲字缺少。
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: 一個喺餐桌上講咗好耐故事嘅人會繼續肚餓。
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: 佢要專心，唔可以喺雨中喺外面企耐。所以佢感冒咗。
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: 佢有自己清晰嘅諗法，但佢會信你講嘅每一樣嘢，好似你係佢老婆咁。
