- Marko estas en la ĉambro.: 馬可在房間裡。
- Li sidas sur seĝo.: 他坐在椅子上。
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: 有老師教。一名工人正在工作。一個學生學習。
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: 馬科和亞歷山德羅是學生和運動員。
- La patrino de Marko estas instruistino.: 馬科的母親是一名教師。
- La seĝo estas en la ĉambro.: 椅子在房間裡。
- La libro estas de li, ĝi estas lia.: 這本書是他的；這是他的。
- Mia nomo estas Marko.: 我叫馬可。
