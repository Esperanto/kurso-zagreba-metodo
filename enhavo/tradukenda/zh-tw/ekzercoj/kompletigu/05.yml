- Dankon, sinjoro. Nedankinde.: 謝謝您，先生。不客氣。
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: 一小時短，一天長，一個月最長。
- Mi legas pli multajn librojn ol mia amiko.: 我比我朋友讀的書還多。
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: 當我的朋友在東京時，我寫了一封長信給他。
- La libro estas leginda.: 這本書值得一讀。
