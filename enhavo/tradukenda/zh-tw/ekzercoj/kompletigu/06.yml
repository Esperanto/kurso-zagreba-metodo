- La gepatroj ĉiam deziras, ke mi lernu multon.: 父母總是希望我學到很多。
- Mia amiko deziras, ke mi iru kanti kun li.: 我的朋友希望我跟他一起去唱歌。
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: 父親想讓他的孩子吃桌上的蛋糕。
- Ni loĝas en malgranda ĉambro.: 我們住在一個小房間裡。
- Mi fariĝis maltrankvila, kiam mi vidis vin.: 當我看到你時我變得不安。
- Ĉiuj rimarkis, ke ŝi estas belega.: 大家都注意到她非常漂亮。
