- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: 如果我有和想法一樣多的錢，我就會環遊世界。
- En ĉiu vortaro mankas kelkaj vortoj.: 每本字典中都缺少一些單字。
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: 一個人在餐桌上講故事久了，他就會感到飢餓。
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: 他必須要注意，不可以在雨中長時間待在外面。因此他感冒了。
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: 他的想法很明確，但他會相信你所說的一切，就像你是他的妻子一樣。
