- Marko estas en la ĉambro.: 马可在房间里。
- Li sidas sur seĝo.: 他坐在椅子上。
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: 有老师教。一名工人正在工作。一个学生学习。
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: 马科和亚历山德罗是学生和运动员。
- La patrino de Marko estas instruistino.: 马科的母亲是一名教师。
- La seĝo estas en la ĉambro.: 椅子在房间里。
- La libro estas de li, ĝi estas lia.: 这本书是他的；这是他的。
- Mia nomo estas Marko.: 我叫马可。
