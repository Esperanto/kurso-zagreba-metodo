- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: 如果我有和想法一样多的钱，我就会环游世界。
- En ĉiu vortaro mankas kelkaj vortoj.: 每本字典中都缺少一些单词。
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: 一个人在餐桌上讲故事久了，他就会感到饥饿。
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: 他必须要注意，不可以在雨中长时间呆在外面。因此他感冒了。
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: 他的想法很明确，但他会相信你所说的一切，就像你是他的妻子一样。
