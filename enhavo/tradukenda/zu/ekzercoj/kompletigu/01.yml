- Marko estas en la ĉambro.: UMarko usegunjini.
- Li sidas sur seĝo.: Ahlale esihlalweni.
- Instruisto instruas. Laboristo laboras. Lernanto lernas.: Uthisha uyafundisa. Isisebenzi siyasebenza. Umfundi uyafunda.
- Marko kaj Aleksandro estas lernantoj kaj sportistoj.: UMarko no-Aleksandro bangabafundi nabasubathi.
- La patrino de Marko estas instruistino.: Umama kaMarko unguthisha.
- La seĝo estas en la ĉambro.: Isihlalo sisekamelweni.
- La libro estas de li, ĝi estas lia.: Incwadi ngeyakhe; kungokwakhe.
- Mia nomo estas Marko.: Igama lami nginguMarko.
