- Marko havas amikon kaj amikinon. Ili estas geamikoj.: UMarko unomngane wesilisa nomngane wesifazane. Bangabangane.
- Li kuiras kafon kaj ili trinkas ĝin en nia hejmo.: Wenza ikhofi futhi bayaliphuza ekhaya lethu.
- Ili iras al la hotelo.: Bahambe baye ehhotela.
- Ŝi vidas, ke Marko amas ŝin.: Uyabona ukuthi uMarko uyamthanda.
- Ili havas facilajn lernolibrojn.: Banezincwadi zokufunda ezilula.
