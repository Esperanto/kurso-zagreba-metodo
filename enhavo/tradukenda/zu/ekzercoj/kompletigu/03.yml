- Mia amiko skribas multe.: Umngane wami ubhala kakhulu.
- Bela kelnerino estas belulino.: Uweta omuhle ungowesifazane omuhle.
- Ni havas multajn belajn aferojn.: Sinezinto eziningi ezinhle.
- Ni kune lernas en lernejo.: Sifunda ndawonye esikoleni.
- Miaj gepatroj manĝas en manĝejo.: Abazali bami badla endlini yokudlela.
- La kuko estas manĝebla.: Ikhekhe liyadliwa.
