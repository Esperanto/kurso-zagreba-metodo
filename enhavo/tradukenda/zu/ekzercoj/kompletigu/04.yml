- Ana kaj Marko iris tra la strato.: U-Ana noMarko bahamba ngomgwaqo.
- Ili venis al kafejo, iris al tablo kaj vidis la patron sidi sur seĝo.: Bafike endaweni yokudlela, baqonde etafuleni, babone ubaba ehlezi esitulweni.
- Ana metis tri kukojn sur seĝon.: U-Ana wabeka amakhekhe amathathu esihlalweni.
- Ŝi remetis poste la kukojn sur la tablon.: Kamuva wabuyisela amakhekhe etafuleni.
