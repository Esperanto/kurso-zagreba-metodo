- Dankon, sinjoro. Nedankinde.: Ngiyabonga, mnumzane. Wamukelekile.
- Horo estas mallonga, tago estas pli longa, monato estas la plej longa.: Ihora lifushane, usuku lude, inyanga yinde kakhulu.
- Mi legas pli multajn librojn ol mia amiko.: Ngifunda izincwadi eziningi kunomngane wami.
- Mi sendis al mia amiko longajn leterojn, dum li estis en Tokio.: Ngathumela izincwadi ezinde kumngane wami lapho eseTokyo.
- La libro estas leginda.: Incwadi ifanele ukuyifunda.
