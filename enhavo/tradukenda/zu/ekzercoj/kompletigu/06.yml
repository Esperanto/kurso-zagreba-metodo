- La gepatroj ĉiam deziras, ke mi lernu multon.: Abazali bahlale befisa ukuthi ngifunde okuningi.
- Mia amiko deziras, ke mi iru kanti kun li.: Umngane wami ufisa ukuthi ngihambe ngicule naye.
- La patro volas, ke lia infano manĝu kukon, kiu estas sur la tablo.: Ubaba ufuna ingane yakhe idle ikhekhe eliphezu kwetafula.
- Ni loĝas en malgranda ĉambro.: Sihlala ekamelweni elincane.
- Mi fariĝis maltrankvila, kiam mi vidis vin.: Ngaqala ukungakhululeki lapho ngikubona.
- Ĉiuj rimarkis, ke ŝi estas belega.: Wonke umuntu waqaphela ukuthi muhle kakhulu.
