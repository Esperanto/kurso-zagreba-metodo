- Li trinkis rapidege sian matenan trinkaĵon por frue veni al la lernejo.: Waphuza isiphuzo sakhe sasekuseni ngokushesha ukuze afike ekuseni esikoleni.
- Mi ankoraŭ ne aŭdis novaĵon.: Bengingakazizwa izindaba.
- En tiu momento Marko ekkriis.: Ngaleso sikhathi uMarko wakhala.
- Knabo, kiu ne amas aliajn geknabojn, havas nek amikojn nek amikinojn.: Umfana ongabathandi abanye abafana namantombazane akanabo abangani besilisa noma abangani besifazane.
