- Ni ordigis ĉion kaj transdonis al ili.: Sabeka yonke into ngononina sabanikeza.
- Mi petas glason da kafo kaj iom da akvo.: Ngicela ingilazi yekhofi namanzi.
- Doloris lin la kapo. Li malsaniĝis.: Ikhanda lakhe lalibuhlungu. Wagula.
- La knabino ŝatas esti bela kaj pro tio ŝi beligas sian vizaĝon.: Intombazane ithanda ukuba yinhle, futhi ngenxa yaleso sizathu ihlobisa ubuso bayo.
