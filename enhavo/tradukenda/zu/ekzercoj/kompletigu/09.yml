- Se mi havus tiom da mono kiom da ideoj, mi vojaĝadus ĉirkaŭ la mondo.: Ukube nginemali eningi njengemibono, bengizohamba emhlabeni jikelele.
- En ĉiu vortaro mankas kelkaj vortoj.: Kuzo zonke izichazamazwi amanye amagama ayashoda.
- Homo, kiu longe rakontadas ĉe la manĝotablo, restos malsata.: Umuntu olokhu exoxa izindaba isikhathi eside etafuleni lokudlela uzohlala elambile.
- Li devis atenti kaj ne rajtis longe resti ekstere en pluvo. Tial li malvarmumis.: Kwadingeka anake futhi akavunyelwe ukuhlala isikhathi eside ngaphandle lina. Ngakho wangenwa umkhuhlane.
- Li havas sian klaran ideon, sed li kredos ĉion, kion vi diros, kvazaŭ vi estus lia edzino.: Unombono wakhe ocacile, kodwa uzokholelwa yonke into oyishoyo, njengokungathi ungumkayo.
