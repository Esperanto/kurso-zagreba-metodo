- La knabino ĵetis la paperon en la paperujon.: Intombazane yaphonsa iphepha kubhasikidi wephepha.
- Kie estas mia skribilo, mi volas respondi al li.: Liphi ipeni lami? Ngifuna ukumphendula.
- La suno malaperis kaj nun estas preskaŭ malhele.: Lanyamalala ilanga manje sekumnyama.
- Bonvolu manĝi la panon per manĝilo.: Sicela udle isinkwa ngesitsha sokudlela.
- Pardonu min, mi ne rajtas resti.: Ungixolele, angivunyelwe ukuhlala.
