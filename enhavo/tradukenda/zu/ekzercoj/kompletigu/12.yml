- Antaŭ kvarona horo ili revenis.: Babuye ngekota yehora edlule.
- Post la terura malfeliĉo la homoj foriris kaj la malnovaj urboj disfalis.: Ngemva kweshwa elibi, abantu bahamba futhi imizi emidala yahlakazeka.
- Ni devus revidi nin, mia amiko.: Kufanele siphinde sibonane mngani wami.
- Ju pli ofte mi pripensas, des pli mi koleras.: Lapho ngicabanga ngakho kaningi, ngithukuthela nakakhulu.
- Ŝi loĝas en iu ajn domo.: Uhlala kunoma iyiphi indlu.
