$schema: https://json-schema.org/draft/2020-12/schema
title: Tradukenda ĉefpaĝa fasado YAML
allOf:
- $ref: ../fasado.schema.yml
- type: object
  minProperties: 9
  maxProperties: 11
  anyOf:
  - minProperties: 9
    maxProperties: 9
    required:
    - Ĉi tiu lingvo estis AI-tradukita. Se vi vidas erarojn, [bonvolu informi nin]({{ url_kontakto }}).
    not:
      anyOf:
      - required:
        - Instalu apon
      - required:
        - Malfermu la retumilan menuon kaj elektu "Instali" aŭ "Aldoni al la hejma ekrano".
  - minProperties: 10
    maxProperties: 10
    required:
    - Instalu apon
    - Malfermu la retumilan menuon kaj elektu "Instali" aŭ "Aldoni al la hejma ekrano".
    not:
      required:
      - Ĉi tiu lingvo estis AI-tradukita. Se vi vidas erarojn, [bonvolu informi nin]({{ url_kontakto }}).
  - minProperties: 11
    maxProperties: 11
  propertyNames:
    enum:
    - Ek
    - Esperanto en 12 lecionoj
    - Instalu apon
    - La plej rapida kurso por la bazoj
    - Lerni Esperanto en 12 horoj
    - Lerni Esperanton
    - Lerni Esperanton en 12 lecionoj
    - Malfermu la retumilan menuon kaj elektu "Instali" aŭ "Aldoni al la hejma ekrano".
    - Trovu Esperanto-parolantojn
    - '{{lingvo_nombro}} lingvoj'
    - Ĉi tiu lingvo estis AI-tradukita. Se vi vidas erarojn, [bonvolu informi nin]({{ url_kontakto }}).
  additionalProperties:
    $ref: ../fasado.schema.yml#/$defs/nepraTeksto
